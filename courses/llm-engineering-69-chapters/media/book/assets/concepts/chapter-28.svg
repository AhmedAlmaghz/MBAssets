<text x="738.0" y="266" text-anchor="middle" fill="#203B54" font-size="19" font-weight="700" font-family="Tahoma,Arial,sans-serif" direction="rtl">
<tspan x="738.0" dy="0">التقنية الأولى:</tspan>
<tspan x="738.0" dy="27">Linear Averaging</tspan>
<tspan x="738.0" dy="27">(Model Soups)</tspan>
</text>
