<circle cx="373" cy="238" r="17" fill="#1B6C7A"/><text x="373" y="244" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="700" font-family="Arial,sans-serif">3</text>
<text x="462.0" y="253" text-anchor="middle" fill="#203B54" font-size="19" font-weight="700" font-family="Tahoma,Arial,sans-serif" direction="rtl">
<tspan x="462.0" dy="0">التقنية الثانية:</tspan>
<tspan x="462.0" dy="27">Task Arithmetic —</tspan>
<tspan x="462.0" dy="27">الجبر مع &quot;متجهات</tspan>
<tspan x="462.0" dy="27">المهام&quot;</tspan>
</text>
<rect x="67" y="205" width="238" height="190" rx="20" fill="#F2EDFF" stroke="#D7E2EE" stroke-width="2"/>
