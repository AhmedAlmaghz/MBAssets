<title id="title">مخطط مفاهيم الفصل 28</title>
<desc id="description">الموضوعات الأساسية المستخرجة من عناوين الفصل: كيف تُنشئ نموذجًا جديدًا بدون تدريب واحد؟ — سحر الجبر الخطي في فضاء الأوزان، التقنية الأولى: Linear Averaging (Model Soups)، التقنية الثانية: Task Arithmetic — الجبر مع &quot;متجهات المهام&quot;، التقنية الثالثة: TIES-Merging — حل مشكلة &quot;تداخل الإشارات&quot;</desc>
<text x="600" y="49" text-anchor="middle" fill="#FFFFFF" font-size="25" font-weight="700" font-family="Tahoma,Arial,sans-serif" direction="rtl">
<tspan x="600" dy="0">الفصل 28: دمج النماذج (Model Merging)</tspan>
</text>
<text x="600" y="100" text-anchor="middle" fill="#D7EEF0" font-size="16" font-family="Tahoma,Arial,sans-serif" direction="rtl">مسار قراءة بصري لموضوعات الفصل</text>
<path d="M887 322 H861" stroke="#47728A" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="895" y="205" width="238" height="190" rx="20" fill="#EAF1FF" stroke="#D7E2EE" stroke-width="2"/>
<circle cx="925" cy="238" r="17" fill="#1B6C7A"/><text x="925" y="244" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="700" font-family="Arial,sans-serif">1</text>
<text x="1014.0" y="253" text-anchor="middle" fill="#203B54" font-size="19" font-weight="700" font-family="Tahoma,Arial,sans-serif" direction="rtl">
<tspan x="1014.0" dy="0">كيف تُنشئ نموذجًا</tspan>
<tspan x="1014.0" dy="27">جديدًا بدون تدريب</tspan>
<tspan x="1014.0" dy="27">واحد؟ — سحر الجبر</tspan>
<tspan x="1014.0" dy="27">الخطي في فضاء…</tspan>
</text>
<path d="M611 322 H585" stroke="#47728A" stroke-width="4" marker-end="url(#arrow)"/>
