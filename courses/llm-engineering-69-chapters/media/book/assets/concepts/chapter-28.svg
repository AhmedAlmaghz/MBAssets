<text x="186.0" y="253" text-anchor="middle" fill="#203B54" font-size="19" font-weight="700" font-family="Tahoma,Arial,sans-serif" direction="rtl">
<tspan x="186.0" dy="0">التقنية الثالثة:</tspan>
<tspan x="186.0" dy="27">TIES-Merging — حل</tspan>
<tspan x="186.0" dy="27">مشكلة &quot;تداخل</tspan>
<tspan x="186.0" dy="27">الإشارات&quot;</tspan>
</text>
<text x="600" y="455" text-anchor="middle" fill="#60758A" font-size="16" font-family="Tahoma,Arial,sans-serif" direction="rtl">تسلسل الموضوعات كما ورد في بنية الفصل</text>
