<title id="title">مخطط مفاهيم الفصل 27</title>
<desc id="description">الموضوعات الأساسية المستخرجة من عناوين الفصل: من نموذج عام إلى خبير متخصص — رحلة التحويل الذكي، ما الفرق بالضبط بين Transfer Learning و Continued Pretraining؟، متى بالضبط تحتاج Continued Pretraining؟، الرياضيات: لماذا يحدث النسيان الكارثي؟</desc>
<text x="600" y="49" text-anchor="middle" fill="#FFFFFF" font-size="25" font-weight="700" font-family="Tahoma,Arial,sans-serif" direction="rtl">
<tspan x="600" dy="0">الفصل 27: Transfer Learning &amp; Continued Pretraining</tspan>
</text>
