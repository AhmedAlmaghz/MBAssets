<text x="995.0" y="263.0" text-anchor="middle" fill="#203B54" font-size="20" font-weight="700" font-family="Tahoma,Arial,sans-serif" direction="rtl">
<tspan x="995.0" dy="0">الرسم الحسابي</tspan>
<tspan x="995.0" dy="28">(Computational Graph)</tspan>
</text>
