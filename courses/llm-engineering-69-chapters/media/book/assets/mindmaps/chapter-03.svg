<rect width="1200" height="800" rx="34" fill="url(#canvas)"/>
<circle cx="600" cy="400" r="290" fill="#D9EEEF" opacity=".22"/>
<title id="title">الخريطة الذهنية — الفصل الثالث: Backpropagation والتحسين (Optimization)</title>
<desc id="description">رسم مفاهيمي يربط موضوع الفصل بمحاوره الأساسية: من &quot;الشبكة تتعلم&quot; إلى &quot;كيف بالضبط تتعلم؟&quot;، قاعدة السلسلة (Chain Rule) — حجر الأساس، الرسم الحسابي (Computational Graph)، دعنا نشتق Backprop يدويًا لشبكة بطبقتين (كما في الفصل 2)، الآن: التحسين (Optimization) — ماذا نفعل بالتدرج بعد حسابه؟، جدولة معدل التعلم (Learning Rate Scheduling)</desc>
