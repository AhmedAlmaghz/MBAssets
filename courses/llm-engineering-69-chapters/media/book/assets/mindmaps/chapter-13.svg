<title id="title">الخريطة الذهنية — الفصل الثالث عشر: نحو الاستدلال السريع — KV Caching وFlash Attention ومقدمة في Quantization</title>
<desc id="description">رسم مفاهيمي يربط موضوع الفصل بمحاوره الأساسية: KV Caching: لماذا نُعيد حساب ما حسبناه بالفعل؟، Flash Attention: تسريع الحساب نفسه دون تغيير النتيجة، مقدمة Quantization: تقليص حجم الأرقام نفسها، التعقيد الحسابي: الفرق الكمّي، الفكرة العبقرية لـ Flash Attention (Dao et al. 2022)، الفكرة الرياضية الأساسية (Linear/Affine Quantization)</desc>
