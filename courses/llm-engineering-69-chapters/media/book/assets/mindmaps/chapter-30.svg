<title id="title">الخريطة الذهنية — الفصل 30: التقليم (Pruning)</title>
<desc id="description">رسم مفاهيمي يربط موضوع الفصل بمحاوره الأساسية: فن النحت في الشبكات العصبية — كيف تُزيل النصف وتحتفظ بكل شيء تقريبًا؟، التمييز الجوهري: Unstructured مقابل Structured Pruning، Magnitude Pruning: أبسط طريقة، ونقطة البداية الكلاسيكية، صندوق تعمّق: لماذا Magnitude Pruning وحدها غير كافية في LLMs؟، Wanda: Pruning by Weights AND Activations، Structured Pruning: حذف خلايا عصبية ورؤوس Attention كاملة</desc>
