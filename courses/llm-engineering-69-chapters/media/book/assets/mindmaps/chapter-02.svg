<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
<defs>
        <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F7FAFF"/><stop offset="1" stop-color="#EEF5F7"/></linearGradient>
        <linearGradient id="center" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#173B63"/><stop offset="1" stop-color="#226E78"/></linearGradient>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#16324A" flood-opacity=".12"/></filter>
        </defs>
<rect width="1200" height="800" rx="34" fill="url(#canvas)"/>
<circle cx="600" cy="400" r="290" fill="#D9EEEF" opacity=".22"/>
<title id="title">الخريطة الذهنية — الفصل الثاني: الشبكة العصبية الأولى من الصفر — من نقطة واحدة إلى شبكة تتعلّم</title>
<desc id="description">رسم مفاهيمي يربط موضوع الفصل بمحاوره الأساسية: نظرية التقريب الشامل (Universal Approximation Theorem)، 2.6 جدول: متى تختار كل دالة تفعيل في مشروعك القادم؟، Perceptron: الخط الفاصل البسيط، لغز XOR — المشكلة التي أوقفت مجالًا كاملاً لعقد من الزمن، الحل: الطبقة الخفية + اللاخطية، دوال التفعيل الأربع: Sigmoid, Tanh, ReLU, GELU</desc>
<path d="M600.0 311.1 C600.0 146.0 600.0 146.0 600.0 217.1" fill="none" stroke="#83A6B4" stroke-width="4" stroke-linecap="round"/>
