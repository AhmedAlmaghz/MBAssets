<path d="M738.2 356.9 C738.2 277.0 884.4 277.0 884.4 311.4" fill="none" stroke="#83A6B4" stroke-width="4" stroke-linecap="round"/>
<path d="M461.8 447.9 C461.8 537.0 315.6 537.0 315.6 498.6" fill="none" stroke="#83A6B4" stroke-width="4" stroke-linecap="round"/>
<path d="M600.0 489.2 C600.0 655.0 600.0 655.0 600.0 583.6" fill="none" stroke="#83A6B4" stroke-width="4" stroke-linecap="round"/>
<path d="M738.2 447.9 C738.2 537.0 884.4 537.0 884.4 498.6" fill="none" stroke="#83A6B4" stroke-width="4" stroke-linecap="round"/>
<rect x="420" y="324" width="360" height="152" rx="26" fill="url(#center)" filter="url(#shadow)"/>
<text x="600.0" y="370.0" text-anchor="middle" fill="#FFFFFF" font-size="24" font-weight="700" font-family="Tahoma,Arial,sans-serif" direction="rtl">
<tspan x="600.0" dy="0">الثاني: الشبكة العصبية</tspan>
<tspan x="600.0" dy="31">الأولى من الصفر — من نقطة</tspan>
<tspan x="600.0" dy="31">واحدة إلى شبكة تتعلّم</tspan>
</text>
<text x="600.0" y="458" text-anchor="middle" fill="#BDE6E1" font-size="15" font-weight="700" font-family="Arial,sans-serif">CHAPTER MAP</text>
<rect x="425" y="76" width="350" height="140" rx="22" fill="#E6F5F4" stroke="#D8E3EC" stroke-width="2" filter="url(#shadow)"/>
<circle cx="455" cy="104" r="16" fill="#1D7280"/><text x="455" y="110" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="700" font-family="Arial,sans-serif">1</text>
<text x="600.0" y="118.0" text-anchor="middle" fill="#203B54" font-size="20" font-weight="700" font-family="Tahoma,Arial,sans-serif" direction="rtl">
<tspan x="600.0" dy="0">نظرية التقريب الشامل</tspan>
<tspan x="600.0" dy="28">(Universal</tspan>
<tspan x="600.0" dy="28">Approximation Theorem)</tspan>
</text>
<rect x="35" y="205" width="340" height="144" rx="22" fill="#EAF1FF" stroke="#D8E3EC" stroke-width="2" filter="url(#shadow)"/>
<circle cx="65" cy="233" r="16" fill="#1D7280"/><text x="65" y="239" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="700" font-family="Arial,sans-serif">2</text>
<text x="205.0" y="249.0" text-anchor="middle" fill="#203B54" font-size="20" font-weight="700" font-family="Tahoma,Arial,sans-serif" direction="rtl">
<tspan x="205.0" dy="0">2.6 جدول: متى تختار كل</tspan>
<tspan x="205.0" dy="28">دالة تفعيل في مشروعك</tspan>
<tspan x="205.0" dy="28">القادم؟</tspan>
</text>
<rect x="825" y="205" width="340" height="144" rx="22" fill="#FFF2E5" stroke="#D8E3EC" stroke-width="2" filter="url(#shadow)"/>
<circle cx="855" cy="233" r="16" fill="#1D7280"/><text x="855" y="239" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="700" font-family="Arial,sans-serif">3</text>
<text x="995.0" y="263.0" text-anchor="middle" fill="#203B54" font-size="20" font-weight="700" font-family="Tahoma,Arial,sans-serif" direction="rtl">
<tspan x="995.0" dy="0">Perceptron: الخط الفاصل</tspan>
<tspan x="995.0" dy="28">البسيط</tspan>
</text>
<rect x="35" y="465" width="340" height="144" rx="22" fill="#F1ECFF" stroke="#D8E3EC" stroke-width="2" filter="url(#shadow)"/>
<circle cx="65" cy="493" r="16" fill="#1D7280"/><text x="65" y="499" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="700" font-family="Arial,sans-serif">4</text>
<text x="205.0" y="509.0" text-anchor="middle" fill="#203B54" font-size="20" font-weight="700" font-family="Tahoma,Arial,sans-serif" direction="rtl">
<tspan x="205.0" dy="0">لغز XOR — المشكلة التي</tspan>
<tspan x="205.0" dy="28">أوقفت مجالًا كاملاً</tspan>
<tspan x="205.0" dy="28">لعقد من الزمن</tspan>
</text>
<rect x="425" y="585" width="350" height="140" rx="22" fill="#E8F6EF" stroke="#D8E3EC" stroke-width="2" filter="url(#shadow)"/>
<circle cx="455" cy="613" r="16" fill="#1D7280"/><text x="455" y="619" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="700" font-family="Arial,sans-serif">5</text>
<text x="600.0" y="641.0" text-anchor="middle" fill="#203B54" font-size="20" font-weight="700" font-family="Tahoma,Arial,sans-serif" direction="rtl">
<tspan x="600.0" dy="0">الحل: الطبقة الخفية +</tspan>
<tspan x="600.0" dy="28">اللاخطية</tspan>
</text>
<rect x="825" y="465" width="340" height="144" rx="22" fill="#FFF0F2" stroke="#D8E3EC" stroke-width="2" filter="url(#shadow)"/>
<circle cx="855" cy="493" r="16" fill="#1D7280"/><text x="855" y="499" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="700" font-family="Arial,sans-serif">6</text>
<text x="995.0" y="509.0" text-anchor="middle" fill="#203B54" font-size="20" font-weight="700" font-family="Tahoma,Arial,sans-serif" direction="rtl">
<tspan x="995.0" dy="0">دوال التفعيل الأربع:</tspan>
<tspan x="995.0" dy="28">Sigmoid, Tanh, ReLU,</tspan>
<tspan x="995.0" dy="28">GELU</tspan>
</text>
</svg>