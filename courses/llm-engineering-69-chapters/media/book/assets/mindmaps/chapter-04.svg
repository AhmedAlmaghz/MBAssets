<title id="title">الخريطة الذهنية — الفصل الرابع: التقييم والتعميم — Overfitting وRegularization وPerplexity</title>
<desc id="description">رسم مفاهيمي يربط موضوع الفصل بمحاوره الأساسية: عندما يحفظ النموذج الإجابة بدل أن يفهم السؤال، لماذا تقسيم بياناتنا إلى ثلاث مجموعات هو قرار إحصائي، لا تنظيمي فقط؟، أداة التشخيص الأقوى: منحنيات التعلّم (Learning Curves)، السلاح الأول: L1/L2 Regularization — لماذا &quot;الأوزان الكبيرة&quot; مشبوهة؟، السلاح الثاني: Dropout — الفريق الذي لا يعتمد على نجم واحد، السلاح الثالث: Early Stopping — أرخص علاج وأكثره فعالية</desc>
