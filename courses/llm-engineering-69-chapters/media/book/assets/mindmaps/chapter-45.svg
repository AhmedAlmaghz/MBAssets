<desc id="description">رسم مفاهيمي يربط موضوع الفصل بمحاوره الأساسية: التعمّق (قابل للتخطي)، أ. Perplexity: من الخسارة التي تعرفها جيدًا إلى رقم بديهي، ب. BLEU وROUGE: ركيزتان من عصر ما قبل التضمينات السياقية، ج. BERTScore: الانتقال من &quot;تطابق الحروف&quot; إلى &quot;تطابق المعنى&quot;، د. الصرامة الإحصائية: من &quot;رقم واحد&quot; إلى &quot;برهان هندسي&quot;</desc>
