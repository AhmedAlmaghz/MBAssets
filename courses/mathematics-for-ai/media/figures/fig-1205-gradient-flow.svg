<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="Georgia, 'Times New Roman', serif">
  <rect width="680" height="320" fill="#fafaf7"/>

  <text x="340" y="26" font-size="14" fill="#334155" text-anchor="middle" font-weight="bold">تدفّق التدرّج: مسار هبوطي نحو الأدنى</text>

  <!-- bowl contours -->
  <g fill="none" stroke="#0f766e" stroke-width="1.4">
    <ellipse cx="360" cy="190" rx="40"  ry="26"/>
    <ellipse cx="360" cy="190" rx="90"  ry="58"/>
    <ellipse cx="360" cy="190" rx="150" ry="96"/>
    <ellipse cx="360" cy="190" rx="220" ry="140"/>
  </g>
  <circle cx="360" cy="190" r="5" fill="#0f766e"/>
  <text x="360" y="215" font-size="12" fill="#0f766e" text-anchor="middle">θ*</text>

  <!-- gradient flow trajectory (descending spiral) -->
  <path d="M120,80 C200,110 250,150 300,175 C330,188 345,190 358,191" fill="none" stroke="#9d174d" stroke-width="2.4"/>
  <!-- arrowheads along path -->
  <g fill="#9d174d">
    <circle cx="120" cy="80" r="4.5"/>
    <circle cx="210" cy="120" r="3.5"/>
    <circle cx="285" cy="170" r="3.5"/>
  </g>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9d174d"/>
    </marker>
  </defs>
  <path d="M120,80 C200,110 250,150 300,175" fill="none" stroke="#9d174d" stroke-width="1" stroke-dasharray="2 3" marker-end="url(#g)"/>

  <!-- negative gradient arrows (downhill) -->
  <g stroke="#b45309" stroke-width="1.4">
    <line x1="120" y1="80" x2="135" y2="100" marker-end="url(#gn)"/>
    <line x1="210" y1="120" x2="225" y2="140" marker-end="url(#gn)"/>
  </g>
  <defs>
    <marker id="gn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>
  <text x="95" y="72" font-size="12" fill="#b45309" text-anchor="end">−∇L</text>

  <rect x="470" y="60" width="180" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="560" y="78" font-size="12.5" fill="#334155" text-anchor="middle" font-style="italic">θ̇ = −∇L(θ)</text>
  <text x="560" y="94" font-size="11.5" fill="#64748b" text-anchor="middle">L(θ) تتناقص دوماً</text>

  <text x="340" y="305" font-size="12.5" fill="#334155" text-anchor="middle" font-style="italic">التدريب = نظام ديناميكي مستمرّ ؛ الخسارة دالة ليانوف (Lyapunov)</text>
</svg>
