<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="380" fill="#fbfbfd"/>
  <text x="340" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2238">Pooling (max / average)</text>

  <!-- 4x4 input -->
  <text x="40" y="62" font-size="13" fill="#3b5bdb" font-weight="600">Input (4x4)</text>
  <g stroke="#5b6b8c" stroke-width="1.2" fill="none">
    <rect x="40" y="75" width="160" height="160"/>
    <line x1="80" y1="75" x2="80" y2="235"/><line x1="120" y1="75" x2="120" y2="235"/><line x1="160" y1="75" x2="160" y2="235"/>
    <line x1="40" y1="115" x2="200" y2="115"/><line x1="40" y1="155" x2="200" y2="155"/><line x1="40" y1="195" x2="200" y2="195"/>
  </g>
  <g font-size="12" fill="#1a2238" text-anchor="middle">
    <text x="60" y="98">1</text><text x="100" y="98">3</text><text x="140" y="98">2</text><text x="180" y="98">0</text>
    <text x="60" y="138">4</text><text x="100" y="138">7</text><text x="140" y="138">1</text><text x="180" y="138">2</text>
    <text x="60" y="178">5</text><text x="100" y="178">2</text><text x="140" y="178">6</text><text x="180" y="178">1</text>
    <text x="60" y="218">0</text><text x="100" y="218">3</text><text x="140" y="218">1</text><text x="180" y="218">4</text>
  </g>
  <!-- 2x2 windows -->
  <g fill="none" stroke="#e8590c" stroke-width="2" stroke-dasharray="4 3">
    <rect x="40" y="75" width="80" height="80"/><rect x="120" y="75" width="80" height="80"/>
    <rect x="40" y="155" width="80" height="80"/><rect x="120" y="155" width="80" height="80"/>
  </g>

  <path d="M200 155 L280 155" stroke="#888" stroke-width="2" fill="none" marker-end="url(#p1)"/>
  <defs><marker id="p1" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#888"/></marker></defs>

  <!-- output 2x2 max -->
  <text x="320" y="62" font-size="13" fill="#2f9e44" font-weight="600">Max-pool 2x2</text>
  <g stroke="#5b6b8c" stroke-width="1.2" fill="none">
    <rect x="320" y="95" width="100" height="100"/>
    <line x1="370" y1="95" x2="370" y2="195"/><line x1="320" y1="145" x2="420" y2="145"/>
  </g>
  <g font-size="14" fill="#1a2238" text-anchor="middle">
    <text x="345" y="125" fill="#e8590c" font-weight="700">7</text><text x="395" y="125">2</text>
    <text x="345" y="175">6</text><text x="395" y="175">6</text>
  </g>

  <!-- output 2x2 avg -->
  <text x="500" y="62" font-size="13" fill="#3b5bdb" font-weight="600">Avg-pool 2x2</text>
  <g stroke="#5b6b8c" stroke-width="1.2" fill="none">
    <rect x="500" y="95" width="100" height="100"/>
    <line x1="550" y1="95" x2="550" y2="195"/><line x1="500" y1="145" x2="600" y2="145"/>
  </g>
  <g font-size="14" fill="#1a2238" text-anchor="middle">
    <text x="525" y="125">3.75</text><text x="575" y="125">1.25</text>
    <text x="525" y="175">2.5</text><text x="575" y="175">3.0</text>
  </g>

  <text x="340" y="350" text-anchor="middle" font-size="12.5" fill="#555">Output size after pool k_p:  O_p = floor((O - k_p)/S_p) + 1 ;  pooling is shift-equivariant, stride=k_p gives downsampling</text>
</svg>
