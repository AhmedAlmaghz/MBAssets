<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="380" fill="#fbfbfd"/>
  <text x="340" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2238">Normal-form game (2x2 payoff matrix)</text>

  <!-- column player labels -->
  <text x="180" y="110" font-size="12" fill="#1a2238">A \ B</text>
  <text x="290" y="110" font-size="13" fill="#3b5bdb">L</text>
  <text x="420" y="110" font-size="13" fill="#3b5bdb">R</text>
  <text x="150" y="180" font-size="13" fill="#c2255c">U</text>
  <text x="150" y="260" font-size="13" fill="#c2255c">D</text>

  <!-- matrix cells -->
  <rect x="170" y="130" width="140" height="90" fill="#c9d6ff" stroke="#5b6b8c" stroke-width="1.5"/>
  <rect x="310" y="130" width="140" height="90" fill="#ffd6e7" stroke="#5b6b8c" stroke-width="1.5"/>
  <rect x="170" y="220" width="140" height="90" fill="#ffd6e7" stroke="#5b6b8c" stroke-width="1.5"/>
  <rect x="310" y="220" width="140" height="90" fill="#fff3bf" stroke="#f08c00" stroke-width="2.5"/>

  <!-- payoffs -->
  <text x="240" y="160" text-anchor="middle" font-size="12" fill="#1a2238">(3, 2)</text>
  <text x="240" y="180" text-anchor="middle" font-size="11" fill="#555">U,L</text>
  <text x="380" y="160" text-anchor="middle" font-size="12" fill="#1a2238">(1, 4)</text>
  <text x="380" y="180" text-anchor="middle" font-size="11" fill="#555">U,R</text>
  <text x="240" y="250" text-anchor="middle" font-size="12" fill="#1a2238">(0, 1)</text>
  <text x="240" y="270" text-anchor="middle" font-size="11" fill="#555">D,L</text>
  <text x="380" y="250" text-anchor="middle" font-size="12" fill="#1a2238">(2, 3)</text>
  <text x="380" y="270" text-anchor="middle" font-size="11" fill="#555">D,R ★ Nash</text>

  <text x="340" y="345" text-anchor="middle" font-size="12" fill="#555">Cell shows (payoff to Row, payoff to Column); Nash = each playing best reply.</text>
</svg>
