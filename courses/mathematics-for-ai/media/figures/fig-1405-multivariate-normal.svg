<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" font-family="Latin Modern, serif">
  <rect width="680" height="340" fill="#fafafa"/>
  <text x="340" y="26" text-anchor="middle" font-size="16" fill="#222">Multivariate Gaussian N(mu, Sigma)</text>

  <g transform="translate(140,70)">
    <!-- axes -->
    <line x1="0" y1="200" x2="320" y2="200" stroke="#222"/>
    <line x1="160" y1="0" x2="160" y2="240" stroke="#222"/>
    <text x="300" y="218" font-size="11" fill="#222">x1</text>
    <text x="170" y="12" font-size="11" fill="#222">x2</text>

    <!-- contours (ellipses) -->
    <ellipse cx="160" cy="140" rx="40" ry="80" fill="none" stroke="#2a6f97" stroke-width="2"/>
    <ellipse cx="160" cy="140" rx="75" ry="140" fill="none" stroke="#2a6f97" stroke-width="1.5" opacity="0.7"/>
    <ellipse cx="160" cy="140" rx="110" ry="190" fill="none" stroke="#2a6f97" stroke-width="1" opacity="0.45"/>

    <!-- mean -->
    <circle cx="160" cy="140" r="4" fill="#b5333a"/>
    <text x="170" y="135" font-size="11" fill="#b5333a">mu</text>

    <!-- eigen axes -->
    <line x1="160" y1="140" x2="200" y2="90" stroke="#e07a1f" stroke-width="2"/>
    <line x1="160" y1="140" x2="120" y2="220" stroke="#e07a1f" stroke-width="2"/>
    <text x="205" y="85" font-size="10" fill="#e07a1f">PC1</text>
    <text x="95" y="235" font-size="10" fill="#e07a1f">PC2</text>
  </g>

  <text x="500" y="110" font-size="12" fill="#222">Sigma = U diag(lambda) U^T</text>
  <text x="500" y="135" font-size="12" fill="#222">axes = eigenvectors</text>
  <text x="500" y="160" font-size="12" fill="#222">lengths = sqrt(lambda)</text>
  <text x="500" y="195" font-size="12" fill="#222">Mahalanobis d^2 =</text>
  <text x="500" y="212" font-size="12" fill="#222">(x-mu)^T Sigma^{-1}(x-mu)</text>
  <text x="340" y="320" text-anchor="middle" font-size="12" fill="#555">GMM, PCA, Kalman, GP priors all build on this shape.</text>
</svg>
