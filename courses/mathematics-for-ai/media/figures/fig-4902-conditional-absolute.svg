<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="680" height="380" font-family="Tajawal, Noto Naskh Arabic, sans-serif">
  <rect width="680" height="380" fill="#ffffff"/>
  <text x="664" y="26" text-anchor="end" font-size="15" fill="#1f4e6b" font-weight="700">التقارب المطلق والشرطي وإعادة الترتيب</text>
  <text x="664" y="44" text-anchor="end" font-size="11" fill="#5a6770">Absolute vs conditional convergence</text>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6770"/></marker></defs>
  <rect x="30" y="70" width="290" height="60" rx="7" fill="#f2f7fa" stroke="#7a9e3c" stroke-width="1.5"/>
  <text x="175" y="98" text-anchor="middle" font-size="12.5" fill="#1c2b36" font-weight="700"><tspan direction="ltr" unicode-bidi="isolate">Σ |a<tspan dy="3.75" font-size="70%">n</tspan><tspan dy="-3.75" font-size="1">&#8203;</tspan>| &lt; ∞</tspan></text>
  <text x="175" y="114" text-anchor="middle" font-size="10" fill="#5a6770">تقارب مطلق: أيّ ترتيب يعطي المجموع نفسه</text>
  <rect x="360" y="70" width="290" height="60" rx="7" fill="#f2f7fa" stroke="#b5473a" stroke-width="1.5"/>
  <text x="505" y="98" text-anchor="middle" font-size="12.5" fill="#1c2b36" font-weight="700"><tspan direction="ltr" unicode-bidi="isolate">Σ a<tspan dy="3.75" font-size="70%">n</tspan><tspan dy="-3.75" font-size="1">&#8203;</tspan> &lt; ∞, Σ|a<tspan dy="3.75" font-size="70%">n</tspan><tspan dy="-3.75" font-size="1">&#8203;</tspan>|=∞</tspan></text>
  <text x="505" y="114" text-anchor="middle" font-size="10" fill="#5a6770">تقارب شرطي: الترتيب يغيّر النتيجة</text>
  <text x="656" y="168" text-anchor="end" font-size="11.5" fill="#1c2b36">ترتيب المتسلسلة المتناوبة<tspan direction="ltr" unicode-bidi="isolate"> Σ(-1)<tspan dy="-4.83" font-size="70%">n+1</tspan><tspan dy="4.83" font-size="1">&#8203;</tspan>/n</tspan></text>
  <g font-size="11" fill="#1c2b36">
    <text x="60" y="200">1, 1/2, 1/3, 1/4, ...</text>
    <text x="60" y="224">1, -1/2, 1/3, -1/4, ...</text>
    <text x="60" y="248">1+1/3, -1/2, 1/5+1/7, -1/4, ...</text>
  </g>
  <g font-size="11" fill="#7a9e3c">
    <text x="380" y="200"><tspan direction="ltr" unicode-bidi="isolate">S = ln 2 ≈ 0.693</tspan></text>
  </g>
  <g font-size="11" fill="#b5473a">
    <text x="380" y="224">S' = (1/2) ln 2</text>
    <text x="380" y="248">S'' = (3/2) ln 2</text>
  </g>
  <text x="340" y="292" font-size="10.5" fill="#5a6770" direction="rtl">مبرهنة ريمان: المتسلسلة الشرطية يمكن إعادة ترتيبها لتقترب من أيّ عدد حقيقي معطى.</text>
  <text x="340" y="316" font-size="10.5" fill="#5a6770" direction="rtl">أثر هندسي: جمع التدرّجات بترتيب غير مستقرّ (مثل الحساب الموزَّع غير الحتمي) يغيّر النتيجة.</text>
  <text x="340" y="340" font-size="10.5" fill="#5a6770" direction="rtl">قاعدة عملية: اطلب التقارب المطلق قبل السماح بتبديل عمليات الجمع والتوقّع.</text>
</svg>