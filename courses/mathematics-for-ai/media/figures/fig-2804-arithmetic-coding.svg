<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360">
  <rect width="680" height="360" fill="#fbfbfd"/>
  <line x1="60" y1="320" x2="620" y2="320" stroke="#222" stroke-width="2"/>
  <g stroke="#bbb" stroke-width="1">
    <line x1="134" y1="320" x2="134" y2="326"/><line x1="208" y1="320" x2="208" y2="326"/>
    <line x1="282" y1="320" x2="282" y2="326"/><line x1="356" y1="320" x2="356" y2="326"/>
    <line x1="430" y1="320" x2="430" y2="326"/><line x1="504" y1="320" x2="504" y2="326"/>
    <line x1="578" y1="320" x2="578" y2="326"/>
  </g>
  <text x="60" y="340" font-family="sans-serif" font-size="11" fill="#555">0</text>
  <text x="614" y="340" font-family="sans-serif" font-size="11" fill="#555">1</text>
  <rect x="60" y="90" width="560" height="26" fill="#e8f0ff" stroke="#1f6feb" stroke-width="2"/>
  <text x="340" y="108" font-family="sans-serif" font-size="12" fill="#1f6feb" text-anchor="middle">step 1: [0, 0.8) = a, [0.8, 1) = b</text>
  <rect x="60" y="140" width="448" height="26" fill="#fff2e0" stroke="#e08a00" stroke-width="2"/>
  <text x="284" y="158" font-family="sans-serif" font-size="12" fill="#e08a00" text-anchor="middle">step 2 (a): [0, 0.8) × [0, 0.8) = [0, 0.64)</text>
  <rect x="60" y="190" width="358.4" height="26" fill="#e6ffe6" stroke="#2a7a2a" stroke-width="2"/>
  <text x="240" y="208" font-family="sans-serif" font-size="12" fill="#2a7a2a" text-anchor="middle">step 3 (a): [0, 0.512)</text>
  <rect x="60" y="240" width="286.7" height="26" fill="#ffe8e8" stroke="#c00" stroke-width="2"/>
  <text x="200" y="258" font-family="sans-serif" font-size="12" fill="#c00" text-anchor="middle">step 4 (b): [0.4096, 0.512)</text>
  <text x="340" y="40" font-family="sans-serif" font-size="13" fill="#222" text-anchor="middle">message aab → nested interval of width p(aab) = 0.8·0.8·0.8·0.2</text>
  <text x="340" y="300" font-family="sans-serif" font-size="12" fill="#555" text-anchor="middle">any binary fraction inside the final interval encodes the message</text>
</svg>
