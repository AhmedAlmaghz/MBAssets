<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="680" height="380" font-family="Tajawal, Noto Naskh Arabic, sans-serif">
  <rect width="680" height="380" fill="#ffffff"/>
  <text x="664" y="26" text-anchor="end" font-size="15" fill="#1f4e6b" font-weight="700">شجرة معايير تقارب المتسلسلات الموجبة</text>
  <text x="664" y="44" text-anchor="end" font-size="11" fill="#5a6770">Convergence tests for positive series</text>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6770"/></marker></defs>
  <rect x="250" y="60" width="180" height="44" rx="7" fill="#f2f7fa" stroke="#1f4e6b" stroke-width="1.5"/>
  <text x="340" y="80" text-anchor="middle" font-size="12.5" fill="#1c2b36" font-weight="700"><tspan direction="ltr" unicode-bidi="isolate">Σ a<tspan dy="3.75" font-size="70%">n</tspan><tspan dy="-3.75" font-size="1">&#8203;</tspan> , a<tspan dy="3.75" font-size="70%">n</tspan><tspan dy="-3.75" font-size="1">&#8203;</tspan> ≥ 0</tspan></text>
  <text x="340" y="96" text-anchor="middle" font-size="10" fill="#5a6770">متسلسلة موجبة</text>
  <line x1="340" y1="104" x2="340" y2="130" stroke="#5a6770" stroke-width="1.4" marker-end="url(#ah)"/>  <rect x="40" y="134" width="150" height="40" rx="7" fill="#f2f7fa" stroke="#1f4e6b" stroke-width="1.5"/>
  <text x="115" y="152" text-anchor="middle" font-size="12.5" fill="#1c2b36" font-weight="700">Comparison</text>
  <text x="115" y="168" text-anchor="middle" font-size="10" fill="#5a6770">مقارنة بـ b_n</text>
  <rect x="265" y="134" width="150" height="40" rx="7" fill="#f2f7fa" stroke="#1f4e6b" stroke-width="1.5"/>
  <text x="340" y="152" text-anchor="middle" font-size="12.5" fill="#1c2b36" font-weight="700">Ratio (d'Alembert)</text>
  <text x="340" y="168" text-anchor="middle" font-size="10" fill="#5a6770">L = lim a_{n+1}/a_n</text>
  <rect x="490" y="134" width="150" height="40" rx="7" fill="#f2f7fa" stroke="#1f4e6b" stroke-width="1.5"/>
  <text x="565" y="152" text-anchor="middle" font-size="12.5" fill="#1c2b36" font-weight="700">Root (Cauchy)</text>
  <text x="565" y="168" text-anchor="middle" font-size="10" fill="#5a6770">L = lim (a_n)^{1/n}</text>
  <line x1="115" y1="174" x2="115" y2="200" stroke="#5a6770" stroke-width="1.4" marker-end="url(#ah)"/>  <line x1="340" y1="174" x2="340" y2="200" stroke="#5a6770" stroke-width="1.4" marker-end="url(#ah)"/>  <line x1="565" y1="174" x2="565" y2="200" stroke="#5a6770" stroke-width="1.4" marker-end="url(#ah)"/>  <rect x="40" y="204" width="150" height="36" rx="7" fill="#f2f7fa" stroke="#7a9e3c" stroke-width="1.5"/>
  <text x="115" y="220" text-anchor="middle" font-size="12.5" fill="#1c2b36" font-weight="700"><tspan direction="ltr" unicode-bidi="isolate">L &lt; 1 ⇒</tspan></text>
  <text x="115" y="236" text-anchor="middle" font-size="10" fill="#5a6770">تقارب</text>
  <rect x="265" y="204" width="150" height="36" rx="7" fill="#f2f7fa" stroke="#b5473a" stroke-width="1.5"/>
  <text x="340" y="220" text-anchor="middle" font-size="12.5" fill="#1c2b36" font-weight="700"><tspan direction="ltr" unicode-bidi="isolate">L &gt; 1 ⇒</tspan></text>
  <text x="340" y="236" text-anchor="middle" font-size="10" fill="#5a6770">تباعد</text>
  <rect x="490" y="204" width="150" height="36" rx="7" fill="#f2f7fa" stroke="#5a6770" stroke-width="1.5"/>
  <text x="565" y="220" text-anchor="middle" font-size="12.5" fill="#1c2b36" font-weight="700"><tspan direction="ltr" unicode-bidi="isolate">L = 1 ⇒</tspan></text>
  <text x="565" y="236" text-anchor="middle" font-size="10" fill="#5a6770">غير حاسم</text>
  <line stroke-dasharray="4 3" x1="115" y1="240" x2="265" y2="240" stroke="#b5473a" stroke-width="1.4" marker-end="url(#ah)"/>  <line stroke-dasharray="4 3" x1="565" y1="240" x2="340" y2="240" stroke="#b5473a" stroke-width="1.4" marker-end="url(#ah)"/>  <rect x="150" y="258" width="380" height="40" rx="7" fill="#f2f7fa" stroke="#5a6770" stroke-width="1.5"/>
  <text x="340" y="276" text-anchor="middle" font-size="12.5" fill="#1c2b36" font-weight="700">Fallback: Integral / Raabe / Cauchy condensation</text>
  <text x="340" y="292" text-anchor="middle" font-size="10" fill="#5a6770">معيار احتياطي عند L=1</text>
  <text x="340" y="322" font-size="10.5" fill="#5a6770" direction="rtl">القاعدة: معيار النسبة/الجذر سريع لكنه يصمت عند L=1؛ والمقارنة هي الحكم النهائي.</text>
  <text x="340" y="344" font-size="10.5" fill="#5a6770" direction="rtl">نظير في التعلّم: معايير توقّف التدريب تُقارن بمعيار مرجعي لا بمطلق القيم.</text>
</svg>