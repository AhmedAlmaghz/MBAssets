<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380">
  <rect width="680" height="380" fill="#fbfbfd"/>

  <!-- perceptron unit (top) -->
  <text x="20" y="28" font-family="sans-serif" font-size="13" fill="#1f6feb" font-weight="bold">Perceptron unit</text>
  <circle cx="70" cy="80" r="18" fill="#eef4ff" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="70" y="84" font-family="sans-serif" font-size="12" fill="#1f6feb" text-anchor="middle">x1</text>
  <circle cx="70" cy="120" r="18" fill="#eef4ff" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="70" y="124" font-family="sans-serif" font-size="12" fill="#1f6feb" text-anchor="middle">x2</text>
  <circle cx="70" cy="160" r="18" fill="#eef4ff" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="70" y="164" font-family="sans-serif" font-size="12" fill="#1f6feb" text-anchor="middle">x3</text>

  <line x1="88" y1="80" x2="200" y2="120" stroke="#333" stroke-width="1.5"/>
  <line x1="88" y1="120" x2="200" y2="120" stroke="#333" stroke-width="1.5"/>
  <line x1="88" y1="160" x2="200" y2="120" stroke="#333" stroke-width="1.5"/>

  <circle cx="220" cy="120" r="22" fill="#fff6d8" stroke="#b8860b" stroke-width="1.8"/>
  <text x="220" y="125" font-family="sans-serif" font-size="16" fill="#8a5a00" text-anchor="middle">&#931;</text>

  <line x1="242" y1="120" x2="320" y2="120" stroke="#333" stroke-width="1.5"/>
  <circle cx="340" cy="120" r="22" fill="#e8f5e8" stroke="#2a7a2a" stroke-width="1.8"/>
  <text x="340" y="125" font-family="sans-serif" font-size="13" fill="#2a7a2a" text-anchor="middle">step</text>

  <line x1="362" y1="120" x2="440" y2="120" stroke="#333" stroke-width="1.5"/>
  <text x="470" y="125" font-family="sans-serif" font-size="13" fill="#333">y_hat = sign(w.x)</text>

  <!-- 2D separation (bottom) -->
  <text x="20" y="210" font-family="sans-serif" font-size="13" fill="#1f6feb" font-weight="bold">Separating hyperplane with margin gamma</text>
  <line x1="60" y1="360" x2="60" y2="240" stroke="#999" stroke-width="1"/>
  <line x1="60" y1="360" x2="600" y2="360" stroke="#999" stroke-width="1"/>
  <text x="610" y="364" font-family="sans-serif" font-size="11" fill="#555">x1</text>
  <text x="50" y="236" font-family="sans-serif" font-size="11" fill="#555">x2</text>

  <!-- margin band -->
  <line x1="180" y1="240" x2="460" y2="360" stroke="#c00" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="240" y1="240" x2="520" y2="360" stroke="#c00" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="330" y="270" font-family="sans-serif" font-size="11" fill="#c00" text-anchor="middle">gamma (margin)</text>

  <!-- hyperplane -->
  <line x1="210" y1="240" x2="490" y2="360" stroke="#1f6feb" stroke-width="2.5"/>
  <text x="500" y="330" font-family="sans-serif" font-size="11" fill="#1f6feb">hyperplane w.x=0</text>

  <!-- points -->
  <circle cx="160" cy="270" r="6" fill="#2a7a2a"/>
  <circle cx="200" cy="300" r="6" fill="#2a7a2a"/>
  <circle cx="300" cy="255" r="6" fill="#2a7a2a"/>
  <text x="155" y="262" font-family="sans-serif" font-size="11" fill="#2a7a2a">+1</text>

  <circle cx="500" cy="300" r="6" fill="#c00"/>
  <circle cx="440" cy="340" r="6" fill="#c00"/>
  <circle cx="540" cy="270" r="6" fill="#c00"/>
  <text x="500" y="292" font-family="sans-serif" font-size="11" fill="#c00">-1</text>

  <text x="20" y="375" font-family="sans-serif" font-size="10" fill="#555">Novikoff: T &lt;= (R/gamma)^2 mistakes</text>
</svg>
