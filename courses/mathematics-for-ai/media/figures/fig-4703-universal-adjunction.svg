<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="380" fill="#fbfbfd"/>
  <text x="340" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2238">Universal property: product &amp; adjunction</text>

  <!-- product cone -->
  <circle cx="250" cy="230" r="24" fill="#ffe0b2" stroke="#e8590c" stroke-width="2.5"/>
  <text x="250" y="235" text-anchor="middle" font-size="12" fill="#1a2238">A×B</text>
  <circle cx="130" cy="120" r="22" fill="#c9d6ff" stroke="#3b5bdb" stroke-width="2"/>
  <text x="130" y="125" text-anchor="middle" font-size="12" fill="#1a2238">A</text>
  <circle cx="370" cy="120" r="22" fill="#c9d6ff" stroke="#3b5bdb" stroke-width="2"/>
  <text x="370" y="125" text-anchor="middle" font-size="12" fill="#1a2238">B</text>
  <line x1="238" y1="208" x2="152" y2="142" stroke="#2f9e44" stroke-width="2.2" marker-end="url(#ua1)"/>
  <line x1="262" y1="208" x2="348" y2="142" stroke="#2f9e44" stroke-width="2.2" marker-end="url(#ua1)"/>
  <text x="185" y="180" font-size="11" fill="#2f9e44">π_A</text>
  <text x="325" y="180" font-size="11" fill="#2f9e44">π_B</text>

  <!-- unique mediating morphism -->
  <circle cx="250" cy="330" r="22" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/>
  <text x="250" y="335" text-anchor="middle" font-size="12" fill="#1a2238">X</text>
  <path d="M250 308 L250 254" stroke="#c2255c" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#ua2)"/>
  <text x="275" y="285" font-size="11" fill="#c2255c">⟨f,g⟩ unique</text>

  <!-- adjunction note -->
  <rect x="430" y="110" width="210" height="80" rx="10" fill="#fff3bf" stroke="#f08c00" stroke-width="1.5"/>
  <text x="535" y="140" text-anchor="middle" font-size="12.5" fill="#1a2238">adjunction F ⊣ G</text>
  <text x="535" y="162" text-anchor="middle" font-size="11.5" fill="#555">Hom(F(X),Y) ≅ Hom(X,G(Y))</text>
  <text x="535" y="180" text-anchor="middle" font-size="10.5" fill="#555">naturally in X and Y</text>

  <text x="340" y="365" text-anchor="middle" font-size="11.5" fill="#555">Product: any pair f:X→A, g:X→B factors uniquely through A×B.</text>
  <defs>
    <marker id="ua1" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#2f9e44"/></marker>
    <marker id="ua2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#c2255c"/></marker>
  </defs>
</svg>
