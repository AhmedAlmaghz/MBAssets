<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="380" fill="#fbfbfd"/>
  <text x="340" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2238">Graph, adjacency &amp; degree</text>

  <!-- graph on left -->
  <g>
    <line x1="150" y1="120" x2="240" y2="170" stroke="#888" stroke-width="2"/>
    <line x1="240" y1="170" x2="330" y2="120" stroke="#888" stroke-width="2"/>
    <line x1="150" y1="250" x2="240" y2="200" stroke="#888" stroke-width="2"/>
    <line x1="240" y1="200" x2="330" y2="250" stroke="#888" stroke-width="2"/>
    <line x1="150" y1="120" x2="150" y2="250" stroke="#888" stroke-width="2"/>
    <line x1="240" y1="170" x2="240" y2="200" stroke="#888" stroke-width="2"/>
    <line x1="330" y1="120" x2="330" y2="250" stroke="#888" stroke-width="2"/>
    <circle cx="150" cy="120" r="16" fill="#c9d6ff" stroke="#3b5bdb" stroke-width="2"/>
    <circle cx="240" cy="170" r="16" fill="#c9d6ff" stroke="#3b5bdb" stroke-width="2"/>
    <circle cx="330" cy="120" r="16" fill="#c9d6ff" stroke="#3b5bdb" stroke-width="2"/>
    <circle cx="150" cy="250" r="16" fill="#c9d6ff" stroke="#3b5bdb" stroke-width="2"/>
    <circle cx="240" cy="200" r="16" fill="#c9d6ff" stroke="#3b5bdb" stroke-width="2"/>
    <circle cx="330" cy="250" r="16" fill="#c9d6ff" stroke="#3b5bdb" stroke-width="2"/>
    <text x="150" y="124" text-anchor="middle" font-size="11" fill="#1a2238">1</text>
    <text x="240" y="174" text-anchor="middle" font-size="11" fill="#1a2238">2</text>
    <text x="330" y="124" text-anchor="middle" font-size="11" fill="#1a2238">3</text>
    <text x="150" y="254" text-anchor="middle" font-size="11" fill="#1a2238">4</text>
    <text x="240" y="204" text-anchor="middle" font-size="11" fill="#1a2238">5</text>
    <text x="330" y="254" text-anchor="middle" font-size="11" fill="#1a2238">6</text>
  </g>
  <text x="240" y="300" text-anchor="middle" font-size="12" fill="#555">graph G = (V, E)</text>

  <!-- adjacency matrix on right -->
  <text x="530" y="90" text-anchor="middle" font-size="13" fill="#1a2238" font-weight="600">A (adjacency)</text>
  <g stroke="#5b6b8c" stroke-width="1" fill="#c9d6ff">
    <rect x="440" y="105" width="180" height="180"/>
    <rect x="440" y="105" width="60" height="60" fill="#3b5bdb"/>
    <rect x="560" y="105" width="60" height="60" fill="#3b5bdb"/>
    <rect x="440" y="225" width="60" height="60" fill="#3b5bdb"/>
    <rect x="560" y="225" width="60" height="60" fill="#3b5bdb"/>
  </g>
  <g stroke="#e5e7f0" stroke-width="1">
    <line x1="500" y1="105" x2="500" y2="285"/><line x1="560" y1="105" x2="560" y2="285"/>
    <line x1="440" y1="165" x2="620" y2="165"/><line x1="440" y1="225" x2="620" y2="225"/>
  </g>
  <text x="530" y="320" text-anchor="middle" font-size="11.5" fill="#555">A(i,j)=1 if edge i-j (symmetric)</text>
  <text x="530" y="342" text-anchor="middle" font-size="11.5" fill="#555">D = diag(degrees),  L = D − A</text>
</svg>
