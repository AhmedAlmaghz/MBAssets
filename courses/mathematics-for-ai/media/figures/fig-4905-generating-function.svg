<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="680" height="380" font-family="Tajawal, Noto Naskh Arabic, sans-serif">
  <rect width="680" height="380" fill="#ffffff"/>
  <text x="664" y="26" text-anchor="end" font-size="15" fill="#1f4e6b" font-weight="700">من المتتالية إلى الدالة المولّدة وإلى الشكل المغلق</text>
  <text x="664" y="44" text-anchor="end" font-size="11" fill="#5a6770">Generating function pipeline</text>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6770"/></marker></defs>
  <rect x="30" y="140" width="150" height="60" rx="7" fill="#f2f7fa" stroke="#1f4e6b" stroke-width="1.5"/>
  <text x="105" y="168" text-anchor="middle" font-size="12.5" fill="#1c2b36" font-weight="700">a_n</text>
  <text x="105" y="184" text-anchor="middle" font-size="10" fill="#5a6770">المتتالية / العلاقة التكراريّة</text>
  <line x1="180" y1="170" x2="240" y2="170" stroke="#5a6770" stroke-width="1.4" marker-end="url(#ah)"/>  <rect x="240" y="140" width="190" height="60" rx="7" fill="#f2f7fa" stroke="#1f4e6b" stroke-width="1.5"/>
  <text x="335" y="168" text-anchor="middle" font-size="12.5" fill="#1c2b36" font-weight="700"><tspan direction="ltr" unicode-bidi="isolate">A(z)=Σ<tspan dy="3.75" font-size="70%">n≥0</tspan><tspan dy="-3.75" font-size="1">&#8203;</tspan> a<tspan dy="3.75" font-size="70%">n</tspan><tspan dy="-3.75" font-size="1">&#8203;</tspan> z<tspan dy="-5.25" font-size="70%">n</tspan><tspan dy="5.25" font-size="1">&#8203;</tspan></tspan></text>
  <text x="335" y="184" text-anchor="middle" font-size="10" fill="#5a6770">التحويل إلى دالة مولّدة</text>
  <line x1="430" y1="170" x2="490" y2="170" stroke="#5a6770" stroke-width="1.4" marker-end="url(#ah)"/>  <rect x="490" y="140" width="160" height="60" rx="7" fill="#f2f7fa" stroke="#7a9e3c" stroke-width="1.5"/>
  <text x="570" y="168" text-anchor="middle" font-size="12.5" fill="#1c2b36" font-weight="700"><tspan direction="ltr" unicode-bidi="isolate">A(z)=1/(1-2z)</tspan></text>
  <text x="570" y="184" text-anchor="middle" font-size="10" fill="#5a6770">شكل مغلق كسري</text>
  <line x1="570" y1="200" x2="570" y2="240" stroke="#5a6770" stroke-width="1.4" marker-end="url(#ah)"/>  <rect x="430" y="244" width="220" height="50" rx="7" fill="#f2f7fa" stroke="#7a9e3c" stroke-width="1.5"/>
  <text x="540" y="267" text-anchor="middle" font-size="12.5" fill="#1c2b36" font-weight="700">a_n = [z^n]A(z) = 2^n</text>
  <text x="540" y="283" text-anchor="middle" font-size="10" fill="#5a6770">استخراج المعاملات</text>
  <line stroke-dasharray="4 3" x1="430" y1="269" x2="300" y2="269" stroke="#5a6770" stroke-width="1.4" marker-end="url(#ah)"/>  <text x="340" y="322" font-size="10.5" fill="#5a6770" direction="rtl">العلاقة التكراريّة تصير معادلة جبريّة<tspan direction="ltr" unicode-bidi="isolate">: a<tspan dy="3.15" font-size="70%">n</tspan><tspan dy="-3.15" font-size="1">&#8203;</tspan> = 2a<tspan dy="3.15" font-size="70%">n-1</tspan><tspan dy="-3.15" font-size="1">&#8203;</tspan> ⇒ A(z) = a<tspan dy="3.15" font-size="70%">0</tspan><tspan dy="-3.15" font-size="1">&#8203;</tspan> + 2zA(z).</tspan></text>
  <text x="340" y="344" font-size="10.5" fill="#5a6770" direction="rtl">النظير الحديث: تحويل Z في معالجة الإشارة، ودوال التوليد في عدّ نماذج الشبكات.</text>
</svg>