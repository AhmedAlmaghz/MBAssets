<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360">
  <rect width="680" height="360" fill="#fbfbfd"/>
  <line x1="40" y1="200" x2="660" y2="200" stroke="#222" stroke-width="2"/>
  <line x1="40" y1="40" x2="40" y2="200" stroke="#222" stroke-width="2"/>
  <polyline points="40,200 90,140 140,165 190,120 240,150 290,110 340,145 390,115 440,150 490,120 540,155 590,125 640,150" fill="none" stroke="#1f6feb" stroke-width="2.5"/>
  <line x1="40" y1="170" x2="660" y2="170" stroke="#888" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="350" y="165" font-family="sans-serif" font-size="13" fill="#888" text-anchor="middle">mean level</text>
  <path d="M90,140 C100,150 120,165 140,165" fill="none" stroke="#c00" stroke-width="1.8"/>
  <text x="70" y="120" font-family="sans-serif" font-size="12" fill="#c00" text-anchor="middle">pull back</text>
  <text x="350" y="240" font-family="sans-serif" font-size="14" fill="#222" text-anchor="middle">X_t = c + phi X_{t-1} + e_t</text>
