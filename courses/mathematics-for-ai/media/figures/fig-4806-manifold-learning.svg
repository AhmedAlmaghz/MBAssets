<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="380" fill="#fbfbfd"/>
  <text x="340" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2238">Data on a manifold: representation learning</text>

  <!-- swiss roll / embedded manifold -->
  <path d="M120 260 Q160 140 260 160 Q380 190 370 260 Q350 300 250 290 Q180 285 190 240"
        fill="none" stroke="#3b5bdb" stroke-width="14" opacity="0.22"/>
  <path d="M120 260 Q160 140 260 160 Q380 190 370 260 Q350 300 250 290 Q180 285 190 240"
        fill="none" stroke="#3b5bdb" stroke-width="2"/>

  <!-- data points on roll -->
  <g fill="#c2255c">
    <circle cx="150" cy="240" r="4"/><circle cx="185" cy="180" r="4"/>
    <circle cx="240" cy="165" r="4"/><circle cx="300" cy="178" r="4"/>
    <circle cx="345" cy="220" r="4"/><circle cx="300" cy="278" r="4"/>
  </g>
  <text x="120" y="320" font-size="12" fill="#3b5bdb">latent manifold M</text>

  <!-- arrow to learned embedding -->
  <line x1="405" y1="220" x2="455" y2="220" stroke="#f08c00" stroke-width="2" marker-end="url(#mn2)"/>
  <text x="430" y="210" text-anchor="middle" font-size="11" fill="#f08c00">encode</text>

  <!-- embedding space (flat) -->
  <rect x="470" y="140" width="170" height="170" rx="10" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2" opacity="0.5"/>
  <g fill="#2f9e44">
    <circle cx="500" cy="180" r="5"/><circle cx="535" cy="170" r="5"/>
    <circle cx="575" cy="175" r="5"/><circle cx="610" cy="185" r="5"/>
    <circle cx="510" cy="230" r="5"/><circle cx="555" cy="245" r="5"/>
  </g>
  <text x="555" y="300" text-anchor="middle" font-size="11" fill="#2f9e44">learned embedding</text>

  <text x="340" y="356" text-anchor="middle" font-size="11" fill="#555">Unroll / embed data while preserving geodesic distances (Isomap, MDS, hyperbolic).</text>
  <defs><marker id="mn2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#f08c00"/></marker></defs>
</svg>
