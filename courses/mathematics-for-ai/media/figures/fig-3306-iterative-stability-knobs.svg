<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380">
  <rect width="680" height="380" fill="#fbfbfd"/>

  <text x="340" y="26" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">Three knobs of an iterative solver: steps T, step size alpha, batch size b</text>

  <!-- panel 1 : T -->
  <rect x="40" y="52" width="180" height="150" fill="#fff" stroke="#bbb" stroke-width="1.2"/>
  <text x="130" y="72" font-family="sans-serif" font-size="12" fill="#222" text-anchor="middle">steps T</text>
  <line x1="60" y1="180" x2="200" y2="180" stroke="#222" stroke-width="1.4"/>
  <line x1="60" y1="90" x2="60" y2="180" stroke="#222" stroke-width="1.4"/>
  <path d="M62,176 L198,96" fill="none" stroke="#c00" stroke-width="2.4"/>
  <text x="130" y="196" font-family="sans-serif" font-size="10" fill="#777" text-anchor="middle">beta grows with T</text>
  <path d="M62,176 C120,140 160,120 198,116" fill="none" stroke="#1f6feb" stroke-width="2"/>
  <text x="130" y="152" font-family="sans-serif" font-size="10" fill="#1f6feb" text-anchor="middle">bias falls with T</text>

  <!-- panel 2 : alpha -->
  <rect x="250" y="52" width="180" height="150" fill="#fff" stroke="#bbb" stroke-width="1.2"/>
  <text x="340" y="72" font-family="sans-serif" font-size="12" fill="#222" text-anchor="middle">step size alpha</text>
  <line x1="270" y1="180" x2="410" y2="180" stroke="#222" stroke-width="1.4"/>
  <line x1="270" y1="90" x2="270" y2="180" stroke="#222" stroke-width="1.4"/>
  <path d="M272,176 L408,100" fill="none" stroke="#c00" stroke-width="2.4"/>
  <text x="340" y="196" font-family="sans-serif" font-size="10" fill="#777" text-anchor="middle">beta grows with alpha</text>
  <text x="340" y="152" font-family="sans-serif" font-size="10" fill="#1f6feb" text-anchor="middle">decay alpha_t = c/t helps</text>

  <!-- panel 3 : batch -->
  <rect x="460" y="52" width="180" height="150" fill="#fff" stroke="#bbb" stroke-width="1.2"/>
  <text x="550" y="72" font-family="sans-serif" font-size="12" fill="#222" text-anchor="middle">batch size b</text>
  <line x1="480" y1="180" x2="620" y2="180" stroke="#222" stroke-width="1.4"/>
  <line x1="480" y1="90" x2="480" y2="180" stroke="#222" stroke-width="1.4"/>
  <path d="M482,110 C520,150 570,170 618,174" fill="none" stroke="#2a7a2a" stroke-width="2.6"/>
  <text x="550" y="196" font-family="sans-serif" font-size="10" fill="#777" text-anchor="middle">noise ~ 1/(n b)</text>
  <text x="550" y="152" font-family="sans-serif" font-size="10" fill="#2a7a2a" text-anchor="middle">mean drift stays 2 alpha L / n</text>

  <!-- bottom: bias variance tradeoff -->
  <rect x="40" y="240" width="600" height="90" fill="#f3fbf3" stroke="#2a7a2a" stroke-width="1.3"/>
  <text x="340" y="264" font-family="sans-serif" font-size="12" fill="#2a7a2a" text-anchor="middle">early stopping + iterate averaging = implicit regularisation</text>
  <text x="340" y="288" font-family="sans-serif" font-size="12" fill="#2a7a2a" text-anchor="middle">effective ridge parameter: lambda_eff ~ 1 / (alpha T)</text>
  <text x="340" y="312" font-family="sans-serif" font-size="12" fill="#2a7a2a" text-anchor="middle">tail averaging of m iterates: variance divided by m/(2 tau), tau = 1/(alpha lambda)</text>

  <text x="340" y="356" font-family="sans-serif" font-size="11" fill="#555" text-anchor="middle">stopping early trades bias for stability - exactly the bias-variance dial of chapter 30</text>
</svg>
