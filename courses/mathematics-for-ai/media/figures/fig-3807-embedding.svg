<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="380" fill="#fbfbfd"/>
  <text x="340" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2238">Embedding lookup</text>

  <!-- one-hot -->
  <text x="50" y="62" font-size="13" fill="#3b5bdb" font-weight="600">One-hot input</text>
  <g stroke="#5b6b8c" stroke-width="1" fill="none">
    <rect x="40" y="80" width="40" height="200"/>
    <line x1="40" y1="130" x2="80" y2="130"/><line x1="40" y1="180" x2="80" y2="180"/><line x1="40" y1="230" x2="80" y2="230"/>
  </g>
  <g font-size="11" fill="#1a2238" text-anchor="middle">
    <text x="60" y="105">0</text><text x="60" y="155">1</text><text x="60" y="205">0</text><text x="60" y="255">0</text>
  </g>
  <text x="60" y="305" text-anchor="middle" font-size="11" fill="#555">index = 1</text>

  <!-- embedding matrix -->
  <text x="300" y="62" font-size="13" fill="#e8590c" font-weight="600">Embedding matrix E (V x d)</text>
  <g stroke="#5b6b8c" stroke-width="1" fill="none">
    <rect x="220" y="80" width="200" height="200"/>
    <line x1="220" y1="130" x2="420" y2="130"/><line x1="220" y1="180" x2="420" y2="180"/><line x1="220" y1="230" x2="420" y2="230"/>
    <line x1="270" y1="80" x2="270" y2="280"/><line x1="320" y1="80" x2="320" y2="280"/><line x1="370" y1="80" x2="370" y2="280"/>
  </g>
  <g font-size="9" fill="#1a2238" text-anchor="middle">
    <text x="245" y="105">.2</text><text x="295" y="105">.5</text><text x="345" y="105">.1</text><text x="395" y="105">.8</text>
    <text x="245" y="155">.7</text><text x="295" y="155">.3</text><text x="345" y="155">.9</text><text x="395" y="155">.2</text>
    <text x="245" y="205">.4</text><text x="295" y="205">.6</text><text x="345" y="205">.1</text><text x="395" y="205">.5</text>
    <text x="245" y="255">.1</text><text x="295" y="255">.2</text><text x="345" y="255">.8</text><text x="395" y="255">.3</text>
  </g>
  <rect x="220" y="130" width="50" height="50" fill="#ffe0b2" fill-opacity="0.6" stroke="#e8590c" stroke-width="2.4"/>

  <!-- output vector -->
  <text x="600" y="62" font-size="13" fill="#2f9e44" font-weight="600">Vector d</text>
  <g stroke="#5b6b8c" stroke-width="1" fill="none">
    <rect x="560" y="80" width="40" height="200"/>
    <line x1="560" y1="130" x2="600" y2="130"/><line x1="560" y1="180" x2="600" y2="180"/><line x1="560" y1="230" x2="600" y2="230"/>
  </g>
  <g font-size="10" fill="#1a2238" text-anchor="middle">
    <text x="580" y="105">.7</text><text x="580" y="155">.3</text><text x="580" y="205">.6</text><text x="580" y="255">.2</text>
  </g>

  <line x1="80" y1="180" x2="218" y2="155" stroke="#888" stroke-width="1.6" marker-end="url(#em1)"/>
  <line x1="420" y1="155" x2="558" y2="155" stroke="#888" stroke-width="1.6" marker-end="url(#em1)"/>
  <defs><marker id="em1" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#888"/></marker></defs>

  <text x="340" y="350" text-anchor="middle" font-size="12.5" fill="#555">Embedding = row lookup E[index, :]; params = V*d (learned).</text>
</svg>
