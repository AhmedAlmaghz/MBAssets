<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="680" height="380" font-family="Tajawal, Noto Naskh Arabic, sans-serif">
  <rect width="680" height="380" fill="#ffffff"/>
  <text x="664" y="26" text-anchor="end" font-size="15" fill="#1f4e6b" font-weight="700">المؤثّر العصبي الفورييه (FNO): طبقة في مجال التردّد</text>
  <text x="664" y="44" text-anchor="end" font-size="11" fill="#5a6770">Fourier Neural Operator layer</text>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6770"/></marker></defs>
  <rect x="40" y="140" width="150" height="56" rx="7" fill="#f2f7fa" stroke="#1f4e6b" stroke-width="1.5"/>
  <text x="115" y="166" text-anchor="middle" font-size="12.5" fill="#1c2b36" font-weight="700">v(x)</text>
  <text x="115" y="182" text-anchor="middle" font-size="10" fill="#5a6770">حقل الدخل</text>
  <line x1="190" y1="168" x2="240" y2="168" stroke="#5a6770" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="240" y="140" width="160" height="56" rx="7" fill="#f2f7fa" stroke="#1f4e6b" stroke-width="1.5"/>
  <text x="320" y="166" text-anchor="middle" font-size="12.5" fill="#1c2b36" font-weight="700"><tspan direction="ltr" unicode-bidi="isolate">ℱ</tspan></text>
  <text x="320" y="182" text-anchor="middle" font-size="10" fill="#5a6770">تحويل فورييه</text>
  <line x1="400" y1="168" x2="450" y2="168" stroke="#5a6770" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="450" y="140" width="190" height="56" rx="7" fill="#f2f7fa" stroke="#7a9e3c" stroke-width="1.5"/>
  <text x="545" y="166" text-anchor="middle" font-size="12.5" fill="#1c2b36" font-weight="700"><tspan direction="ltr" unicode-bidi="isolate">R<tspan dy="3.75" font-size="70%">k</tspan><tspan dy="-3.75" font-size="1">&#8203;</tspan> ·(ℱ v)<tspan dy="3.75" font-size="70%">k</tspan><tspan dy="-3.75" font-size="1">&#8203;</tspan></tspan></text>
  <text x="545" y="182" text-anchor="middle" font-size="10" fill="#5a6770">ضرب بأوزان للأوضاع المحفوظة</text>
  <line x1="450" y1="196" x2="400" y2="250" stroke="#5a6770" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah)"/>
  <rect x="300" y="224" width="160" height="52" rx="7" fill="#f2f7fa" stroke="#1f4e6b" stroke-width="1.5"/>
  <text x="380" y="248" text-anchor="middle" font-size="12.5" fill="#1c2b36" font-weight="700"><tspan direction="ltr" unicode-bidi="isolate">ℱ<tspan dy="-5.25" font-size="70%">-1</tspan><tspan dy="5.25" font-size="1">&#8203;</tspan></tspan></text>
  <text x="380" y="264" text-anchor="middle" font-size="10" fill="#5a6770">تحويل عكسي</text>
  <text x="340" y="316" font-size="10.5" fill="#5a6770" direction="rtl">الاقتطاع عند<tspan direction="ltr" unicode-bidi="isolate"> k≤ K </tspan>يجعل التعقيد<tspan direction="ltr" unicode-bidi="isolate"> O(N log N) </tspan>ويمنح حياداً للدقة<tspan direction="ltr" unicode-bidi="isolate"> (resolution-invariant).</tspan></text>
  <text x="340" y="338" font-size="10.5" fill="#5a6770" direction="rtl">يحلّ معادلات تفاضلية جزئية أسرع بأضعاف من الشبكات المكانية.</text>
</svg>