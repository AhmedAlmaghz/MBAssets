<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="680" height="380" font-family="Tajawal, Noto Naskh Arabic, sans-serif">
  <rect width="680" height="380" fill="#ffffff"/>
  <text x="664" y="26" text-anchor="end" font-size="15" fill="#1f4e6b" font-weight="700">مبدأ الريبة: مربع الزمن-التردّد</text>
  <text x="664" y="44" text-anchor="end" font-size="11" fill="#5a6770">Time–frequency uncertainty principle</text>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6770"/></marker></defs>
  <line x1="70" y1="280" x2="320" y2="280" stroke="#5a6770" stroke-width="1"/>
  <line x1="70" y1="90" x2="70" y2="280" stroke="#5a6770" stroke-width="1"/>
  <text x="320" y="294" font-size="11" fill="#5a6770">t</text>
  <text x="64" y="100" text-anchor="end" font-size="11" fill="#5a6770">x(t)</text>
  <path d="M 80 250 C 140 250 160 130 220 130 C 260 130 270 250 310 250" fill="none" stroke="#1f4e6b" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="370" y1="280" x2="620" y2="280" stroke="#5a6770" stroke-width="1"/>
  <line x1="370" y1="90" x2="370" y2="280" stroke="#5a6770" stroke-width="1"/>
  <text x="620" y="294" font-size="11" fill="#5a6770"><tspan direction="ltr" unicode-bidi="isolate">ω</tspan></text>
  <text x="364" y="100" text-anchor="end" font-size="11" fill="#5a6770">|X|</text>
  <path d="M 380 260 L 440 260 L 460 150 L 520 150 L 540 260 L 610 260" fill="none" stroke="#7a9e3c" stroke-width="2.4" stroke-linecap="round"/>
  <text x="340" y="330" font-size="10.5" fill="#5a6770" direction="rtl"><tspan direction="ltr" unicode-bidi="isolate">Δ t Δω ≥ 1/2 — </tspan>لا يمكن تحديد الزمن والتردّد معاً بدقّة اختياريّة<tspan direction="ltr" unicode-bidi="isolate">.</tspan></text>
  <text x="340" y="352" font-size="10.5" fill="#5a6770" direction="rtl">كلّ تحليل زمني-ترددي هو مفاضلة في هذا المربع (STFT: شبكة ثابتة؛ مويجات: شبكة متعدّدة المقاييس).</text>
</svg>