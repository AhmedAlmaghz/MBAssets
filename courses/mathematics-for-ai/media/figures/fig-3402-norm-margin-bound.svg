<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380">
  <rect width="680" height="380" fill="#fbfbfd"/>

  <text x="340" y="28" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">Norm based bound: O( ||X||_F * prod_l ||W_l||_sigma * L^1.5 / (gamma * sqrt(n)) )</text>

  <!-- axes -->
  <line x1="80" y1="320" x2="640" y2="320" stroke="#222" stroke-width="2"/>
  <line x1="80" y1="60" x2="80" y2="320" stroke="#222" stroke-width="2"/>
  <text x="360" y="352" font-family="sans-serif" font-size="12" fill="#555" text-anchor="middle">spectral norm product  prod_l ||W_l||_sigma</text>
  <text x="24" y="180" font-family="sans-serif" font-size="12" fill="#555">bound</text>

  <!-- bound curves for three margins -->
  <path d="M100,300 C220,262 330,222 620,170" fill="none" stroke="#c00" stroke-width="2.6"/>
  <text x="560" y="162" font-family="sans-serif" font-size="11" fill="#c00">gamma = 0.5</text>

  <path d="M100,312 C220,290 330,268 620,232" fill="none" stroke="#1f6feb" stroke-width="2.6"/>
  <text x="560" y="224" font-family="sans-serif" font-size="11" fill="#1f6feb">gamma = 1.0</text>

  <path d="M100,318 C220,304 330,292 620,272" fill="none" stroke="#2a7a2a" stroke-width="2.6"/>
  <text x="560" y="264" font-family="sans-serif" font-size="11" fill="#2a7a2a">gamma = 2.0</text>

  <!-- markers: unnormalised vs spectrally normalised -->
  <circle cx="470" cy="196" r="6" fill="#c00"/>
  <line x1="470" y1="196" x2="470" y2="320" stroke="#c00" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="414" y="338" font-family="sans-serif" font-size="10" fill="#c00">unnormalised</text>
  <text x="404" y="350" font-family="sans-serif" font-size="10" fill="#c00">3^8 = 6561</text>

  <circle cx="150" cy="290" r="6" fill="#2a7a2a"/>
  <line x1="150" y1="290" x2="150" y2="320" stroke="#2a7a2a" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="118" y="338" font-family="sans-serif" font-size="10" fill="#2a7a2a">spectral</text>
  <text x="112" y="350" font-family="sans-serif" font-size="10" fill="#2a7a2a">norm = 1</text>

  <path d="M470,196 C360,190 240,240 150,290" fill="none" stroke="#b8860b" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="250" y="222" font-family="sans-serif" font-size="11" fill="#b8860b">gain factor = 6561</text>

  <!-- depth penalty box -->
  <rect x="430" y="66" width="200" height="46" fill="#eef4ff" stroke="#1f6feb" stroke-width="1.2"/>
  <text x="530" y="84" font-family="sans-serif" font-size="10" fill="#1f6feb" text-anchor="middle">depth penalty L^1.5</text>
  <text x="530" y="100" font-family="sans-serif" font-size="10" fill="#1f6feb" text-anchor="middle">L=4: 8.0   L=8: 22.6   L=32: 181.0</text>
</svg>
