<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="680" height="380" font-family="Tajawal, Noto Naskh Arabic, sans-serif">
  <rect width="680" height="380" fill="#ffffff"/>
  <text x="664" y="26" text-anchor="end" font-size="15" fill="#1f4e6b" font-weight="700">نيكويست–شانون: شرط معدّل العيّنات</text>
  <text x="664" y="44" text-anchor="end" font-size="11" fill="#5a6770">Nyquist–Shannon sampling theorem</text>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6770"/></marker></defs>
  <line x1="60" y1="290" x2="620" y2="290" stroke="#5a6770" stroke-width="1"/>
  <line x1="60" y1="90" x2="60" y2="290" stroke="#5a6770" stroke-width="1"/>
  <text x="620" y="304" font-size="11" fill="#5a6770">f (Hz)</text>
  <text x="54" y="100" text-anchor="end" font-size="11" fill="#5a6770">|X(f)|</text>
  <path d="M 70 280 L 240 280 L 260 140 L 410 140 L 430 280 L 620 280" fill="none" stroke="#1f4e6b" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="470" y1="90" x2="470" y2="290" stroke="#b5473a" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="478" y="120" font-size="11" fill="#b5473a">f_s/2 (نيكويست)</text>
  <line x1="330" y1="90" x2="330" y2="290" stroke="#7a9e3c" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="250" y="120" font-size="11" fill="#7a9e3c">B: أعلى تردّد</text>
  <text x="340" y="330" font-size="10.5" fill="#5a6770" direction="rtl">الشرط: f_s > 2B. وإلا تداخل الطيف (aliasing) ولا يمكن إعادة البناء.</text>
  <text x="340" y="352" font-size="10.5" fill="#5a6770" direction="rtl">إعادة البناء<tspan direction="ltr" unicode-bidi="isolate">: x(t)=Σ<tspan dy="3.15" font-size="70%">n</tspan><tspan dy="-3.15" font-size="1">&#8203;</tspan> x[n] sinc(t/T-n).</tspan></text>
</svg>