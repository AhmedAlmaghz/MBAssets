<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360">
  <rect width="680" height="360" fill="#fbfbfd"/>
  <line x1="60" y1="310" x2="640" y2="310" stroke="#222" stroke-width="2"/>
  <line x1="60" y1="40" x2="60" y2="310" stroke="#222" stroke-width="2"/>
  <path d="M60,50 C60,200 200,290 480,305" fill="none" stroke="#1f6feb" stroke-width="3"/>
  <text x="180" y="120" font-family="sans-serif" font-size="13" fill="#1f6feb">R(D) : convex, decreasing</text>
  <line x1="60" y1="230" x2="640" y2="230" stroke="#c00" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="580" y="222" font-family="sans-serif" font-size="12" fill="#c00">budget R</text>
  <line x1="300" y1="230" x2="300" y2="310" stroke="#c00" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="306" y="300" font-family="sans-serif" font-size="12" fill="#c00">D*(R): best achievable distortion</text>
  <text x="350" y="340" font-family="sans-serif" font-size="12" fill="#555" text-anchor="middle">distortion D (e.g. MSE)</text>
  <text x="30" y="180" font-family="sans-serif" font-size="12" fill="#555">rate</text>
  <text x="340" y="30" font-family="sans-serif" font-size="13" fill="#222" text-anchor="middle">rate–distortion trade-off: fewer bits ⇔ more distortion</text>
</svg>
