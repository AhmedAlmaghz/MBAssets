<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360">
  <rect width="680" height="360" fill="#fbfbfd"/>
  <rect x="50" y="60" width="230" height="90" fill="#e8f4ff" stroke="#1f6feb" stroke-width="2"/>
  <text x="165" y="105" font-family="sans-serif" font-size="13" fill="#1f6feb" text-anchor="middle">primal: min f(x) + g(Ax)</text>
  <rect x="400" y="60" width="230" height="90" fill="#ffe8e8" stroke="#c00" stroke-width="2"/>
  <text x="515" y="100" font-family="sans-serif" font-size="12" fill="#c00" text-anchor="middle">dual: max -f*(-A^T y)</text>
  <text x="515" y="118" font-family="sans-serif" font-size="12" fill="#c00" text-anchor="middle">- g*(y)</text>
  <line x1="280" y1="105" x2="400" y2="105" stroke="#2da44e" stroke-width="2.5" marker-end="url(#b)"/>
  <defs>
    <marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2da44e"/>
    </marker>
  </defs>
  <text x="340" y="85" font-family="sans-serif" font-size="12" fill="#2da44e" text-anchor="middle">conjugates</text>
  <rect x="200" y="220" width="280" height="80" fill="#e8ffe8" stroke="#2da44e" stroke-width="2"/>
  <text x="340" y="255" font-family="sans-serif" font-size="13" fill="#2da44e" text-anchor="middle">p* = d*  (strong duality)</text>
  <text x="340" y="278" font-family="sans-serif" font-size="12" fill="#555" text-anchor="middle">under constraint qualification</text>
  <text x="340" y="345" font-family="sans-serif" font-size="12" fill="#555" text-anchor="middle">Fenchel-Rockafellar duality</text>
</svg>
