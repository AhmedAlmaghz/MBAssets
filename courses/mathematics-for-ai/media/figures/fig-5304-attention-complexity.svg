<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="680" height="380" font-family="Tajawal, Noto Naskh Arabic, sans-serif">
  <rect width="680" height="380" fill="#ffffff"/>
  <text x="664" y="26" text-anchor="end" font-size="15" fill="#1f4e6b" font-weight="700">تعقيد الانتباه on الطويل وبدائله</text>
  <text x="664" y="44" text-anchor="end" font-size="11" fill="#5a6770">Attention complexity O(n²) and alternatives</text>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6770"/></marker></defs>
  <g>
    <rect x="70" y="120" width="540" height="180" fill="none" stroke="#5a6770" stroke-width="1"/>
    <text x="90" y="150" font-size="12" fill="#b5473a">انتباه كامل<tspan direction="ltr" unicode-bidi="isolate">: </tspan>مصفوفة<tspan direction="ltr" unicode-bidi="isolate"> n×n ⇒ O(n<tspan dy="-5.04" font-size="70%">2</tspan><tspan dy="5.04" font-size="1">&#8203;</tspan> d)</tspan></text>
    <text x="90" y="180" font-size="12" fill="#5a6770">نوافذ محلية / متفرّقة: O(n w d)</text>
    <text x="90" y="210" font-size="12" fill="#5a6770">انتباه خطّي (kernel/Performer): O(n d^2)</text>
    <text x="90" y="240" font-size="12" fill="#7a9e3c">نماذج الحالة<tspan direction="ltr" unicode-bidi="isolate"> SSM/S4: O(n log n) </tspan>أو<tspan direction="ltr" unicode-bidi="isolate"> O(n d)</tspan></text>
    <text x="90" y="270" font-size="12" fill="#1f4e6b">التردّد<tspan direction="ltr" unicode-bidi="isolate"> (FNet/AFU): </tspan>مزجٌ بـ<tspan direction="ltr" unicode-bidi="isolate"> FFT ⇒ O(n log n) </tspan>بلا تعلّم</text>
  </g>
  <text x="340" y="326" font-size="10.5" fill="#5a6770" direction="rtl">السياق الطويل: المفاضلة بين الدقّة (انتباه كامل) والتكلفة (بدائل أُسّيّة/طيفية).</text>
  <text x="340" y="348" font-size="10.5" fill="#5a6770" direction="rtl">ميزة البدائل الطيفية: مزجٌ عالمي للرموز بتكلفة FFT وبلا معاملات.</text>
</svg>