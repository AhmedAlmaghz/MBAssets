<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="680" height="380" font-family="Tajawal, Noto Naskh Arabic, sans-serif">
  <rect width="680" height="380" fill="#ffffff"/>
  <text x="664" y="26" text-anchor="end" font-size="15" fill="#1f4e6b" font-weight="700">STFT: شبكة زمن-تردد بدقّة ثابتة</text>
  <text x="664" y="44" text-anchor="end" font-size="11" fill="#5a6770">STFT: fixed-resolution time–frequency grid</text>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6770"/></marker></defs>
  <g stroke="#5a6770" stroke-width="0.7">
    <line x1="90" y1="120" x2="600" y2="120"/><line x1="90" y1="160" x2="600" y2="160"/>
    <line x1="90" y1="200" x2="600" y2="200"/><line x1="90" y1="240" x2="600" y2="240"/><line x1="90" y1="280" x2="600" y2="280"/>
  </g>
  <g stroke="#5a6770" stroke-width="0.7">
    <line x1="150" y1="110" x2="150" y2="290"/><line x1="230" y1="110" x2="230" y2="290"/>
    <line x1="310" y1="110" x2="310" y2="290"/><line x1="390" y1="110" x2="390" y2="290"/>
    <line x1="470" y1="110" x2="470" y2="290"/><line x1="550" y1="110" x2="550" y2="290"/>
  </g>
  <g fill="#1f4e6b">
    <rect x="150" y="200" width="80" height="40"/><rect x="230" y="160" width="80" height="40"/>
    <rect x="310" y="240" width="80" height="40"/><rect x="390" y="120" width="80" height="40"/>
    <rect x="470" y="200" width="80" height="40"/>
  </g>
  <text x="340" y="330" font-size="10.5" fill="#5a6770" direction="rtl">كلّ خليّة حجمها ثابت (نافذة واحدة) ⇒ تردّدات عالية بدقّة زمنية جيدة ودقّة ترددية ضعيفة، والعكس.</text>
  <text x="340" y="352" font-size="10.5" fill="#5a6770" direction="rtl"><tspan direction="ltr" unicode-bidi="isolate">STFT: X[m,k]=Σ<tspan dy="3.15" font-size="70%">n</tspan><tspan dy="-3.15" font-size="1">&#8203;</tspan> x[n]w[n-m]e<tspan dy="-4.41" font-size="70%">-2π i kn/N</tspan><tspan dy="4.41" font-size="1">&#8203;</tspan>.</tspan></text>
</svg>