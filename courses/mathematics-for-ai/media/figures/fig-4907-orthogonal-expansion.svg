  <text x="330" y="86" text-anchor="middle" font-size="11.5" fill="#7a9e3c"><tspan direction="ltr" unicode-bidi="isolate">Σ<tspan dy="3.45" font-size="70%">k</tspan><tspan dy="-3.45" font-size="1">&#8203;</tspan> |⟨ f,e<tspan dy="3.45" font-size="70%">k</tspan><tspan dy="-3.45" font-size="1">&#8203;</tspan>⟩|<tspan dy="-4.83" font-size="70%">2</tspan><tspan dy="4.83" font-size="1">&#8203;</tspan> ≤ ||f||<tspan dy="-4.83" font-size="70%">2</tspan><tspan dy="4.83" font-size="1">&#8203;</tspan></tspan></text>
  <text x="340" y="344" font-size="10.5" fill="#5a6770" direction="rtl">المساواة (بارسيفال) تتحقّق عندما تكون {e_k} أساساً كاملاً — أي أن الطاقة محفوظة بالكامل.</text>
