<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380">
  <rect width="680" height="380" fill="#fbfbfd"/>

  <text x="340" y="24" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">Left: DP-SGD clips then noises each step. Right: capacity bounds explode, stability bounds do not.</text>

  <!-- left panel: DP-SGD -->
  <rect x="30" y="48" width="290" height="290" fill="#fff" stroke="#bbb" stroke-width="1.2"/>
  <text x="175" y="68" font-family="sans-serif" font-size="12" fill="#222" text-anchor="middle">DP-SGD step</text>

  <rect x="50" y="84" width="250" height="34" fill="#eef4ff" stroke="#1f6feb" stroke-width="1.2"/>
  <text x="175" y="106" font-family="sans-serif" font-size="11" fill="#1f6feb" text-anchor="middle">per-example gradients g_1 ... g_b</text>

  <line x1="175" y1="118" x2="175" y2="140" stroke="#222" stroke-width="1.4"/>
  <rect x="50" y="140" width="250" height="34" fill="#fdfaf0" stroke="#b8860b" stroke-width="1.2"/>
  <text x="175" y="162" font-family="sans-serif" font-size="11" fill="#b8860b" text-anchor="middle">clip: ||g_i|| &lt;= C  (sensitivity bound)</text>

  <line x1="175" y1="174" x2="175" y2="196" stroke="#222" stroke-width="1.4"/>
  <rect x="50" y="196" width="250" height="34" fill="#f3fbf3" stroke="#2a7a2a" stroke-width="1.2"/>
  <text x="175" y="218" font-family="sans-serif" font-size="11" fill="#2a7a2a" text-anchor="middle">aggregate + Gaussian noise sigma C</text>

  <line x1="175" y1="230" x2="175" y2="252" stroke="#222" stroke-width="1.4"/>
  <rect x="50" y="252" width="250" height="34" fill="#fdeeee" stroke="#c00" stroke-width="1.2"/>
  <text x="175" y="274" font-family="sans-serif" font-size="11" fill="#c00" text-anchor="middle">descent step, sensitivity 2C / b</text>

  <text x="175" y="308" font-family="sans-serif" font-size="11" fill="#555" text-anchor="middle">privacy: eps ~ q sqrt(T ln(1/delta)) / sigma</text>
  <text x="175" y="326" font-family="sans-serif" font-size="11" fill="#555" text-anchor="middle">generalisation gap &lt;= e^eps - 1 + delta</text>

  <!-- right panel: comparison -->
  <rect x="345" y="48" width="305" height="290" fill="#fff" stroke="#bbb" stroke-width="1.2"/>
  <text x="497" y="68" font-family="sans-serif" font-size="12" fill="#222" text-anchor="middle">capacity versus stability</text>

  <line x1="370" y1="300" x2="625" y2="300" stroke="#222" stroke-width="1.6"/>
  <line x1="370" y1="90" x2="370" y2="300" stroke="#222" stroke-width="1.6"/>
  <text x="497" y="322" font-family="sans-serif" font-size="10" fill="#777" text-anchor="middle">number of parameters p (n fixed = 50000)</text>

  <path d="M372,296 C450,280 520,180 622,96" fill="none" stroke="#c00" stroke-width="2.8"/>
  <text x="470" y="130" font-family="sans-serif" font-size="11" fill="#c00">VC / Rademacher ~ sqrt(p/n)</text>
  <line x1="372" y1="290" x2="622" y2="290" stroke="#1f6feb" stroke-width="2.8"/>
  <text x="440" y="284" font-family="sans-serif" font-size="11" fill="#1f6feb">stability bound: no p at all</text>
  <text x="497" y="112" font-family="sans-serif" font-size="10" fill="#777" text-anchor="middle">capacity term passes 1 =&gt; vacuous</text>

  <text x="340" y="362" font-family="sans-serif" font-size="11" fill="#555" text-anchor="middle">DP gives stability by construction; stability bounds stay meaningful in the overparameterised regime</text>
</svg>
