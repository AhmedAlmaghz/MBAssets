<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="680" height="380" font-family="Tajawal, Noto Naskh Arabic, sans-serif">
  <rect width="680" height="380" fill="#ffffff"/>
  <text x="664" y="26" text-anchor="end" font-size="15" fill="#1f4e6b" font-weight="700">فورييه المركّب: معاملات على دائرة الوحدة</text>
  <text x="664" y="44" text-anchor="end" font-size="11" fill="#5a6770">Complex Fourier series coefficients</text>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6770"/></marker></defs>
  <circle cx="250" cy="210" r="120" fill="none" stroke="#5a6770" stroke-width="1.2"/>
  <line x1="130" y1="210" x2="370" y2="210" stroke="#5a6770" stroke-width="1"/>
  <line x1="250" y1="90" x2="250" y2="330" stroke="#5a6770" stroke-width="1"/>
  <text x="372" y="214" font-size="11" fill="#5a6770">Re</text><text x="256" y="96" font-size="11" fill="#5a6770">Im</text>
  <circle cx="330" cy="150" r="5" fill="#1f4e6b"/><text x="338" y="146" font-size="11" fill="#1f4e6b">c_k</text>
  <circle cx="170" cy="270" r="5" fill="#7a9e3c"/><text x="178" y="284" font-size="11" fill="#7a9e3c"><tspan direction="ltr" unicode-bidi="isolate">c<tspan dy="3.30" font-size="70%">-k</tspan><tspan dy="-3.30" font-size="1">&#8203;</tspan>=c̄<tspan dy="3.30" font-size="70%">k</tspan><tspan dy="-3.30" font-size="1">&#8203;</tspan></tspan></text>
  <line x1="250" y1="210" x2="330" y2="150" stroke="#1f4e6b" stroke-width="1.6"/>
  <line x1="250" y1="210" x2="170" y2="270" stroke="#7a9e3c" stroke-width="1.6"/>
  <rect x="450" y="150" width="190" height="70" rx="7" fill="#f2f7fa" stroke="#1f4e6b" stroke-width="1.5"/>
  <text x="545" y="183" text-anchor="middle" font-size="12.5" fill="#1c2b36" font-weight="700"><tspan direction="ltr" unicode-bidi="isolate">c<tspan dy="3.75" font-size="70%">k</tspan><tspan dy="-3.75" font-size="1">&#8203;</tspan>=1/(2π)∫ f e<tspan dy="-5.25" font-size="70%">-ikx</tspan><tspan dy="5.25" font-size="1">&#8203;</tspan></tspan></text>
  <text x="545" y="199" text-anchor="middle" font-size="10" fill="#5a6770">للدوالّ الحقيقية: تماثل هيرميتي</text>
  <text x="340" y="342" font-size="10.5" fill="#5a6770" direction="rtl">الصيغة المركّبة تجمّع الجيب وتمام التمام في معامل واحد — وتُفضي مباشرةً إلى DFT.</text>
</svg>