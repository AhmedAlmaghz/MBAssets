<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="380" fill="#fbfbfd"/>
  <text x="340" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2238">Diffusion: forward (noising) process</text>

  <!-- x0 -->
  <rect x="40" y="150" width="90" height="80" rx="8" fill="#c9d6ff" stroke="#3b5bdb" stroke-width="2"/>
  <text x="85" y="186" text-anchor="middle" font-size="14" fill="#1a2238">x0</text>
  <text x="85" y="206" text-anchor="middle" font-size="11" fill="#1a2238">data</text>

  <!-- x1 -->
  <rect x="200" y="150" width="90" height="80" rx="8" fill="#d0ebff" stroke="#1c7ed6" stroke-width="2"/>
  <text x="245" y="186" text-anchor="middle" font-size="14" fill="#1a2238">x1</text>
  <text x="245" y="206" text-anchor="middle" font-size="10" fill="#555">some noise</text>

  <!-- xt-1 -->
  <rect x="360" y="150" width="90" height="80" rx="8" fill="#ffe8cc" stroke="#e8590c" stroke-width="2"/>
  <text x="405" y="186" text-anchor="middle" font-size="14" fill="#1a2238">x(t-1)</text>

  <!-- xt -->
  <rect x="520" y="150" width="90" height="80" rx="8" fill="#ffe3e3" stroke="#c2255c" stroke-width="2"/>
  <text x="565" y="186" text-anchor="middle" font-size="14" fill="#1a2238">xt</text>
  <text x="565" y="206" text-anchor="middle" font-size="11" fill="#1a2238">≈ N(0,I)</text>

  <line x1="130" y1="190" x2="198" y2="190" stroke="#888" stroke-width="1.6" marker-end="url(#d1)"/>
  <line x1="290" y1="190" x2="358" y2="190" stroke="#888" stroke-width="1.6" marker-end="url(#d1)"/>
  <line x1="450" y1="190" x2="518" y2="190" stroke="#888" stroke-width="1.6" marker-end="url(#d1)"/>

  <text x="340" y="290" text-anchor="middle" font-size="12.5" fill="#1a2238">q(x_t | x_0) = N(√ᾱ_t x_0, (1 − ᾱ_t) I)</text>
  <text x="340" y="318" text-anchor="middle" font-size="12" fill="#555">ᾱ_t = Π_{s=1}^t (1 − β_s): signal retained at step t.</text>
  <defs><marker id="d1" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#888"/></marker></defs>
</svg>
