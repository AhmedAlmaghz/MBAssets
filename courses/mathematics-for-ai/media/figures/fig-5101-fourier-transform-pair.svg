<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="680" height="380" font-family="Tajawal, Noto Naskh Arabic, sans-serif">
  <rect width="680" height="380" fill="#ffffff"/>
  <text x="664" y="26" text-anchor="end" font-size="15" fill="#1f4e6b" font-weight="700">تحويل فورييه: الزمن والتردّد وجهان لشيء واحد</text>
  <text x="664" y="44" text-anchor="end" font-size="11" fill="#5a6770">Fourier transform pair: time ↔ frequency</text>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6770"/></marker></defs>
  <line x1="60" y1="280" x2="310" y2="280" stroke="#5a6770" stroke-width="1"/>
  <line x1="60" y1="90" x2="60" y2="280" stroke="#5a6770" stroke-width="1"/>
  <text x="310" y="294" font-size="11" fill="#5a6770">t</text>
  <text x="54" y="100" text-anchor="end" font-size="11" fill="#5a6770">x(t)</text>
  <path d="M 70 250 C 120 120 170 120 220 250 C 250 320 280 320 310 250" fill="none" stroke="#1f4e6b" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="370" y1="280" x2="620" y2="280" stroke="#5a6770" stroke-width="1"/>
  <line x1="370" y1="90" x2="370" y2="280" stroke="#5a6770" stroke-width="1"/>
  <text x="620" y="294" font-size="11" fill="#5a6770"><tspan direction="ltr" unicode-bidi="isolate">ω</tspan></text>
  <text x="364" y="100" text-anchor="end" font-size="11" fill="#5a6770"><tspan direction="ltr" unicode-bidi="isolate">|X(ω)|</tspan></text>
  <path d="M 380 270 L 430 270 L 440 130 L 460 130 L 470 270 L 610 270" fill="none" stroke="#7a9e3c" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="320" y1="190" x2="360" y2="190" stroke="#5a6770" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="340" y="330" font-size="10.5" fill="#5a6770" direction="rtl"><tspan direction="ltr" unicode-bidi="isolate">X(ω)=∫ x(t)e<tspan dy="-4.41" font-size="70%">-iω t</tspan><tspan dy="4.41" font-size="1">&#8203;</tspan>dt  ⇌  x(t)=1/(2π)∫ X(ω)e<tspan dy="-4.41" font-size="70%">iω t</tspan><tspan dy="4.41" font-size="1">&#8203;</tspan>dω</tspan></text>
  <text x="340" y="352" font-size="10.5" fill="#5a6770" direction="rtl">الضيق في الزمن = الانتشار في التردّد (مبدأ الريبة، الفصل 52).</text>
</svg>