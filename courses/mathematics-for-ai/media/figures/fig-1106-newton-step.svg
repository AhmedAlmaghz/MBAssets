<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="Georgia, 'Times New Roman', serif">
  <rect width="680" height="320" fill="#fafaf7"/>

  <text x="340" y="26" font-size="14" fill="#334155" text-anchor="middle" font-weight="bold">خطوة نيوتن: تقاطع المظلوم (tangent) مع المحور</text>

  <!-- axes -->
  <line x1="50" y1="280" x2="640" y2="280" stroke="#334155" stroke-width="1.4"/>
  <line x1="80" y1="290" x2="80" y2="50" stroke="#334155" stroke-width="1.4"/>

  <!-- convex curve f -->
  <path d="M80,270 C200,260 320,230 400,170 C460,125 540,80 620,60" fill="none" stroke="#0f766e" stroke-width="2.6"/>
  <text x="600" y="54" font-size="13" fill="#0f766e" font-style="italic">f(x)</text>

  <!-- current point x_k -->
  <circle cx="300" cy="200" r="4.5" fill="#b45309"/>
  <line x1="300" y1="200" x2="300" y2="280" stroke="#b45309" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="300" y="296" font-size="12" fill="#b45309" text-anchor="middle">xₖ</text>

  <!-- tangent at x_k -->
  <line x1="160" y1="264" x2="430" y2="118" stroke="#9d174d" stroke-width="1.8"/>
  <!-- Newton step to root of tangent -->
  <line x1="300" y1="200" x2="400" y2="170" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#n)"/>
  <defs>
    <marker id="n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <circle cx="400" cy="170" r="4" fill="#1d4ed8"/>
  <line x1="400" y1="170" x2="400" y2="280" stroke="#1d4ed8" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="400" y="296" font-size="12" fill="#1d4ed8" text-anchor="middle">xₖ₊₁</text>

  <text x="350" y="150" font-size="12" fill="#1d4ed8" text-anchor="middle" font-style="italic">خطوة نيوتن</text>

  <rect x="470" y="200" width="180" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="560" y="224" font-size="13" fill="#334155" text-anchor="middle" font-style="italic">xₖ₊₁ = xₖ − f′/f″</text>
  <text x="560" y="240" font-size="11.5" fill="#64748b" text-anchor="middle">(تقارب تربيعي)</text>
</svg>
