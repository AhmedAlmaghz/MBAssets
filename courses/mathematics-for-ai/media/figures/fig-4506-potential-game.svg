<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="380" fill="#fbfbfd"/>
  <text x="340" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2238">Potential game &amp; congestion</text>

  <!-- potential landscape -->
  <path d="M80 300 Q160 120 240 180 Q300 220 340 120 Q400 60 460 200 Q520 320 600 280" fill="none" stroke="#f08c00" stroke-width="3"/>

  <!-- local maxima (pure NE) -->
  <circle cx="345" cy="118" r="9" fill="#c2255c"/>
  <text x="360" y="112" font-size="12" fill="#c2255c" font-weight="600">pure Nash (local max)</text>
  <circle cx="185" cy="150" r="6" fill="#3b5bdb"/>
  <text x="200" y="145" font-size="11" fill="#3b5bdb">local max</text>

  <!-- global max -->
  <circle cx="470" cy="205" r="7" fill="#2f9e44"/>

  <!-- best-response arrows on landscape -->
  <path d="M120 300 Q150 240 185 160" fill="none" stroke="#2f9e44" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#k2)"/>

  <text x="340" y="350" text-anchor="middle" font-size="12" fill="#1a2238">Pure-ne best responses climb Φ exactly; existence of pure NE guaranteed.</text>
  <defs><marker id="k2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#2f9e44"/></marker></defs>
</svg>
