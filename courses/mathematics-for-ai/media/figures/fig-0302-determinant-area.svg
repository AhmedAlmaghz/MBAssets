<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="680" height="320" font-family="Segoe UI, Tahoma, Arial, sans-serif">
  <rect width="680" height="320" fill="#ffffff"/>
  <text x="340" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">المحدّد = معامل تضخّم المساحة (والاتجاه)</text>

  <defs>
    <marker id="g1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#1d4ed8"/>
    </marker>
    <marker id="g2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/>
    </marker>
    <marker id="g3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- اللوحة 1: مربع الوحدة مساحة 1 -->
  <text x="150" y="56" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">مربع الوحدة: المساحة = 1</text>
  <polygon points="70,240 190,240 190,120 70,120" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <line x1="70" y1="240" x2="190" y2="240" stroke="#1d4ed8" stroke-width="3" marker-end="url(#g1)"/>
  <line x1="70" y1="240" x2="70" y2="120" stroke="#16a34a" stroke-width="3" marker-end="url(#g2)"/>
  <text x="196" y="252" font-size="13" font-weight="bold" fill="#1d4ed8">e₁</text>
  <text x="70" y="110" font-size="13" font-weight="bold" fill="#16a34a">e₂</text>
  <text x="130" y="188" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e40af">1</text>
  <text x="70" y="262" font-size="12" fill="#475569">0</text>

  <!-- اللوحة 2: det > 0 تمدد -->
  <text x="350" y="56" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">A = [[2,1],[1,2]] ⟹ det A = 3</text>
  <polygon points="290,240 410,200 450,120 330,160" fill="#bbf7d0" stroke="#166534" stroke-width="2"/>
  <line x1="290" y1="240" x2="410" y2="200" stroke="#1d4ed8" stroke-width="3" marker-end="url(#g1)"/>
  <line x1="290" y1="240" x2="330" y2="160" stroke="#16a34a" stroke-width="3" marker-end="url(#g2)"/>
  <text x="416" y="196" font-size="13" font-weight="bold" fill="#1d4ed8">a₁</text>
  <text x="326" y="152" font-size="13" font-weight="bold" fill="#16a34a">a₂</text>
  <text x="368" y="192" text-anchor="middle" font-size="16" font-weight="bold" fill="#14532d">3</text>
  <text x="290" y="262" font-size="12" fill="#475569">0</text>

  <!-- اللوحة 3: det < 0 انعكاس -->
  <text x="556" y="56" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">det A = −2 ⟹ انقلاب الاتجاه</text>
  <polygon points="480,240 620,240 620,150 480,150" fill="#fecaca" stroke="#b91c1c" stroke-width="2"/>
  <line x1="480" y1="240" x2="620" y2="240" stroke="#16a34a" stroke-width="3" marker-end="url(#g2)"/>
  <line x1="480" y1="240" x2="480" y2="150" stroke="#1d4ed8" stroke-width="3" marker-end="url(#g1)"/>
  <text x="626" y="252" font-size="13" font-weight="bold" fill="#16a34a">a₁</text>
  <text x="480" y="140" font-size="13" font-weight="bold" fill="#1d4ed8">a₂</text>
  <text x="550" y="200" text-anchor="middle" font-size="16" font-weight="bold" fill="#7f1d1d">|−2| = 2</text>
  <text x="550" y="276" text-anchor="middle" font-size="12" fill="#7f1d1d">الترتيب (e₁ → e₂) انعكس</text>

  <rect x="40" y="292" width="600" height="24" rx="4" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="340" y="309" text-anchor="middle" font-size="12" fill="#0f172a">شكل (3.2): |det A| = معامل تضخّم الحجم؛ إشارة det A = هل حُفظ الاتجاه (يمين) أم انعكس (يسار)</text>
</svg>
