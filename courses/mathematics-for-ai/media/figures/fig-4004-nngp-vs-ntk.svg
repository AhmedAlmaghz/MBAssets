<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="380" fill="#fbfbfd"/>
  <text x="340" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2238">NNGP prior vs NTK training</text>

  <g>
    <rect x="60" y="90" width="240" height="70" rx="8" fill="#c9d6ff" stroke="#3b5bdb" stroke-width="2"/>
    <text x="180" y="115" text-anchor="middle" font-size="12" fill="#1a2238">NNGP: prior covariance</text>
    <text x="180" y="138" text-anchor="middle" font-size="11" fill="#555">Cov[f(x),f(x')] = Theta_NNGP(x,x')</text>
  </g>
  <g>
    <rect x="380" y="90" width="240" height="70" rx="8" fill="#c8e6c9" stroke="#2f9e44" stroke-width="2"/>
    <text x="500" y="115" text-anchor="middle" font-size="12" fill="#1a2238">NTK: training kernel</text>
    <text x="500" y="138" text-anchor="middle" font-size="11" fill="#555">Theta_NTK = &lt;nabla f, nabla f&gt;</text>
  </g>

  <!-- arrow: NNGP feeds NTK -->
  <line x1="300" y1="125" x2="378" y2="125" stroke="#888" stroke-width="2" marker-end="url(#n1)"/>
  <text x="340" y="118" text-anchor="middle" font-size="10" fill="#888">same net</text>

  <text x="340" y="220" text-anchor="middle" font-size="12" fill="#1a2238">NNGP describes the function BEFORE training (random init).</text>
  <text x="340" y="248" text-anchor="middle" font-size="12" fill="#1a2238">NTK describes how it MOVES DURING training.</text>

  <g>
    <circle cx="180" cy="300" r="26" fill="#c9d6ff" stroke="#3b5bdb" stroke-width="2"/>
    <circle cx="340" cy="300" r="26" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/>
    <circle cx="500" cy="300" r="26" fill="#c8e6c9" stroke="#2f9e44" stroke-width="2"/>
    <text x="180" y="305" text-anchor="middle" font-size="11" fill="#1a2238">prior</text>
    <text x="340" y="305" text-anchor="middle" font-size="11" fill="#1a2238">init</text>
    <text x="500" y="305" text-anchor="middle" font-size="11" fill="#1a2238">trained</text>
    <line x1="206" y1="300" x2="314" y2="300" stroke="#888" stroke-width="1.6" marker-end="url(#n1)"/>
    <line x1="366" y1="300" x2="474" y2="300" stroke="#888" stroke-width="1.6" marker-end="url(#n1)"/>
  </g>

  <text x="340" y="360" text-anchor="middle" font-size="12.5" fill="#555">NNGP predicts generalization of the random net; NTK predicts trained-net behavior.</text>
</svg>
