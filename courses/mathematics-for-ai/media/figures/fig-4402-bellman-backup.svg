<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="380" fill="#fbfbfd"/>
  <text x="340" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2238">Bellman backup diagram</text>

  <!-- root -->
  <circle cx="340" cy="90" r="26" fill="#ffe0b2" stroke="#e8590c" stroke-width="2.5"/>
  <text x="340" y="95" text-anchor="middle" font-size="13" fill="#1a2238">s</text>

  <!-- actions row -->
  <circle cx="200" cy="190" r="22" fill="#c9d6ff" stroke="#3b5bdb" stroke-width="2"/>
  <text x="200" y="194" text-anchor="middle" font-size="11" fill="#1a2238">a1</text>
  <circle cx="340" cy="190" r="22" fill="#c9d6ff" stroke="#3b5bdb" stroke-width="2"/>
  <text x="340" y="194" text-anchor="middle" font-size="11" fill="#1a2238">a2</text>
  <circle cx="480" cy="190" r="22" fill="#c9d6ff" stroke="#3b5bdb" stroke-width="2"/>
  <text x="480" y="194" text-anchor="middle" font-size="11" fill="#1a2238">a3</text>

  <line x1="322" y1="108" x2="222" y2="176" stroke="#888" stroke-width="1.6" marker-end="url(#b2)"/>
  <line x1="340" y1="116" x2="340" y2="168" stroke="#888" stroke-width="1.6" marker-end="url(#b2)"/>
  <line x1="358" y1="108" x2="458" y2="176" stroke="#888" stroke-width="1.6" marker-end="url(#b2)"/>

  <!-- next states -->
  <circle cx="150" cy="290" r="20" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/>
  <text x="150" y="294" text-anchor="middle" font-size="11" fill="#1a2238">s'</text>
  <circle cx="340" cy="300" r="20" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/>
  <text x="340" y="304" text-anchor="middle" font-size="11" fill="#1a2238">s'</text>
  <circle cx="530" cy="290" r="20" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/>
  <text x="530" y="294" text-anchor="middle" font-size="11" fill="#1a2238">s'</text>
  <line x1="200" y1="212" x2="160" y2="272" stroke="#888" stroke-width="1.4" marker-end="url(#b2)"/>
  <line x1="340" y1="212" x2="340" y2="280" stroke="#888" stroke-width="1.4" marker-end="url(#b2)"/>
  <line x1="480" y1="212" x2="520" y2="272" stroke="#888" stroke-width="1.4" marker-end="url(#b2)"/>

  <rect x="120" y="330" width="440" height="40" rx="8" fill="#fff3bf" stroke="#f08c00" stroke-width="1.5"/>
  <text x="340" y="354" text-anchor="middle" font-size="12.5" fill="#1a2238">V(s) = max_a Σ_s' P(s'|s,a)[ R(s,a,s') + γ V(s') ]</text>
  <defs><marker id="b2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#888"/></marker></defs>
</svg>
