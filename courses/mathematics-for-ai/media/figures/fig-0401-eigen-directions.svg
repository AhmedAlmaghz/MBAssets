<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" width="680" height="360" font-family="Segoe UI, Tahoma, Arial, sans-serif">
  <rect width="680" height="360" fill="#ffffff"/>

  <text x="340" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">Eigenvectors = invariant directions of A</text>
  <text x="340" y="47" text-anchor="middle" font-size="13" fill="#475569">المتجهات الذاتية: الاتجاهات التي لا يُديرها التحويل، بل يمدّدها أو يضغطها بمقدار القيمة الذاتية</text>

  <defs>
    <marker id="a1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1d4ed8"/></marker>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/></marker>
    <marker id="a3" markerWidth="11" markerHeight="11" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/></marker>
  </defs>

  <!-- ============ Panel 1: unit circle ============ -->
  <text x="170" y="74" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">input: { x : ||x|| = 1 }</text>
  <circle cx="170" cy="200" r="90" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <line x1="62" y1="200" x2="278" y2="200" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="170" y1="92" x2="170" y2="308" stroke="#cbd5e1" stroke-width="1"/>

  <line x1="170" y1="200" x2="248" y2="245" stroke="#1d4ed8" stroke-width="3" marker-end="url(#a1)"/>
  <line x1="170" y1="200" x2="125" y2="278" stroke="#dc2626" stroke-width="3" marker-end="url(#a2)"/>
  <text x="252" y="258" font-size="15" font-weight="bold" fill="#1d4ed8">u₁</text>
  <text x="100" y="296" font-size="15" font-weight="bold" fill="#dc2626">u₂</text>
  <text x="170" y="328" text-anchor="middle" font-size="12" fill="#64748b">دائرة الوحدة (نصف قطرها 1)</text>

  <!-- ============ map arrow ============ -->
  <line x1="300" y1="200" x2="366" y2="200" stroke="#0f766e" stroke-width="3" marker-end="url(#a3)"/>
  <text x="333" y="186" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f766e">A</text>

  <!-- ============ Panel 2: ellipse ============ -->
  <text x="510" y="74" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">output: { Ax : ||x|| = 1 }</text>
  <ellipse cx="510" cy="200" rx="140" ry="54" fill="none" stroke="#94a3b8" stroke-width="2" transform="rotate(-30 510 200)"/>
  <line x1="360" y1="200" x2="660" y2="200" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="510" y1="120" x2="510" y2="280" stroke="#cbd5e1" stroke-width="1"/>

  <line x1="510" y1="200" x2="631" y2="130" stroke="#1d4ed8" stroke-width="3" marker-end="url(#a1)"/>
  <line x1="510" y1="200" x2="483" y2="247" stroke="#dc2626" stroke-width="3" marker-end="url(#a2)"/>
  <text x="636" y="126" font-size="15" font-weight="bold" fill="#1d4ed8">λ₁u₁</text>
  <text x="440" y="266" font-size="15" font-weight="bold" fill="#dc2626">λ₂u₂</text>
  <text x="600" y="176" font-size="13" fill="#1d4ed8">σ-direction: λ₁ = 1.55</text>
  <text x="600" y="196" font-size="13" fill="#dc2626">λ₂ = 0.60</text>
  <text x="510" y="328" text-anchor="middle" font-size="12" fill="#64748b">قطع ناقص: أنصاف محاوره |λ₁| و |λ₂|</text>

  <!-- ============ formula ============ -->
  <rect x="150" y="342" width="380" height="0" fill="none"/>
  <text x="340" y="352" text-anchor="middle" font-size="14" fill="#0f172a">A u = λ u　⇔　(A − λI) u = 0　⇔　det(A − λI) = 0</text>
</svg>
