  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6770"/></marker></defs>
  <rect x="40" y="110" width="180" height="50" rx="7" fill="#f2f7fa" stroke="#1f4e6b" stroke-width="1.5"/>
  <text x="130" y="133" text-anchor="middle" font-size="12.5" fill="#1c2b36" font-weight="700">فورييه/مويجات</text>
  <text x="130" y="149" text-anchor="middle" font-size="10" fill="#5a6770">أسس كلاسيكية</text>
  <line x1="220" y1="135" x2="260" y2="135" stroke="#5a6770" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="260" y="110" width="180" height="50" rx="7" fill="#f2f7fa" stroke="#1f4e6b" stroke-width="1.5"/>
  <text x="350" y="133" text-anchor="middle" font-size="12.5" fill="#1c2b36" font-weight="700">مرشّحات متعلّمة</text>
  <text x="350" y="149" text-anchor="middle" font-size="10" fill="#5a6770">CNN/SSM/محوّلات</text>
  <line x1="440" y1="135" x2="480" y2="135" stroke="#5a6770" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="480" y="110" width="160" height="50" rx="7" fill="#f2f7fa" stroke="#1f4e6b" stroke-width="1.5"/>
  <text x="560" y="133" text-anchor="middle" font-size="12.5" fill="#1c2b36" font-weight="700">مؤثّرات عصبية</text>
  <text x="560" y="149" text-anchor="middle" font-size="10" fill="#5a6770">FNO/DeepONet</text>
  <line x1="340" y1="160" x2="340" y2="200" stroke="#5a6770" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="180" y="200" width="320" height="60" rx="7" fill="#f2f7fa" stroke="#7a9e3c" stroke-width="1.5"/>
  <text x="340" y="228" text-anchor="middle" font-size="12.5" fill="#1c2b36" font-weight="700">نماذج تأسيسية متعدّدة الوسائط للإشارات</text>
  <text x="340" y="244" text-anchor="middle" font-size="10" fill="#5a6770">صوت · صورة · زمن · رسوم</text>
  <text x="340" y="300" font-size="10.5" fill="#5a6770" direction="rtl">الثابت عبر المراحل: تحويلٌ خطّي يحفظ الطاقة + تعلمٌ غير خطّي في فضاء أفضل.</text>
  <text x="340" y="322" font-size="10.5" fill="#5a6770" direction="rtl">السؤال المفتوح: ضمانات تعميم لنماذج الإشارات (حدودٌ كحدود PAC على الطيف).</text>
</svg>