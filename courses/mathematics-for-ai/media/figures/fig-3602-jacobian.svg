<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380">
  <rect width="680" height="380" fill="#fbfbfd"/>
  <text x="20" y="28" font-family="sans-serif" font-size="13" fill="#1f6feb" font-weight="bold">Matrix gradient: dL/dW = delta * a^T</text>

  <!-- delta row on top -->
  <text x="380" y="70" font-family="sans-serif" font-size="12" fill="#c00" text-anchor="middle">delta^(l)  (1 x d_l)</text>
  <rect x="280" y="80" width="200" height="30" fill="#fde8e8" stroke="#c00" stroke-width="1.5"/>
  <text x="380" y="100" font-family="sans-serif" font-size="11" fill="#c00" text-anchor="middle">[ d1  d2  ...  d_dl ]</text>
  <line x1="380" y1="110" x2="380" y2="140" stroke="#333" stroke-width="1.5"/>

  <!-- a column on left -->
  <text x="120" y="220" font-family="sans-serif" font-size="12" fill="#1f6feb" text-anchor="middle">a^(l-1)^T</text>
  <rect x="90" y="170" width="60" height="120" fill="#eef4ff" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="120" y="200" font-family="sans-serif" font-size="11" fill="#1f6feb" text-anchor="middle">a1</text>
  <text x="120" y="230" font-family="sans-serif" font-size="11" fill="#1f6feb" text-anchor="middle">a2</text>
  <text x="120" y="260" font-family="sans-serif" font-size="11" fill="#1f6feb" text-anchor="middle">.</text>
  <text x="120" y="280" font-family="sans-serif" font-size="11" fill="#1f6feb" text-anchor="middle">.</text>
  <line x1="150" y1="230" x2="280" y2="230" stroke="#333" stroke-width="1.5"/>

  <!-- W = outer product grid -->
  <text x="400" y="320" font-family="sans-serif" font-size="13" fill="#2a7a2a" text-anchor="middle">dL/dW  (d_l x d_{l-1})</text>
  <rect x="280" y="155" width="240" height="150" fill="#e8f5e8" stroke="#2a7a2a" stroke-width="1.8"/>
  <text x="400" y="235" font-family="sans-serif" font-size="11" fill="#2a7a2a" text-anchor="middle">outer product</text>
  <text x="400" y="255" font-family="sans-serif" font-size="11" fill="#2a7a2a" text-anchor="middle">delta_i * a_j</text>

  <text x="20" y="365" font-family="sans-serif" font-size="10" fill="#555">Each output unit i contributes a row delta_i * a^T to the weight matrix</text>
</svg>
