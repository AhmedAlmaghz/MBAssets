<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="Georgia, 'Times New Roman', serif">
  <rect width="680" height="300" fill="#fafaf7"/>

  <text x="340" y="26" font-size="14" fill="#334155" text-anchor="middle" font-weight="bold">المتغيّر العشوائي X: Ω → ℝ (قياسي)</text>

  <!-- domain Omega -->
  <g>
    <rect x="50" y="70" width="190" height="180" rx="10" fill="#e0f2f1" stroke="#0f766e" stroke-width="1.8"/>
    <text x="145" y="60" font-size="14" fill="#0f766e" text-anchor="middle" font-weight="bold">Ω</text>
    <circle cx="100" cy="120" r="6" fill="#b45309"/><text x="115" y="124" font-size="13" fill="#334155">ω₁</text>
    <circle cx="170" cy="140" r="6" fill="#b45309"/><text x="185" y="144" font-size="13" fill="#334155">ω₂</text>
    <circle cx="110" cy="200" r="6" fill="#b45309"/><text x="125" y="204" font-size="13" fill="#334155">ω₃</text>
    <circle cx="180" cy="210" r="6" fill="#b45309"/><text x="195" y="214" font-size="13" fill="#334155">ω₄</text>
  </g>

  <!-- arrow X -->
  <line x1="245" y1="150" x2="335" y2="150" stroke="#334155" stroke-width="1.8" marker-end="url(#x)"/>
  <defs>
    <marker id="x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <text x="290" y="138" font-size="15" fill="#334155" text-anchor="middle" font-style="italic">X</text>

  <!-- codomain R with values -->
  <g>
    <rect x="360" y="70" width="270" height="180" rx="10" fill="#e0f2f1" stroke="#0f766e" stroke-width="1.8"/>
    <text x="495" y="60" font-size="14" fill="#0f766e" text-anchor="middle" font-weight="bold">ℝ</text>
    <line x1="375" y1="160" x2="615" y2="160" stroke="#64748b" stroke-width="1.2"/>
    <!-- points -->
    <circle cx="410" cy="160" r="6" fill="#9d174d"/><text x="410" y="145" font-size="13" fill="#9d174d" text-anchor="middle">0.2</text>
    <circle cx="470" cy="160" r="6" fill="#9d174d"/><text x="470" y="145" font-size="13" fill="#9d174d" text-anchor="middle">0.5</text>
    <circle cx="540" cy="160" r="6" fill="#9d174d"/><text x="540" y="145" font-size="13" fill="#9d174d" text-anchor="middle">0.8</text>
    <circle cx="590" cy="160" r="6" fill="#9d174d"/><text x="590" y="145" font-size="13" fill="#9d174d" text-anchor="middle">1.0</text>
  </g>

  <rect x="120" y="265" width="440" height="26" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="340" y="283" font-size="12.5" fill="#334155" text-anchor="middle" font-style="italic">P_X(B)=P(X∈B) = توزيع X (قياس دافع)</text>
</svg>
