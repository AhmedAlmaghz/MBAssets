<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="380" fill="#fbfbfd"/>
  <text x="340" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2238">Normalizing Flows</text>

  <!-- z0 base -->
  <ellipse cx="110" cy="190" rx="60" ry="50" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/>
  <text x="110" y="186" text-anchor="middle" font-size="13" fill="#1a2238">z0</text>
  <text x="110" y="204" text-anchor="middle" font-size="11" fill="#1a2238">N(0,I)</text>

  <!-- f1 -->
  <rect x="210" y="165" width="70" height="50" rx="8" fill="#ffe0b2" stroke="#e8590c" stroke-width="2"/>
  <text x="245" y="195" text-anchor="middle" font-size="12" fill="#1a2238">f1</text>
  <line x1="170" y1="190" x2="208" y2="190" stroke="#888" stroke-width="1.6" marker-end="url(#c1)"/>

  <!-- z1 -->
  <ellipse cx="330" cy="190" rx="55" ry="48" fill="#c9d6ff" stroke="#3b5bdb" stroke-width="2"/>
  <text x="330" y="186" text-anchor="middle" font-size="13" fill="#1a2238">z1</text>
  <text x="330" y="204" text-anchor="middle" font-size="11" fill="#1a2238">f1(z0)</text>
  <line x1="280" y1="190" x2="328" y2="190" stroke="#888" stroke-width="1.6" marker-end="url(#c1)"/>

  <!-- f2 -->
  <rect x="410" y="165" width="70" height="50" rx="8" fill="#ffe0b2" stroke="#e8590c" stroke-width="2"/>
  <text x="445" y="195" text-anchor="middle" font-size="12" fill="#1a2238">f2</text>
  <line x1="385" y1="190" x2="408" y2="190" stroke="#888" stroke-width="1.6" marker-end="url(#c1)"/>

  <!-- x -->
  <ellipse cx="560" cy="190" rx="60" ry="55" fill="#ffd6e7" stroke="#c2255c" stroke-width="2"/>
  <text x="560" y="186" text-anchor="middle" font-size="13" fill="#1a2238">x</text>
  <text x="560" y="204" text-anchor="middle" font-size="11" fill="#1a2238">f2(z1)</text>
  <line x1="480" y1="190" x2="558" y2="190" stroke="#888" stroke-width="1.6" marker-end="url(#c1)"/>

  <text x="340" y="300" text-anchor="middle" font-size="12.5" fill="#1a2238">Each f_k invertible ⇒ exact likelihood</text>
  <text x="340" y="328" text-anchor="middle" font-size="12.5" fill="#555">log p(x) = log p(z0) − Σ log |det J_fk|.</text>
  <defs><marker id="c1" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#888"/></marker></defs>
</svg>
