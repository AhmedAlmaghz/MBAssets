<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="380" fill="#fbfbfd"/>
  <text x="340" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2238">The MDP agent–environment loop</text>

  <!-- agent -->
  <rect x="90" y="150" width="120" height="80" rx="10" fill="#c9d6ff" stroke="#3b5bdb" stroke-width="2"/>
  <text x="150" y="185" text-anchor="middle" font-size="14" fill="#1a2238">Agent</text>
  <text x="150" y="205" text-anchor="middle" font-size="11" fill="#555">policy pi(a|s)</text>

  <!-- environment -->
  <rect x="470" y="150" width="120" height="80" rx="10" fill="#ffd6e7" stroke="#c2255c" stroke-width="2"/>
  <text x="530" y="185" text-anchor="middle" font-size="14" fill="#1a2238">Environment</text>
  <text x="530" y="205" text-anchor="middle" font-size="11" fill="#555">P, R</text>

  <!-- arrows -->
  <line x1="210" y1="175" x2="468" y2="175" stroke="#888" stroke-width="2" marker-end="url(#a2)"/>
  <text x="340" y="168" text-anchor="middle" font-size="12" fill="#1a2238">action a_t</text>

  <line x1="468" y1="205" x2="210" y2="205" stroke="#888" stroke-width="2" marker-end="url(#a2)"/>
  <text x="340" y="228" text-anchor="middle" font-size="12" fill="#1a2238">reward r_t+1 , next state s_t+1</text>

  <!-- state cycle -->
  <path d="M150 230 L150 250 Q150 280 250 290 Q400 300 530 260" fill="none" stroke="#2f9e44" stroke-width="1.8" marker-end="url(#a3)"/>
  <text x="340" y="330" text-anchor="middle" font-size="12" fill="#2f9e44">state s_t evolves under transition P(s'|s,a)</text>
  <text x="340" y="356" text-anchor="middle" font-size="11.5" fill="#555">Goal: maximise expected discounted return  G = Σ γ^t r_t.</text>
  <defs>
    <marker id="a2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#888"/></marker>
    <marker id="a3" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#2f9e44"/></marker>
  </defs>
</svg>
