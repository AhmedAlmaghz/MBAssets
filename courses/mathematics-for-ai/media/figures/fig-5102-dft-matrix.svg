<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="680" height="380" font-family="Tajawal, Noto Naskh Arabic, sans-serif">
  <rect width="680" height="380" fill="#ffffff"/>
  <text x="664" y="26" text-anchor="end" font-size="15" fill="#1f4e6b" font-weight="700">DFT: مصفوفة الجذور وحدوية الجذر</text>
  <text x="664" y="44" text-anchor="end" font-size="11" fill="#5a6770">DFT matrix and roots of unity</text>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6770"/></marker></defs>
  <circle cx="200" cy="200" r="110" fill="none" stroke="#5a6770" stroke-width="1.2"/>
  <line x1="90" y1="200" x2="310" y2="200" stroke="#5a6770" stroke-width="1"/>
  <line x1="200" y1="90" x2="200" y2="310" stroke="#5a6770" stroke-width="1"/>
  <g fill="#1f4e6b">
    <circle cx="310" cy="200" r="4"/><circle cx="278" cy="278" r="4"/><circle cx="200" cy="310" r="4"/>
    <circle cx="122" cy="278" r="4"/><circle cx="90" cy="200" r="4"/><circle cx="122" cy="122" r="4"/>
    <circle cx="200" cy="90" r="4"/><circle cx="278" cy="122" r="4"/>
  </g>
  <text x="320" y="196" font-size="10" fill="#1f4e6b">W_N^{0}</text><text x="286" y="290" font-size="10" fill="#1f4e6b">W_N^{1}</text>
  <rect x="380" y="140" width="260" height="110" rx="7" fill="#f2f7fa" stroke="#1f4e6b" stroke-width="1.5"/>
  <text x="510" y="193" text-anchor="middle" font-size="12.5" fill="#1c2b36" font-weight="700"><tspan direction="ltr" unicode-bidi="isolate">X<tspan dy="3.75" font-size="70%">k</tspan><tspan dy="-3.75" font-size="1">&#8203;</tspan>=Σ<tspan dy="3.75" font-size="70%">n</tspan><tspan dy="-3.75" font-size="1">&#8203;</tspan>x<tspan dy="3.75" font-size="70%">n</tspan><tspan dy="-3.75" font-size="1">&#8203;</tspan> e<tspan dy="-5.25" font-size="70%">-2π i kn/N</tspan><tspan dy="5.25" font-size="1">&#8203;</tspan></tspan></text>
  <text x="510" y="209" text-anchor="middle" font-size="10" fill="#5a6770"><tspan direction="ltr" unicode-bidi="isolate">N=8 </tspan>جذور<tspan direction="ltr" unicode-bidi="isolate">: W<tspan dy="3.00" font-size="70%">N</tspan><tspan dy="-3.00" font-size="1">&#8203;</tspan>=e<tspan dy="-4.20" font-size="70%">-2π i/N</tspan><tspan dy="4.20" font-size="1">&#8203;</tspan></tspan></text>
  <text x="340" y="330" font-size="10.5" fill="#5a6770" direction="rtl"><tspan direction="ltr" unicode-bidi="isolate">DFT </tspan>المباشر<tspan direction="ltr" unicode-bidi="isolate"> O(N<tspan dy="-4.41" font-size="70%">2</tspan><tspan dy="4.41" font-size="1">&#8203;</tspan>)</tspan>؛ و<tspan direction="ltr" unicode-bidi="isolate">FFT </tspan>يقسّم المسألة زوجيّاً<tspan direction="ltr" unicode-bidi="isolate">/</tspan>فرديّاً<tspan direction="ltr" unicode-bidi="isolate">: O(N log N).</tspan></text>
</svg>