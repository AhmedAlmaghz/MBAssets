<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="Georgia, 'Times New Roman', serif">
  <rect width="680" height="300" fill="#fafaf7"/>

  <text x="340" y="26" font-size="14" fill="#334155" text-anchor="middle" font-weight="bold">مبرهنة التقارب الرتيب: φₙ ↑ f</text>

  <!-- axes -->
  <line x1="50" y1="250" x2="630" y2="250" stroke="#334155" stroke-width="1.4"/>
  <line x1="50" y1="40"  x2="50"  y2="250" stroke="#334155" stroke-width="1.4"/>

  <!-- target function f -->
  <path d="M50,240 C160,230 260,120 360,110 C460,100 560,60 630,55" fill="none" stroke="#0f766e" stroke-width="2.4"/>
  <text x="560" y="70" font-size="13" fill="#0f766e" font-style="italic">f (الحدّ)</text>

  <!-- phi1 -->
  <g fill="#fef3c7" stroke="#b45309" stroke-width="1">
    <rect x="50"  y="236" width="58" height="14"/>
    <rect x="108" y="220" width="58" height="30"/>
    <rect x="166" y="190" width="58" height="60"/>
    <rect x="224" y="170" width="58" height="80"/>
    <rect x="282" y="160" width="58" height="90"/>
    <rect x="340" y="150" width="58" height="100"/>
    <rect x="398" y="140" width="58" height="110"/>
    <rect x="456" y="120" width="58" height="130"/>
    <rect x="514" y="110" width="58" height="140"/>
    <rect x="572" y="100" width="58" height="150"/>
  </g>
  <text x="95" y="270" font-size="12" fill="#b45309" text-anchor="middle">φ₁</text>

  <!-- phi2 dashed overlay (higher) -->
  <g fill="none" stroke="#9d174d" stroke-width="1.2" stroke-dasharray="4 3">
    <path d="M50,232 H108 V214 H166 V188 H224 V168 H282 V156 H340 V146 H398 V134 H456 V116 H514 V106 H572 V96 H630"/>
  </g>
  <text x="160" y="270" font-size="12" fill="#9d174d" text-anchor="middle">φ₂ (أعلى)</text>

  <text x="430" y="270" font-size="12" fill="#64748b" text-anchor="middle">كل φₙ دالة بسيطة غير سالبة</text>
  <text x="340" y="290" font-size="12.5" fill="#334155" text-anchor="middle" font-style="italic">∫ φₙ ↑ ∫ f  (حتى لو كان الحدّ غير منتهٍ)</text>
</svg>
