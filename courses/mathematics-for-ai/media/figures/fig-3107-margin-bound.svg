<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380">
  <rect width="680" height="380" fill="#fbfbfd"/>
  <text x="340" y="26" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">Margin bounds: a large margin makes the effective capacity smaller</text>

  <!-- separating hyperplane -->
  <line x1="120" y1="300" x2="560" y2="100" stroke="#1f6feb" stroke-width="3"/>
  <text x="470" y="112" font-family="sans-serif" font-size="12" fill="#1f6feb">w . x = 0</text>

  <!-- margin bands -->
  <line x1="100" y1="330" x2="540" y2="130" stroke="#2a7a2a" stroke-width="1.6" stroke-dasharray="6,4"/>
  <line x1="140" y1="270" x2="580" y2="70" stroke="#2a7a2a" stroke-width="1.6" stroke-dasharray="6,4"/>
  <text x="560" y="80" font-family="sans-serif" font-size="11" fill="#2a7a2a">margin gamma</text>
  <line x1="130" y1="282" x2="150" y2="300" stroke="#2a7a2a" stroke-width="1.4"/>
  <text x="86" y="300" font-family="sans-serif" font-size="11" fill="#2a7a2a">gamma</text>

  <!-- points -->
  <circle cx="220" cy="90" r="6" fill="#c00"/>
  <circle cx="300" cy="70" r="6" fill="#c00"/>
  <circle cx="180" cy="140" r="6" fill="#c00"/>
  <circle cx="420" cy="300" r="6" fill="#2a7a2a"/>
  <circle cx="500" cy="270" r="6" fill="#2a7a2a"/>
  <circle cx="380" cy="330" r="6" fill="#2a7a2a"/>
  <!-- points inside the margin (counted by the margin loss) -->
  <circle cx="360" cy="180" r="6" fill="#b8860b"/>
  <circle cx="300" cy="220" r="6" fill="#b8860b"/>
  <text x="372" y="176" font-family="sans-serif" font-size="10" fill="#8a5a00">inside the margin</text>
  <text x="312" y="216" font-family="sans-serif" font-size="10" fill="#8a5a00">(counted by R_hat_gamma)</text>

  <!-- formula -->
  <rect x="70" y="330" width="560" height="40" fill="#fff6d8" stroke="#b8860b" stroke-width="1.2"/>
  <text x="350" y="348" font-family="sans-serif" font-size="12" fill="#8a5a00" text-anchor="middle">R(h) &lt;= R_hat_gamma(h) + O( (B R_x) / (gamma sqrt(n)) )</text>
  <text x="350" y="364" font-family="sans-serif" font-size="10" fill="#555" text-anchor="middle">independent of the raw dimension d -- this is why kernel machines and SVMs work in huge feature spaces</text>
</svg>
