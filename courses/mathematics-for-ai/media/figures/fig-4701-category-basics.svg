<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="380" fill="#fbfbfd"/>
  <text x="340" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2238">A category: objects &amp; morphisms</text>

  <!-- objects -->
  <circle cx="130" cy="180" r="26" fill="#c9d6ff" stroke="#3b5bdb" stroke-width="2.5"/>
  <text x="130" y="185" text-anchor="middle" font-size="14" font-weight="600" fill="#1a2238">A</text>
  <circle cx="340" cy="110" r="26" fill="#c9d6ff" stroke="#3b5bdb" stroke-width="2.5"/>
  <text x="340" y="115" text-anchor="middle" font-size="14" font-weight="600" fill="#1a2238">B</text>
  <circle cx="550" cy="180" r="26" fill="#c9d6ff" stroke="#3b5bdb" stroke-width="2.5"/>
  <text x="550" y="185" text-anchor="middle" font-size="14" font-weight="600" fill="#1a2238">C</text>

  <!-- morphisms -->
  <line x1="158" y1="165" x2="312" y2="118" stroke="#2f9e44" stroke-width="2.2" marker-end="url(#cb1)"/>
  <text x="230" y="130" font-size="12" fill="#2f9e44">f: A → B</text>

  <line x1="366" y1="128" x2="524" y2="172" stroke="#2f9e44" stroke-width="2.2" marker-end="url(#cb1)"/>
  <text x="450" y="160" font-size="12" fill="#2f9e44">g: B → C</text>

  <!-- composition -->
  <path d="M160 205 Q340 330 520 205" fill="none" stroke="#c2255c" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#cb2)"/>
  <text x="340" y="300" text-anchor="middle" font-size="13" fill="#c2255c">g ∘ f: A → C  (composition)</text>

  <!-- identity loops -->
  <path d="M130 154 A26 26 0 0 1 156 180" fill="none" stroke="#f08c00" stroke-width="1.8"/>
  <text x="175" y="152" font-size="11" fill="#f08c00">id_A</text>

  <text x="340" y="355" text-anchor="middle" font-size="11.5" fill="#555">associativity: (h∘g)∘f = h∘(g∘f);  identity: id∘f = f = f∘id.</text>
  <defs>
    <marker id="cb1" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#2f9e44"/></marker>
    <marker id="cb2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#c2255c"/></marker>
  </defs>
</svg>
