<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="380" fill="#fbfbfd"/>
  <text x="340" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2238">Weisfeiler–Lehman (color refinement)</text>

  <!-- two graphs (non-isomorphic, WL indistinguishable) -->
  <text x="180" y="72" text-anchor="middle" font-size="12" fill="#3b5bdb">Graph 1 (cycle C6)</text>
  <g stroke="#888" stroke-width="2">
    <line x1="130" y1="150" x2="230" y2="150"/>
    <line x1="130" y1="150" x2="180" y2="120"/>
    <line x1="230" y1="150" x2="180" y2="120"/>
    <line x1="130" y1="150" x2="180" y2="180"/>
    <line x1="230" y1="150" x2="180" y2="180"/>
    <line x1="180" y1="120" x2="180" y2="180"/>
  </g>
  <g fill="#c9d6ff" stroke="#3b5bdb" stroke-width="2">
    <circle cx="130" cy="150" r="14"/><circle cx="230" cy="150" r="14"/>
    <circle cx="180" cy="120" r="14"/><circle cx="180" cy="180" r="14"/>
  </g>

  <text x="500" y="72" text-anchor="middle" font-size="12" fill="#c2255c">Graph 2 (two triangles)</text>
  <g stroke="#888" stroke-width="2">
    <line x1="440" y1="130" x2="480" y2="160"/>
    <line x1="440" y1="130" x2="490" y2="110"/>
    <line x1="490" y1="110" x2="480" y2="160"/>
    <line x1="510" y1="150" x2="550" y2="170"/>
    <line x1="510" y1="150" x2="560" y2="140"/>
    <line x1="560" y1="140" x2="550" y2="170"/>
  </g>
  <g fill="#ffd6e7" stroke="#c2255c" stroke-width="2">
    <circle cx="440" cy="130" r="12"/><circle cx="480" cy="160" r="12"/><circle cx="490" cy="110" r="12"/>
    <circle cx="510" cy="150" r="12"/><circle cx="550" cy="170" r="12"/><circle cx="560" cy="140" r="12"/>
  </g>

  <text x="340" y="235" text-anchor="middle" font-size="12" fill="#f08c00">Both: all nodes degree 2 (WL gives same colors)</text>
  <text x="340" y="258" text-anchor="middle" font-size="11.5" fill="#555">C6 is one 6-cycle; two-triangles has two 3-cycles ⇒ non-isomorphic</text>

  <rect x="120" y="290" width="440" height="60" rx="8" fill="#ffe0b2" stroke="#e8590c" stroke-width="1.5"/>
  <text x="340" y="312" text-anchor="middle" font-size="12.5" fill="#1a2238">GNN expressiveness ≤ WL test (message passing)</text>
  <text x="340" y="332" text-anchor="middle" font-size="11.5" fill="#555">c_v^(k) = HASH({c_u^(k−1) : u ∈ N(v)});  WL-indistinct ⇒ GNN cannot separate</text>
  <defs><marker id="p2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#888"/></marker></defs>
</svg>
