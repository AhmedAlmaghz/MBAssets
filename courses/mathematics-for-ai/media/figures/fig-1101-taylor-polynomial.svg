<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="Georgia, 'Times New Roman', serif">
  <rect width="680" height="320" fill="#fafaf7"/>

  <text x="340" y="26" font-size="14" fill="#334155" text-anchor="middle" font-weight="bold">متعدّدات تايلور حول النقطة a</text>

  <!-- axes -->
  <line x1="50" y1="270" x2="640" y2="270" stroke="#334155" stroke-width="1.4"/>
  <line x1="120" y1="290" x2="120" y2="40" stroke="#334155" stroke-width="1.4"/>
  <text x="120" y="284" font-size="12" fill="#334155" text-anchor="middle">a</text>

  <!-- target curve f -->
  <path d="M120,200 C200,170 260,90 320,80 C400,66 480,150 620,120" fill="none" stroke="#0f766e" stroke-width="2.6"/>
  <text x="560" y="108" font-size="13" fill="#0f766e" font-style="italic">f(x)</text>

  <!-- linear approx (tangent) -->
  <path d="M120,200 L320,150" fill="none" stroke="#b45309" stroke-width="1.8"/>
  <!-- quadratic approx -->
  <path d="M120,200 C200,180 250,150 320,140 C400,128 470,150 540,168" fill="none" stroke="#9d174d" stroke-width="1.8" stroke-dasharray="5 3"/>
  <!-- cubic approx -->
  <path d="M120,200 C200,178 250,110 320,98 C400,84 480,122 560,112" fill="none" stroke="#1d4ed8" stroke-width="1.8" stroke-dasharray="2 3"/>

  <!-- point a marker -->
  <circle cx="120" cy="200" r="4" fill="#0f766e"/>

  <!-- legend -->
  <g font-size="12" fill="#334155">
    <rect x="430" y="210" width="14" height="4" fill="#b45309"/><text x="450" y="215">خطّي (درجة 1)</text>
    <rect x="430" y="228" width="14" height="4" fill="#9d174d"/><text x="450" y="233">تربيعي (درجة 2)</text>
    <rect x="430" y="246" width="14" height="4" fill="#1d4ed8"/><text x="450" y="251">تكعيبي (درجة 3)</text>
  </g>

  <text x="340" y="305" font-size="12.5" fill="#334155" text-anchor="middle" font-style="italic">كلما زادت الدرجة اقترب التقريب من f حول a</text>
</svg>
