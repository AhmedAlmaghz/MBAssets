<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="680" height="320" font-family="Segoe UI, Tahoma, Arial, sans-serif">
  <rect width="680" height="320" fill="#ffffff"/>
  <text x="340" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">الفضاء المتجهي: كل متجه = تركيبة خطية وحيدة لمتجهات الأساس</text>

  <!-- شبكة -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="40" y1="60" x2="40" y2="270"/><line x1="100" y1="60" x2="100" y2="270"/>
    <line x1="160" y1="60" x2="160" y2="270"/><line x1="220" y1="60" x2="220" y2="270"/>
    <line x1="280" y1="60" x2="280" y2="270"/><line x1="340" y1="60" x2="340" y2="270"/>
    <line x1="60" y1="90" x2="340" y2="90"/><line x1="60" y1="150" x2="340" y2="150"/>
    <line x1="60" y1="210" x2="340" y2="210"/><line x1="60" y1="270" x2="340" y2="270"/>
  </g>

  <defs>
    <marker id="a201" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#1d4ed8"/>
    </marker>
    <marker id="a202" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/>
    </marker>
    <marker id="a203" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- e1, e2 -->
  <line x1="100" y1="210" x2="220" y2="210" stroke="#1d4ed8" stroke-width="3" marker-end="url(#a201)"/>
  <line x1="100" y1="210" x2="100" y2="90" stroke="#16a34a" stroke-width="3" marker-end="url(#a202)"/>
  <text x="228" y="214" font-size="14" font-weight="bold" fill="#1d4ed8">e₁</text>
  <text x="104" y="80" font-size="14" font-weight="bold" fill="#16a34a">e₂</text>

  <!-- المتجه الهدف -->
  <line x1="100" y1="210" x2="280" y2="90" stroke="#b91c1c" stroke-width="3" marker-end="url(#a203)"/>
  <text x="288" y="84" font-size="14" font-weight="bold" fill="#b91c1c">x</text>

  <!-- المركّبات المتقطعة -->
  <line x1="100" y1="210" x2="280" y2="210" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="5,4"/>
  <line x1="280" y1="210" x2="280" y2="90" stroke="#16a34a" stroke-width="2" stroke-dasharray="5,4"/>

  <!-- اللوحة اليمنى: التبعية الخطية -->
  <rect x="380" y="60" width="280" height="200" rx="4" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="520" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">ثلاثة متجهات في R² ⟹ تابعة خطياً</text>
  <line x1="520" y1="200" x2="450" y2="120" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#a201)"/>
  <line x1="520" y1="200" x2="600" y2="140" stroke="#16a34a" stroke-width="2.5" marker-end="url(#a202)"/>
  <line x1="520" y1="200" x2="470" y2="230" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#a203)"/>
  <text x="520" y="252" text-anchor="middle" font-size="12" fill="#475569">v₃ = αv₁ + βv₂ ⟹ ليست أساساً</text>

  <text x="340" y="300" text-anchor="middle" font-size="12" fill="#475569">شكل (2.1): الأساس = أصغر مجموعة تولّد الفضاء، وأكبر مجموعة مستقلة فيه؛ عددها = البُعد</text>
</svg>
