  <text x="664" y="44" text-anchor="end" font-size="11" fill="#5a6770">Wavelets: multi-resolution tiling</text>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6770"/></marker></defs>
  <g fill="#7a9e3c">
    <rect x="90" y="240" width="160" height="40"/><rect x="250" y="200" width="120" height="40"/>
