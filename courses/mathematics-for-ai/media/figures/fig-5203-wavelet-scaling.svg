  <text x="540" y="314" font-size="11" fill="#5a6770">scale (a)</text>
  <text x="74" y="120" text-anchor="end" font-size="11" fill="#5a6770"></text>
  <text x="340" y="336" font-size="10.5" fill="#5a6770" direction="rtl">مربّعات المويجات: ضيقة عند التردّد العالي (دقّة زمنية) وواسعة عند المنخفض (دقّة تردّدية).</text>
  <text x="340" y="358" font-size="10.5" fill="#5a6770" direction="rtl"><tspan direction="ltr" unicode-bidi="isolate">ψ<tspan dy="3.15" font-size="70%">a,b</tspan><tspan dy="-3.15" font-size="1">&#8203;</tspan>(t)=1/(√a)ψ((t-b)/a): </tspan>تحجيمٌ وإزاحة للمويجة الأُمّ<tspan direction="ltr" unicode-bidi="isolate">.</tspan></text>
