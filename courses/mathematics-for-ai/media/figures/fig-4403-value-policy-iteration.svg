<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="380" fill="#fbfbfd"/>
  <text x="340" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2238">Value &amp; policy iteration</text>

  <!-- convergence curves -->
  <line x1="70" y1="300" x2="600" y2="300" stroke="#888" stroke-width="1.5"/>
  <line x1="70" y1="300" x2="70" y2="60" stroke="#888" stroke-width="1.5"/>
  <text x="70" y="55" font-size="11" fill="#555">error</text>
  <text x="595" y="322" font-size="11" fill="#555">iteration</text>

  <!-- value iteration curve (geometric decay) -->
  <path d="M80 90 Q130 260 180 285 Q240 295 320 297 L580 298" fill="none" stroke="#3b5bdb" stroke-width="2.5"/>
  <text x="420" y="270" font-size="12" fill="#3b5bdb">Value iteration (γ^k decay)</text>

  <!-- policy iteration curve (finite steps) -->
  <path d="M80 90 L180 110 L280 295 L420 297 L580 298" fill="none" stroke="#c2255c" stroke-width="2.5"/>
  <text x="180" y="150" font-size="12" fill="#c2255c">Policy iteration (few exact steps)</text>

  <text x="340" y="350" text-anchor="middle" font-size="12" fill="#555">Both converge to V*; trading number of iterations vs. cost per iteration.</text>
</svg>
