<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="380" fill="#fbfbfd"/>
  <text x="340" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2238">Entropic OT &amp; Sinkhorn</text>

  <!-- unregularized plan (sparse) -->
  <text x="160" y="70" text-anchor="middle" font-size="12" fill="#1a2238">OT (sparse)</text>
  <g stroke="#5b6b8c" stroke-width="1" fill="none">
    <rect x="80" y="80" width="160" height="160"/>
  </g>
  <g fill="#3b5bdb" fill-opacity="0.7">
    <rect x="80" y="160" width="80" height="80"/>
    <rect x="160" y="80" width="80" height="80"/>
  </g>

  <!-- arrow -->
  <line x1="250" y1="160" x2="310" y2="160" stroke="#f08c00" stroke-width="2" marker-end="url(#i2)"/>

  <!-- regularized plan (soft) -->
  <text x="500" y="70" text-anchor="middle" font-size="12" fill="#1a2238">Entropic OT (soft)</text>
  <g stroke="#5b6b8c" stroke-width="1" fill="none">
    <rect x="400" y="80" width="200" height="160"/>
    <line x1="500" y1="80" x2="500" y2="240"/>
    <line x1="400" y1="160" x2="600" y2="160"/>
  </g>
  <g fill="#c2255c" fill-opacity="0.5">
    <rect x="400" y="80" width="100" height="80"/>
    <rect x="500" y="160" width="100" height="80"/>
    <rect x="500" y="80" width="100" height="80" opacity="0.3"/>
    <rect x="400" y="160" width="100" height="80" opacity="0.3"/>
  </g>

  <text x="340" y="300" text-anchor="middle" font-size="12.5" fill="#1a2238">Add ε·KL(γ || μ⊗ν): plan becomes smooth, Sinkhorn converges fast.</text>
  <text x="340" y="326" text-anchor="middle" font-size="12" fill="#555">u_i v_j e^{-C_{ij}/ε}  (rank-1 factors after normalization)</text>
  <defs><marker id="i2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#f08c00"/></marker></defs>
</svg>
