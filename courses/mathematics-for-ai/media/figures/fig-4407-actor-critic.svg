<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="380" fill="#fbfbfd"/>
  <text x="340" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2238">Actor–Critic</text>

  <!-- actor -->
  <rect x="110" y="140" width="150" height="90" rx="10" fill="#ffe0b2" stroke="#e8590c" stroke-width="2.5"/>
  <text x="185" y="180" text-anchor="middle" font-size="14" fill="#1a2238">Actor</text>
  <text x="185" y="202" text-anchor="middle" font-size="11" fill="#555">πθ(a|s) — policy</text>

  <!-- critic -->
  <rect x="420" y="140" width="150" height="90" rx="10" fill="#c9d6ff" stroke="#3b5bdb" stroke-width="2.5"/>
  <text x="495" y="180" text-anchor="middle" font-size="14" fill="#1a2238">Critic</text>
  <text x="495" y="202" text-anchor="middle" font-size="11" fill="#555">Vw(s) — value</text>

  <!-- actor to critic (advantage) -->
  <line x1="260" y1="170" x2="418" y2="170" stroke="#f08c00" stroke-width="2" marker-end="url(#e2)"/>
  <text x="339" y="160" text-anchor="middle" font-size="12" fill="#f08c00">action a</text>
  <line x1="418" y1="205" x2="260" y2="205" stroke="#2f9e44" stroke-width="2" marker-end="url(#e3)"/>
  <text x="339" y="228" text-anchor="middle" font-size="12" fill="#2f9e44">advantage A = R − Vw(s)</text>

  <rect x="120" y="290" width="440" height="60" rx="8" fill="#fff3bf" stroke="#f08c00" stroke-width="1.5"/>
  <text x="340" y="312" text-anchor="middle" font-size="12.5" fill="#1a2238">θ ← θ + α A_t ∇ log πθ(a_t|s_t);   w ← w + α' [r + γVw(s') − Vw(s)]</text>
  <text x="340" y="336" text-anchor="middle" font-size="11.5" fill="#555">Critic supplies a low-variance baseline for the actor's policy gradient.</text>
  <defs>
    <marker id="e2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#f08c00"/></marker>
    <marker id="e3" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#2f9e44"/></marker>
  </defs>
</svg>
