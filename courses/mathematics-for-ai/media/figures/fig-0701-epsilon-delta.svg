<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="680" height="420" fill="#fafaf7"/>

  <!-- axes -->
  <g stroke="#334155" stroke-width="1.5" fill="none">
    <line x1="60" y1="360" x2="640" y2="360" marker-end="url(#arr)"/>
    <line x1="90" y1="390" x2="90" y2="40" marker-end="url(#arr)"/>
  </g>
  <text x="650" y="365" font-size="15" fill="#334155">x</text>
  <text x="80" y="32" font-size="15" fill="#334155">f(x)</text>

  <!-- epsilon band around L=7 (y=120) : eps=30px -->
  <rect x="90" y="90" width="550" height="60" fill="#ef4444" opacity="0.14"/>
  <line x1="90" y1="90" x2="640" y2="90" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="90" y1="150" x2="640" y2="150" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="600" y="85" font-size="14" fill="#b91c1c">L + ε = 7.2</text>
  <text x="600" y="166" font-size="14" fill="#b91c1c">L − ε = 6.8</text>
  <line x1="90" y1="120" x2="640" y2="120" stroke="#0f766e" stroke-width="1.2" stroke-dasharray="2 4"/>
  <text x="600" y="115" font-size="14" fill="#0f766e">L = 7</text>

  <!-- delta band around a=3 (x=330) : delta=60px -->
  <rect x="270" y="40" width="120" height="320" fill="#2563eb" opacity="0.12"/>
  <line x1="270" y1="40" x2="270" y2="360" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="390" y1="40" x2="390" y2="360" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="245" y="352" font-size="14" fill="#1d4ed8">a − δ</text>
  <text x="396" y="352" font-size="14" fill="#1d4ed8">a + δ</text>
  <circle cx="330" cy="360" r="4" fill="#1d4ed8"/>
  <text x="322" y="378" font-size="15" fill="#1d4ed8" font-weight="bold">a = 3</text>

  <!-- curve f(x)=2x+1 : scale: x px = 90 + 80x ; y px = 360 - 40 f(x) -->
  <line x1="120" y1="300" x2="560" y2="76" stroke="#0f766e" stroke-width="2.5"/>
  <!-- hollow point at (a,L): x=90+240=330, y=360-280=80 -->
  <circle cx="330" cy="80" r="6" fill="#fafaf7" stroke="#0f766e" stroke-width="2"/>
  <text x="345" y="70" font-size="14" fill="#0f766e">(a, L)</text>

  <!-- intersection markers -->
  <circle cx="270" cy="112" r="4" fill="#0f766e"/>
  <circle cx="390" cy="48" r="4" fill="#0f766e"/>

  <!-- caption box -->
  <rect x="430" y="30" width="220" height="42" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="440" y="47" font-size="13" fill="#334155">لكل ε يوجد δ بحيث:</text>
  <text x="440" y="65" font-size="13" fill="#334155">كل نقاط المنحنى داخل الشريطين</text>
</svg>
