<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380">
  <rect width="680" height="380" fill="#fbfbfd"/>
  <text x="20" y="28" font-family="sans-serif" font-size="13" fill="#1f6feb" font-weight="bold">Softmax + Cross-Entropy gradient</text>

  <!-- boxes -->
  <rect x="60" y="160" width="90" height="50" fill="#eef4ff" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="105" y="185" font-family="sans-serif" font-size="12" fill="#1f6feb" text-anchor="middle">z (logits)</text>

  <rect x="220" y="160" width="110" height="50" fill="#fff6d8" stroke="#b8860b" stroke-width="1.5"/>
  <text x="275" y="185" font-family="sans-serif" font-size="12" fill="#8a5a00" text-anchor="middle">softmax</text>

  <rect x="400" y="160" width="110" height="50" fill="#eef4ff" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="455" y="178" font-family="sans-serif" font-size="12" fill="#1f6feb" text-anchor="middle">y_hat</text>
  <text x="455" y="197" font-family="sans-serif" font-size="10" fill="#1f6feb" text-anchor="middle">probs</text>

  <rect x="560" y="160" width="90" height="50" fill="#e8f5e8" stroke="#2a7a2a" stroke-width="1.5"/>
  <text x="605" y="185" font-family="sans-serif" font-size="11" fill="#2a7a2a" text-anchor="middle">CE Loss</text>

  <!-- arrows -->
  <line x1="150" y1="185" x2="218" y2="185" stroke="#333" stroke-width="1.5"/>
  <line x1="330" y1="185" x2="398" y2="185" stroke="#333" stroke-width="1.5"/>
  <line x1="510" y1="185" x2="558" y2="185" stroke="#333" stroke-width="1.5"/>

  <!-- y label -->
  <text x="605" y="120" font-family="sans-serif" font-size="12" fill="#c00" text-anchor="middle">y (target)</text>
  <line x1="605" y1="128" x2="605" y2="158" stroke="#c00" stroke-width="1.2"/>

  <!-- gradient result -->
  <rect x="220" y="280" width="300" height="40" fill="#fde8e8" stroke="#c00" stroke-width="1.5"/>
  <text x="370" y="305" font-family="sans-serif" font-size="13" fill="#c00" text-anchor="middle">dL/dz = y_hat - y</text>

  <line x1="105" y1="210" x2="370" y2="278" stroke="#c00" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="605" y="210" x2="370" y2="278" stroke="#c00" stroke-width="1.5" stroke-dasharray="5,4"/>

  <text x="20" y="370" font-family="sans-serif" font-size="10" fill="#555">Combined, the gradient simplifies to the difference of prediction and target</text>
</svg>
