<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="380" fill="#fbfbfd"/>
  <text x="340" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2238">NTK = kernel regression</text>

  <!-- prediction formula -->
  <g>
    <rect x="60" y="90" width="220" height="60" rx="8" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/>
    <text x="170" y="118" text-anchor="middle" font-size="12" fill="#1a2238">f*(x) = K(x,X) [K + lambda I]^(-1) y</text>
    <text x="170" y="138" text-anchor="middle" font-size="10" fill="#555">same form as Gaussian-process / ridge</text>
  </g>

  <!-- kernel matrix K -->
  <text x="430" y="80" text-anchor="middle" font-size="13" fill="#2f9e44" font-weight="600">K (Gram matrix)</text>
  <g stroke="#5b6b8c" stroke-width="1" fill="none">
    <rect x="380" y="95" width="160" height="160"/>
    <line x1="460" y1="95" x2="460" y2="255"/><line x1="380" y1="175" x2="540" y2="175"/>
  </g>
  <g fill="#3b5bdb" fill-opacity="0.45">
    <rect x="380" y="95" width="80" height="80"/>
    <rect x="460" y="175" width="80" height="80"/>
    <rect x="460" y="95" width="80" height="80"/>
    <rect x="380" y="175" width="80" height="80"/>
  </g>
  <line x1="280" y1="120" x2="378" y2="150" stroke="#888" stroke-width="1.4" marker-end="url(#n1)"/>
  <path d="M280 120 A40 40 0 0 1 320 160" fill="none" stroke="#888" stroke-width="1" />
  <text x="430" y="285" text-anchor="middle" font-size="11" fill="#555">K_ij = Theta(x_i,x_j)</text>

  <text x="340" y="355" text-anchor="middle" font-size="12.5" fill="#555">In the infinite-width limit the NN trains exactly like a linear model in feature space.</text>
</svg>
