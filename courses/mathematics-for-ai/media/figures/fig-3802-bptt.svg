<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="380" fill="#fbfbfd"/>
  <text x="340" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2238">Backpropagation Through Time (BPTT)</text>

  <!-- forward chain -->
  <g>
    <rect x="80" y="70" width="70" height="44" rx="6" fill="#c9d6ff" stroke="#3b5bdb" stroke-width="2"/>
    <rect x="220" y="70" width="70" height="44" rx="6" fill="#c9d6ff" stroke="#3b5bdb" stroke-width="2"/>
    <rect x="360" y="70" width="70" height="44" rx="6" fill="#c9d6ff" stroke="#3b5bdb" stroke-width="2"/>
    <rect x="500" y="70" width="70" height="44" rx="6" fill="#c9d6ff" stroke="#3b5bdb" stroke-width="2"/>
    <text x="115" y="97" text-anchor="middle" font-size="12" fill="#1a2238">h_1</text>
    <text x="255" y="97" text-anchor="middle" font-size="12" fill="#1a2238">h_2</text>
    <text x="395" y="97" text-anchor="middle" font-size="12" fill="#1a2238">h_3</text>
    <text x="535" y="97" text-anchor="middle" font-size="12" fill="#1a2238">h_T</text>
    <line x1="150" y1="92" x2="218" y2="92" stroke="#888" stroke-width="2" marker-end="url(#a1)"/>
    <line x1="290" y1="92" x2="358" y2="92" stroke="#888" stroke-width="2" marker-end="url(#a1)"/>
    <line x1="430" y1="92" x2="498" y2="92" stroke="#888" stroke-width="2" marker-end="url(#a1)"/>
    <defs><marker id="a1" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#888"/></marker></defs>
  </g>

  <!-- backward chain -->
  <g>
    <line x1="150" y1="180" x2="218" y2="180" stroke="#e8590c" stroke-width="2.4" marker-end="url(#b1)"/>
    <line x1="290" y1="180" x2="358" y2="180" stroke="#e8590c" stroke-width="2.4" marker-end="url(#b1)"/>
    <line x1="430" y1="180" x2="498" y2="180" stroke="#e8590c" stroke-width="2.4" marker-end="url(#b1)"/>
    <defs><marker id="b1" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#e8590c"/></marker></defs>
    <text x="300" y="172" text-anchor="middle" font-size="11" fill="#e8590c">gradient flows backward in time</text>
  </g>

  <!-- loss -->
  <text x="80" y="250" font-size="13" fill="#2f9e44" font-weight="600">Total loss L = sum_t L_t</text>
  <text x="80" y="280" font-size="12.5" fill="#1a2238">dh_t / dh_1 = prod_{k=1}^{t-1} [ diag(1-h_{k+1}^2) W_h ]</text>
  <text x="80" y="310" font-size="12.5" fill="#1a2238">Each factor multiplies the Jacobian -> product of many matrices.</text>

  <text x="340" y="355" text-anchor="middle" font-size="12.5" fill="#555">Truncated BPTT stops the chain after k steps to bound cost and exploding gradients.</text>
</svg>
