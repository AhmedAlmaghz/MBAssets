<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380">
  <rect width="680" height="380" fill="#fbfbfd"/>
  <text x="20" y="28" font-family="sans-serif" font-size="13" fill="#1f6feb" font-weight="bold">Activation functions</text>

  <!-- axes -->
  <line x1="130" y1="330" x2="600" y2="330" stroke="#999" stroke-width="1"/>
  <line x1="340" y1="330" x2="340" y2="60" stroke="#999" stroke-width="1"/>
  <text x="610" y="334" font-family="sans-serif" font-size="11" fill="#555">t</text>
  <text x="320" y="52" font-family="sans-serif" font-size="11" fill="#555">sigma(t)</text>

  <!-- sigmoid: dataY in [0,1] -> py=330-dataY*240 ; dataX in [-3,3] -> px=340+dataX*70 -->
  <polyline points="130,318.6 200,301.4 270,265.4 340,210 410,154.6 480,118.6 550,101.3"
            fill="none" stroke="#1f6feb" stroke-width="2.5"/>
  <text x="500" y="95" font-family="sans-serif" font-size="11" fill="#1f6feb">sigmoid (0,1)</text>

  <!-- tanh: dataY in [-1,1] -> py=210-dataY*120 ; same x mapping -->
  <polyline points="130,329.4 200,325.7 270,301.4 340,210 410,118.6 480,94.3 550,90.6"
            fill="none" stroke="#b8860b" stroke-width="2.5"/>
  <text x="430" y="350" font-family="sans-serif" font-size="11" fill="#b8860b">tanh (-1,1)</text>

  <!-- ReLU: dataY in [0,3] -> py=330-dataY*80 ; dataX in [-3,3] -->
  <polyline points="130,330 270,330 340,330 410,250 480,170 550,90"
            fill="none" stroke="#2a7a2a" stroke-width="2.5"/>
  <text x="470" y="160" font-family="sans-serif" font-size="11" fill="#2a7a2a">ReLU [0,inf)</text>

  <text x="20" y="370" font-family="sans-serif" font-size="10" fill="#555">All three are continuous &amp; non-polynomial (required for universal approximation)</text>
</svg>
