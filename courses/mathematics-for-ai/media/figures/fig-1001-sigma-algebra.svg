<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="Georgia, 'Times New Roman', serif">
  <rect width="680" height="320" fill="#fafaf7"/>

  <!-- sample space Omega -->
  <g>
    <rect x="40" y="50" width="250" height="220" rx="10" fill="#e0f2f1" stroke="#0f766e" stroke-width="1.8"/>
    <text x="165" y="42" font-size="15" fill="#0f766e" text-anchor="middle" font-weight="bold">Ω — فضاء العيّنات</text>
    <!-- subset A -->
    <ellipse cx="160" cy="160" rx="80" ry="65" fill="#ffffff" stroke="#b45309" stroke-width="1.8"/>
    <text x="160" y="165" font-size="16" fill="#b45309" text-anchor="middle" font-weight="bold">A</text>
    <!-- complement shading -->
    <path d="M40,50 h250 v220 h-250 z M160,95 a80,65 0 1,0 0.1,0 z" fill="#fef3c7" fill-rule="evenodd" opacity="0.55"/>
    <text x="252" y="240" font-size="13" fill="#b45309" text-anchor="end">Aᶜ</text>
  </g>

  <!-- arrow -->
  <line x1="295" y1="160" x2="345" y2="160" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <!-- sigma-algebra collection -->
  <g>
    <text x="500" y="42" font-size="15" fill="#334155" text-anchor="middle" font-weight="bold">σ-جبرا 𝓕</text>
    <g font-size="14" fill="#334155" text-anchor="middle">
      <rect x="370" y="60"  width="130" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="435" y="85">∅</text>
      <rect x="370" y="110" width="130" height="40" rx="8" fill="#fef3c7" stroke="#b45309"/>
      <text x="435" y="135">A</text>
      <rect x="510" y="110" width="130" height="40" rx="8" fill="#fef3c7" stroke="#b45309"/>
      <text x="575" y="135">Aᶜ</text>
      <rect x="370" y="160" width="270" height="40" rx="8" fill="#e0f2f1" stroke="#0f766e"/>
      <text x="505" y="185">Ω</text>
    </g>
    <text x="435" y="235" font-size="12.5" fill="#64748b" text-anchor="middle">مغلقة تحت المتمّم</text>
    <text x="435" y="252" font-size="12.5" fill="#64748b" text-anchor="middle">والاتحادات العدّية</text>
  </g>

  <rect x="150" y="280" width="380" height="30" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="340" y="300" font-size="13" fill="#334155" text-anchor="middle" font-style="italic">𝓕 = {∅, A, Aᶜ, Ω} أصغر σ-جبرا تحتوي A</text>
</svg>
