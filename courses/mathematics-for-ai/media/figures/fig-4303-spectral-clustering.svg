<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="380" fill="#fbfbfd"/>
  <text x="340" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2238">Spectral clustering</text>

  <!-- two blobs -->
  <circle cx="180" cy="160" r="70" fill="#c9d6ff" stroke="#3b5bdb" stroke-width="2" opacity="0.4"/>
  <text x="180" y="165" text-anchor="middle" font-size="13" fill="#3b5bdb">cluster A</text>
  <circle cx="470" cy="230" r="70" fill="#ffd6e7" stroke="#c2255c" stroke-width="2" opacity="0.4"/>
  <text x="470" y="235" text-anchor="middle" font-size="13" fill="#c2255c">cluster B</text>

  <!-- weak link -->
  <line x1="250" y1="180" x2="400" y2="215" stroke="#f08c00" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#m2)"/>
  <text x="325" y="160" text-anchor="middle" font-size="11" fill="#f08c00">weak bridge</text>

  <!-- arrow down to embedding -->
  <line x1="340" y1="290" x2="340" y2="320" stroke="#888" stroke-width="1.8" marker-end="url(#m2)"/>

  <text x="340" y="350" text-anchor="middle" font-size="12" fill="#1a2238">Embed nodes in eigenvectors of L (or L_sym), then k-means.</text>
  <text x="340" y="370" text-anchor="middle" font-size="11" fill="#555">Cut cost = x^T L x; spectral min finds near-optimal normalized cut.</text>
  <defs><marker id="m2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#888"/></marker></defs>
</svg>
