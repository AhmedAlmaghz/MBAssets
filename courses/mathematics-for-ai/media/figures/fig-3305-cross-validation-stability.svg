<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380">
  <rect width="680" height="380" fill="#fbfbfd"/>

  <text x="340" y="26" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">Leave-one-out: unbiased for size n-1, and concentrated when the algorithm is stable</text>

  <!-- dataset split -->
  <rect x="50" y="70" width="420" height="30" fill="#eef4ff" stroke="#1f6feb" stroke-width="1.3"/>
  <text x="260" y="90" font-family="sans-serif" font-size="11" fill="#1f6feb" text-anchor="middle">training set S (n points)</text>
  <rect x="50" y="110" width="414" height="26" fill="#eef4ff" stroke="#1f6feb" stroke-width="1.3"/>
  <rect x="462" y="110" width="8" height="26" fill="#c00"/>
  <text x="256" y="128" font-family="sans-serif" font-size="11" fill="#1f6feb" text-anchor="middle">S^{-i}  (n-1 points)</text>
  <text x="500" y="128" font-family="sans-serif" font-size="11" fill="#c00">z_i held out</text>

  <!-- arrow to algorithm -->
  <line x1="260" y1="136" x2="260" y2="164" stroke="#222" stroke-width="1.6"/>
  <rect x="140" y="164" width="240" height="34" fill="#fff" stroke="#222" stroke-width="1.4"/>
  <text x="260" y="186" font-family="sans-serif" font-size="12" fill="#222" text-anchor="middle">h_i = A(S^{-i})</text>

  <line x1="380" y1="198" x2="380" y2="226" stroke="#222" stroke-width="1.6"/>
  <text x="300" y="216" font-family="sans-serif" font-size="11" fill="#555">score on z_i</text>

  <rect x="120" y="226" width="380" height="46" fill="#fdfaf0" stroke="#b8860b" stroke-width="1.4"/>
  <text x="310" y="248" font-family="sans-serif" font-size="12" fill="#b8860b" text-anchor="middle">R_hat_LOO = (1/n) sum_i  l( A(S^{-i}), z_i )</text>
  <text x="310" y="266" font-family="sans-serif" font-size="12" fill="#b8860b" text-anchor="middle">E[R_hat_LOO] = E[ R( A(S^{-1}) ) ]   (exact, no approximation)</text>

  <!-- stability arrow -->
  <line x1="120" y1="300" x2="620" y2="300" stroke="#2a7a2a" stroke-width="2"/>
  <text x="370" y="292" font-family="sans-serif" font-size="12" fill="#2a7a2a" text-anchor="middle">| R(A(S)) - R(A(S^{-i})) | &lt;= beta_e   (error stability)</text>
  <text x="370" y="322" font-family="sans-serif" font-size="11" fill="#2a7a2a" text-anchor="middle">plus concentration: |R_hat_LOO - R| &lt;= beta_e + (n beta_e + M) sqrt(ln(1/delta)/2n)</text>

  <!-- caution box -->
  <rect x="50" y="60" width="1" height="1" fill="none"/>
  <text x="340" y="356" font-family="sans-serif" font-size="11" fill="#c00" text-anchor="middle">unstable algorithms (deep trees, small n, leakage) break this chain: CV then misleads</text>
</svg>
