<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380">
  <rect width="680" height="380" fill="#fbfbfd"/>

  <text x="340" y="26" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">Uniform stability: replace one training point, measure the worst loss change</text>

  <!-- left: dataset S -->
  <rect x="40" y="70" width="150" height="150" fill="#eef4ff" stroke="#1f6feb" stroke-width="1.4"/>
  <text x="115" y="92" font-family="sans-serif" font-size="12" fill="#1f6feb" text-anchor="middle">S = {z_1 ... z_i ... z_n}</text>
  <circle cx="70" cy="120" r="6" fill="#1f6feb"/>
  <circle cx="70" cy="146" r="6" fill="#1f6feb"/>
  <circle cx="70" cy="172" r="6" fill="#1f6feb"/>
  <circle cx="70" cy="198" r="7.5" fill="#c00"/>
  <text x="86" y="125" font-family="sans-serif" font-size="11" fill="#555">z_1</text>
  <text x="86" y="151" font-family="sans-serif" font-size="11" fill="#555">z_2</text>
  <text x="86" y="177" font-family="sans-serif" font-size="11" fill="#555">z_3</text>
  <text x="86" y="203" font-family="sans-serif" font-size="11" fill="#c00">z_i</text>
  <text x="130" y="203" font-family="sans-serif" font-size="11" fill="#c00">replaced</text>

  <!-- right: dataset S' -->
  <rect x="490" y="70" width="150" height="150" fill="#eef4ff" stroke="#1f6feb" stroke-width="1.4"/>
  <text x="565" y="92" font-family="sans-serif" font-size="12" fill="#1f6feb" text-anchor="middle">S^{i,z}</text>
  <circle cx="520" cy="120" r="6" fill="#1f6feb"/>
  <circle cx="520" cy="146" r="6" fill="#1f6feb"/>
  <circle cx="520" cy="172" r="6" fill="#1f6feb"/>
  <circle cx="520" cy="198" r="7.5" fill="#2a7a2a"/>
  <text x="536" y="125" font-family="sans-serif" font-size="11" fill="#555">z_1</text>
  <text x="536" y="151" font-family="sans-serif" font-size="11" fill="#555">z_2</text>
  <text x="536" y="177" font-family="sans-serif" font-size="11" fill="#555">z_3</text>
  <text x="536" y="203" font-family="sans-serif" font-size="11" fill="#2a7a2a">z (fresh)</text>

  <!-- arrows to algorithms -->
  <line x1="190" y1="145" x2="250" y2="145" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="490" y1="145" x2="430" y2="145" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#222"/>
    </marker>
  </defs>
  <text x="220" y="136" font-family="sans-serif" font-size="11" fill="#555" text-anchor="middle">A</text>

  <rect x="262" y="112" width="156" height="66" fill="#fff" stroke="#222" stroke-width="1.4"/>
  <text x="340" y="136" font-family="sans-serif" font-size="12" fill="#222" text-anchor="middle">h = A(S)</text>
  <text x="340" y="158" font-family="sans-serif" font-size="12" fill="#222" text-anchor="middle">h' = A(S^{i,z})</text>

  <!-- evaluation on arbitrary test point -->
  <line x1="340" y1="178" x2="340" y2="216" stroke="#222" stroke-width="1.6"/>
  <rect x="230" y="216" width="220" height="52" fill="#fdfaf0" stroke="#b8860b" stroke-width="1.4"/>
  <text x="340" y="238" font-family="sans-serif" font-size="12" fill="#b8860b" text-anchor="middle">any test point z' ~ D</text>
  <text x="340" y="258" font-family="sans-serif" font-size="12" fill="#b8860b" text-anchor="middle">| l(h,z') - l(h',z') | &lt;= beta</text>

  <!-- beta scale -->
  <line x1="60" y1="320" x2="620" y2="320" stroke="#222" stroke-width="1.6"/>
  <text x="60" y="344" font-family="sans-serif" font-size="11" fill="#2a7a2a">beta = 0 (independent of data)</text>
  <text x="620" y="344" font-family="sans-serif" font-size="11" fill="#c00" text-anchor="end">beta large (memorises every point)</text>
  <circle cx="140" cy="320" r="5.5" fill="#2a7a2a"/>
  <circle cx="500" cy="320" r="5.5" fill="#c00"/>
  <text x="340" y="368" font-family="sans-serif" font-size="11" fill="#555" text-anchor="middle">small beta  =&gt;  R(A(S)) - R_hat(A(S)) is small with high probability</text>
</svg>
