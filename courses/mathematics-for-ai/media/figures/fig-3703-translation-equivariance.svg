<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="380" fill="#fbfbfd"/>
  <text x="340" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2238">Translation equivariance vs invariance</text>

  <!-- Equivariance -->
  <text x="40" y="62" font-size="13" fill="#3b5bdb" font-weight="600">Equivariance:  L(T_x f) = T_x L(f)</text>
  <!-- input -->
  <g fill="#c9d6ff" stroke="#3b5bdb" stroke-width="1.4">
    <rect x="50" y="80" width="40" height="40"/><rect x="90" y="80" width="40" height="40"/><rect x="130" y="80" width="40" height="40"/>
    <rect x="50" y="120" width="40" height="40"/><rect x="90" y="120" width="40" height="40" fill="#ffe0b2"/><rect x="130" y="120" width="40" height="40"/>
    <rect x="50" y="160" width="40" height="40"/><rect x="90" y="160" width="40" height="40"/><rect x="130" y="160" width="40" height="40"/>
  </g>
  <text x="95" y="245" text-anchor="middle" font-size="11" fill="#555">input f</text>
  <!-- arrow down to conv -->
  <path d="M200 130 L250 130" stroke="#888" stroke-width="2" fill="none" marker-end="url(#a1)"/>
  <defs><marker id="a1" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#888"/></marker></defs>
  <!-- output -->
  <g fill="#c8e6c9" stroke="#2f9e44" stroke-width="1.4">
    <rect x="270" y="100" width="35" height="35"/><rect x="305" y="100" width="35" height="35"/>
    <rect x="270" y="135" width="35" height="35"/><rect x="305" y="135" width="35" height="35" fill="#ffd43b"/>
  </g>
  <text x="300" y="245" text-anchor="middle" font-size="11" fill="#555">L(f): activation at (1,1)</text>
  <!-- shifted input -->
  <g fill="#c9d6ff" stroke="#3b5bdb" stroke-width="1.4">
    <rect x="410" y="80" width="40" height="40"/><rect x="450" y="80" width="40" height="40"/><rect x="490" y="80" width="40" height="40"/>
    <rect x="410" y="120" width="40" height="40"/><rect x="450" y="120" width="40" height="40"/><rect x="490" y="120" width="40" height="40" fill="#ffe0b2"/>
    <rect x="410" y="160" width="40" height="40"/><rect x="450" y="160" width="40" height="40"/><rect x="490" y="160" width="40" height="40"/>
  </g>
  <text x="450" y="245" text-anchor="middle" font-size="11" fill="#555">shifted T_x f</text>
  <path d="M540 130 L590 130" stroke="#888" stroke-width="2" fill="none" marker-end="url(#a1)"/>
  <g fill="#c8e6c9" stroke="#2f9e44" stroke-width="1.4">
    <rect x="610" y="100" width="35" height="35"/><rect x="645" y="100" width="35" height="35"/>
    <rect x="610" y="135" width="35" height="35" fill="#ffd43b"/><rect x="645" y="135" width="35" height="35"/>
  </g>
  <text x="627" y="245" text-anchor="middle" font-size="11" fill="#555">L(T_x f): peak shifted too</text>

  <!-- Invariance -->
  <line x1="40" y1="265" x2="640" y2="265" stroke="#ccc" stroke-width="1"/>
  <text x="40" y="290" font-size="13" fill="#e8590c" font-weight="600">Invariance:  L(T_x f) = L(f)</text>
  <g fill="#c8e6c9" stroke="#2f9e44" stroke-width="1.4">
    <rect x="80" y="305" width="35" height="35" fill="#ffd43b"/><rect x="125" y="305" width="35" height="35"/>
    <rect x="170" y="305" width="35" height="35" fill="#ffd43b"/>
  </g>
  <text x="150" y="368" text-anchor="middle" font-size="11" fill="#555">max-pool / global-pool collapses translation -> same label</text>
  <path d="M250 322 L300 322" stroke="#888" stroke-width="2" fill="none" marker-end="url(#a1)"/>
  <circle cx="330" cy="322" r="18" fill="#ffe0b2" stroke="#e8590c" stroke-width="2"/>
  <text x="330" y="326" font-size="10" text-anchor="middle" fill="#1a2238">cat</text>
</svg>
