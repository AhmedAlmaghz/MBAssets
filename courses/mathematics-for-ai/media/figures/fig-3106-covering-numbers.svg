<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380">
  <rect width="680" height="380" fill="#fbfbfd"/>
  <text x="340" y="26" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">Covering numbers: how many balls of radius eps are needed to cover H</text>

  <!-- big region -->
  <path d="M120,200 C120,120 220,80 340,90 C460,100 560,140 560,200 C560,270 450,320 340,315 C220,310 120,280 120,200 Z"
        fill="#eef4ff" stroke="#1f6feb" stroke-width="2"/>
  <text x="340" y="200" font-family="sans-serif" font-size="13" fill="#1f6feb" text-anchor="middle">H (function class)</text>

  <!-- covering balls -->
  <circle cx="200" cy="170" r="42" fill="#fff6d8" fill-opacity="0.75" stroke="#b8860b" stroke-width="1.6"/>
  <circle cx="300" cy="140" r="42" fill="#fff6d8" fill-opacity="0.75" stroke="#b8860b" stroke-width="1.6"/>
  <circle cx="400" cy="160" r="42" fill="#fff6d8" fill-opacity="0.75" stroke="#b8860b" stroke-width="1.6"/>
  <circle cx="480" cy="210" r="42" fill="#fff6d8" fill-opacity="0.75" stroke="#b8860b" stroke-width="1.6"/>
  <circle cx="250" cy="250" r="42" fill="#fff6d8" fill-opacity="0.75" stroke="#b8860b" stroke-width="1.6"/>
  <circle cx="370" cy="260" r="42" fill="#fff6d8" fill-opacity="0.75" stroke="#b8860b" stroke-width="1.6"/>
  <circle cx="460" cy="290" r="42" fill="#fff6d8" fill-opacity="0.75" stroke="#b8860b" stroke-width="1.6"/>

  <!-- centres -->
  <circle cx="200" cy="170" r="4" fill="#c00"/>
  <circle cx="300" cy="140" r="4" fill="#c00"/>
  <circle cx="400" cy="160" r="4" fill="#c00"/>
  <circle cx="480" cy="210" r="4" fill="#c00"/>
  <circle cx="250" cy="250" r="4" fill="#c00"/>
  <circle cx="370" cy="260" r="4" fill="#c00"/>
  <circle cx="460" cy="290" r="4" fill="#c00"/>

  <!-- eps radius marker -->
  <line x1="300" y1="140" x2="342" y2="140" stroke="#c00" stroke-width="1.6"/>
  <text x="312" y="132" font-family="sans-serif" font-size="11" fill="#c00">eps</text>

  <!-- texts -->
  <text x="60" y="340" font-family="sans-serif" font-size="12" fill="#333">N(eps, H, ||.||) = 7 here</text>
  <rect x="60" y="348" width="560" height="24" fill="#fff6d8" stroke="#b8860b" stroke-width="1"/>
  <text x="340" y="365" font-family="sans-serif" font-size="11" fill="#8a5a00" text-anchor="middle">d-dimensional ball: N(eps) &lt;= (3/eps)^d   =&gt;   metric entropy  ln N = d ln(3/eps)</text>
</svg>
