<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300" font-family="Segoe UI, Tahoma, Arial, sans-serif">
  <rect width="680" height="300" fill="#ffffff"/>
  <text x="340" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">الاستقراء الرياضي — قطع الدومينو</text>

  <!-- السلسلة -->
  <rect x="24" y="118" width="74" height="94" rx="4" fill="#bbf7d0" stroke="#166534" stroke-width="2"/>
  <rect x="132" y="118" width="74" height="94" rx="4" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
  <rect x="240" y="118" width="74" height="94" rx="4" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
  <rect x="348" y="118" width="74" height="94" rx="4" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
  <text x="386" y="172" text-anchor="middle" font-size="14" fill="#334155">. . .</text>
  <rect x="456" y="118" width="74" height="94" rx="4" fill="#fef08a" stroke="#a16207" stroke-width="2"/>
  <rect x="564" y="118" width="74" height="94" rx="4" fill="#fed7aa" stroke="#9a3412" stroke-width="2"/>

  <text x="61" y="170" text-anchor="middle" font-size="16" font-weight="bold" fill="#14532d">P(1)</text>
  <text x="169" y="170" text-anchor="middle" font-size="15" fill="#0f172a">P(2)</text>
  <text x="277" y="170" text-anchor="middle" font-size="15" fill="#0f172a">P(3)</text>
  <text x="493" y="170" text-anchor="middle" font-size="15" fill="#713f12">P(k)</text>
  <text x="601" y="170" text-anchor="middle" font-size="15" fill="#7c2d12">P(k+1)</text>

  <text x="61" y="98" text-anchor="middle" font-size="12" fill="#166534">الأساس ✓</text>
  <text x="601" y="98" text-anchor="middle" font-size="12" fill="#9a3412">الهدف</text>

  <!-- سهم الخطوة الاستقرائية -->
  <defs>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#a16207"/>
    </marker>
  </defs>
  <path d="M530 96 C 560 60, 592 60, 604 92" fill="none" stroke="#a16207" stroke-width="2" marker-end="url(#arw)"/>
  <text x="567" y="58" text-anchor="middle" font-size="12" fill="#a16207">P(k) ⟹ P(k+1)</text>

  <rect x="24" y="236" width="632" height="42" rx="4" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="340" y="262" text-anchor="middle" font-size="14" fill="#0f172a">[ P(1) صحيحة ] ∧ [ ∀k ≥ 1 : P(k) ⟹ P(k+1) ] ⟹ [ ∀n ≥ 1 : P(n) صحيحة ]</text>
  <text x="340" y="294" text-anchor="middle" font-size="11" fill="#475569">شكل (1.3): سقوط القطعة الأولى يُسقط السلسلة كلها</text>
</svg>
