<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420">
  <defs>
    <marker id="dnA" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#b03030"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="420" fill="#ffffff"/>

  <text x="380" y="30" text-anchor="middle" font-size="19" fill="#111111" font-family="Times New Roman, serif">Dual norm:  ||z||_* = sup { &#10216;z, x&#10217; : ||x|| &#8804; 1 }</text>
  <text x="380" y="54" text-anchor="middle" font-size="14" fill="#555555" font-family="Segoe UI, Tahoma, sans-serif">المستوى الداعم يمسّ كرة الوحدة في النقطة التي تُعظّم الإسقاط</text>

  <!-- ============ Panel 1 : L1 ball, dual = Linf ============ -->
  <line x1="60" y1="200" x2="340" y2="200" stroke="#cccccc" stroke-width="1"/>
  <line x1="200" y1="60" x2="200" y2="340" stroke="#cccccc" stroke-width="1"/>
  <polygon points="200,85 315,200 200,315 85,200" fill="#dbe6ff" stroke="#1b3a8a" stroke-width="2.5"/>

  <line x1="99" y1="9" x2="301" y2="161" stroke="#b03030" stroke-width="2.2"/>
  <text x="120" y="30" font-size="15" fill="#b03030" font-family="Times New Roman, serif">&#10216;z,x&#10217; = ||z||_*</text>

  <line x1="200" y1="200" x2="255" y2="126" stroke="#b03030" stroke-width="3" marker-end="url(#dnA)"/>
  <text x="262" y="140" font-size="17" fill="#b03030" font-family="Times New Roman, serif">z</text>

  <circle cx="200" cy="85" r="5" fill="#0f2a66"/>
  <text x="212" y="76" font-size="16" fill="#0f2a66" font-family="Times New Roman, serif">x*</text>

  <text x="200" y="358" text-anchor="middle" font-size="14" fill="#333333" font-family="Segoe UI, Tahoma, sans-serif">كرة L₁ ⟹ الناظم الثنوي هو L∞</text>
  <text x="200" y="380" text-anchor="middle" font-size="15" fill="#111111" font-family="Times New Roman, serif">z = (0.6, 0.8) :  ||z||_&#8734; = 0.8</text>

  <!-- ============ Panel 2 : L2 ball, self dual ============ -->
  <line x1="420" y1="200" x2="700" y2="200" stroke="#cccccc" stroke-width="1"/>
  <line x1="560" y1="60" x2="560" y2="340" stroke="#cccccc" stroke-width="1"/>
  <circle cx="560" cy="200" r="115" fill="#dbe6ff" stroke="#1b3a8a" stroke-width="2.5"/>

  <line x1="519" y1="25" x2="739" y2="191" stroke="#b03030" stroke-width="2.2"/>
  <text x="600" y="46" font-size="15" fill="#b03030" font-family="Times New Roman, serif">&#10216;z,x*&#10217; = ||z||₂</text>

  <line x1="560" y1="200" x2="629" y2="108" stroke="#b03030" stroke-width="3" marker-end="url(#dnA)"/>
  <text x="640" y="122" font-size="17" fill="#b03030" font-family="Times New Roman, serif">z</text>

  <circle cx="629" cy="108" r="5" fill="#0f2a66"/>
  <text x="640" y="98" font-size="16" fill="#0f2a66" font-family="Times New Roman, serif">x* = z/||z||₂</text>

  <text x="560" y="358" text-anchor="middle" font-size="14" fill="#333333" font-family="Segoe UI, Tahoma, sans-serif">كرة L₂ ⟹ ثنويتها نفسها (self-dual)</text>
  <text x="560" y="380" text-anchor="middle" font-size="15" fill="#111111" font-family="Times New Roman, serif">||z||₂ = 1 :  sup = 1</text>

  <line x1="40" y1="398" x2="720" y2="398" stroke="#999999" stroke-width="1"/>
  <text x="380" y="417" text-anchor="middle" font-size="16" fill="#111111" font-family="Times New Roman, serif">(||&#183;||_p)* = ||&#183;||_q ,  1/p + 1/q = 1 ;&#160;&#160; (||&#183;||_*)* = ||&#183;|| ;&#160;&#160; &#10216;z,x&#10217; &#8804; ||z||_*&#183;||x||</text>
</svg>
