<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360">
  <rect width="680" height="360" fill="#fbfbfd"/>
  <line x1="40" y1="320" x2="640" y2="320" stroke="#222" stroke-width="2"/>
  <line x1="40" y1="40" x2="40" y2="320" stroke="#222" stroke-width="2"/>
  <path d="M40,320 C160,320 280,60 340,55 C400,60 520,320 640,320" fill="none" stroke="#1f6feb" stroke-width="2.5"/>
  <circle cx="340" cy="55" r="6" fill="#c00"/>
  <line x1="340" y1="55" x2="340" y2="320" stroke="#c00" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="340" y="42" font-family="sans-serif" font-size="13" fill="#c00" text-anchor="middle">H = 1 bit at p = 0.5</text>
  <text x="340" y="345" font-family="sans-serif" font-size="12" fill="#555" text-anchor="middle">p (Bernoulli)</text>
  <text x="90" y="60" font-family="sans-serif" font-size="12" fill="#555" text-anchor="middle">H</text>
  <text x="560" y="250" font-family="sans-serif" font-size="12" fill="#1f6feb" text-anchor="middle">H = -p log p - (1-p) log(1-p)</text>
</svg>
