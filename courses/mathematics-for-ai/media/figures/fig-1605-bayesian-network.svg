<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="Latin Modern, serif">
  <rect width="680" height="320" fill="#fafafa"/>
  <text x="340" y="26" text-anchor="middle" font-size="16" fill="#222">Bayesian Network (DAG)</text>

  <defs>
    <marker id="a3" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#222"/>
    </marker>
  </defs>

  <circle cx="200" cy="90" r="30" fill="#fff" stroke="#2a6f97" stroke-width="2"/>
  <text x="200" y="95" text-anchor="middle" font-size="12" fill="#222">Rain</text>
  <circle cx="200" cy="200" r="30" fill="#fff" stroke="#2a6f97" stroke-width="2"/>
  <text x="200" y="205" text-anchor="middle" font-size="12" fill="#222">Sprinkler</text>
  <circle cx="430" cy="145" r="34" fill="#fff" stroke="#e07a1f" stroke-width="2"/>
  <text x="430" y="150" text-anchor="middle" font-size="12" fill="#222">WetGrass</text>

  <line x1="222" y1="105" x2="408" y2="128" stroke="#222" stroke-width="2" marker-end="url(#a3)"/>
  <line x1="222" y1="188" x2="408" y2="160" stroke="#222" stroke-width="2" marker-end="url(#a3)"/>

  <text x="300" y="250" font-size="12" fill="#555">Joint = P(Rain)P(Sprinkler)P(WetGrass|Rain,Sprinkler)</text>
  <text x="300" y="272" font-size="12" fill="#555">d-separation: Rain _|_ Sprinkler given WetGrass (explaining away).</text>
</svg>
