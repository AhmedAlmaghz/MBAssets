<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="380" fill="#fbfbfd"/>
  <text x="340" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2238">Vanishing &amp; exploding gradients through time</text>

  <!-- axes -->
  <line x1="70" y1="320" x2="620" y2="320" stroke="#555" stroke-width="1.5"/>
  <line x1="70" y1="40" x2="70" y2="320" stroke="#555" stroke-width="1.5"/>
  <text x="340" y="350" text-anchor="middle" font-size="12" fill="#555">time step t</text>
  <text x="40" y="180" text-anchor="middle" font-size="12" fill="#555" transform="rotate(-90 40 180)">|| dh_t/dh_1 ||</text>

  <!-- vanishing curve (decaying) -->
  <path d="M90 120 q120 -40 250 130 q120 90 230 70" fill="none" stroke="#e8590c" stroke-width="2.6"/>
  <text x="300" y="120" font-size="12" fill="#e8590c">vanishing (|lambda_max| &lt; 1)</text>

  <!-- exploding curve (growing) -->
  <path d="M90 300 q150 10 230 -180 q60 -90 200 -70" fill="none" stroke="#c92a2a" stroke-width="2.6"/>
  <text x="430" y="120" font-size="12" fill="#c92a2a">exploding (|lambda_max| &gt; 1)</text>

  <!-- unit line -->
  <line x1="70" y1="200" x2="620" y2="200" stroke="#999" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="520" y="195" font-size="11" fill="#999">norm = 1</text>

  <text x="340" y="368" text-anchor="middle" font-size="12.5" fill="#555">Condition for stable memory: spectral radius rho(W_h) = 1; LSTM/GRU/gating fix vanishing.</text>
</svg>
