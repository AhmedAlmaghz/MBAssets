<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="680" height="380" font-family="Tajawal, Noto Naskh Arabic, sans-serif">
  <rect width="680" height="380" fill="#ffffff"/>
  <text x="664" y="26" text-anchor="end" font-size="15" fill="#1f4e6b" font-weight="700">الضغط العصبي: من الترميز اليدوي إلى التعلّم</text>
  <text x="664" y="44" text-anchor="end" font-size="11" fill="#5a6770">Learned compression pipeline</text>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6770"/></marker></defs>
  <rect x="40" y="150" width="130" height="56" rx="7" fill="#f2f7fa" stroke="#1f4e6b" stroke-width="1.5"/>
  <text x="105" y="176" text-anchor="middle" font-size="12.5" fill="#1c2b36" font-weight="700">x</text>
  <text x="105" y="192" text-anchor="middle" font-size="10" fill="#5a6770">الإشارة/الصورة</text>
  <line x1="170" y1="178" x2="220" y2="178" stroke="#5a6770" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="220" y="150" width="150" height="56" rx="7" fill="#f2f7fa" stroke="#1f4e6b" stroke-width="1.5"/>
  <text x="295" y="176" text-anchor="middle" font-size="12.5" fill="#1c2b36" font-weight="700">مُرمِّز عصبي</text>
  <text x="295" y="192" text-anchor="middle" font-size="10" fill="#5a6770">تحليل + تحويل</text>
  <line x1="370" y1="178" x2="420" y2="178" stroke="#5a6770" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="420" y="150" width="120" height="56" rx="7" fill="#f2f7fa" stroke="#b5473a" stroke-width="1.5"/>
  <text x="480" y="176" text-anchor="middle" font-size="12.5" fill="#1c2b36" font-weight="700">تكميم</text>
  <text x="480" y="192" text-anchor="middle" font-size="10" fill="#5a6770">فقدان محسوب</text>
  <line x1="540" y1="178" x2="580" y2="178" stroke="#5a6770" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="580" y="150" width="60" height="56" rx="7" fill="#f2f7fa" stroke="#7a9e3c" stroke-width="1.5"/>
  <text x="610" y="176" text-anchor="middle" font-size="12.5" fill="#1c2b36" font-weight="700">إنتروبيا</text>
  <text x="610" y="192" text-anchor="middle" font-size="10" fill="#5a6770">ترميز</text>
  <text x="340" y="250" font-size="10.5" fill="#5a6770" direction="rtl">الخسارة<tspan direction="ltr" unicode-bidi="isolate">: D + λ R — </tspan>مفاضلة التشويه مقابل معدّل البِتّات<tspan direction="ltr" unicode-bidi="isolate"> ( rate–distortion ).</tspan></text>
  <text x="340" y="272" font-size="10.5" fill="#5a6770" direction="rtl">الربط بنظرية المعلومات (الجزء الخامس): معدّل البِتّات ≈ الإنتروبيا المرمّزة.</text>
</svg>