<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="380" fill="#fbfbfd"/>
  <text x="340" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2238">LSTM cell: gates and cell state</text>

  <!-- cell state horizontal line -->
  <line x1="120" y1="110" x2="560" y2="110" stroke="#3b5bdb" stroke-width="3"/>
  <text x="110" y="100" font-size="11" fill="#3b5bdb">C_{t-1}</text>
  <text x="565" y="100" font-size="11" fill="#3b5bdb">C_t</text>

  <!-- forget gate -->
  <rect x="180" y="160" width="90" height="40" rx="6" fill="#ffe0b2" stroke="#e8590c" stroke-width="2"/>
  <text x="225" y="185" text-anchor="middle" font-size="12" fill="#1a2238">f_t = s(W_f[h,x]+b_f)</text>
  <line x1="225" y1="160" x2="225" y2="125" stroke="#e8590c" stroke-width="2" marker-end="url(#l1)"/>
  <defs><marker id="l1" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#e8590c"/></marker></defs>

  <!-- input gate -->
  <rect x="300" y="160" width="90" height="40" rx="6" fill="#ffe0b2" stroke="#e8590c" stroke-width="2"/>
  <text x="345" y="185" text-anchor="middle" font-size="12" fill="#1a2238">i_t, g_t</text>
  <line x1="345" y1="160" x2="345" y2="125" stroke="#e8590c" stroke-width="2" marker-end="url(#l1)"/>

  <!-- output gate -->
  <rect x="420" y="160" width="90" height="40" rx="6" fill="#ffe0b2" stroke="#e8590c" stroke-width="2"/>
  <text x="465" y="185" text-anchor="middle" font-size="12" fill="#1a2238">o_t = s(W_o[h,x]+b_o)</text>
  <line x1="465" y1="160" x2="465" y2="125" stroke="#e8590c" stroke-width="2" marker-end="url(#l1)"/>

  <text x="340" y="245" text-anchor="middle" font-size="13" fill="#1a2238">C_t = f_t * C_{t-1} + i_t * g_t</text>
  <text x="340" y="275" text-anchor="middle" font-size="13" fill="#1a2238">h_t = o_t * tanh(C_t)</text>

  <text x="340" y="350" text-anchor="middle" font-size="12.5" fill="#555">Additive cell state C_t gives a near-constant error carousel -> no vanishing.</text>
</svg>
