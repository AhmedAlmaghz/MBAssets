<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="680" height="380" font-family="Tajawal, Noto Naskh Arabic, sans-serif">
  <rect width="680" height="380" fill="#ffffff"/>
  <text x="664" y="26" text-anchor="end" font-size="15" fill="#1f4e6b" font-weight="700">من الدالة إلى معاملات فورييه وإلى التركيب</text>
  <text x="664" y="44" text-anchor="end" font-size="11" fill="#5a6770">Fourier coefficients: analysis &amp; synthesis</text>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6770"/></marker></defs>
  <rect x="40" y="150" width="160" height="60" rx="7" fill="#f2f7fa" stroke="#1f4e6b" stroke-width="1.5"/>
  <text x="120" y="178" text-anchor="middle" font-size="12.5" fill="#1c2b36" font-weight="700">f(x)</text>
  <text x="120" y="194" text-anchor="middle" font-size="10" fill="#5a6770">الدالة الدوريّة</text>
  <line x1="200" y1="180" x2="260" y2="180" stroke="#5a6770" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="260" y="150" width="170" height="60" rx="7" fill="#f2f7fa" stroke="#1f4e6b" stroke-width="1.5"/>
  <text x="345" y="178" text-anchor="middle" font-size="12.5" fill="#1c2b36" font-weight="700">a_n, b_n</text>
  <text x="345" y="194" text-anchor="middle" font-size="10" fill="#5a6770">إسقاطات على القاعدة</text>
  <line x1="430" y1="180" x2="490" y2="180" stroke="#5a6770" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="490" y="150" width="150" height="60" rx="7" fill="#f2f7fa" stroke="#7a9e3c" stroke-width="1.5"/>
  <text x="565" y="178" text-anchor="middle" font-size="12.5" fill="#1c2b36" font-weight="700"><tspan direction="ltr" unicode-bidi="isolate">Σ a<tspan dy="3.75" font-size="70%">n</tspan><tspan dy="-3.75" font-size="1">&#8203;</tspan> cos nx+b<tspan dy="3.75" font-size="70%">n</tspan><tspan dy="-3.75" font-size="1">&#8203;</tspan> sin nx</tspan></text>
  <text x="565" y="194" text-anchor="middle" font-size="10" fill="#5a6770">إعادة التركيب</text>
  <text x="340" y="300" font-size="10.5" fill="#5a6770" direction="rtl"><tspan direction="ltr" unicode-bidi="isolate">a<tspan dy="3.15" font-size="70%">n</tspan><tspan dy="-3.15" font-size="1">&#8203;</tspan> = (1/π)∫ f cos nx,  b<tspan dy="3.15" font-size="70%">n</tspan><tspan dy="-3.15" font-size="1">&#8203;</tspan> = (1/π)∫ f sin nx — </tspan>إسقاطات عمودية<tspan direction="ltr" unicode-bidi="isolate"> (</tspan>نظرية<tspan direction="ltr" unicode-bidi="isolate"> 49.8).</tspan></text>
  <text x="340" y="322" font-size="10.5" fill="#5a6770" direction="rtl">التحليل = إسقاط؛ التركيب = جمع المكوّنات — تماماً كما في PCA بالقاعدة المثلثية.</text>
</svg>