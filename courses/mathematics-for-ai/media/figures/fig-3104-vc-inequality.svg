<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380">
  <rect width="680" height="380" fill="#fbfbfd"/>
  <text x="340" y="26" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">VC inequality: generalisation gap shrinks like sqrt(d / n) up to logs</text>

  <line x1="70" y1="320" x2="640" y2="320" stroke="#222" stroke-width="2"/>
  <line x1="70" y1="50" x2="70" y2="320" stroke="#222" stroke-width="2"/>
  <text x="355" y="352" font-family="sans-serif" font-size="12" fill="#555" text-anchor="middle">n (sample size)</text>
  <text x="26" y="180" font-family="sans-serif" font-size="12" fill="#555">gap</text>

  <!-- d = 1 -->
  <path d="M90,110 C180,150 280,215 620,290" fill="none" stroke="#1f6feb" stroke-width="2.2"/>
  <text x="560" y="300" font-family="sans-serif" font-size="11" fill="#1f6feb">d = 1</text>

  <!-- d = 10 -->
  <path d="M90,80 C180,125 280,195 620,270" fill="none" stroke="#2a7a2a" stroke-width="2.2"/>
  <text x="560" y="280" font-family="sans-serif" font-size="11" fill="#2a7a2a">d = 10</text>

  <!-- d = 100 -->
  <path d="M90,58 C180,105 280,175 620,250" fill="none" stroke="#c00" stroke-width="2.2"/>
  <text x="560" y="260" font-family="sans-serif" font-size="11" fill="#c00">d = 100</text>

  <!-- vacuity line at 1 -->
  <line x1="70" y1="130" x2="640" y2="130" stroke="#888" stroke-width="1.6" stroke-dasharray="6,4"/>
  <text x="90" y="124" font-family="sans-serif" font-size="11" fill="#666">gap = 1 : the bound is vacuous</text>

  <!-- annotation box -->
  <rect x="90" y="150" width="330" height="62" fill="#eef4ff" stroke="#1f6feb" stroke-width="1.2"/>
  <text x="255" y="172" font-family="sans-serif" font-size="11" fill="#1f6feb" text-anchor="middle">R(h) &lt;= R_hat(h) + sqrt( (8/n)( d ln(2en/d) + ln(4/delta) ) )</text>
  <text x="255" y="190" font-family="sans-serif" font-size="11" fill="#1f6feb" text-anchor="middle">sample complexity:  n = O( d / eps^2 )</text>
  <text x="255" y="206" font-family="sans-serif" font-size="10" fill="#555" text-anchor="middle">linear in VC dimension -- the central quantitative law</text>
</svg>
