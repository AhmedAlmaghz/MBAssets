<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380">
  <rect width="680" height="380" fill="#fbfbfd"/>

  <text x="340" y="26" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">k-fold cross-validation (k = 5)</text>

  <!-- top: whole dataset -->
  <rect x="60" y="60" width="560" height="34" fill="#eef4ff" stroke="#1f6feb" stroke-width="1.6"/>
  <text x="340" y="82" font-family="sans-serif" font-size="12" fill="#1f6feb" text-anchor="middle">full data set S (n examples)</text>

  <!-- folds -->
  <g font-family="sans-serif" font-size="11">
    <!-- fold 1 -->
    <rect x="60" y="120" width="112" height="30" fill="#ffd9d9" stroke="#c00" stroke-width="1.6"/>
    <text x="116" y="140" fill="#c00" text-anchor="middle">test</text>
    <rect x="172" y="120" width="112" height="30" fill="#e8f5e8" stroke="#2a7a2a" stroke-width="1.2"/>
    <text x="228" y="140" fill="#2a7a2a" text-anchor="middle">train</text>
    <rect x="284" y="120" width="112" height="30" fill="#e8f5e8" stroke="#2a7a2a" stroke-width="1.2"/>
    <rect x="396" y="120" width="112" height="30" fill="#e8f5e8" stroke="#2a7a2a" stroke-width="1.2"/>
    <rect x="508" y="120" width="112" height="30" fill="#e8f5e8" stroke="#2a7a2a" stroke-width="1.2"/>
    <text x="116" y="166" fill="#333" text-anchor="middle">fold 1</text>

    <!-- fold 2 -->
    <rect x="60" y="180" width="112" height="30" fill="#e8f5e8" stroke="#2a7a2a" stroke-width="1.2"/>
    <rect x="172" y="180" width="112" height="30" fill="#ffd9d9" stroke="#c00" stroke-width="1.6"/>
    <text x="228" y="200" fill="#c00" text-anchor="middle">test</text>
    <rect x="284" y="180" width="112" height="30" fill="#e8f5e8" stroke="#2a7a2a" stroke-width="1.2"/>
    <rect x="396" y="180" width="112" height="30" fill="#e8f5e8" stroke="#2a7a2a" stroke-width="1.2"/>
    <rect x="508" y="180" width="112" height="30" fill="#e8f5e8" stroke="#2a7a2a" stroke-width="1.2"/>
    <text x="116" y="226" fill="#333" text-anchor="middle">fold 2</text>

    <!-- fold 3 -->
    <rect x="60" y="240" width="112" height="30" fill="#e8f5e8" stroke="#2a7a2a" stroke-width="1.2"/>
    <rect x="172" y="240" width="112" height="30" fill="#e8f5e8" stroke="#2a7a2a" stroke-width="1.2"/>
    <rect x="284" y="240" width="112" height="30" fill="#ffd9d9" stroke="#c00" stroke-width="1.6"/>
    <text x="340" y="260" fill="#c00" text-anchor="middle">test</text>
    <rect x="396" y="240" width="112" height="30" fill="#e8f5e8" stroke="#2a7a2a" stroke-width="1.2"/>
    <rect x="508" y="240" width="112" height="30" fill="#e8f5e8" stroke="#2a7a2a" stroke-width="1.2"/>
    <text x="116" y="286" fill="#333" text-anchor="middle">fold 3</text>
  </g>

  <text x="340" y="310" font-family="sans-serif" font-size="12" fill="#555" text-anchor="middle">... folds 4 and 5 ...</text>

  <rect x="110" y="326" width="460" height="34" fill="#fff6d8" stroke="#b8860b" stroke-width="1.2"/>
  <text x="340" y="348" font-family="sans-serif" font-size="12" fill="#8a5a00" text-anchor="middle">CV estimate = (1/k) sum_k error on held-out fold  (each example is tested once)</text>
</svg>
