<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="680" height="320" font-family="Segoe UI, Tahoma, Arial, sans-serif">
  <rect width="680" height="320" fill="#ffffff"/>
  <text x="340" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">خوارزمية غرام–شميدت: من أساسٍ مائل إلى أساسٍ متعامدٍ معياري</text>

  <defs>
    <marker id="d201" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#1d4ed8"/>
    </marker>
    <marker id="d202" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/>
    </marker>
    <marker id="d203" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#b91c1c"/>
    </marker>
    <marker id="d204" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- قبل -->
  <text x="160" y="56" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">قبل: v₁, v₂ مائلان</text>
  <line x1="60" y1="240" x2="240" y2="240" stroke="#1d4ed8" stroke-width="3" marker-end="url(#d201)"/>
  <line x1="60" y1="240" x2="180" y2="110" stroke="#94a3b8" stroke-width="3" marker-end="url(#d202)"/>
  <text x="248" y="244" font-size="14" font-weight="bold" fill="#1d4ed8">v₁</text>
  <text x="188" y="100" font-size="14" font-weight="bold" fill="#475569">v₂</text>
  <text x="60" y="262" font-size="12" fill="#475569">0</text>
  <path d="M90 240 A 30 30 0 0 0 100 216" fill="none" stroke="#a16207" stroke-width="2"/>
  <text x="110" y="228" font-size="12" fill="#a16207">θ</text>

  <!-- سهم التحول -->
  <text x="340" y="150" text-anchor="middle" font-size="30" fill="#0f172a">⟹</text>
  <text x="340" y="180" text-anchor="middle" font-size="12" fill="#475569">u₁ = v₁ ; u₂ = v₂ − proj_{u₁}(v₂)</text>

  <!-- بعد -->
  <text x="520" y="56" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">بعد: u₁ ⟂ u₂، ‖uᵢ‖ = 1</text>
  <line x1="420" y1="240" x2="600" y2="240" stroke="#1d4ed8" stroke-width="3" marker-end="url(#d201)"/>
  <line x1="420" y1="240" x2="420" y2="100" stroke="#16a34a" stroke-width="3" marker-end="url(#d204)"/>
  <text x="608" y="244" font-size="14" font-weight="bold" fill="#1d4ed8">u₁</text>
  <text x="424" y="90" font-size="14" font-weight="bold" fill="#16a34a">u₂</text>
  <text x="420" y="262" font-size="12" fill="#475569">0</text>
  <rect x="424" y="212" width="20" height="20" fill="none" stroke="#16a34a" stroke-width="2"/>

  <!-- الإسقاط المطروح -->
  <line x1="420" y1="180" x2="560" y2="180" stroke="#b91c1c" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="490" y="172" text-anchor="middle" font-size="11" fill="#b91c1c">proj مطروح</text>

  <rect x="40" y="280" width="600" height="28" rx="4" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="340" y="299" text-anchor="middle" font-size="13" fill="#0f172a">Q = [u₁ u₂ … u_k] ⟹ QᵀQ = I  ⟹  A = QR</text>
</svg>
