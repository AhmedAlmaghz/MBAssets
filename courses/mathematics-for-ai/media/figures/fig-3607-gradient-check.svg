<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380">
  <rect width="680" height="380" fill="#fbfbfd"/>
  <text x="20" y="28" font-family="sans-serif" font-size="13" fill="#1f6feb" font-weight="bold">Gradient check: symmetric finite difference</text>

  <!-- axes -->
  <line x1="80" y1="330" x2="620" y2="330" stroke="#999" stroke-width="1"/>
  <line x1="120" y1="330" x2="120" y2="70" stroke="#999" stroke-width="1"/>
  <text x="630" y="334" font-family="sans-serif" font-size="11" fill="#555">x</text>

  <!-- curve -->
  <path d="M120,320 Q260,120 470,90 T620,80" fill="none" stroke="#1f6feb" stroke-width="2.5"/>
  <text x="430" y="80" font-family="sans-serif" font-size="11" fill="#1f6feb">f(x)</text>

  <!-- secant at x -->
  <line x1="240" y1="240" x2="360" y2="160" stroke="#c00" stroke-width="2" stroke-dasharray="5,4"/>
  <circle cx="240" cy="240" r="4" fill="#c00"/>
  <circle cx="360" cy="160" r="4" fill="#c00"/>
  <text x="300" y="150" font-family="sans-serif" font-size="11" fill="#c00" text-anchor="middle">slope = (f(x+h)-f(x-h))/2h</text>

  <!-- x markers -->
  <line x1="240" y1="330" x2="240" y2="240" stroke="#999" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="360" y1="330" x2="360" y2="160" stroke="#999" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="240" y="350" font-family="sans-serif" font-size="11" fill="#555" text-anchor="middle">x-h</text>
  <text x="360" y="350" font-family="sans-serif" font-size="11" fill="#555" text-anchor="middle">x+h</text>

  <text x="20" y="370" font-family="sans-serif" font-size="10" fill="#555">Secant slope approximates f'(x); compare against automatic differentiation gradient</text>
</svg>
