<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360">
  <defs>
  <marker id="c" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
    <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
  </marker>
</defs>
<rect width="680" height="360" fill="#fbfbfd"/>
  <line x1="40" y1="320" x2="640" y2="320" stroke="#222" stroke-width="2"/>
  <line x1="40" y1="40" x2="40" y2="320" stroke="#222" stroke-width="2"/>
  <path d="M40,300 C200,300 260,80 340,70 C420,80 480,300 640,300" fill="none" stroke="#1f6feb" stroke-width="2.5"/>
  <text x="340" y="55" font-family="sans-serif" font-size="13" fill="#1f6feb" text-anchor="middle">steep in one coordinate, flat in another</text>
  <line x1="150" y1="250" x2="150" y2="200" stroke="#c00" stroke-width="3" marker-end="url(#c)"/>
  <text x="110" y="270" font-family="sans-serif" font-size="11" fill="#c00" text-anchor="middle">small step</text>
  <line x1="530" y1="250" x2="530" y2="150" stroke="#2da44e" stroke-width="3" marker-end="url(#c)"/>
  <text x="570" y="270" font-family="sans-serif" font-size="11" fill="#2da44e" text-anchor="middle">large step</text>
  <text x="340" y="352" font-family="sans-serif" font-size="12" fill="#555" text-anchor="middle">per-coordinate step: eta / sqrt(G_k + eps)</text>
</svg>
