<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="Georgia, 'Times New Roman', serif">
  <rect width="680" height="300" fill="#fafaf7"/>

  <text x="340" y="26" font-size="14" fill="#334155" text-anchor="middle" font-weight="bold">مبرهنة الحدّ المرافق: |fₙ| ≤ g</text>

  <!-- axes -->
  <line x1="50" y1="250" x2="630" y2="250" stroke="#334155" stroke-width="1.4"/>
  <line x1="50" y1="40"  x2="50"  y2="250" stroke="#334155" stroke-width="1.4"/>

  <!-- dominating g (band) -->
  <path d="M50,120 C200,90 420,150 630,110" fill="none" stroke="#9d174d" stroke-width="2"/>
  <path d="M50,180 C200,150 420,210 630,170" fill="none" stroke="#9d174d" stroke-width="2"/>
  <path d="M50,180 C200,150 420,210 630,170 L630,110 C420,150 200,90 50,120 Z" fill="#fce7f3" opacity="0.5"/>
  <text x="600" y="100" font-size="12" fill="#9d174d" font-style="italic">+g</text>
  <text x="600" y="200" font-size="12" fill="#9d174d" font-style="italic">−g</text>

  <!-- limit f -->
  <path d="M50,150 C200,130 420,160 630,140" fill="none" stroke="#0f766e" stroke-width="2.4"/>
  <text x="600" y="135" font-size="13" fill="#0f766e" font-style="italic">f (الحدّ)</text>

  <!-- fn sequence inside band -->
  <g fill="none" stroke="#b45309" stroke-width="1.3" opacity="0.9">
    <path d="M50,155 C170,140 300,175 420,150 C520,130 580,160 630,142"/>
    <path d="M50,145 C170,160 300,128 420,158 C520,150 580,135 630,144"/>
    <path d="M50,158 C170,135 300,165 420,140 C520,145 580,152 630,141"/>
  </g>
  <text x="200" y="270" font-size="12" fill="#b45309" text-anchor="middle">fₙ (تتقارب داخل الشريط)</text>

  <text x="340" y="290" font-size="12.5" fill="#334155" text-anchor="middle" font-style="italic">∫ fₙ → ∫ f  مهما كان ∫g منتهٍ</text>
</svg>
