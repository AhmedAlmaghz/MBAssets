<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="Latin Modern, serif">
  <rect width="680" height="320" fill="#fafafa"/>
  <text x="340" y="26" text-anchor="middle" font-size="16" fill="#222">Positive Semidefinite: x^T A x &gt;= 0</text>

  <!-- axes -->
  <line x1="120" y1="260" x2="560" y2="260" stroke="#222"/>
  <line x1="340" y1="60" x2="340" y2="290" stroke="#222"/>
  <text x="545" y="275" font-size="11" fill="#222">x1</text>
  <text x="350" y="70" font-size="11" fill="#222">x2</text>

  <!-- ellipse level set x^T A x = 1 -->
  <ellipse cx="340" cy="200" rx="150" ry="80" fill="none" stroke="#2a6f97" stroke-width="2.5"/>
  <ellipse cx="340" cy="200" rx="90" ry="48" fill="none" stroke="#2a6f97" stroke-width="1" opacity="0.6"/>
  <!-- eigenvectors -->
  <line x1="190" y1="200" x2="490" y2="200" stroke="#e07a1f" stroke-width="2"/>
  <line x1="340" y1="120" x2="340" y2="280" stroke="#3a923a" stroke-width="2"/>

  <text x="500" y="205" font-size="11" fill="#e07a1f">v1 (lambda1&gt;0)</text>
  <text x="350" y="115" font-size="11" fill="#3a923a">v2 (lambda2&gt;0)</text>

  <!-- sample vector and projection -->
  <line x1="340" y1="200" x2="420" y2="160" stroke="#b5333a" stroke-width="2"/>
  <text x="425" y="155" font-size="11" fill="#b5333a">x</text>

  <text x="340" y="320" text-anchor="middle" font-size="12" fill="#555">If all eigenvalues &gt;= 0, x^T A x &gt;= 0 for every x (ellipse opens outward).</text>
</svg>
