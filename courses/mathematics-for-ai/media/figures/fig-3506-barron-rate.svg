<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380">
  <rect width="680" height="380" fill="#fbfbfd"/>
  <text x="20" y="28" font-family="sans-serif" font-size="13" fill="#1f6feb" font-weight="bold">Barron approximation rate: error vs width m</text>

  <!-- axes (log-log) -->
  <line x1="90" y1="330" x2="630" y2="330" stroke="#999" stroke-width="1"/>
  <line x1="90" y1="330" x2="90" y2="70" stroke="#999" stroke-width="1"/>
  <text x="640" y="334" font-family="sans-serif" font-size="11" fill="#555">m</text>
  <text x="70" y="62" font-family="sans-serif" font-size="11" fill="#555">error</text>

  <!-- O(1/sqrt(m)): slope -1/2. points: m=10,err=0.32 ; m=100,0.10 ; m=1000,0.032 -->
  <polyline points="130,296 250,330 370,330 490,330 610,330" fill="none" stroke="#2a7a2a" stroke-width="0"/>
  <!-- compute px: m in [10,1000] log scale -> px=130 + (log10(m)-1)/2 *480 ; py: err [0.01,0.5] log -> py=330-(log10(1/err)+2)/2.7*260 -->
  <!-- approximate visual line for 1/sqrt(m): (10,0.316)->(130,300); (100,0.1)->(370,180); (1000,0.0316)->(610,95) -->
  <polyline points="130,300 250,240 370,180 490,138 610,95"
            fill="none" stroke="#2a7a2a" stroke-width="2.5"/>
  <text x="300" y="150" font-family="sans-serif" font-size="11" fill="#2a7a2a">O(1/sqrt(m))</text>

  <!-- O(1/m) steeper -->
  <polyline points="130,330 250,330 370,150 490,108 610,80"
            fill="none" stroke="#1f6feb" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="430" y="130" font-family="sans-serif" font-size="11" fill="#1f6feb">O(1/m) (deeper)</text>

  <text x="20" y="370" font-family="sans-serif" font-size="10" fill="#555">Barron: rate independent of dimension d; B_2(f)/sqrt(m) bound</text>
</svg>
