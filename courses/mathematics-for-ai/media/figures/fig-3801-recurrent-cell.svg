<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="380" fill="#fbfbfd"/>
  <text x="340" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2238">Recurrent cell and its unrolled form</text>

  <!-- folded cell -->
  <text x="60" y="62" font-size="13" fill="#3b5bdb" font-weight="600">Folded RNN</text>
  <circle cx="130" cy="120" r="34" fill="#c9d6ff" stroke="#3b5bdb" stroke-width="2"/>
  <text x="130" y="124" text-anchor="middle" font-size="12" fill="#1a2238">RNN</text>
  <path d="M96 105 A34 34 0 0 0 96 135" fill="none" stroke="#e8590c" stroke-width="2.2" marker-end="url(#r1)"/>
  <defs><marker id="r1" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#e8590c"/></marker></defs>
  <text x="60" y="100" font-size="11" fill="#e8590c">h_{t-1}</text>
  <text x="150" y="100" font-size="11" fill="#2f9e44">x_t</text>
  <line x1="150" y1="120" x2="164" y2="120" stroke="#2f9e44" stroke-width="2" marker-end="url(#g1)"/>
  <defs><marker id="g1" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#2f9e44"/></marker></defs>
  <text x="120" y="200" text-anchor="middle" font-size="11" fill="#1a2238">h_t = tanh(W_h h_{t-1} + W_x x_t + b)</text>

  <!-- unrolled -->
  <text x="430" y="62" font-size="13" fill="#3b5bdb" font-weight="600">Unrolled through time</text>
  <g>
    <circle cx="380" cy="130" r="26" fill="#c9d6ff" stroke="#3b5bdb" stroke-width="2"/>
    <circle cx="480" cy="130" r="26" fill="#c9d6ff" stroke="#3b5bdb" stroke-width="2"/>
    <circle cx="580" cy="130" r="26" fill="#c9d6ff" stroke="#3b5bdb" stroke-width="2"/>
    <text x="380" y="134" text-anchor="middle" font-size="11" fill="#1a2238">t-1</text>
    <text x="480" y="134" text-anchor="middle" font-size="11" fill="#1a2238">t</text>
    <text x="580" y="134" text-anchor="middle" font-size="11" fill="#1a2238">t+1</text>
    <line x1="406" y1="130" x2="454" y2="130" stroke="#e8590c" stroke-width="2.4" marker-end="url(#r1)"/>
    <line x1="506" y1="130" x2="554" y2="130" stroke="#e8590c" stroke-width="2.4" marker-end="url(#r1)"/>
    <text x="380" y="185" text-anchor="middle" font-size="11" fill="#2f9e44">x_{t-1}</text>
    <text x="480" y="185" text-anchor="middle" font-size="11" fill="#2f9e44">x_t</text>
    <text x="580" y="185" text-anchor="middle" font-size="11" fill="#2f9e44">x_{t+1}</text>
    <line x1="380" y1="156" x2="380" y2="180" stroke="#2f9e44" stroke-width="2" marker-end="url(#g1)"/>
    <line x1="480" y1="156" x2="480" y2="180" stroke="#2f9e44" stroke-width="2" marker-end="url(#g1)"/>
    <line x1="580" y1="156" x2="580" y2="180" stroke="#2f9e44" stroke-width="2" marker-end="url(#g1)"/>
  </g>

  <text x="340" y="350" text-anchor="middle" font-size="12.5" fill="#555">Same weights W_h, W_x, b shared across every time step (weight sharing in time).</text>
</svg>
