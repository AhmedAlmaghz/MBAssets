<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="380" fill="#fbfbfd"/>
  <text x="340" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2238">Backprop through convolution: im2col / col2im</text>

  <!-- im2col -->
  <text x="40" y="62" font-size="13" fill="#3b5bdb" font-weight="600">im2col: unfold patches to columns</text>
  <g stroke="#5b6b8c" stroke-width="1" fill="none">
    <rect x="40" y="75" width="100" height="100"/>
    <line x1="73" y1="75" x2="73" y2="175"/><line x1="106" y1="75" x2="106" y2="175"/>
    <line x1="40" y1="108" x2="140" y2="108"/><line x1="40" y1="141" x2="140" y2="141"/>
  </g>
  <g font-size="9" fill="#1a2238" text-anchor="middle">
    <text x="56" y="95">a</text><text x="89" y="95">b</text><text x="122" y="95">c</text>
    <text x="56" y="128">d</text><text x="89" y="128">e</text><text x="122" y="128">f</text>
    <text x="56" y="161">g</text><text x="89" y="161">h</text><text x="122" y="161">i</text>
  </g>
  <path d="M200 125 L260 125" stroke="#888" stroke-width="2" fill="none" marker-end="url(#b1)"/>
  <defs><marker id="b1" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#888"/></marker></defs>

  <!-- columns matrix -->
  <text x="320" y="62" font-size="12" fill="#555">Column matrix X_col</text>
  <g stroke="#5b6b8c" stroke-width="1" fill="none">
    <rect x="280" y="80" width="90" height="90"/>
    <line x1="280" y1="110" x2="370" y2="110"/><line x1="280" y1="140" x2="370" y2="140"/>
  </g>
  <g font-size="9" fill="#1a2238" text-anchor="middle">
    <text x="295" y="98">a</text><text x="325" y="98">d</text><text x="355" y="98">g</text>
    <text x="295" y="128">b</text><text x="325" y="128">e</text><text x="355" y="128">h</text>
    <text x="295" y="158">c</text><text x="325" y="158">f</text><text x="355" y="158">i</text>
  </g>

  <!-- kernel as row vector W -->
  <text x="470" y="62" font-size="12" fill="#e8590c" font-weight="600">Kernel W (row)</text>
  <g stroke="#5b6b8c" stroke-width="1" fill="none">
    <rect x="430" y="80" width="120" height="20"/>
    <line x1="460" y1="80" x2="460" y2="100"/><line x1="490" y1="80" x2="490" y2="100"/>
  </g>
  <g font-size="9" fill="#1a2238" text-anchor="middle">
    <text x="445" y="95">w1</text><text x="475" y="95">w2</text><text x="505" y="95">w3</text>
  </g>
  <path d="M430 100 L355 150" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#b1)"/>
  <text x="390" y="135" font-size="10" fill="#555">x</text>

  <!-- output -->
  <text x="470" y="200" font-size="12" fill="#2f9e44" font-weight="600">Y = W X_col</text>
  <g stroke="#5b6b8c" stroke-width="1" fill="none">
    <rect x="430" y="210" width="90" height="60"/>
    <line x1="475" y1="210" x2="475" y2="270"/>
  </g>
  <g font-size="9" fill="#1a2238" text-anchor="middle">
    <text x="452" y="230">y1</text><text x="502" y="230">y2</text>
    <text x="452" y="258">y3</text><text x="502" y="258">y4</text>
  </g>

  <!-- backward -->
  <line x1="40" y1="290" x2="560" y2="290" stroke="#ccc" stroke-width="1"/>
  <text x="40" y="315" font-size="13" fill="#e8590c" font-weight="600">Backward: dX_col = W^T dY  ->  col2im reshapes back to feature map</text>
  <text x="40" y="345" font-size="12.5" fill="#555">Gradient wrt kernel:  dW = dY X_col^T  (summed over all spatial positions)</text>
</svg>
