<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="680" height="320" font-family="Segoe UI, Tahoma, Arial, sans-serif">
  <rect width="680" height="320" fill="#ffffff"/>
  <text x="340" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">متراجحة كوشي–شفارتس ومتراجحة المثلث</text>

  <defs>
    <marker id="b201" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#1d4ed8"/>
    </marker>
    <marker id="b202" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- اللوحة اليسرى: كوشي–شفارتس -->
  <text x="180" y="56" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">|⟨u,v⟩| ≤ ‖u‖ · ‖v‖</text>
  <line x1="80" y1="240" x2="320" y2="240" stroke="#1d4ed8" stroke-width="3" marker-end="url(#b201)"/>
  <line x1="80" y1="240" x2="208" y2="106" stroke="#b91c1c" stroke-width="3" marker-end="url(#b202)"/>
  <path d="M120 240 A 40 40 0 0 0 132 208" fill="none" stroke="#a16207" stroke-width="2"/>
  <text x="146" y="228" font-size="14" fill="#a16207">θ</text>
  <text x="330" y="244" font-size="14" font-weight="bold" fill="#1d4ed8">u</text>
  <text x="214" y="98" font-size="14" font-weight="bold" fill="#b91c1c">v</text>
  <text x="80" y="262" font-size="12" fill="#475569">O</text>
  <rect x="60" y="272" width="260" height="30" rx="4" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="190" y="291" text-anchor="middle" font-size="12" fill="#0f172a">⟨u,v⟩ = ‖u‖‖v‖cos θ ⟹ |cos θ| ≤ 1</text>

  <!-- اللوحة اليمنى: متراجحة المثلث -->
  <text x="520" y="56" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">‖a + b‖ ≤ ‖a‖ + ‖b‖</text>
  <line x1="430" y1="240" x2="560" y2="120" stroke="#1d4ed8" stroke-width="3" marker-end="url(#b201)"/>
  <line x1="560" y1="120" x2="640" y2="220" stroke="#b91c1c" stroke-width="3" marker-end="url(#b202)"/>
  <line x1="430" y1="240" x2="640" y2="220" stroke="#16a34a" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#b201)"/>
  <text x="546" y="112" font-size="13" font-weight="bold" fill="#1d4ed8">a</text>
  <text x="650" y="216" font-size="13" font-weight="bold" fill="#b91c1c">b</text>
  <text x="520" y="262" font-size="13" font-weight="bold" fill="#16a34a">a + b</text>
  <rect x="400" y="272" width="260" height="30" rx="4" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="530" y="291" text-anchor="middle" font-size="12" fill="#0f172a">المسار المستقيم أقصر من المنكسر</text>

  <text x="340" y="314" text-anchor="middle" font-size="11" fill="#475569">شكل (2.2): التساوي في المتراجحتين ⟺ المتجهان متوازيان (θ = 0 أو π)</text>
</svg>
