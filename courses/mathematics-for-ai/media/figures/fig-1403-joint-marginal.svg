<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" font-family="Latin Modern, serif">
  <rect width="680" height="340" fill="#fafafa"/>
  <text x="340" y="26" text-anchor="middle" font-size="16" fill="#222">Joint, Marginal and Conditional</text>

  <!-- joint grid -->
  <g transform="translate(120,70)">
    <rect x="0" y="0" width="200" height="200" fill="#fff" stroke="#222"/>
    <!-- density blobs -->
    <ellipse cx="70" cy="80" rx="40" ry="28" fill="#2a6f97" opacity="0.35"/>
    <ellipse cx="140" cy="130" rx="30" ry="38" fill="#2a6f97" opacity="0.30"/>
    <line x1="0" y1="0" x2="200" y2="200" stroke="#999" stroke-dasharray="4 3"/>
    <text x="100" y="220" text-anchor="middle" font-size="12" fill="#222">f_{X,Y}(x,y)</text>
    <!-- marginal X arrow down -->
    <line x1="10" y1="210" x2="10" y2="250" stroke="#e07a1f" stroke-width="2"/>
    <line x1="6" y1="244" x2="10" y2="250" stroke="#e07a1f" stroke-width="2"/>
    <line x1="14" y1="244" x2="10" y2="250" stroke="#e07a1f" stroke-width="2"/>
  </g>
  <!-- marginal X -->
  <g transform="translate(120,300)">
    <path d="M0,0 C40,-40 80,-55 100,-55 C120,-55 160,-40 200,0" fill="none" stroke="#e07a1f" stroke-width="2.5"/>
    <text x="100" y="18" text-anchor="middle" font-size="12" fill="#222">f_X(x) = int f_{X,Y} dy</text>
  </g>
  <!-- marginal Y arrow left -->
  <g transform="translate(80,70)">
    <line x1="0" y1="100" x2="-40" y2="100" stroke="#3a923a" stroke-width="2"/>
    <line x1="-34" y1="96" x2="-40" y2="100" stroke="#3a923a" stroke-width="2"/>
    <line x1="-34" y1="104" x2="-40" y2="100" stroke="#3a923a" stroke-width="2"/>
  </g>
  <g transform="translate(10,170)">
    <text x="0" y="0" font-size="12" fill="#3a923a" transform="rotate(-90)">f_Y(y)</text>
  </g>

  <text x="480" y="120" font-size="12" fill="#222">Independence:</text>
  <text x="480" y="140" font-size="12" fill="#222">f_{X,Y}=f_X f_Y</text>
  <text x="480" y="170" font-size="12" fill="#222">Conditional:</text>
  <text x="480" y="190" font-size="12" fill="#222">f_{X|Y}=f_{X,Y}/f_Y</text>
  <text x="340" y="330" text-anchor="middle" font-size="12" fill="#555">Marginalize to predict one variable; condition for inference.</text>
</svg>
