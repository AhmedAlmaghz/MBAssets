  <text x="664" y="26" text-anchor="end" font-size="15" fill="#1f4e6b" font-weight="700">الاستشعار الحدثي والإشارات النبضية</text>
  <text x="664" y="44" text-anchor="end" font-size="11" fill="#5a6770">Event-based sensing &amp; spiking signals</text>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6770"/></marker></defs>
  <line x1="60" y1="290" x2="620" y2="290" stroke="#5a6770" stroke-width="1"/>
  <line x1="60" y1="90" x2="60" y2="290" stroke="#5a6770" stroke-width="1"/>
  <text x="620" y="304" font-size="11" fill="#5a6770">t</text>
  <text x="54" y="100" text-anchor="end" font-size="11" fill="#5a6770">x(t)</text>
  <path d="M 70 250 C 130 250 150 160 210 160 C 270 160 290 250 350 250 C 410 250 430 140 490 140 C 550 140 570 220 610 220" fill="none" stroke="#5a6770" stroke-width="1.6" stroke-dasharray="5 3" stroke-linecap="round"/>
