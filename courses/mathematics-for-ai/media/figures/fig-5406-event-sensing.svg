  </g>
  <text x="150" y="76" font-size="11" fill="#b5473a">أحداث (spikes) عند تغيّر السعة</text>
  <text x="340" y="320" font-size="10.5" fill="#5a6770" direction="rtl">المستشعر الحدثي يرسل عند التغيّر فقط ⇒ معدّل بيانات أخفض بكثير وزمن وصول أدقّ.</text>
  <text x="340" y="342" font-size="10.5" fill="#5a6770" direction="rtl">الرياضيات: إشارة غير منتظمة العيّنات ⇒ تعميم نظرية نيكويست على مجاميع غير منتظمة.</text>
