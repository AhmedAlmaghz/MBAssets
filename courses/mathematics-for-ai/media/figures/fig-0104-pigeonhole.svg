<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300" font-family="Segoe UI, Tahoma, Arial, sans-serif">
  <rect width="680" height="300" fill="#ffffff"/>
  <text x="340" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">مبدأ الحمام (ديريكلِه): n = 10 عنصراً في m = 9 صناديق</text>

  <!-- الحمامات -->
  <g fill="#334155">
    <circle cx="60" cy="76" r="10"/><circle cx="122" cy="76" r="10"/><circle cx="184" cy="76" r="10"/>
    <circle cx="246" cy="76" r="10"/><circle cx="308" cy="76" r="10"/><circle cx="370" cy="76" r="10"/>
    <circle cx="432" cy="76" r="10"/><circle cx="494" cy="76" r="10"/><circle cx="556" cy="76" r="10"/>
    <circle cx="618" cy="76" r="10" fill="#b91c1c"/>
  </g>

  <!-- صناديق -->
  <g stroke="#0f172a" stroke-width="2" fill="#e2e8f0">
    <rect x="42" y="128" width="56" height="86" rx="3"/>
    <rect x="104" y="128" width="56" height="86" rx="3"/>
    <rect x="166" y="128" width="56" height="86" rx="3"/>
    <rect x="228" y="128" width="56" height="86" rx="3"/>
    <rect x="290" y="128" width="56" height="86" rx="3"/>
    <rect x="352" y="128" width="56" height="86" rx="3"/>
    <rect x="414" y="128" width="56" height="86" rx="3"/>
    <rect x="476" y="128" width="56" height="86" rx="3"/>
  </g>
  <rect x="576" y="128" width="56" height="86" rx="3" fill="#fecaca" stroke="#b91c1c" stroke-width="3"/>
  <text x="604" y="178" text-anchor="middle" font-size="15" font-weight="bold" fill="#7f1d1d">2</text>

  <!-- أسهم -->
  <defs>
    <marker id="arw2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
  <g stroke="#64748b" stroke-width="1.5" marker-end="url(#arw2)">
    <path d="M60 92 L60 122"/><path d="M122 92 L122 122"/><path d="M184 92 L184 122"/>
    <path d="M246 92 L246 122"/><path d="M308 92 L308 122"/><path d="M370 92 L370 122"/>
    <path d="M432 92 L432 122"/><path d="M494 92 L494 122"/><path d="M556 92 L576 122"/>
  </g>
  <path d="M618 92 L632 122" stroke="#b91c1c" stroke-width="2" fill="none" marker-end="url(#arw2)"/>

  <rect x="24" y="238" width="632" height="40" rx="4" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="340" y="263" text-anchor="middle" font-size="14" fill="#0f172a">∃ صندوق j بحيث: |A_j| ≥ ⌈ n / m ⌉ = ⌈ 10 / 9 ⌉ = 2</text>
  <text x="340" y="294" text-anchor="middle" font-size="11" fill="#475569">شكل (1.4): استحالة توزيع 10 عناصر على 9 صناديق دون تكرار</text>
</svg>
