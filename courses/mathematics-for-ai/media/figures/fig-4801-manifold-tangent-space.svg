<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="380" fill="#fbfbfd"/>
  <text x="340" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2238">Manifold &amp; tangent space</text>

  <!-- sphere -->
  <circle cx="300" cy="200" r="90" fill="#c9d6ff" stroke="#3b5bdb" stroke-width="2.5" opacity="0.5"/>
  <ellipse cx="300" cy="200" rx="90" ry="28" fill="none" stroke="#3b5bdb" stroke-width="1.2" opacity="0.6"/>
  <circle cx="300" cy="130" r="6" fill="#c2255c"/>
  <text x="315" y="125" font-size="12" fill="#c2255c">p</text>

  <!-- tangent plane -->
  <polygon points="390,130 520,100 550,160 420,190" fill="#fff3bf" stroke="#f08c00" stroke-width="2" opacity="0.8"/>
  <line x1="300" y1="130" x2="395" y2="135" stroke="#888" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- tangent vectors -->
  <line x1="395" y1="135" x2="470" y2="120" stroke="#2f9e44" stroke-width="2.5" marker-end="url(#s2)"/>
  <line x1="395" y1="140" x2="430" y2="180" stroke="#c2255c" stroke-width="2.5" marker-end="url(#s2)"/>
  <text x="478" y="118" font-size="11" fill="#2f9e44">v</text>
  <text x="420" y="196" font-size="11" fill="#c2255c">w</text>

  <!-- labels -->
  <text x="250" y="250" font-size="12" fill="#3b5bdb">M (2-manifold)</text>
  <text x="445" y="165" font-size="11" fill="#f08c00">T_p M</text>
  <text x="300" y="330" text-anchor="middle" font-size="11.5" fill="#555">locally looks like R²; tangent plane ≈ best linear approximation at p.</text>
  <defs><marker id="s2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#2f9e44"/></marker></defs>
</svg>
