<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380">
  <rect width="680" height="380" fill="#fbfbfd"/>

  <text x="340" y="26" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">Bias-variance: four regimes (the dartboard)</text>

  <!-- helper: target at center -->
  <g transform="translate(140,180)">
    <circle cx="0" cy="0" r="70" fill="#eef4ff" stroke="#1f6feb" stroke-width="2"/>
    <circle cx="0" cy="0" r="5" fill="#c00"/>
    <!-- shots clustered far, tight -->
    <circle cx="-34" cy="-30" r="4" fill="#c00"/><circle cx="-28" cy="-38" r="4" fill="#c00"/>
    <circle cx="-42" cy="-24" r="4" fill="#c00"/><circle cx="-36" cy="-40" r="4" fill="#c00"/>
    <text x="0" y="92" font-family="sans-serif" font-size="12" fill="#333" text-anchor="middle">low variance, high bias</text>
  </g>

  <g transform="translate(480,180)">
    <circle cx="0" cy="0" r="70" fill="#eef4ff" stroke="#1f6feb" stroke-width="2"/>
    <circle cx="0" cy="0" r="5" fill="#c00"/>
    <!-- shots scattered around center -->
    <circle cx="30" cy="-28" r="4" fill="#c00"/><circle cx="-26" cy="26" r="4" fill="#c00"/>
    <circle cx="34" cy="30" r="4" fill="#c00"/><circle cx="-32" cy="-34" r="4" fill="#c00"/>
    <circle cx="8" cy="-44" r="4" fill="#c00"/><circle cx="-6" cy="46" r="4" fill="#c00"/>
    <text x="0" y="92" font-family="sans-serif" font-size="12" fill="#333" text-anchor="middle">high variance, low bias</text>
  </g>

  <!-- arrows -->
  <line x1="70" y1="180" x2="230" y2="180" stroke="#555" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="390" y1="180" x2="550" y2="180" stroke="#555" stroke-width="1.2" stroke-dasharray="4,3"/>

  <!-- bottom-left: low var low bias -->
  <g transform="translate(140,320)">
    <circle cx="0" cy="0" r="52" fill="#e8f5e8" stroke="#2a7a2a" stroke-width="2"/>
    <circle cx="0" cy="0" r="5" fill="#c00"/>
    <circle cx="6" cy="-6" r="4" fill="#c00"/><circle cx="-6" cy="6" r="4" fill="#c00"/>
    <circle cx="7" cy="7" r="4" fill="#c00"/><circle cx="-7" cy="-6" r="4" fill="#c00"/>
    <text x="0" y="70" font-family="sans-serif" font-size="12" fill="#333" text-anchor="middle">ideal: low bias, low variance</text>
  </g>

  <!-- bottom-right: worst -->
  <g transform="translate(480,320)">
    <circle cx="0" cy="0" r="52" fill="#ffeaea" stroke="#c00" stroke-width="2"/>
    <circle cx="0" cy="0" r="5" fill="#c00"/>
    <circle cx="28" cy="-30" r="4" fill="#c00"/><circle cx="-24" cy="28" r="4" fill="#c00"/>
    <circle cx="30" cy="26" r="4" fill="#c00"/><circle cx="-30" cy="-26" r="4" fill="#c00"/>
    <text x="0" y="70" font-family="sans-serif" font-size="12" fill="#333" text-anchor="middle">worst: high bias, high variance</text>
  </g>

  <text x="340" y="372" font-family="sans-serif" font-size="11" fill="#555" text-anchor="middle">centre of each board = true target f(x); dots = predictions h_S(x) over different training samples S</text>
</svg>
