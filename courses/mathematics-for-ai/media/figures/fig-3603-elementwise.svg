<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380">
  <rect width="680" height="380" fill="#fbfbfd"/>
  <text x="20" y="28" font-family="sans-serif" font-size="13" fill="#1f6feb" font-weight="bold">Element-wise activation backprop</text>

  <!-- z -->
  <circle cx="120" cy="190" r="24" fill="#eef4ff" stroke="#1f6feb" stroke-width="1.8"/>
  <text x="120" y="194" font-family="sans-serif" font-size="13" fill="#1f6feb" text-anchor="middle">z</text>
  <!-- sigma -->
  <circle cx="280" cy="190" r="24" fill="#fff6d8" stroke="#b8860b" stroke-width="1.8"/>
  <text x="280" y="194" font-family="sans-serif" font-size="13" fill="#8a5a00" text-anchor="middle">sigma</text>
  <!-- a -->
  <circle cx="440" cy="190" r="24" fill="#eef4ff" stroke="#1f6feb" stroke-width="1.8"/>
  <text x="440" y="194" font-family="sans-serif" font-size="13" fill="#1f6feb" text-anchor="middle">a</text>
  <!-- downstream W^T delta -->
  <rect x="560" y="170" width="90" height="40" fill="#e8f5e8" stroke="#2a7a2a" stroke-width="1.5"/>
  <text x="605" y="194" font-family="sans-serif" font-size="11" fill="#2a7a2a" text-anchor="middle">W^T delta</text>

  <!-- forward -->
  <line x1="144" y1="190" x2="256" y2="190" stroke="#333" stroke-width="1.5"/>
  <line x1="304" y1="190" x2="416" y2="190" stroke="#333" stroke-width="1.5"/>
  <line x1="464" y1="190" x2="560" y2="190" stroke="#333" stroke-width="1.5"/>
  <text x="200" y="178" font-family="sans-serif" font-size="11" fill="#333">forward</text>

  <!-- backward: delta_in = (W^T delta) * sigma'(z) -->
  <line x1="560" y1="210" x2="464" y2="210" stroke="#c00" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="416" y1="220" x2="304" y2="220" stroke="#c00" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="256" y1="230" x2="144" y2="230" stroke="#c00" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="200" y="248" font-family="sans-serif" font-size="11" fill="#c00">backward: delta_in = (W^T delta) (odot) sigma'(z)</text>

  <text x="20" y="365" font-family="sans-serif" font-size="10" fill="#555">Element-wise sigma => diagonal Jacobian => element-wise multiply by sigma'(z)</text>
</svg>
