<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="380" fill="#fbfbfd"/>
  <text x="340" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2238">Multi-agent learning &amp; self-play</text>

  <!-- two agents -->
  <rect x="120" y="150" width="130" height="80" rx="10" fill="#c9d6ff" stroke="#3b5bdb" stroke-width="2.5"/>
  <text x="185" y="185" text-anchor="middle" font-size="14" fill="#1a2238">Agent A</text>
  <text x="185" y="206" text-anchor="middle" font-size="11" fill="#555">π_A (self-play ✓)</text>

  <rect x="430" y="150" width="130" height="80" rx="10" fill="#ffd6e7" stroke="#c2255c" stroke-width="2.5"/>
  <text x="495" y="185" text-anchor="middle" font-size="14" fill="#1a2238">Agent B</text>
  <text x="495" y="206" text-anchor="middle" font-size="11" fill="#555">π_B</text>

  <!-- play arrows -->
  <line x1="250" y1="175" x2="428" y2="175" stroke="#f08c00" stroke-width="2.5" marker-end="url(#l3)"/>
  <line x1="428" y1="205" x2="250" y2="205" stroke="#f08c00" stroke-width="2.5" marker-end="url(#l4)"/>
  <text x="339" y="160" text-anchor="middle" font-size="12" fill="#f08c00">actions</text>
  <text x="339" y="228" text-anchor="middle" font-size="12" fill="#f08c00">rewards</text>

  <!-- self loop for self-play -->
  <path d="M150 150 Q110 90 185 150" fill="none" stroke="#2f9e44" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#l5)"/>

  <text x="340" y="300" text-anchor="middle" font-size="12" fill="#555">Independent learners interact; equilibrium ≠ individually optimal (nonstationarity).</text>
  <text x="340" y="340" text-anchor="middle" font-size="12" fill="#555">Self-play: π plays against its own copies → progress to equilibrium.</text>
  <defs>
    <marker id="l3" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#f08c00"/></marker>
    <marker id="l4" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#f08c00"/></marker>
    <marker id="l5" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#2f9e44"/></marker>
  </defs>
</svg>
