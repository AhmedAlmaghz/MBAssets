<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380">
  <rect width="680" height="380" fill="#fbfbfd"/>
  <text x="340" y="26" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">Sample complexity of concrete hypothesis classes (eps = 0.05, delta = 0.05)</text>

  <!-- bars -->
  <g font-family="sans-serif" font-size="11">
    <text x="70" y="80" fill="#333">thresholds on R  (d = 1)</text>
    <rect x="330" y="66" width="260" height="20" fill="#e8f5e8" stroke="#2a7a2a"/>
    <text x="600" y="81" fill="#2a7a2a">n ~ 120</text>

    <text x="70" y="118" fill="#333">intervals  (d = 2)</text>
    <rect x="330" y="104" width="260" height="20" fill="#e8f5e8" stroke="#2a7a2a"/>
    <text x="600" y="119" fill="#2a7a2a">n ~ 200</text>

    <text x="70" y="156" fill="#333">axis-parallel rectangles  (d = 4)</text>
    <rect x="330" y="142" width="260" height="20" fill="#d8f5d8" stroke="#2a7a2a"/>
    <text x="600" y="157" fill="#2a7a2a">n ~ 340</text>

    <text x="70" y="194" fill="#333">half-spaces in R^10  (d = 11)</text>
    <rect x="330" y="180" width="260" height="20" fill="#fff6d8" stroke="#b8860b"/>
    <text x="600" y="195" fill="#8a5a00">n ~ 740</text>

    <text x="70" y="232" fill="#333">half-spaces in R^100  (d = 101)</text>
    <rect x="330" y="218" width="260" height="20" fill="#ffe0d0" stroke="#c00"/>
    <text x="600" y="233" fill="#c00">n ~ 6 300</text>

    <text x="70" y="270" fill="#333">decision trees, 32 leaves, d=20  (VC ~ 138)</text>
    <rect x="330" y="256" width="260" height="20" fill="#ffd9d9" stroke="#c00"/>
    <text x="600" y="271" fill="#c00">n ~ 8 600</text>

    <text x="70" y="308" fill="#333">ReLU net: W = 10^6, L = 10  (VC ~ 1.4e8)</text>
    <rect x="330" y="294" width="260" height="20" fill="#c00" stroke="#c00"/>
    <text x="600" y="309" fill="#fff">n ~ 10^10</text>
  </g>

  <text x="340" y="348" font-family="sans-serif" font-size="11" fill="#555" text-anchor="middle">the law: n grows linearly in the VC dimension -- and the VC dimension grows with the model</text>
  <text x="340" y="366" font-family="sans-serif" font-size="11" fill="#555" text-anchor="middle">bars are schematic (log-compressed); see the chapter for exact computations</text>
</svg>
