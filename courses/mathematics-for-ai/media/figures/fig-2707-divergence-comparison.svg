<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360">
  <rect width="680" height="360" fill="#fbfbfd"/>
  <text x="340" y="30" font-family="sans-serif" font-size="14" fill="#222" text-anchor="middle">choosing a divergence for the task</text>
  <rect x="40" y="50" width="130" height="70" fill="#e8f4ff" stroke="#1f6feb" stroke-width="2"/>
  <text x="105" y="80" font-family="sans-serif" font-size="12" fill="#1f6feb" text-anchor="middle">JS</text>
  <text x="105" y="100" font-family="sans-serif" font-size="11" fill="#1f6feb" text-anchor="middle">symmetric,</text>
  <text x="105" y="115" font-family="sans-serif" font-size="11" fill="#1f6feb" text-anchor="middle">bounded by ln2</text>
  <rect x="190" y="50" width="130" height="70" fill="#ffe8e8" stroke="#c00" stroke-width="2"/>
  <text x="255" y="80" font-family="sans-serif" font-size="12" fill="#c00" text-anchor="middle">TV</text>
  <text x="255" y="100" font-family="sans-serif" font-size="11" fill="#c00" text-anchor="middle">in [0,1],</text>
  <text x="255" y="115" font-family="sans-serif" font-size="11" fill="#c00" text-anchor="middle">a distance</text>
  <rect x="340" y="50" width="130" height="70" fill="#e8ffe8" stroke="#2da44e" stroke-width="2"/>
  <text x="405" y="80" font-family="sans-serif" font-size="12" fill="#2da44e" text-anchor="middle">Hellinger</text>
  <text x="405" y="100" font-family="sans-serif" font-size="11" fill="#2da44e" text-anchor="middle">robust,</text>
  <text x="405" y="115" font-family="sans-serif" font-size="11" fill="#2da44e" text-anchor="middle">bounded</text>
  <rect x="490" y="50" width="150" height="70" fill="#fff6e0" stroke="#b8860b" stroke-width="2"/>
  <text x="565" y="80" font-family="sans-serif" font-size="12" fill="#b8860b" text-anchor="middle">Wasserstein</text>
  <text x="565" y="100" font-family="sans-serif" font-size="11" fill="#b8860b" text-anchor="middle">geometric, no</text>
  <text x="565" y="115" font-family="sans-serif" font-size="11" fill="#b8860b" text-anchor="middle">shared support</text>
  <text x="340" y="170" font-family="sans-serif" font-size="12" fill="#555" text-anchor="middle">classification -&gt; cross entropy</text>
  <text x="340" y="195" font-family="sans-serif" font-size="12" fill="#555" text-anchor="middle">VAE / RL -&gt; KL (posterior to prior)</text>
  <text x="340" y="220" font-family="sans-serif" font-size="12" fill="#555" text-anchor="middle">GAN (vanishing gradients) -&gt; Wasserstein</text>
  <text x="340" y="245" font-family="sans-serif" font-size="12" fill="#555" text-anchor="middle">robust estimation -&gt; Hellinger / TV</text>
  <text x="340" y="290" font-family="sans-serif" font-size="12" fill="#888" text-anchor="middle">no divergence is universally best</text>
  <text x="340" y="330" font-family="sans-serif" font-size="12" fill="#888" text-anchor="middle">the choice depends on supports, smoothness and the loss landscape</text>
</svg>
