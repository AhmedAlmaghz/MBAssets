<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="380" fill="#fbfbfd"/>
  <text x="340" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2238">Convolution as a shifted inner product</text>

  <!-- Input 5x5 -->
  <text x="60" y="62" font-size="13" fill="#3b5bdb" font-weight="600">Input X (5x5)</text>
  <g stroke="#5b6b8c" stroke-width="1.2" fill="none">
    <rect x="40" y="70" width="150" height="150"/>
    <line x1="70" y1="70" x2="70" y2="220"/><line x1="100" y1="70" x2="100" y2="220"/><line x1="130" y1="70" x2="130" y2="220"/><line x1="160" y1="70" x2="160" y2="220"/>
    <line x1="40" y1="100" x2="190" y2="100"/><line x1="40" y1="130" x2="190" y2="130"/><line x1="40" y1="160" x2="190" y2="160"/><line x1="40" y1="190" x2="190" y2="190"/>
  </g>
  <g font-size="11" fill="#1a2238" text-anchor="middle">
    <text x="55" y="90">1</text><text x="85" y="90">2</text><text x="115" y="90">3</text><text x="145" y="90">0</text><text x="175" y="90">1</text>
    <text x="55" y="120">4</text><text x="85" y="120">5</text><text x="115" y="120">6</text><text x="145" y="120">1</text><text x="175" y="120">2</text>
    <text x="55" y="150">7</text><text x="85" y="150">8</text><text x="115" y="150">9</text><text x="145" y="150">2</text><text x="175" y="150">1</text>
    <text x="55" y="180">1</text><text x="85" y="180">0</text><text x="115" y="180">3</text><text x="145" y="180">1</text><text x="175" y="180">4</text>
    <text x="55" y="210">2</text><text x="85" y="210">1</text><text x="115" y="210">0</text><text x="145" y="210">2</text><text x="175" y="210">1</text>
  </g>
  <!-- highlighted 3x3 window -->
  <rect x="40" y="70" width="90" height="90" fill="#c9d6ff" fill-opacity="0.55" stroke="#3b5bdb" stroke-width="2.4"/>

  <!-- Kernel 3x3 -->
  <text x="295" y="62" font-size="13" fill="#e8590c" font-weight="600">Kernel K (3x3)</text>
  <g stroke="#5b6b8c" stroke-width="1.2" fill="none">
    <rect x="250" y="70" width="90" height="90"/>
    <line x1="280" y1="70" x2="280" y2="160"/><line x1="310" y1="70" x2="310" y2="160"/>
    <line x1="250" y1="100" x2="340" y2="100"/><line x1="250" y1="130" x2="340" y2="130"/>
  </g>
  <g font-size="11" fill="#1a2238" text-anchor="middle">
    <text x="265" y="90">-1</text><text x="295" y="90">0</text><text x="325" y="90">1</text>
    <text x="265" y="120">-2</text><text x="295" y="120">0</text><text x="325" y="120">2</text>
    <text x="265" y="150">-1</text><text x="295" y="150">0</text><text x="325" y="150">1</text>
  </g>

  <!-- arrow -->
  <path d="M340 115 L420 140" stroke="#888" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#888"/></marker></defs>

  <!-- Output 3x3 -->
  <text x="470" y="62" font-size="13" fill="#2f9e44" font-weight="600">Output Y (3x3)</text>
  <g stroke="#5b6b8c" stroke-width="1.2" fill="none">
    <rect x="430" y="100" width="90" height="90"/>
    <line x1="460" y1="100" x2="460" y2="190"/><line x1="490" y1="100" x2="490" y2="190"/>
    <line x1="430" y1="130" x2="520" y2="130"/><line x1="430" y1="160" x2="520" y2="160"/>
  </g>
  <g font-size="11" fill="#1a2238" text-anchor="middle">
    <text x="445" y="120">Y11</text><text x="475" y="120">Y12</text><text x="505" y="120">Y13</text>
    <text x="445" y="150">Y21</text><text x="475" y="150">Y22</text><text x="505" y="150">Y23</text>
    <text x="445" y="180">Y31</text><text x="475" y="180">Y32</text><text x="505" y="180">Y33</text>
  </g>
  <rect x="430" y="100" width="30" height="30" fill="#c8e6c9" fill-opacity="0.6" stroke="#2f9e44" stroke-width="2.4"/>

  <text x="340" y="350" text-anchor="middle" font-size="12.5" fill="#555">Y(i,j) = sum_{m,n} X(i+m, j+n) K(m,n)  --  O = floor((W-k+2P)/S)+1 = floor((5-3+0)/1)+1 = 3</text>
</svg>
