<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="Latin Modern, serif">
  <rect width="680" height="320" fill="#fafafa"/>
  <text x="340" y="26" text-anchor="middle" font-size="16" fill="#222">Schur Complement &amp; Block PSD</text>

  <!-- block matrix -->
  <g transform="translate(120,70)">
    <rect x="0" y="0" width="200" height="140" fill="none" stroke="#222" stroke-width="2"/>
    <line x1="100" y1="0" x2="100" y2="140" stroke="#999" stroke-dasharray="4 3"/>
    <line x1="0" y1="70" x2="200" y2="70" stroke="#999" stroke-dasharray="4 3"/>
    <text x="50" y="45" text-anchor="middle" font-size="20" fill="#2a6f97">A</text>
    <text x="150" y="45" text-anchor="middle" font-size="20" fill="#2a6f97">B</text>
    <text x="50" y="115" text-anchor="middle" font-size="20" fill="#2a6f97">B^T</text>
    <text x="150" y="115" text-anchor="middle" font-size="20" fill="#2a6f97">C</text>
    <text x="-10" y="75" font-size="11" fill="#999">[</text>
  </g>

  <!-- Schur complement box -->
  <g transform="translate(400,120)">
    <rect x="0" y="0" width="220" height="60" fill="#fff" stroke="#b5333a" stroke-width="2"/>
    <text x="110" y="25" text-anchor="middle" font-size="13" fill="#b5333a">S = C - B^T A^{-1} B</text>
    <text x="110" y="45" text-anchor="middle" font-size="12" fill="#555">Schur complement</text>
  </g>

  <!-- arrow -->
  <line x1="320" y1="140" x2="395" y2="150" stroke="#222" stroke-width="1.5"/>
  <line x1="389" y1="146" x2="395" y2="150" stroke="#222" stroke-width="1.5"/>
  <line x1="389" y1="154" x2="395" y2="150" stroke="#222" stroke-width="1.5"/>

  <text x="340" y="290" text-anchor="middle" font-size="12" fill="#555">Block PSD (A&gt;0) iff S &gt;= 0. Used in Gaussian conditioning and precision.</text>
</svg>
