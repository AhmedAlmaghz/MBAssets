<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380">
  <rect width="680" height="380" fill="#fbfbfd"/>
  <text x="20" y="28" font-family="sans-serif" font-size="13" fill="#1f6feb" font-weight="bold">Width-bounded approximation (ReLU, width n+1)</text>

  <!-- left panel: width n -->
  <rect x="40" y="70" width="260" height="240" fill="#fff" stroke="#bbb" stroke-width="1.2"/>
  <text x="170" y="62" font-family="sans-serif" font-size="12" fill="#c00" text-anchor="middle">width = n</text>
  <!-- few regions (2 lines) -->
  <line x1="40" y1="190" x2="300" y2="190" stroke="#999" stroke-width="1.5"/>
  <line x1="170" y1="70" x2="170" y2="310" stroke="#999" stroke-width="1.5"/>
  <text x="105" y="135" font-family="sans-serif" font-size="11" fill="#555">4 regions</text>
  <text x="235" y="135" font-family="sans-serif" font-size="11" fill="#555">4 regions</text>
  <text x="105" y="260" font-family="sans-serif" font-size="11" fill="#555">4 regions</text>
  <text x="235" y="260" font-family="sans-serif" font-size="11" fill="#555">4 regions</text>
  <text x="170" y="330" font-family="sans-serif" font-size="11" fill="#c00" text-anchor="middle">insufficient in general</text>

  <!-- right panel: width n+1 -->
  <rect x="380" y="70" width="260" height="240" fill="#fff" stroke="#2a7a2a" stroke-width="1.5"/>
  <text x="510" y="62" font-family="sans-serif" font-size="12" fill="#2a7a2a" text-anchor="middle">width = n+1</text>
  <!-- many simplicial regions -->
  <line x1="380" y1="130" x2="640" y2="130" stroke="#bbb" stroke-width="1"/>
  <line x1="380" y1="190" x2="640" y2="190" stroke="#bbb" stroke-width="1"/>
  <line x1="380" y1="250" x2="640" y2="250" stroke="#bbb" stroke-width="1"/>
  <line x1="450" y1="70" x2="450" y2="310" stroke="#bbb" stroke-width="1"/>
  <line x1="510" y1="70" x2="510" y2="310" stroke="#bbb" stroke-width="1"/>
  <line x1="570" y1="70" x2="570" y2="310" stroke="#bbb" stroke-width="1"/>
  <line x1="380" y1="300" x2="640" y2="180" stroke="#2a7a2a" stroke-width="1.2" stroke-dasharray="3,3"/>
  <text x="510" y="330" font-family="sans-serif" font-size="11" fill="#2a7a2a" text-anchor="middle">~2^L regions with depth</text>

  <text x="20" y="370" font-family="sans-serif" font-size="10" fill="#555">Lu/Hanin-Sellke: width n+1 suffices (in L^1) for any measurable f; width n may fail</text>
</svg>
