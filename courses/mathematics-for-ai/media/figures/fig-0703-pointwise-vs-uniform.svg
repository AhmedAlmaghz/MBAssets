<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="Georgia, 'Times New Roman', serif">
  <rect width="680" height="300" fill="#fafaf7"/>
  <!-- left: pointwise-only (x^n near 1) -->
  <g>
    <line x1="40" y1="240" x2="310" y2="240" stroke="#334155" stroke-width="1.2"/>
    <line x1="60" y1="260" x2="60" y2="30" stroke="#334155" stroke-width="1.2"/>
    <text x="90" y="25" font-size="15" fill="#334155" font-weight="bold">تقارب نقطي فقط: fₙ(x)=xⁿ</text>
    <g fill="none" stroke="#0f766e">
      <path d="M 60 240 C 120 239, 200 235, 245 215 C 280 198, 305 120, 320 60" stroke-width="1.8" transform="translate(-10,0)"/>
      <path d="M 60 240 C 130 239, 210 234, 258 210 C 292 191, 313 90, 325 45" stroke-width="1.5" opacity="0.65"/>
      <path d="M 60 240 C 140 239, 220 232, 268 206 C 300 187, 320 70, 330 38" stroke-width="1.2" opacity="0.4"/>
    </g>
    <line x1="312" y1="30" x2="312" y2="240" stroke="#b91c1c" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="286" y="262" font-size="13" fill="#b91c1c">x = 1</text>
    <path d="M 300 60 Q 315 100 310 150" fill="none" stroke="#b91c1c" stroke-width="1.4"/>
    <text x="230" y="80" font-size="12" fill="#64748b">الجبل يزحف نحو الحافة</text>
  </g>
  <!-- right: uniform -->
  <g>
    <line x1="370" y1="240" x2="640" y2="240" stroke="#334155" stroke-width="1.2"/>
    <line x1="390" y1="260" x2="390" y2="30" stroke="#334155" stroke-width="1.2"/>
    <text x="415" y="25" font-size="15" fill="#334155" font-weight="bold">تقارب موحّد: fₙ(x)=x/n</text>
    <g fill="none" stroke="#0f766e">
      <line x1="390" y1="238" x2="630" y2="238" stroke-width="2"/>
      <line x1="390" y1="215" x2="630" y2="215" stroke-width="1.4" opacity="0.6"/>
      <line x1="390" y1="190" x2="630" y2="190" stroke-width="1.1" opacity="0.35"/>
    </g>
    <line x1="390" y1="238" x2="630" y2="238" stroke="#1d4ed8" stroke-width="1.8"/>
    <text x="500" y="170" font-size="12" fill="#64748b">كل الدوال تنخفض معاً</text>
    <text x="500" y="155" font-size="12" fill="#64748b">بشكل مستوٍ على المجال كله</text>
  </g>
</svg>
