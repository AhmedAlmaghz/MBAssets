<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="Georgia, 'Times New Roman', serif">
  <rect width="680" height="320" fill="#fafaf7"/>

  <text x="340" y="26" font-size="14" fill="#334155" text-anchor="middle" font-weight="bold">فضاء الاحتمال (Ω, 𝓕, P)</text>

  <!-- sample space Omega -->
  <g>
    <rect x="60" y="60" width="280" height="210" rx="10" fill="#e0f2f1" stroke="#0f766e" stroke-width="1.8"/>
    <text x="200" y="52" font-size="15" fill="#0f766e" text-anchor="middle" font-weight="bold">Ω — فضاء العيّنات</text>
    <!-- events A, B -->
    <ellipse cx="160" cy="150" rx="80" ry="65" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
    <text x="160" y="155" font-size="15" fill="#b45309" text-anchor="middle" font-weight="bold">A</text>
    <ellipse cx="250" cy="180" rx="75" ry="60" fill="#fce7f3" stroke="#9d174d" stroke-width="1.6"/>
    <text x="250" y="185" font-size="15" fill="#9d174d" text-anchor="middle" font-weight="bold">B</text>
  </g>

  <!-- sigma-algebra / P -->
  <g>
    <text x="500" y="52" font-size="15" fill="#334155" text-anchor="middle" font-weight="bold">𝓕 و P</text>
    <g font-size="14" fill="#334155" text-anchor="middle">
      <rect x="400" y="70"  width="200" height="36" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="500" y="93">𝓕 = σ-جبرا الأحداث</text>
      <rect x="400" y="120" width="200" height="36" rx="8" fill="#fef3c7" stroke="#b45309"/>
      <text x="500" y="143">P(A) = 0.4</text>
      <rect x="400" y="170" width="200" height="36" rx="8" fill="#fce7f3" stroke="#9d174d"/>
      <text x="500" y="193">P(B) = 0.5</text>
      <rect x="400" y="220" width="200" height="36" rx="8" fill="#e0f2f1" stroke="#0f766e"/>
      <text x="500" y="243">P(Ω) = 1</text>
    </g>
  </g>

  <line x1="340" y1="165" x2="395" y2="165" stroke="#334155" stroke-width="1.4" marker-end="url(#p)"/>
  <defs>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="120" y="285" width="440" height="26" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="340" y="303" font-size="12.5" fill="#334155" text-anchor="middle" font-style="italic">P قياس بـ P(Ω)=1 وجمع عدّي على المنفصلة</text>
</svg>
