<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380">
  <rect width="680" height="380" fill="#fbfbfd"/>

  <!-- left: unit ball -->
  <text x="130" y="30" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">Unit ball of the Fisher metric</text>
  <ellipse cx="130" cy="180" rx="95" ry="48" fill="#e8f2ff" stroke="#1f6feb" stroke-width="2.4" transform="rotate(-18 130 180)"/>
  <circle cx="130" cy="180" r="48" fill="none" stroke="#c00" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="245" y="120" font-family="sans-serif" font-size="12" fill="#1f6feb">d_theta^T I d_theta = 1</text>
  <text x="245" y="140" font-family="sans-serif" font-size="12" fill="#c00">Euclidean ball (wrong)</text>
  <line x1="130" y1="180" x2="222" y2="164" stroke="#1f6feb" stroke-width="2"/>
  <line x1="130" y1="180" x2="130" y2="132" stroke="#c00" stroke-width="2"/>
  <text x="60" y="290" font-family="sans-serif" font-size="12" fill="#555">long axis = low information direction</text>
  <text x="60" y="310" font-family="sans-serif" font-size="12" fill="#555">short axis = high information direction</text>

  <!-- divider -->
  <line x1="340" y1="40" x2="340" y2="330" stroke="#bbb" stroke-width="1.2"/>

  <!-- right: KL bowl -->
  <text x="510" y="30" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">KL is locally the squared Fisher length</text>
  <path d="M370,300 Q510,120 650,300" fill="none" stroke="#1f6feb" stroke-width="3"/>
  <path d="M370,300 Q510,190 650,300" fill="none" stroke="#9dc4f5" stroke-width="1.6"/>
  <path d="M370,300 Q510,250 650,300" fill="none" stroke="#9dc4f5" stroke-width="1.6"/>
  <circle cx="510" cy="300" r="6" fill="#c00"/>
  <text x="470" y="322" font-family="sans-serif" font-size="12" fill="#c00">theta</text>
  <text x="560" y="318" font-family="sans-serif" font-size="12" fill="#333">theta + d_theta</text>
  <line x1="510" y1="300" x2="560" y2="300" stroke="#333" stroke-width="1.4"/>
  <text x="420" y="230" font-family="sans-serif" font-size="13" fill="#1f6feb">D_KL = 1/2 d^T I d + O(|d|^3)</text>
  <text x="430" y="360" font-family="sans-serif" font-size="12" fill="#555" text-anchor="middle">curvature of the bowl at the minimum = I(theta)</text>
</svg>
