<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="380" fill="#fbfbfd"/>
  <text x="340" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2238">GRU cell: update &amp; reset gates</text>

  <!-- reset gate -->
  <rect x="120" y="90" width="160" height="44" rx="6" fill="#ffe0b2" stroke="#e8590c" stroke-width="2"/>
  <text x="200" y="117" text-anchor="middle" font-size="12" fill="#1a2238">r_t = s(W_r[h_{t-1},x_t]+b_r)</text>

  <!-- update gate -->
  <rect x="120" y="170" width="160" height="44" rx="6" fill="#ffe0b2" stroke="#e8590c" stroke-width="2"/>
  <text x="200" y="197" text-anchor="middle" font-size="12" fill="#1a2238">z_t = s(W_z[h_{t-1},x_t]+b_z)</text>

  <!-- candidate -->
  <rect x="340" y="130" width="170" height="44" rx="6" fill="#c9d6ff" stroke="#3b5bdb" stroke-width="2"/>
  <text x="425" y="157" text-anchor="middle" font-size="12" fill="#1a2238">h'_t = tanh(W[r_t*h_{t-1},x_t])</text>

  <!-- output -->
  <rect x="540" y="130" width="110" height="44" rx="6" fill="#c8e6c9" stroke="#2f9e44" stroke-width="2"/>
  <text x="595" y="157" text-anchor="middle" font-size="12" fill="#1a2238">h_t</text>

  <line x1="280" y1="112" x2="338" y2="148" stroke="#888" stroke-width="1.6" marker-end="url(#g1)"/>
  <line x1="280" y1="192" x2="338" y2="156" stroke="#888" stroke-width="1.6" marker-end="url(#g1)"/>
  <line x1="510" y1="152" x2="538" y2="152" stroke="#2f9e44" stroke-width="2" marker-end="url(#gg)"/>
  <defs><marker id="gg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#2f9e44"/></marker>
  <marker id="g1" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#888"/></marker></defs>

  <text x="340" y="280" text-anchor="middle" font-size="13" fill="#1a2238">h_t = (1 - z_t) * h_{t-1} + z_t * h'_t</text>
  <text x="340" y="350" text-anchor="middle" font-size="12.5" fill="#555">GRU = LSTM without separate cell state; fewer params, comparable performance.</text>
</svg>
