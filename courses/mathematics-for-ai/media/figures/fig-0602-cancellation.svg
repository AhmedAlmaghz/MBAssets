<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" width="780" height="470">
  <rect x="0" y="0" width="780" height="470" fill="#ffffff"/>

  <text x="390" y="30" text-anchor="middle" font-size="19" fill="#111111" font-family="Times New Roman, serif">Catastrophic cancellation:  rel. err(a - b) &#8804; ((|a| + |b|) / |a - b|) &#183; u</text>
  <text x="390" y="54" text-anchor="middle" font-size="14" fill="#555555" font-family="Segoe UI, Tahoma, sans-serif">طرحُ عددين متقاربين يُدمّر الخانات الصحيحة: الخطأ المطلق ثابت لكن النسبي ينفجر</text>

  <!-- ===== Number line ===== -->
  <line x1="70" y1="150" x2="400" y2="150" stroke="#333333" stroke-width="2"/>
  <line x1="70" y1="144" x2="70" y2="156" stroke="#333333" stroke-width="2"/>
  <line x1="400" y1="144" x2="400" y2="156" stroke="#333333" stroke-width="2"/>
  <text x="70" y="172" font-size="13" fill="#333333" font-family="Times New Roman, serif">1.2345600</text>
  <text x="400" y="172" text-anchor="end" font-size="13" fill="#333333" font-family="Times New Roman, serif">1.2345800</text>

  <line x1="316" y1="136" x2="316" y2="164" stroke="#1b3a8a" stroke-width="2.6"/>
  <text x="316" y="126" text-anchor="middle" font-size="15" fill="#1b3a8a" font-family="Times New Roman, serif">a = 1.2345678</text>
  <line x1="291" y1="136" x2="291" y2="164" stroke="#b03030" stroke-width="2.6"/>
  <text x="291" y="112" text-anchor="middle" font-size="15" fill="#b03030" font-family="Times New Roman, serif">b = 1.2345670</text>

  <rect x="302" y="184" width="28" height="16" fill="#dbe6ff" stroke="#1b3a8a" stroke-width="1.4"/>
  <rect x="277" y="184" width="28" height="16" fill="#f7dcdc" stroke="#b03030" stroke-width="1.4"/>
  <text x="70" y="216" font-size="13" fill="#333333" font-family="Segoe UI, Tahoma, sans-serif">مجال التقريب &#177;|a|&#183;u و &#177;|b|&#183;u (مكبّر للرؤية)</text>

  <line x1="291" y1="244" x2="316" y2="244" stroke="#111111" stroke-width="3"/>
  <line x1="291" y1="238" x2="291" y2="250" stroke="#111111" stroke-width="1.6"/>
  <line x1="316" y1="238" x2="316" y2="250" stroke="#111111" stroke-width="1.6"/>
  <text x="70" y="276" font-size="15" fill="#111111" font-family="Times New Roman, serif">d = a - b = 8.0e-7   (&#1605;&#1602;&#1575;&#1585;&#1606;&#1577;: |a|&#183;u &#8776; 7.4e-8)</text>
  <text x="70" y="302" font-size="14" fill="#b03030" font-family="Times New Roman, serif">amplification  (|a|+|b|) / |a-b| = 3.09e&#8310;</text>
  <text x="70" y="326" font-size="14" fill="#b03030" font-family="Times New Roman, serif">rel. err &#8804; 3.09e&#8310; &#215; 6.0e-8 = 0.185  (18.5%)</text>
  <text x="70" y="350" font-size="13" fill="#555555" font-family="Segoe UI, Tahoma, sans-serif">فقدنا كل الخانات إلا خانة واحدة من صحّة الناتج</text>

  <!-- ===== Right : sum error growth (log scale bars) ===== -->
  <text x="620" y="92" text-anchor="middle" font-size="15" fill="#111111" font-family="Times New Roman, serif">error of  &#931; x_i  &#1600; (log scale, u = 1.1e-16)</text>
  <line x1="480" y1="104" x2="760" y2="104" stroke="#999999" stroke-width="1"/>

  <!-- axis ticks -->
  <line x1="486" y1="120" x2="760" y2="120" stroke="#cccccc" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="480" y="124" text-anchor="end" font-size="12" fill="#666666" font-family="Times New Roman, serif">1e-10</text>
  <line x1="486" y1="168" x2="760" y2="168" stroke="#cccccc" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="480" y="172" text-anchor="end" font-size="12" fill="#666666" font-family="Times New Roman, serif">1e-12</text>
  <line x1="486" y1="216" x2="760" y2="216" stroke="#cccccc" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="480" y="220" text-anchor="end" font-size="12" fill="#666666" font-family="Times New Roman, serif">1e-14</text>
  <line x1="486" y1="264" x2="760" y2="264" stroke="#cccccc" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="480" y="268" text-anchor="end" font-size="12" fill="#666666" font-family="Times New Roman, serif">1e-16</text>

  <line x1="486" y1="288" x2="760" y2="288" stroke="#333333" stroke-width="1.6"/>

  <!-- n = 10^2 -->
  <rect x="518" y="215" width="20" height="73" fill="#7f9ade" stroke="#0f2a66" stroke-width="1.4"/>
  <rect x="542" y="256" width="20" height="32" fill="#f0c98a" stroke="#8a5a12" stroke-width="1.4"/>
  <text x="540" y="306" text-anchor="middle" font-size="13" fill="#111111" font-family="Times New Roman, serif">n = 10&#178;</text>

  <!-- n = 10^4 -->
  <rect x="618" y="167" width="20" height="121" fill="#7f9ade" stroke="#0f2a66" stroke-width="1.4"/>
  <rect x="642" y="256" width="20" height="32" fill="#f0c98a" stroke="#8a5a12" stroke-width="1.4"/>
  <text x="640" y="306" text-anchor="middle" font-size="13" fill="#111111" font-family="Times New Roman, serif">n = 10&#8308;</text>

  <!-- n = 10^6 -->
  <rect x="718" y="119" width="20" height="169" fill="#7f9ade" stroke="#0f2a66" stroke-width="1.4"/>
  <rect x="742" y="256" width="20" height="32" fill="#f0c98a" stroke="#8a5a12" stroke-width="1.4"/>
  <text x="740" y="306" text-anchor="middle" font-size="13" fill="#111111" font-family="Times New Roman, serif">n = 10&#8310;</text>

  <rect x="486" y="322" width="14" height="12" fill="#7f9ade" stroke="#0f2a66" stroke-width="1.2"/>
  <text x="506" y="333" font-size="13" fill="#111111" font-family="Times New Roman, serif">naive:  &#947;_n = n u / (1 - n u)</text>
  <rect x="486" y="344" width="14" height="12" fill="#f0c98a" stroke="#8a5a12" stroke-width="1.2"/>
  <text x="506" y="355" font-size="13" fill="#111111" font-family="Times New Roman, serif">Kahan:  2u + O(n u&#178;)  &#1600; &#1579;&#1575;&#1576;&#1578; &#1593;&#1605;&#1604;&#1610;&#1575;&#1611;</text>

  <line x1="40" y1="392" x2="740" y2="392" stroke="#999999" stroke-width="1"/>
  <text x="390" y="418" text-anchor="middle" font-size="15" fill="#111111" font-family="Times New Roman, serif">Kahan:  s &#8592; fl(s + y) ;  c &#8592; fl( (fl(s + y) - s) - y ) ;  y &#8592; fl( x_i - c )</text>
  <text x="390" y="444" text-anchor="middle" font-size="13" fill="#555555" font-family="Segoe UI, Tahoma, sans-serif">متغيّر التعويض c يحفظ الخانات المفقودة ويعيدها في الجمعة التالية</text>
  <text x="390" y="462" text-anchor="middle" font-size="13" fill="#555555" font-family="Segoe UI, Tahoma, sans-serif">&#1605;&#1604;&#1581;&#1608;&#1592;&#1577;: &#1575;&#1604;&#1580;&#1605;&#1593; &#1575;&#1604;&#1579;&#1606;&#1575;&#1574;&#1610; (pairwise) &#1610;&#1593;&#1591;&#1610; O(u log n) &#1571;&#1610;&#1590;&#1575;&#1611;</text>
</svg>
