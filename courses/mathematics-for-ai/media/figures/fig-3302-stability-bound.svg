<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380">
  <rect width="680" height="380" fill="#fbfbfd"/>

  <text x="340" y="26" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">Generalisation gap versus stability parameter beta (n = 1000, M = 1, delta = 0.05)</text>

  <!-- axes -->
  <line x1="70" y1="320" x2="640" y2="320" stroke="#222" stroke-width="2"/>
  <line x1="70" y1="50" x2="70" y2="320" stroke="#222" stroke-width="2"/>
  <text x="355" y="352" font-family="sans-serif" font-size="12" fill="#555" text-anchor="middle">beta (uniform stability)</text>
  <text x="26" y="180" font-family="sans-serif" font-size="12" fill="#555">gap</text>

  <!-- y ticks -->
  <text x="62" y="324" font-family="sans-serif" font-size="10" fill="#777" text-anchor="end">0</text>
  <text x="62" y="224" font-family="sans-serif" font-size="10" fill="#777" text-anchor="end">0.1</text>
  <text x="62" y="124" font-family="sans-serif" font-size="10" fill="#777" text-anchor="end">0.2</text>
  <line x1="70" y1="220" x2="640" y2="220" stroke="#ddd" stroke-width="1"/>
  <line x1="70" y1="120" x2="640" y2="120" stroke="#ddd" stroke-width="1"/>

  <!-- 2 beta line (small slope) -->
  <path d="M70,318 L620,296" fill="none" stroke="#1f6feb" stroke-width="2.6"/>
  <text x="470" y="290" font-family="sans-serif" font-size="12" fill="#1f6feb">2 beta (term of order 1/n)</text>

  <!-- total bound: 2beta + (4n beta + M) c -->
  <path d="M70,290 C200,250 300,160 620,70" fill="none" stroke="#c00" stroke-width="3"/>
  <text x="380" y="100" font-family="sans-serif" font-size="12" fill="#c00">2 beta + (4 n beta + M) sqrt(ln(1/delta)/2n)</text>

  <!-- constant term M*c -->
  <line x1="70" y1="285" x2="640" y2="285" stroke="#b8860b" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="90" y="278" font-family="sans-serif" font-size="11" fill="#b8860b">M sqrt(ln(1/delta)/2n) = 0.0387</text>

  <!-- n beta = 1 marker -->
  <circle cx="240" cy="222" r="5.5" fill="#2a7a2a"/>
  <line x1="240" y1="222" x2="240" y2="320" stroke="#2a7a2a" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="248" y="340" font-family="sans-serif" font-size="11" fill="#2a7a2a">n beta = 1 (beta = 0.001)</text>
  <text x="248" y="212" font-family="sans-serif" font-size="11" fill="#2a7a2a">bound = 0.195</text>

  <!-- vacuous zone -->
  <rect x="470" y="50" width="170" height="34" fill="#fdeeee" stroke="#c00" stroke-width="1.2"/>
  <text x="555" y="71" font-family="sans-serif" font-size="11" fill="#c00" text-anchor="middle">n beta &gt;&gt; 1 : bound is vacuous</text>

  <text x="340" y="368" font-family="sans-serif" font-size="11" fill="#555" text-anchor="middle">the bound is useful only when beta = O(1/n), i.e. n beta stays bounded</text>
</svg>
