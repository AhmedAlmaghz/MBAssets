<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="380" fill="#fbfbfd"/>
  <text x="340" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2238">NTK scaling with width</text>

  <line x1="80" y1="320" x2="600" y2="320" stroke="#555" stroke-width="1.5"/>
  <line x1="80" y1="60" x2="80" y2="320" stroke="#555" stroke-width="1.5"/>
  <text x="340" y="350" text-anchor="middle" font-size="12" fill="#555">width n (log)</text>
  <text x="55" y="190" text-anchor="middle" font-size="12" fill="#555" transform="rotate(-90 55 190)">fluctuation of Theta</text>

  <!-- curve going down to zero as width grows -->
  <path d="M120 100 q180 40 220 200 q40 60 240 10" fill="none" stroke="#3b5bdb" stroke-width="2.6"/>
  <text x="160" y="90" font-size="12" fill="#3b5bdb">Var(Theta) ~ 1/n  ->  0 as n -> inf</text>

  <!-- horizontal line at convergence -->
  <line x1="80" y1="300" x2="600" y2="300" stroke="#2f9e44" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="470" y="293" font-size="11" fill="#2f9e44">Theta == Theta(0) (frozen)</text>

  <g>
    <rect x="430" y="90" width="180" height="50" rx="6" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/>
    <text x="520" y="113" text-anchor="middle" font-size="11" fill="#1a2238">n -> inf : kernel regime exact</text>
    <text x="520" y="130" text-anchor="middle" font-size="11" fill="#1a2238">finite n : feature learning</text>
  </g>

  <text x="340" y="365" text-anchor="middle" font-size="12.5" fill="#555">Wider networks => NTK fixed at init => training = kernel regression.</text>
</svg>
