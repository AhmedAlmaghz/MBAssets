<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="Georgia, 'Times New Roman', serif">
  <rect width="680" height="300" fill="#fafaf7"/>

  <text x="340" y="26" font-size="14" fill="#334155" text-anchor="middle" font-weight="bold">التوقّع = تكامل ليبيسغ–ستيلتjes (المساحة)</text>

  <!-- axes -->
  <line x1="60" y1="250" x2="630" y2="250" stroke="#334155" stroke-width="1.4"/>
  <line x1="60" y1="50" x2="60" y2="250" stroke="#334155" stroke-width="1.4"/>

  <!-- PDF curve -->
  <path d="M60,240 C180,235 280,120 360,110 C460,98 540,160 630,150" fill="none" stroke="#0f766e" stroke-width="2.4"/>
  <text x="560" y="140" font-size="13" fill="#0f766e" font-style="italic">f(x)</text>

  <!-- area from 0 to curve shaded -->
  <path d="M60,240 C180,235 280,120 360,110 L360,250 L60,250 Z" fill="#fef3c7" opacity="0.6"/>

  <!-- mean marker -->
  <line x1="300" y1="60" x2="300" y2="250" stroke="#9d174d" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="300" y="52" font-size="13" fill="#9d174d" text-anchor="middle">μ = E[X]</text>

  <!-- E[X] = integral -->
  <rect x="430" y="60" width="210" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="535" y="80" font-size="13.5" fill="#334155" text-anchor="middle" font-style="italic">E[X] = ∫ x dF(x)</text>
  <text x="535" y="98" font-size="12" fill="#64748b" text-anchor="middle">= ∫ x f(x) dx (سلس)</text>

  <text x="340" y="285" font-size="12.5" fill="#334155" text-anchor="middle" font-style="italic">التوقّع = «مركز كتلة» التوزيع (من الفصل 10.7)</text>
</svg>
