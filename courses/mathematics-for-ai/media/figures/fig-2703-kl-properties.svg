<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360">
  <rect width="680" height="360" fill="#fbfbfd"/>
  <text x="340" y="40" font-family="sans-serif" font-size="14" fill="#222" text-anchor="middle">one quantity, two directions</text>
  <rect x="60" y="70" width="250" height="80" fill="#ffd6d6" stroke="#c00" stroke-width="2"/>
  <text x="185" y="100" font-family="sans-serif" font-size="13" fill="#c00" text-anchor="middle">D_KL(p || q) forward</text>
  <text x="185" y="125" font-family="sans-serif" font-size="12" fill="#c00" text-anchor="middle">mode-seeking</text>
  <rect x="370" y="70" width="250" height="80" fill="#d6e9ff" stroke="#1f6feb" stroke-width="2"/>
  <text x="495" y="100" font-family="sans-serif" font-size="13" fill="#1f6feb" text-anchor="middle">D_KL(q || p) reverse</text>
  <text x="495" y="125" font-family="sans-serif" font-size="12" fill="#1f6feb" text-anchor="middle">mass-covering</text>
  <text x="340" y="185" font-family="sans-serif" font-size="12" fill="#555" text-anchor="middle">they are generally NOT equal</text>
  <rect x="60" y="215" width="560" height="50" fill="#e8ffe8" stroke="#2da44e" stroke-width="2"/>
  <text x="340" y="245" font-family="sans-serif" font-size="13" fill="#2da44e" text-anchor="middle">Gibbs: D_KL &gt;= 0, with equality iff p = q</text>
  <text x="60" y="300" font-family="sans-serif" font-size="12" fill="#222" text-anchor="middle">X</text>
  <text x="110" y="300" font-family="sans-serif" font-size="12" fill="#222" text-anchor="middle">-&gt;</text>
  <text x="160" y="300" font-family="sans-serif" font-size="12" fill="#222" text-anchor="middle">Y</text>
  <text x="210" y="300" font-family="sans-serif" font-size="12" fill="#222" text-anchor="middle">-&gt;</text>
  <text x="260" y="300" font-family="sans-serif" font-size="12" fill="#222" text-anchor="middle">Z</text>
  <text x="330" y="300" font-family="sans-serif" font-size="12" fill="#888" text-anchor="middle">Markov chain</text>
  <text x="470" y="300" font-family="sans-serif" font-size="12" fill="#c00" text-anchor="middle">I(X;Z) &lt;= I(X;Y)</text>
  <text x="340" y="345" font-family="sans-serif" font-size="12" fill="#555" text-anchor="middle">processing cannot create information</text>
</svg>
