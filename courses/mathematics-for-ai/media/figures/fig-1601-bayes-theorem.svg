<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="Latin Modern, serif">
  <rect width="680" height="320" fill="#fafafa"/>
  <text x="340" y="26" text-anchor="middle" font-size="16" fill="#222">Bayes' Theorem</text>

  <!-- overlapping sets -->
  <circle cx="250" cy="170" r="90" fill="#2a6f97" opacity="0.25" stroke="#2a6f97" stroke-width="2"/>
  <circle cx="360" cy="170" r="90" fill="#e07a1f" opacity="0.25" stroke="#e07a1f" stroke-width="2"/>
  <!-- intersection shade -->
  <path d="M295,110 A90,90 0 0 1 315,110 A90,90 0 0 1 295,110 Z" fill="#3a923a" opacity="0.45"/>
  <text x="200" y="175" font-size="13" fill="#2a6f97">A</text>
  <text x="430" y="175" font-size="13" fill="#e07a1f">B</text>
  <text x="305" y="160" font-size="12" fill="#222">A n B</text>

  <!-- formula box -->
  <rect x="470" y="120" width="190" height="100" fill="#fff" stroke="#222" stroke-width="1.5"/>
  <text x="565" y="150" text-anchor="middle" font-size="13" fill="#222">P(A|B) =</text>
  <text x="565" y="172" text-anchor="middle" font-size="13" fill="#222">P(B|A) P(A)</text>
  <text x="565" y="194" text-anchor="middle" font-size="13" fill="#222">-----------</text>
  <text x="565" y="212" text-anchor="middle" font-size="13" fill="#222">P(B)</text>

  <text x="340" y="305" text-anchor="middle" font-size="12" fill="#555">Posterior = Likelihood x Prior / Evidence.</text>
</svg>
