<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380">
  <rect width="680" height="380" fill="#fbfbfd"/>
  <text x="340" y="26" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">Statistical vs computational complexity of learning</text>

  <!-- quadrant axes -->
  <line x1="70" y1="200" x2="640" y2="200" stroke="#222" stroke-width="2"/>
  <line x1="355" y1="60" x2="355" y2="340" stroke="#222" stroke-width="2"/>
  <text x="640" y="216" font-family="sans-serif" font-size="11" fill="#333" text-anchor="end">computationally hard</text>
  <text x="80" y="216" font-family="sans-serif" font-size="11" fill="#333">computationally easy</text>
  <text x="340" y="56" font-family="sans-serif" font-size="11" fill="#333" text-anchor="end">statistically easy</text>
  <text x="340" y="356" font-family="sans-serif" font-size="11" fill="#333" text-anchor="end">statistically hard</text>

  <!-- Q1 easy/easy -->
  <rect x="100" y="80" width="220" height="100" fill="#e8f5e8" stroke="#2a7a2a" stroke-width="1.6"/>
  <text x="210" y="112" font-family="sans-serif" font-size="12" fill="#2a7a2a" text-anchor="middle">easy + easy</text>
  <text x="210" y="132" font-family="sans-serif" font-size="10" fill="#2a7a2a" text-anchor="middle">linear classifiers, SVM</text>
  <text x="210" y="150" font-family="sans-serif" font-size="10" fill="#2a7a2a" text-anchor="middle">k-NN, decision trees</text>
  <text x="210" y="170" font-family="sans-serif" font-size="10" fill="#2a7a2a" text-anchor="middle">ERM is tractable here</text>

  <!-- Q2 hard/easy -->
  <rect x="380" y="80" width="240" height="100" fill="#ffeaea" stroke="#c00" stroke-width="1.6"/>
  <text x="500" y="112" font-family="sans-serif" font-size="12" fill="#c00" text-anchor="middle">easy data, hard optimisation</text>
  <text x="500" y="132" font-family="sans-serif" font-size="10" fill="#c00" text-anchor="middle">3-term DNF: ERM is NP-hard</text>
  <text x="500" y="150" font-family="sans-serif" font-size="10" fill="#c00" text-anchor="middle">deep nets: non-convex ERM</text>
  <text x="500" y="170" font-family="sans-serif" font-size="10" fill="#c00" text-anchor="middle">relax / improper learning</text>

  <!-- Q3 easy/hard -->
  <rect x="100" y="220" width="220" height="100" fill="#fff6d8" stroke="#b8860b" stroke-width="1.6"/>
  <text x="210" y="252" font-family="sans-serif" font-size="12" fill="#8a5a00" text-anchor="middle">hard data, easy optimisation</text>
  <text x="210" y="272" font-family="sans-serif" font-size="10" fill="#8a5a00" text-anchor="middle">infinite VC dimension</text>
  <text x="210" y="290" font-family="sans-serif" font-size="10" fill="#8a5a00" text-anchor="middle">need margins / priors</text>
  <text x="210" y="310" font-family="sans-serif" font-size="10" fill="#8a5a00" text-anchor="middle">kernel machines</text>

  <!-- Q4 hard/hard -->
  <rect x="380" y="220" width="240" height="100" fill="#f0f0f0" stroke="#888" stroke-width="1.6"/>
  <text x="500" y="252" font-family="sans-serif" font-size="12" fill="#555" text-anchor="middle">hard + hard</text>
  <text x="500" y="272" font-family="sans-serif" font-size="10" fill="#555" text-anchor="middle">learning parity with noise</text>
  <text x="500" y="290" font-family="sans-serif" font-size="10" fill="#555" text-anchor="middle">cryptographic hardness</text>
  <text x="500" y="310" font-family="sans-serif" font-size="10" fill="#555" text-anchor="middle">no polynomial learner known</text>
</svg>
