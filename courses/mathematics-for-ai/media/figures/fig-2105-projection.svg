<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360">
  <defs>
  <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
    <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
  </marker>
</defs>
<rect width="680" height="360" fill="#fbfbfd"/>
  <ellipse cx="340" cy="190" rx="180" ry="110" fill="#e8f4ff" stroke="#1f6feb" stroke-width="2"/>
  <text x="340" y="90" font-family="sans-serif" font-size="13" fill="#1f6feb" text-anchor="middle">convex set C</text>
  <circle cx="340" cy="190" r="5" fill="#222"/>
  <text x="340" y="210" font-family="sans-serif" font-size="12" fill="#222" text-anchor="middle">x_k</text>
  <path d="M340,190 L250,155" fill="none" stroke="#c00" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="255" y="140" font-family="sans-serif" font-size="12" fill="#c00" text-anchor="middle">-eta grad f</text>
  <circle cx="250" cy="155" r="5" fill="#c00"/>
  <path d="M250,155 L232,175" fill="none" stroke="#2da44e" stroke-width="2.5" marker-end="url(#a)"/>
  <circle cx="232" cy="176" r="5" fill="#2da44e"/>
  <text x="180" y="200" font-family="sans-serif" font-size="12" fill="#2da44e" text-anchor="middle">project</text>
  <text x="340" y="340" font-family="sans-serif" font-size="12" fill="#555" text-anchor="middle">x_{k+1} = Proj_C( x_k - eta grad f(x_k) )</text>
</svg>
