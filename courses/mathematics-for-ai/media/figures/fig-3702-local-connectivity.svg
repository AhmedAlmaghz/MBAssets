<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="380" fill="#fbfbfd"/>
  <text x="340" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2238">Local connectivity &amp; weight sharing</text>

  <!-- input grid -->
  <text x="40" y="62" font-size="13" fill="#3b5bdb" font-weight="600">Input (8x8 patch)</text>
  <g stroke="#5b6b8c" stroke-width="0.9" fill="none">
    <rect x="40" y="70" width="160" height="160"/>
    <line x1="60" y1="70" x2="60" y2="230"/><line x1="80" y1="70" x2="80" y2="230"/><line x1="100" y1="70" x2="100" y2="230"/><line x1="120" y1="70" x2="120" y2="230"/><line x1="140" y1="70" x2="140" y2="230"/><line x1="160" y1="70" x2="160" y2="230"/>
    <line x1="40" y1="90" x2="200" y2="90"/><line x1="40" y1="110" x2="200" y2="110"/><line x1="40" y1="130" x2="200" y2="130"/><line x1="40" y1="150" x2="200" y2="150"/><line x1="40" y1="170" x2="200" y2="170"/><line x1="40" y1="190" x2="200" y2="190"/><line x1="40" y1="210" x2="200" y2="210"/>
  </g>
  <!-- local region -->
  <rect x="40" y="70" width="60" height="60" fill="#c9d6ff" fill-opacity="0.6" stroke="#3b5bdb" stroke-width="2.4"/>

  <!-- connections to one output -->
  <g stroke="#e8590c" stroke-width="1.4" fill="none">
    <line x1="55" y1="95" x2="320" y2="120"/><line x1="75" y1="95" x2="320" y2="120"/><line x1="95" y1="95" x2="320" y2="120"/>
    <line x1="55" y1="115" x2="320" y2="120"/><line x1="75" y1="115" x2="320" y2="120"/><line x1="95" y1="115" x2="320" y2="120"/>
    <line x1="55" y1="135" x2="320" y2="120"/><line x1="75" y1="135" x2="320" y2="120"/><line x1="95" y1="135" x2="320" y2="120"/>
  </g>
  <!-- weights -->
  <g font-size="9" fill="#e8590c" text-anchor="middle">
    <text x="200" y="105">w1</text><text x="200" y="120">w2</text><text x="200" y="135">w3</text>
  </g>

  <!-- one output neuron -->
  <circle cx="320" cy="120" r="16" fill="#ffe0b2" stroke="#e8590c" stroke-width="2"/>
  <text x="320" y="124" font-size="10" text-anchor="middle" fill="#1a2238">Y11</text>

  <!-- shared kernel replicated -->
  <text x="430" y="62" font-size="13" fill="#2f9e44" font-weight="600">Same kernel K reused (top-left of each 3x3)</text>
  <g fill="#c9d6ff" fill-opacity="0.6" stroke="#3b5bdb" stroke-width="1.6">
    <rect x="420" y="90" width="48" height="48"/>
    <rect x="480" y="90" width="48" height="48"/>
    <rect x="540" y="90" width="48" height="48"/>
    <rect x="420" y="150" width="48" height="48"/>
    <rect x="480" y="150" width="48" height="48"/>
    <rect x="540" y="150" width="48" height="48"/>
    <rect x="420" y="210" width="48" height="48"/>
    <rect x="480" y="210" width="48" height="48"/>
    <rect x="540" y="210" width="48" height="48"/>
  </g>
  <text x="530" y="285" text-anchor="middle" font-size="11" fill="#555">One set of k^2 C_in C_out + C_out weights, shared over all positions</text>

  <text x="340" y="350" text-anchor="middle" font-size="12.5" fill="#555">Params = k^2 x C_in x C_out + C_out   (independent of input size W)</text>
</svg>
