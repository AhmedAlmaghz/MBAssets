<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="380" fill="#fbfbfd"/>
  <text x="340" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2238">Permutation invariance/equivariance</text>

  <!-- same graph, labels swapped -->
  <g>
    <line x1="120" y1="150" x2="180" y2="180" stroke="#888" stroke-width="2"/>
    <line x1="180" y1="180" x2="240" y2="140" stroke="#888" stroke-width="2"/>
    <line x1="120" y1="150" x2="120" y2="230" stroke="#888" stroke-width="2"/>
    <line x1="240" y1="140" x2="240" y2="230" stroke="#888" stroke-width="2"/>
    <circle cx="120" cy="150" r="14" fill="#c9d6ff" stroke="#3b5bdb" stroke-width="2"/>
    <circle cx="180" cy="180" r="14" fill="#c9d6ff" stroke="#3b5bdb" stroke-width="2"/>
    <circle cx="240" cy="140" r="14" fill="#c9d6ff" stroke="#3b5bdb" stroke-width="2"/>
    <circle cx="120" cy="230" r="14" fill="#c9d6ff" stroke="#3b5bdb" stroke-width="2"/>
    <circle cx="240" cy="230" r="14" fill="#c9d6ff" stroke="#3b5bdb" stroke-width="2"/>
    <text x="120" y="153" text-anchor="middle" font-size="10" fill="#1a2238">A</text>
    <text x="180" y="183" text-anchor="middle" font-size="10" fill="#1a2238">B</text>
    <text x="240" y="143" text-anchor="middle" font-size="10" fill="#1a2238">C</text>
    <text x="120" y="233" text-anchor="middle" font-size="10" fill="#1a2238">D</text>
    <text x="240" y="233" text-anchor="middle" font-size="10" fill="#1a2238">E</text>
  </g>
  <text x="180" y="280" text-anchor="middle" font-size="12" fill="#555">G</text>

  <!-- permutation arrow -->
  <line x1="280" y1="190" x2="390" y2="190" stroke="#f08c00" stroke-width="2.5" marker-end="url(#o2)"/>
  <text x="335" y="178" text-anchor="middle" font-size="11" fill="#f08c00">permute π</text>

  <!-- relabeled graph (same topology) -->
  <g>
    <line x1="440" y1="140" x2="500" y2="150" stroke="#888" stroke-width="2"/>
    <line x1="500" y1="150" x2="560" y2="180" stroke="#888" stroke-width="2"/>
    <line x1="440" y1="140" x2="440" y2="220" stroke="#888" stroke-width="2"/>
    <line x1="560" y1="180" x2="560" y2="230" stroke="#888" stroke-width="2"/>
    <line x1="440" y1="220" x2="560" y2="230" stroke="#888" stroke-width="2"/>
    <circle cx="440" cy="140" r="14" fill="#ffd6e7" stroke="#c2255c" stroke-width="2"/>
    <circle cx="500" cy="150" r="14" fill="#ffd6e7" stroke="#c2255c" stroke-width="2"/>
    <circle cx="560" cy="180" r="14" fill="#ffd6e7" stroke="#c2255c" stroke-width="2"/>
    <circle cx="440" cy="220" r="14" fill="#ffd6e7" stroke="#c2255c" stroke-width="2"/>
    <circle cx="560" cy="230" r="14" fill="#ffd6e7" stroke="#c2255c" stroke-width="2"/>
    <text x="440" y="143" text-anchor="middle" font-size="10" fill="#1a2238">C</text>
    <text x="500" y="153" text-anchor="middle" font-size="10" fill="#1a2238">A</text>
    <text x="560" y="183" text-anchor="middle" font-size="10" fill="#1a2238">B</text>
    <text x="440" y="223" text-anchor="middle" font-size="10" fill="#1a2238">E</text>
    <text x="560" y="233" text-anchor="middle" font-size="10" fill="#1a2238">D</text>
  </g>
  <text x="500" y="280" text-anchor="middle" font-size="12" fill="#555">π(G) same graph</text>

  <rect x="130" y="310" width="420" height="46" rx="8" fill="#fff3bf" stroke="#f08c00" stroke-width="1.5"/>
  <text x="340" y="330" text-anchor="middle" font-size="12.5" fill="#1a2238">F(π(G), π(X)) = π(F(G, X))   (node output permutes)</text>
  <text x="340" y="348" text-anchor="middle" font-size="11.5" fill="#555">Graph-level readout: pool is invariant; node task: equivariant.</text>
  <defs><marker id="o2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#f08c00"/></marker></defs>
</svg>
