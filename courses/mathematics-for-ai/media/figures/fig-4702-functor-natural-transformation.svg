<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="380" fill="#fbfbfd"/>
  <text x="340" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2238">Functors &amp; natural transformations</text>

  <!-- category C -->
  <text x="170" y="80" text-anchor="middle" font-size="13" font-weight="600" fill="#3b5bdb">category C</text>
  <circle cx="120" cy="160" r="22" fill="#c9d6ff" stroke="#3b5bdb" stroke-width="2"/>
  <text x="120" y="165" text-anchor="middle" font-size="12" fill="#1a2238">c</text>
  <circle cx="220" cy="160" r="22" fill="#c9d6ff" stroke="#3b5bdb" stroke-width="2"/>
  <text x="220" y="165" text-anchor="middle" font-size="12" fill="#1a2238">c'</text>
  <line x1="142" y1="160" x2="198" y2="160" stroke="#2f9e44" stroke-width="2.2" marker-end="url(#fn1)"/>
  <text x="170" y="152" text-anchor="middle" font-size="11" fill="#2f9e44">h</text>

  <!-- category D -->
  <text x="510" y="80" text-anchor="middle" font-size="13" font-weight="600" fill="#c2255c">category D</text>
  <circle cx="460" cy="130" r="22" fill="#ffd6e7" stroke="#c2255c" stroke-width="2"/>
  <text x="460" y="135" text-anchor="middle" font-size="12" fill="#1a2238">F(c)</text>
  <circle cx="560" cy="130" r="22" fill="#ffd6e7" stroke="#c2255c" stroke-width="2"/>
  <text x="560" y="135" text-anchor="middle" font-size="12" fill="#1a2238">F(c')</text>
  <circle cx="460" cy="240" r="22" fill="#ffe0b2" stroke="#e8590c" stroke-width="2"/>
  <text x="460" y="245" text-anchor="middle" font-size="12" fill="#1a2238">G(c)</text>
  <circle cx="560" cy="240" r="22" fill="#ffe0b2" stroke="#e8590c" stroke-width="2"/>
  <text x="560" y="245" text-anchor="middle" font-size="12" fill="#1a2238">G(c')</text>

  <!-- functor images -->
  <line x1="482" y1="130" x2="538" y2="130" stroke="#2f9e44" stroke-width="2.2" marker-end="url(#fn1)"/>
  <text x="510" y="122" text-anchor="middle" font-size="10.5" fill="#2f9e44">F(h)</text>
  <line x1="482" y1="240" x2="538" y2="240" stroke="#2f9e44" stroke-width="2.2" marker-end="url(#fn1)"/>
  <text x="510" y="232" text-anchor="middle" font-size="10.5" fill="#2f9e44">G(h)</text>

  <!-- natural transformation components -->
  <line x1="460" y1="152" x2="460" y2="218" stroke="#f08c00" stroke-width="2.5" marker-end="url(#fn2)"/>
  <text x="425" y="190" font-size="11" fill="#f08c00">α_c</text>
  <line x1="560" y1="152" x2="560" y2="218" stroke="#f08c00" stroke-width="2.5" marker-end="url(#fn2)"/>
  <text x="575" y="190" font-size="11" fill="#f08c00">α_c'</text>

  <text x="340" y="330" text-anchor="middle" font-size="12" fill="#1a2238">naturality: G(h) ∘ α_c = α_c' ∘ F(h)  (the square commutes)</text>
  <text x="340" y="358" text-anchor="middle" font-size="11.5" fill="#555">Functor preserves composition &amp; identities; NT is a map between functors.</text>
  <defs>
    <marker id="fn1" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#2f9e44"/></marker>
    <marker id="fn2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#f08c00"/></marker>
  </defs>
</svg>
