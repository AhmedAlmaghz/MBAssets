<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 450" width="780" height="450">
  <defs>
    <marker id="jlA" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#1b3a8a"/>
    </marker>
    <marker id="jlB" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#b03030"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="780" height="450" fill="#ffffff"/>

  <text x="390" y="30" text-anchor="middle" font-size="19" fill="#111111" font-family="Times New Roman, serif">Johnson&#8211;Lindenstrauss:  random projection preserves all pairwise distances</text>
  <text x="390" y="54" text-anchor="middle" font-size="14" fill="#555555" font-family="Segoe UI, Tahoma, sans-serif">إسقاط عشوائي واحد يحفظ المسافات بين كل الأزواج في وقت واحد</text>

  <!-- ===== Left cloud : R^d ===== -->
  <rect x="40" y="90" width="250" height="220" fill="#fbfbff" stroke="#888888" stroke-width="1.4"/>
  <text x="165" y="84" text-anchor="middle" font-size="16" fill="#111111" font-family="Times New Roman, serif">R^d ,  d = 4096</text>
  <g fill="#1b3a8a">
    <circle cx="80" cy="140" r="6"/><circle cx="128" cy="118" r="6"/><circle cx="176" cy="152" r="6"/>
    <circle cx="222" cy="126" r="6"/><circle cx="256" cy="168" r="6"/><circle cx="96" cy="196" r="6"/>
    <circle cx="150" cy="222" r="6"/><circle cx="200" cy="248" r="6"/><circle cx="248" cy="216" r="6"/>
    <circle cx="112" cy="268" r="6"/><circle cx="168" cy="288" r="6"/><circle cx="228" cy="272" r="6"/>
    <circle cx="272" cy="240" r="6"/><circle cx="60" cy="232" r="6"/>
  </g>
  <circle cx="128" cy="118" r="8" fill="none" stroke="#b03030" stroke-width="2"/>
  <circle cx="200" cy="248" r="8" fill="none" stroke="#b03030" stroke-width="2"/>
  <line x1="128" y1="118" x2="200" y2="248" stroke="#b03030" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="146" y="192" font-size="15" fill="#b03030" font-family="Times New Roman, serif">||x &#8722; y||</text>

  <!-- ===== Arrow ===== -->
  <line x1="300" y1="200" x2="392" y2="200" stroke="#1b3a8a" stroke-width="3" marker-end="url(#jlA)"/>
  <text x="346" y="188" text-anchor="middle" font-size="15" fill="#1b3a8a" font-family="Times New Roman, serif">R</text>

  <!-- ===== Right cloud : R^k ===== -->
  <rect x="402" y="90" width="340" height="220" fill="#fbfbff" stroke="#888888" stroke-width="1.4"/>
  <text x="572" y="84" text-anchor="middle" font-size="16" fill="#111111" font-family="Times New Roman, serif">R^k ,  k = 128</text>
  <g fill="#9db4ea">
    <circle cx="446" cy="140" r="6"/><circle cx="498" cy="118" r="6"/><circle cx="552" cy="152" r="6"/>
    <circle cx="604" cy="126" r="6"/><circle cx="644" cy="168" r="6"/><circle cx="466" cy="196" r="6"/>
    <circle cx="524" cy="222" r="6"/><circle cx="578" cy="248" r="6"/><circle cx="632" cy="216" r="6"/>
    <circle cx="484" cy="268" r="6"/><circle cx="546" cy="288" r="6"/><circle cx="612" cy="272" r="6"/>
    <circle cx="662" cy="240" r="6"/><circle cx="424" cy="232" r="6"/>
  </g>
  <circle cx="498" cy="118" r="8" fill="none" stroke="#b03030" stroke-width="2"/>
  <circle cx="578" cy="248" r="8" fill="none" stroke="#b03030" stroke-width="2"/>
  <line x1="498" y1="118" x2="578" y2="248" stroke="#b03030" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="516" y="192" font-size="15" fill="#b03030" font-family="Times New Roman, serif">||Rx &#8722; Ry||</text>

  <!-- ===== epsilon band ===== -->
  <text x="390" y="336" text-anchor="middle" font-size="15" fill="#111111" font-family="Times New Roman, serif">ratio  ||Rx &#8722; Ry||² / ||x &#8722; y||²  for every pair</text>
  <rect x="307" y="346" width="167" height="38" fill="#dbe6ff" stroke="#1b3a8a" stroke-width="1.6"/>
  <line x1="140" y1="384" x2="640" y2="384" stroke="#333333" stroke-width="1.5"/>
  <line x1="307" y1="346" x2="307" y2="392" stroke="#1b3a8a" stroke-width="1.6"/>
  <line x1="474" y1="346" x2="474" y2="392" stroke="#1b3a8a" stroke-width="1.6"/>
  <line x1="390" y1="346" x2="390" y2="392" stroke="#b03030" stroke-width="1.6"/>
  <text x="307" y="410" text-anchor="middle" font-size="14" fill="#111111" font-family="Times New Roman, serif">1 &#8722; &#949; = 0.90</text>
  <text x="390" y="410" text-anchor="middle" font-size="14" fill="#b03030" font-family="Times New Roman, serif">1.00</text>
  <text x="474" y="410" text-anchor="middle" font-size="14" fill="#111111" font-family="Times New Roman, serif">1 + &#949; = 1.10</text>

  <line x1="40" y1="424" x2="740" y2="424" stroke="#999999" stroke-width="1"/>
  <text x="390" y="444" text-anchor="middle" font-size="16" fill="#111111" font-family="Times New Roman, serif">k &#8805; C &#949;^(-2) log n  &#8658;  all n(n&#8722;1)/2 distances in (1 &#177; &#949;) with probability &#8805; 1 &#8722; 1/n</text>
</svg>
