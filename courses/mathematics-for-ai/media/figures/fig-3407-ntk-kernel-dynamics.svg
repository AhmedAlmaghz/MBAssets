<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380">
  <rect width="680" height="380" fill="#fbfbfd"/>

  <text x="340" y="28" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">Neural tangent kernel: df/dt = -Theta (f - y), kernel frozen as width grows</text>

  <!-- left: kernel matrices and dynamics -->
  <line x1="70" y1="320" x2="330" y2="320" stroke="#222" stroke-width="2"/>
  <line x1="70" y1="70" x2="70" y2="320" stroke="#222" stroke-width="2"/>
  <text x="200" y="352" font-family="sans-serif" font-size="12" fill="#555" text-anchor="middle">training time t</text>
  <text x="26" y="180" font-family="sans-serif" font-size="12" fill="#555">error</text>

  <path d="M90,86 C140,150 190,214 250,262 C280,282 310,294 326,300" fill="none" stroke="#1f6feb" stroke-width="2.8"/>
  <text x="150" y="132" font-family="sans-serif" font-size="11" fill="#1f6feb">e^(-Theta t)</text>
  <text x="120" y="148" font-family="sans-serif" font-size="10" fill="#1f6feb">NTK regime</text>

  <path d="M90,86 C130,124 170,168 210,206 C250,244 290,276 326,294" fill="none" stroke="#c00" stroke-width="2.4" stroke-dasharray="6,4"/>
  <text x="214" y="238" font-family="sans-serif" font-size="11" fill="#c00">feature learning</text>

  <text x="200" y="62" font-family="sans-serif" font-size="10" fill="#555" text-anchor="middle">t_eps = ln(1/eps) / lambda_min(Theta)</text>

  <!-- right: kernel matrix grid -->
  <text x="470" y="62" font-family="sans-serif" font-size="11" fill="#555" text-anchor="middle">Theta (n x n) gram matrix of gradients</text>
  <g>
    <rect x="388" y="78" width="164" height="164" fill="#eef4ff" stroke="#1f6feb" stroke-width="1.4"/>
    <line x1="388" y1="119" x2="552" y2="119" stroke="#1f6feb" stroke-width="0.8"/>
    <line x1="388" y1="160" x2="552" y2="160" stroke="#1f6feb" stroke-width="0.8"/>
    <line x1="388" y1="201" x2="552" y2="201" stroke="#1f6feb" stroke-width="0.8"/>
    <line x1="429" y1="78" x2="429" y2="242" stroke="#1f6feb" stroke-width="0.8"/>
    <line x1="470" y1="78" x2="470" y2="242" stroke="#1f6feb" stroke-width="0.8"/>
    <line x1="511" y1="78" x2="511" y2="242" stroke="#1f6feb" stroke-width="0.8"/>
    <circle cx="410" cy="99" r="7" fill="#2a7a2a"/>
    <circle cx="452" cy="140" r="5" fill="#2a7a2a"/>
    <circle cx="495" cy="182" r="4" fill="#2a7a2a"/>
    <circle cx="534" cy="222" r="3" fill="#2a7a2a"/>
    <text x="470" y="262" font-family="sans-serif" font-size="10" fill="#2a7a2a" text-anchor="middle">Theta(x,x') = &lt;grad f(x), grad f(x')&gt;</text>
  </g>

  <!-- boxes -->
  <rect x="388" y="272" width="164" height="48" fill="#fdf6e6" stroke="#b8860b" stroke-width="1.2"/>
  <text x="470" y="290" font-family="sans-serif" font-size="10" fill="#b8860b" text-anchor="middle">lazy training:</text>
  <text x="470" y="306" font-family="sans-serif" font-size="10" fill="#b8860b" text-anchor="middle">||theta_t - theta_0|| = O(1/sqrt(m))</text>

  <rect x="86" y="86" width="150" height="46" fill="#eef4ff" stroke="#1f6feb" stroke-width="1.2"/>
  <text x="161" y="104" font-family="sans-serif" font-size="10" fill="#1f6feb" text-anchor="middle">eta &lt;= 2 / lambda_max</text>
  <text x="161" y="120" font-family="sans-serif" font-size="10" fill="#1f6feb" text-anchor="middle">stable integration</text>
</svg>
