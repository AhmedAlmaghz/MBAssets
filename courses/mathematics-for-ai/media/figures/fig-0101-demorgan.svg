<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="680" height="320" font-family="Segoe UI, Tahoma, Arial, sans-serif">
  <rect width="680" height="320" fill="#ffffff"/>
  <text x="340" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">قانونا دي مورغان — التمثيل الهندسي</text>
  <text x="340" y="46" text-anchor="middle" font-size="13" fill="#475569">المنطقة الملوّنة في اللوحتين هي ذاتها ⟹ المتساويتان متكافئتان</text>

  <!-- اللوحة اليسرى: (A ∪ B)^c -->
  <rect x="24" y="66" width="272" height="196" rx="4" fill="#fecaca" stroke="#0f172a" stroke-width="2"/>
  <text x="34" y="84" font-size="13" fill="#7f1d1d">U (الكون)</text>
  <circle cx="108" cy="164" r="74" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <circle cx="212" cy="164" r="74" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="72" y="170" font-size="18" font-weight="bold" fill="#0f172a">A</text>
  <text x="248" y="170" font-size="18" font-weight="bold" fill="#0f172a">B</text>
  <text x="160" y="292" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">(A ∪ B)^c</text>

  <!-- علامة التساوي -->
  <text x="340" y="176" text-anchor="middle" font-size="34" font-weight="bold" fill="#0f172a">=</text>

  <!-- اللوحة اليمنى: A^c ∩ B^c -->
  <rect x="384" y="66" width="272" height="196" rx="4" fill="#fecaca" stroke="#0f172a" stroke-width="2"/>
  <text x="394" y="84" font-size="13" fill="#7f1d1d">U (الكون)</text>
  <circle cx="468" cy="164" r="74" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <circle cx="572" cy="164" r="74" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="432" y="170" font-size="18" font-weight="bold" fill="#0f172a">A</text>
  <text x="608" y="170" font-size="18" font-weight="bold" fill="#0f172a">B</text>
  <text x="520" y="292" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">A^c ∩ B^c</text>

  <text x="340" y="312" text-anchor="middle" font-size="12" fill="#475569">شكل (1.1): متمّم الاتحاد = تقاطع المتمّمات، ومتمّم التقاطع = اتحاد المتمّمات</text>
</svg>
