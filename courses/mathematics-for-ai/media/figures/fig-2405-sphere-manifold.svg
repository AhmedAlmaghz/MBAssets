  <text x="300" y="185" font-family="sans-serif" font-size="13" fill="#1f6feb" text-anchor="middle">sphere S^{n-1}</text>
  <circle cx="430" cy="120" r="6" fill="#222"/>
  <line x1="300" y1="190" x2="430" y2="120" stroke="#888" stroke-width="1.5" stroke-dasharray="4 3"/>
