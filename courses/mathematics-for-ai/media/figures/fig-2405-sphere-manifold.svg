  <path d="M430,120 L520,145" fill="none" stroke="#c00" stroke-width="2.5"/>
  <text x="545" y="140" font-family="sans-serif" font-size="12" fill="#c00" text-anchor="middle">Euclidean grad</text>
  <path d="M430,120 L470,175" fill="none" stroke="#2da44e" stroke-width="2.5"/>
