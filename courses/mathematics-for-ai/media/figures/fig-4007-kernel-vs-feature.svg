<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="380" fill="#fbfbfd"/>
  <text x="340" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2238">Kernel regime vs feature learning</text>

  <!-- two regimes -->
  <g>
    <rect x="60" y="90" width="250" height="150" rx="8" fill="#c9d6ff" stroke="#3b5bdb" stroke-width="2"/>
    <text x="185" y="115" text-anchor="middle" font-size="13" font-weight="600" fill="#3b5bdb">Kernel regime (NTK)</text>
    <text x="185" y="145" text-anchor="middle" font-size="11" fill="#1a2238">- infinite width</text>
    <text x="185" y="165" text-anchor="middle" font-size="11" fill="#1a2238">- features frozen at init</text>
    <text x="185" y="185" text-anchor="middle" font-size="11" fill="#1a2238">- only readout linear</text>
    <text x="185" y="205" text-anchor="middle" font-size="11" fill="#1a2238">- no representation learning</text>
    <text x="185" y="225" text-anchor="middle" font-size="11" fill="#1a2238">- exact but limited capacity</text>
  </g>
  <g>
    <rect x="370" y="90" width="250" height="150" rx="8" fill="#c8e6c9" stroke="#2f9e44" stroke-width="2"/>
    <text x="495" y="115" text-anchor="middle" font-size="13" font-weight="600" fill="#2f9e44">Feature learning</text>
    <text x="495" y="145" text-anchor="middle" font-size="11" fill="#1a2238">- finite / structured width</text>
    <text x="495" y="165" text-anchor="middle" font-size="11" fill="#1a2238">- features evolve in training</text>
    <text x="495" y="185" text-anchor="middle" font-size="11" fill="#1a2238">- NTK changes over time</text>
    <text x="495" y="205" text-anchor="middle" font-size="11" fill="#1a2238">- richer representation</text>
    <text x="495" y="225" text-anchor="middle" font-size="11" fill="#1a2238">- explains deep net success</text>
  </g>

  <line x1="310" y1="165" x2="368" y2="165" stroke="#888" stroke-width="2" marker-end="url(#n1)"/>
  <text x="339" y="158" text-anchor="middle" font-size="10" fill="#888">narrow / deep</text>

  <text x="340" y="290" text-anchor="middle" font-size="12.5" fill="#1a2238">Real deep networks operate mostly OUTSIDE the strict NTK regime.</text>
  <text x="340" y="320" text-anchor="middle" font-size="12.5" fill="#555">NTK is a tractable limit that explains convergence but not why deep nets beat kernels.</text>
</svg>
