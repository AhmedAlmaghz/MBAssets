<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380">
  <rect width="680" height="380" fill="#fbfbfd"/>
  <text x="20" y="28" font-family="sans-serif" font-size="13" fill="#1f6feb" font-weight="bold">Computational graph: f = (x+y)*z</text>

  <!-- leaves -->
  <circle cx="100" cy="120" r="18" fill="#eef4ff" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="100" y="124" font-family="sans-serif" font-size="13" fill="#1f6feb" text-anchor="middle">x</text>
  <circle cx="100" cy="200" r="18" fill="#eef4ff" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="100" y="204" font-family="sans-serif" font-size="13" fill="#1f6feb" text-anchor="middle">y</text>
  <circle cx="100" cy="280" r="18" fill="#eef4ff" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="100" y="284" font-family="sans-serif" font-size="13" fill="#1f6feb" text-anchor="middle">z</text>

  <!-- u = x+y -->
  <circle cx="280" cy="160" r="20" fill="#fff6d8" stroke="#b8860b" stroke-width="1.8"/>
  <text x="280" y="164" font-family="sans-serif" font-size="13" fill="#8a5a00" text-anchor="middle">u=x+y</text>
  <!-- L = u*z -->
  <circle cx="470" cy="220" r="20" fill="#e8f5e8" stroke="#2a7a2a" stroke-width="1.8"/>
  <text x="470" y="224" font-family="sans-serif" font-size="13" fill="#2a7a2a" text-anchor="middle">L=u*z</text>

  <!-- forward edges -->
  <line x1="118" y1="120" x2="260" y2="152" stroke="#333" stroke-width="1.5"/>
  <line x1="118" y1="200" x2="262" y2="172" stroke="#333" stroke-width="1.5"/>
  <line x1="118" y1="280" x2="452" y2="232" stroke="#333" stroke-width="1.5"/>
  <line x1="300" y1="160" x2="450" y2="212" stroke="#333" stroke-width="1.5"/>

  <!-- backward adjoints (red dashed) -->
  <line x1="450" y1="208" x2="302" y2="148" stroke="#c00" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="452" y1="238" x2="120" y2="296" stroke="#c00" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="260" y1="168" x2="118" y2="208" stroke="#c00" stroke-width="1.5" stroke-dasharray="5,4"/>

  <text x="360" y="120" font-family="sans-serif" font-size="11" fill="#333">forward</text>
  <text x="360" y="350" font-family="sans-serif" font-size="11" fill="#c00">backward (adjonts: dL/du, dL/dz, dL/dx...)</text>
  <text x="500" y="320" font-family="sans-serif" font-size="11" fill="#555">dL/dx = z, dL/dy = z, dL/dz = x+y</text>
</svg>
