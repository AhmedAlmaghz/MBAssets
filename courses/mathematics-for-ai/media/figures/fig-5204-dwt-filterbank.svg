  <text x="490" y="144" text-anchor="middle" font-size="10" fill="#5a6770">تقليل</text>
  <rect x="460" y="176" width="60" height="48" rx="7" fill="#f2f7fa" stroke="#5a6770" stroke-width="1.5"/>
