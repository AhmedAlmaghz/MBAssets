  <text x="490" y="214" text-anchor="middle" font-size="10" fill="#5a6770">تقليل</text>
  <text x="340" y="256" font-size="10.5" fill="#5a6770" direction="rtl">إعادة التركيب<tspan direction="ltr" unicode-bidi="isolate">: </tspan>رفع العيّنات<tspan direction="ltr" unicode-bidi="isolate"> ↑ 2 </tspan>ثم الترشيح والجمع<tspan direction="ltr" unicode-bidi="isolate"> (</tspan>مرشّحات ثنائية<tspan direction="ltr" unicode-bidi="isolate">/</tspan>متعامدة<tspan direction="ltr" unicode-bidi="isolate">).</tspan></text>
  <text x="340" y="284" font-size="10.5" fill="#5a6770" direction="rtl">التعقيد O(N) — أرخص من FFT؛ ولذا تُستخدم في الضغط وإزالة الضجيج.</text>
  <text x="340" y="306" font-size="10.5" fill="#5a6770" direction="rtl">الشرط<tspan direction="ltr" unicode-bidi="isolate">: Σ h[n]=√2 </tspan>و<tspan direction="ltr" unicode-bidi="isolate">Σ h[n]h[n-2k]=δ<tspan dy="3.15" font-size="70%">k</tspan><tspan dy="-3.15" font-size="1">&#8203;</tspan> (</tspan>كمال التعميد<tspan direction="ltr" unicode-bidi="isolate">).</tspan></text>
