<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380">
  <rect width="680" height="380" fill="#fbfbfd"/>

  <text x="340" y="28" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">Gradient descent vs natural gradient on an ill-conditioned valley</text>

  <!-- contours -->
  <ellipse cx="330" cy="200" rx="270" ry="110" fill="none" stroke="#9dc4f5" stroke-width="1.4"/>
  <ellipse cx="330" cy="200" rx="215" ry="86" fill="none" stroke="#9dc4f5" stroke-width="1.4"/>
  <ellipse cx="330" cy="200" rx="160" ry="62" fill="none" stroke="#9dc4f5" stroke-width="1.4"/>
  <ellipse cx="330" cy="200" rx="105" ry="40" fill="none" stroke="#9dc4f5" stroke-width="1.4"/>
  <ellipse cx="330" cy="200" rx="52" ry="19" fill="#e8f2ff" stroke="#9dc4f5" stroke-width="1.4"/>
  <circle cx="330" cy="200" r="5" fill="#2a7a2a"/>
  <text x="338" y="196" font-family="sans-serif" font-size="12" fill="#2a7a2a">min</text>

  <!-- GD zigzag -->
  <polyline points="80,80 150,140 190,110 250,165 285,140 320,185 340,170"
            fill="none" stroke="#c00" stroke-width="2.6"/>
  <circle cx="80" cy="80" r="5" fill="#c00"/>
  <text x="52" y="66" font-family="sans-serif" font-size="12" fill="#c00">start</text>
  <text x="96" y="72" font-family="sans-serif" font-size="12" fill="#c00">GD: zigzag, slow</text>

  <!-- NG path -->
  <path d="M80,80 Q230,150 330,200" fill="none" stroke="#1f6feb" stroke-width="3"/>
  <polygon points="330,200 316,192 320,203" fill="#1f6feb"/>
  <text x="150" y="118" font-family="sans-serif" font-size="12" fill="#1f6feb">natural gradient: I^(-1) grad L</text>

  <!-- formulas -->
  <rect x="420" y="296" width="240" height="62" fill="#eef4ff" stroke="#1f6feb" stroke-width="1.2"/>
  <text x="540" y="316" font-family="sans-serif" font-size="12" fill="#1f6feb" text-anchor="middle">theta &lt;- theta - eta grad L      (GD)</text>
  <text x="540" y="334" font-family="sans-serif" font-size="12" fill="#1f6feb" text-anchor="middle">theta &lt;- theta - eta I^(-1) grad L  (NG)</text>
  <text x="540" y="350" font-family="sans-serif" font-size="11" fill="#555" text-anchor="middle">NG path is invariant to re-parametrisation</text>
</svg>
