<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380">
  <rect width="680" height="380" fill="#fbfbfd"/>

  <text x="340" y="28" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">Compression bound: gamma + O( sqrt( k ln n / n ) ), message = k params * b bits</text>

  <!-- axes -->
  <line x1="80" y1="320" x2="640" y2="320" stroke="#222" stroke-width="2"/>
  <line x1="80" y1="60" x2="80" y2="320" stroke="#222" stroke-width="2"/>
  <text x="360" y="352" font-family="sans-serif" font-size="12" fill="#555" text-anchor="middle">k = number of parameters in the compressed description</text>
  <text x="24" y="180" font-family="sans-serif" font-size="12" fill="#555">bound</text>

  <!-- curves for b = 32, 8, 4 -->
  <path d="M100,300 C220,258 340,206 620,150" fill="none" stroke="#c00" stroke-width="2.6"/>
  <text x="570" y="142" font-family="sans-serif" font-size="11" fill="#c00">b = 32 bits</text>

  <path d="M100,310 C220,282 340,252 620,214" fill="none" stroke="#1f6feb" stroke-width="2.6"/>
  <text x="570" y="206" font-family="sans-serif" font-size="11" fill="#1f6feb">b = 8 bits</text>

  <path d="M100,316 C220,298 340,280 620,258" fill="none" stroke="#2a7a2a" stroke-width="2.6"/>
  <text x="570" y="250" font-family="sans-serif" font-size="11" fill="#2a7a2a">b = 4 bits</text>

  <!-- vacuous line -->
  <line x1="100" y1="196" x2="640" y2="196" stroke="#b8860b" stroke-width="1.6" stroke-dasharray="7,4"/>
  <text x="636" y="190" font-family="sans-serif" font-size="10" fill="#b8860b" text-anchor="end">bound = 1 (vacuous above)</text>

  <!-- pruning arrow -->
  <path d="M520,196 C440,206 360,236 240,282" fill="none" stroke="#b8860b" stroke-width="2" stroke-dasharray="6,4"/>
  <polygon points="240,282 254,278 246,290" fill="#b8860b"/>
  <text x="300" y="232" font-family="sans-serif" font-size="11" fill="#b8860b">pruning + quantisation</text>

  <!-- budget box -->
  <rect x="90" y="64" width="208" height="48" fill="#eef4ff" stroke="#1f6feb" stroke-width="1.2"/>
  <text x="194" y="82" font-family="sans-serif" font-size="10" fill="#1f6feb" text-anchor="middle">non vacuous needs k &lt;= n / ln n</text>
  <text x="194" y="98" font-family="sans-serif" font-size="10" fill="#1f6feb" text-anchor="middle">n = 10^9  =&gt;  k &lt;= 4.8*10^7</text>

  <!-- message size note -->
  <rect x="430" y="272" width="200" height="40" fill="#fdf6e6" stroke="#b8860b" stroke-width="1.2"/>
  <text x="530" y="288" font-family="sans-serif" font-size="10" fill="#b8860b" text-anchor="middle">message length = k*b bits</text>
  <text x="530" y="304" font-family="sans-serif" font-size="10" fill="#b8860b" text-anchor="middle">union bound over 2^(k*b) nets</text>
</svg>
