<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="380" fill="#fbfbfd"/>
  <text x="340" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2238">Monoidal category &amp; string diagrams</text>

  <!-- left: boxed morphism with wires -->
  <text x="180" y="80" text-anchor="middle" font-size="12" fill="#3b5bdb">morphism f ⊗ g (parallel)</text>
  <line x1="120" y1="110" x2="120" y2="300" stroke="#555" stroke-width="2"/>
  <line x1="240" y1="110" x2="240" y2="300" stroke="#555" stroke-width="2"/>
  <rect x="100" y="150" width="40" height="60" rx="6" fill="#c9d6ff" stroke="#3b5bdb" stroke-width="2"/>
  <text x="120" y="185" text-anchor="middle" font-size="12" fill="#1a2238">f</text>
  <rect x="220" y="150" width="40" height="60" rx="6" fill="#ffd6e7" stroke="#c2255c" stroke-width="2"/>
  <text x="240" y="185" text-anchor="middle" font-size="12" fill="#1a2238">g</text>
  <text x="120" y="105" text-anchor="middle" font-size="11" fill="#555">A</text>
  <text x="240" y="105" text-anchor="middle" font-size="11" fill="#555">C</text>
  <text x="120" y="322" text-anchor="middle" font-size="11" fill="#555">B</text>
  <text x="240" y="322" text-anchor="middle" font-size="11" fill="#555">D</text>

  <!-- right: sequential composition -->
  <text x="510" y="80" text-anchor="middle" font-size="12" fill="#2f9e44">sequential: g ∘ f</text>
  <line x1="510" y1="110" x2="510" y2="300" stroke="#555" stroke-width="2"/>
  <rect x="490" y="140" width="40" height="50" rx="6" fill="#c9d6ff" stroke="#3b5bdb" stroke-width="2"/>
  <text x="510" y="170" text-anchor="middle" font-size="12" fill="#1a2238">f</text>
  <rect x="490" y="210" width="40" height="50" rx="6" fill="#ffd6e7" stroke="#c2255c" stroke-width="2"/>
  <text x="510" y="240" text-anchor="middle" font-size="12" fill="#1a2238">g</text>
  <text x="510" y="105" text-anchor="middle" font-size="11" fill="#555">A</text>
  <text x="510" y="322" text-anchor="middle" font-size="11" fill="#555">C</text>

  <text x="340" y="355" text-anchor="middle" font-size="11.5" fill="#555">tensor ⊗ = parallel wires; composition = wires joined in series.</text>
</svg>
