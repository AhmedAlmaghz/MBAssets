<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380">
  <rect width="680" height="380" fill="#fbfbfd"/>

  <!-- left: Bernoulli sphere -->
  <circle cx="180" cy="190" r="130" fill="#eef4ff" stroke="#1f6feb" stroke-width="2.4"/>
  <ellipse cx="180" cy="190" rx="130" ry="34" fill="none" stroke="#9dc4f5" stroke-width="1.3"/>
  <text x="180" y="66" font-family="sans-serif" font-size="12" fill="#1f6feb" text-anchor="middle">p = 1 (radius 2 sphere, upper cap)</text>

  <!-- two points on the sphere -->
  <circle cx="103" cy="128" r="6" fill="#c00"/>
  <text x="66" y="118" font-family="sans-serif" font-size="12" fill="#c00">p</text>
  <circle cx="258" cy="132" r="6" fill="#2a7a2a"/>
  <text x="266" y="124" font-family="sans-serif" font-size="12" fill="#2a7a2a">q</text>

  <!-- great circle arc (geodesic) -->
  <path d="M103,128 A130,130 0 0 1 258,132" fill="none" stroke="#c00" stroke-width="3"/>
  <!-- chord (naive) -->
  <line x1="103" y1="128" x2="258" y2="132" stroke="#555" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="150" y="100" font-family="sans-serif" font-size="11" fill="#c00">Fisher-Rao geodesic</text>
  <text x="160" y="158" font-family="sans-serif" font-size="11" fill="#555">straight chord (Euclidean)</text>

  <text x="180" y="345" font-family="sans-serif" font-size="12" fill="#333" text-anchor="middle">Bernoulli: d_F = 2 arccos( sqrt(pq) + sqrt((1-p)(1-q)) )</text>
  <text x="180" y="363" font-family="sans-serif" font-size="11" fill="#555" text-anchor="middle">p = sin^2(phi)  =&gt;  ds^2 = 4 d phi^2,  diameter = pi</text>

  <!-- divider -->
  <line x1="350" y1="40" x2="350" y2="340" stroke="#bbb" stroke-width="1.2"/>

  <!-- right: Poincare half plane for Gaussians -->
  <rect x="390" y="60" width="250" height="250" fill="#f4faff" stroke="#1f6feb" stroke-width="1.4"/>
  <line x1="390" y1="310" x2="640" y2="310" stroke="#333" stroke-width="2"/>
  <text x="515" y="326" font-family="sans-serif" font-size="12" fill="#333" text-anchor="middle">mu</text>
  <text x="372" y="180" font-family="sans-serif" font-size="12" fill="#333">sigma</text>

  <!-- hyperbolic geodesic: semicircle orthogonal to boundary -->
  <path d="M430,310 A120,120 0 0 1 670,310" fill="none" stroke="#c00" stroke-width="2.6"/>
  <line x1="430" y1="310" x2="590" y2="310" stroke="#555" stroke-width="2" stroke-dasharray="6,4"/>
  <circle cx="430" cy="310" r="5" fill="#2a7a2a"/>
  <circle cx="590" cy="310" r="5" fill="#2a7a2a"/>
  <text x="470" y="295" font-family="sans-serif" font-size="11" fill="#c00">hyperbolic geodesic</text>

  <text x="515" y="45" font-family="sans-serif" font-size="12" fill="#333" text-anchor="middle">N(mu, sigma^2): ds^2 = (d mu^2 + 2 d sigma^2)/sigma^2</text>
</svg>
