<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="380" fill="#fbfbfd"/>
  <text x="340" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2238">Training dynamics under NTK</text>

  <!-- loss decay curve -->
  <line x1="80" y1="320" x2="600" y2="320" stroke="#555" stroke-width="1.5"/>
  <line x1="80" y1="60" x2="80" y2="320" stroke="#555" stroke-width="1.5"/>
  <text x="340" y="350" text-anchor="middle" font-size="12" fill="#555">training step t</text>
  <text x="55" y="190" text-anchor="middle" font-size="12" fill="#555" transform="rotate(-90 55 190)">loss / error</text>

  <path d="M90 90 q120 20 220 170 q90 80 280 50" fill="none" stroke="#3b5bdb" stroke-width="2.6"/>
  <text x="180" y="110" font-size="12" fill="#3b5bdb">kernel regime: smooth exponential decay</text>

  <!-- kernel stays constant -->
  <g>
    <rect x="430" y="80" width="120" height="60" rx="6" fill="#c8e6c9" stroke="#2f9e44" stroke-width="2"/>
    <text x="490" y="105" text-anchor="middle" font-size="11" fill="#1a2238">Theta(t)</text>
    <text x="490" y="125" text-anchor="middle" font-size="11" fill="#1a2238">= Theta(0)</text>
  </g>
  <line x1="360" y1="120" x2="428" y2="110" stroke="#888" stroke-width="1.4" marker-end="url(#n1)"/>

  <text x="340" y="365" text-anchor="middle" font-size="12.5" fill="#555">f(t)-y = (I - e^{-Theta t})(f(0)-y): closed-form convergence.</text>
</svg>
