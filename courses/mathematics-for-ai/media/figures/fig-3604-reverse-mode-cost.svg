<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380">
  <rect width="680" height="380" fill="#fbfbfd"/>
  <text x="20" y="28" font-family="sans-serif" font-size="13" fill="#1f6feb" font-weight="bold">Reverse-mode vs forward-mode cost</text>

  <!-- axes -->
  <line x1="80" y1="330" x2="640" y2="330" stroke="#999" stroke-width="1"/>
  <text x="360" y="358" font-family="sans-serif" font-size="11" fill="#555" text-anchor="middle">input dimension n</text>

  <!-- reverse mode bar (~constant) -->
  <rect x="120" y="120" width="140" height="210" fill="#2a7a2a"/>
  <text x="190" y="112" font-family="sans-serif" font-size="11" fill="#2a7a2a" text-anchor="middle">reverse: ~3x fwd</text>

  <!-- forward mode bar (grows with n) -->
  <rect x="420" y="40" width="140" height="290" fill="#c00"/>
  <text x="490" y="32" font-family="sans-serif" font-size="11" fill="#c00" text-anchor="middle">forward: n x fwd</text>

  <text x="20" y="370" font-family="sans-serif" font-size="10" fill="#555">Reverse mode computes all gradients in O(1) forward-passes; forward mode needs O(n)</text>
</svg>
