<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="Latin Modern, serif">
  <rect width="680" height="320" fill="#fafafa"/>
  <text x="340" y="26" text-anchor="middle" font-size="16" fill="#222">Naive Bayes (Conditional Independence)</text>

  <defs>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#222"/>
    </marker>
  </defs>

  <!-- class node -->
  <circle cx="340" cy="90" r="34" fill="#2a6f97" stroke="#222" stroke-width="1.5"/>
  <text x="340" y="95" text-anchor="middle" font-size="13" fill="#fff">C</text>

  <!-- feature nodes -->
  <circle cx="140" cy="210" r="32" fill="#e07a1f" stroke="#222" stroke-width="1.5"/>
  <text x="140" y="215" text-anchor="middle" font-size="13" fill="#fff">X1</text>
  <circle cx="340" cy="210" r="32" fill="#e07a1f" stroke="#222" stroke-width="1.5"/>
  <text x="340" y="215" text-anchor="middle" font-size="13" fill="#fff">X2</text>
  <circle cx="540" cy="210" r="32" fill="#e07a1f" stroke="#222" stroke-width="1.5"/>
  <text x="540" y="215" text-anchor="middle" font-size="13" fill="#fff">X3</text>

  <!-- edges C -> Xi -->
  <line x1="320" y1="118" x2="160" y2="184" stroke="#222" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="340" y1="124" x2="340" y2="178" stroke="#222" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="360" y1="118" x2="520" y2="184" stroke="#222" stroke-width="2" marker-end="url(#a2)"/>

  <text x="340" y="280" text-anchor="middle" font-size="12" fill="#555">No X_i-X_j edges => P(X1,X2,X3|C)=prod P(X_i|C).</text>
</svg>
