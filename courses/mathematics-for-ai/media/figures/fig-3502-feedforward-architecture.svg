<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380">
  <rect width="680" height="380" fill="#fbfbfd"/>
  <text x="20" y="28" font-family="sans-serif" font-size="13" fill="#1f6feb" font-weight="bold">Feedforward architecture (depth L)</text>

  <!-- input layer -->
  <circle cx="90" cy="120" r="16" fill="#eef4ff" stroke="#1f6feb" stroke-width="1.5"/>
  <circle cx="90" cy="170" r="16" fill="#eef4ff" stroke="#1f6feb" stroke-width="1.5"/>
  <circle cx="90" cy="220" r="16" fill="#eef4ff" stroke="#1f6feb" stroke-width="1.5"/>
  <circle cx="90" cy="270" r="16" fill="#eef4ff" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="55" y="140" font-family="sans-serif" font-size="11" fill="#555">x (in)</text>

  <!-- hidden 1 -->
  <circle cx="270" cy="100" r="16" fill="#fff6d8" stroke="#b8860b" stroke-width="1.5"/>
  <circle cx="270" cy="150" r="16" fill="#fff6d8" stroke="#b8860b" stroke-width="1.5"/>
  <circle cx="270" cy="200" r="16" fill="#fff6d8" stroke="#b8860b" stroke-width="1.5"/>
  <circle cx="270" cy="250" r="16" fill="#fff6d8" stroke="#b8860b" stroke-width="1.5"/>
  <circle cx="270" cy="300" r="16" fill="#fff6d8" stroke="#b8860b" stroke-width="1.5"/>

  <!-- hidden 2 -->
  <circle cx="430" cy="120" r="16" fill="#fff6d8" stroke="#b8860b" stroke-width="1.5"/>
  <circle cx="430" cy="170" r="16" fill="#fff6d8" stroke="#b8860b" stroke-width="1.5"/>
  <circle cx="430" cy="220" r="16" fill="#fff6d8" stroke="#b8860b" stroke-width="1.5"/>
  <circle cx="430" cy="270" r="16" fill="#fff6d8" stroke="#b8860b" stroke-width="1.5"/>

  <!-- output -->
  <circle cx="600" cy="190" r="16" fill="#e8f5e8" stroke="#2a7a2a" stroke-width="1.5"/>
  <circle cx="600" cy="240" r="16" fill="#e8f5e8" stroke="#2a7a2a" stroke-width="1.5"/>
  <text x="600" y="285" font-family="sans-serif" font-size="11" fill="#2a7a2a" text-anchor="middle">out</text>

  <!-- edges L1 -->
  <line x1="106" y1="120" x2="254" y2="100" stroke="#bbb" stroke-width="1"/>
  <line x1="106" y1="120" x2="254" y2="150" stroke="#bbb" stroke-width="1"/>
  <line x1="106" y1="120" x2="254" y2="300" stroke="#bbb" stroke-width="1"/>
  <line x1="106" y1="270" x2="254" y2="100" stroke="#bbb" stroke-width="1"/>
  <line x1="106" y1="270" x2="254" y2="300" stroke="#bbb" stroke-width="1"/>
  <!-- edges L2 -->
  <line x1="286" y1="100" x2="414" y2="120" stroke="#bbb" stroke-width="1"/>
  <line x1="286" y1="200" x2="414" y2="220" stroke="#bbb" stroke-width="1"/>
  <line x1="286" y1="300" x2="414" y2="120" stroke="#bbb" stroke-width="1"/>
  <!-- edges L3 -->
  <line x1="446" y1="120" x2="584" y2="190" stroke="#bbb" stroke-width="1"/>
  <line x1="446" y1="270" x2="584" y2="240" stroke="#bbb" stroke-width="1"/>

  <!-- layer labels -->
  <text x="270" y="335" font-family="sans-serif" font-size="11" fill="#555" text-anchor="middle">sigma(W1 x + b1)</text>
  <text x="430" y="335" font-family="sans-serif" font-size="11" fill="#555" text-anchor="middle">sigma(W2 a1 + b2)</text>
  <text x="600" y="335" font-family="sans-serif" font-size="11" fill="#555" text-anchor="middle">f(x)</text>

  <text x="180" y="360" font-family="sans-serif" font-size="11" fill="#1f6feb">a^(0)=x</text>
  <text x="350" y="360" font-family="sans-serif" font-size="11" fill="#1f6feb">a^(l)=sigma(W a + b)</text>
  <text x="540" y="360" font-family="sans-serif" font-size="11" fill="#1f6feb">a^(L)=f(x)</text>
</svg>
