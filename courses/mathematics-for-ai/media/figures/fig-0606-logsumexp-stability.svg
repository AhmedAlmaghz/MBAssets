<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" width="780" height="460">
  <rect x="0" y="0" width="780" height="460" fill="#ffffff"/>

  <text x="390" y="30" text-anchor="middle" font-size="19" fill="#111111" font-family="Times New Roman, serif">Stable softmax:  LSE(z) = m + log &#931; exp(z_i - m) ,  m = max_i z_i</text>
  <text x="390" y="54" text-anchor="middle" font-size="14" fill="#555555" font-family="Segoe UI, Tahoma, sans-serif">الإزاحة بمقدار m لا تغيّر الناتج رياضياً لكنها تمنع الفيضان (overflow) والانهيار (underflow)</text>

  <!-- ===== Left : exp curve with overflow thresholds ===== -->
  <line x1="60" y1="360" x2="400" y2="360" stroke="#333333" stroke-width="2"/>
  <line x1="60" y1="360" x2="60" y2="90" stroke="#333333" stroke-width="2"/>
  <text x="404" y="368" font-size="13" fill="#666666" font-family="Times New Roman, serif">z</text>
  <text x="46" y="96" font-size="13" fill="#666666" font-family="Times New Roman, serif">e&#7580;</text>

  <path d="M60,352 C120,350 170,340 200,318 C240,288 260,240 275,190 C290,140 300,100 310,96"
        fill="none" stroke="#1b3a8a" stroke-width="2.6"/>
  <text x="200" y="330" font-size="15" fill="#1b3a8a" font-family="Times New Roman, serif">exp(z)</text>

  <!-- fp16 threshold -->
  <line x1="196" y1="360" x2="196" y2="90" stroke="#b03030" stroke-width="1.6" stroke-dasharray="6,4"/>
  <text x="192" y="106" text-anchor="end" font-size="12" fill="#b03030" font-family="Times New Roman, serif">fp16: 11.09</text>
  <!-- fp32 threshold -->
  <line x1="276" y1="360" x2="276" y2="90" stroke="#b03030" stroke-width="1.6" stroke-dasharray="6,4"/>
  <text x="272" y="126" text-anchor="end" font-size="12" fill="#b03030" font-family="Times New Roman, serif">fp32: 88.72</text>
  <!-- fp64 threshold -->
  <line x1="356" y1="360" x2="356" y2="90" stroke="#b03030" stroke-width="1.6" stroke-dasharray="6,4"/>
  <text x="352" y="146" text-anchor="end" font-size="12" fill="#b03030" font-family="Times New Roman, serif">fp64: 709.78</text>

  <rect x="276" y="90" width="124" height="270" fill="#b03030" fill-opacity="0.07"/>
  <text x="338" y="350" text-anchor="middle" font-size="13" fill="#b03030" font-family="Times New Roman, serif">overflow</text>

  <text x="60" y="384" font-size="14" fill="#111111" font-family="Times New Roman, serif">max representable:  fp16 65504 ,  fp32 3.4e38 ,  fp64 1.8e308</text>
  <text x="60" y="408" font-size="14" fill="#111111" font-family="Times New Roman, serif">z &gt; log(max) &#1600; &#1600; e&#7580; = &#8734; &#1600; &#1600; softmax = NaN</text>
  <text x="60" y="432" font-size="13" fill="#555555" font-family="Segoe UI, Tahoma, sans-serif">&#1605;&#1593; &#1575;&#1604;&#1573;&#1586;&#1575;&#1581;&#1577;:  z_i - m &#8804; 0 &#1601;&#1600; e^(z_i - m) &#8712; (0, 1] &#1583;&#1575;&#1574;&#1605;&#1575;&#1611;</text>

  <!-- ===== Right : naive vs shifted ===== -->
  <text x="620" y="92" text-anchor="middle" font-size="16" fill="#111111" font-family="Times New Roman, serif">z = (1000, 1001, 999)</text>
  <line x1="450" y1="104" x2="760" y2="104" stroke="#999999" stroke-width="1"/>

  <rect x="450" y="116" width="300" height="66" fill="#f7dcdc" stroke="#7a1f1f" stroke-width="2"/>
  <text x="460" y="138" font-size="14" fill="#7a1f1f" font-family="Times New Roman, serif">naive:  exp(1000) = inf</text>
  <text x="460" y="160" font-size="14" fill="#7a1f1f" font-family="Times New Roman, serif">&#931; = inf  &#8658;  inf/inf = NaN</text>
  <text x="460" y="178" font-size="13" fill="#7a1f1f" font-family="Segoe UI, Tahoma, sans-serif">&#1575;&#1604;&#1606;&#1605;&#1608;&#1584;&#1580; &#1610;&#1605;&#1608;&#1578; &#1605;&#1606; &#1571;&#1608;&#1604; &#1583;&#1601;&#1593;&#1577;</text>

  <rect x="450" y="192" width="300" height="86" fill="#eaf5ec" stroke="#2f7a4a" stroke-width="2"/>
  <text x="460" y="214" font-size="14" fill="#111111" font-family="Times New Roman, serif">shifted:  m = 1001</text>
  <text x="460" y="236" font-size="14" fill="#111111" font-family="Times New Roman, serif">exp(z - m) = (e&#8315;&#185;, 1, e&#8315;&#178;)</text>
  <text x="460" y="258" font-size="14" fill="#111111" font-family="Times New Roman, serif">= (0.3679, 1.0000, 0.1353)</text>
  <text x="460" y="274" font-size="13" fill="#2f7a4a" font-family="Segoe UI, Tahoma, sans-serif">&#1604;&#1575; &#1601;&#1610;&#1590;&#1575;&#1606; &#1608;&#1604;&#1575; &#1575;&#1606;&#1607;&#1610;&#1575;&#1585;</text>

  <line x1="450" y1="292" x2="760" y2="292" stroke="#999999" stroke-width="1"/>

  <text x="450" y="318" font-size="14" fill="#111111" font-family="Times New Roman, serif">softmax(z) = softmax(z + c&#183;1)</text>
  <text x="450" y="342" font-size="14" fill="#111111" font-family="Times New Roman, serif">log softmax(z) = z - LSE(z)</text>
  <text x="450" y="366" font-size="14" fill="#111111" font-family="Times New Roman, serif">LSE &#8805; max z ,  LSE &#8804; max z + log n</text>
  <text x="450" y="392" font-size="13" fill="#555555" font-family="Segoe UI, Tahoma, sans-serif">&#1602;&#1575;&#1593;&#1583;&#1577; &#1593;&#1605;&#1604;&#1610;&#1577;: &#1575;&#1581;&#1587;&#1576; &#1583;&#1575;&#1574;&#1605;&#1575;&#1611; &#1576;&#1600; log-softmax</text>
  <text x="450" y="414" font-size="13" fill="#555555" font-family="Segoe UI, Tahoma, sans-serif">&#1608;&#1604;&#1575; &#1578;&#1581;&#1587;&#1576; log(softmax(z)) &#1605;&#1606;&#1601;&#1585;&#1583;&#1575;&#1611;</text>
  <text x="450" y="438" font-size="13" fill="#555555" font-family="Times New Roman, serif">fp16 training &#1600; &#1575;&#1581;&#1601;&#1592; &#1575;&#1604;&#1571;&#1608;&#1586;&#1575;&#1606; &#1576;&#1600; fp32 (master weights)</text>
</svg>
