<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="680" height="380" font-family="Tajawal, Noto Naskh Arabic, sans-serif">
  <rect width="680" height="380" fill="#ffffff"/>
  <text x="664" y="26" text-anchor="end" font-size="15" fill="#1f4e6b" font-weight="700">من الطيف إلى الموجة: المُرمِّز الصوتي العصبي</text>
  <text x="664" y="44" text-anchor="end" font-size="11" fill="#5a6770">Neural vocoder: spectrum → waveform</text>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6770"/></marker></defs>
  <rect x="40" y="150" width="150" height="56" rx="7" fill="#f2f7fa" stroke="#1f4e6b" stroke-width="1.5"/>
  <text x="115" y="176" text-anchor="middle" font-size="12.5" fill="#1c2b36" font-weight="700">log-mel</text>
  <text x="115" y="192" text-anchor="middle" font-size="10" fill="#5a6770">طيف مضغوط</text>
  <line x1="190" y1="178" x2="240" y2="178" stroke="#5a6770" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="240" y="150" width="190" height="56" rx="7" fill="#f2f7fa" stroke="#1f4e6b" stroke-width="1.5"/>
  <text x="335" y="176" text-anchor="middle" font-size="12.5" fill="#1c2b36" font-weight="700">شبكة توليدية</text>
  <text x="335" y="192" text-anchor="middle" font-size="10" fill="#5a6770">WaveNet / HiFi-GAN / Diffusion</text>
  <line x1="430" y1="178" x2="480" y2="178" stroke="#5a6770" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="480" y="150" width="160" height="56" rx="7" fill="#f2f7fa" stroke="#7a9e3c" stroke-width="1.5"/>
  <text x="560" y="176" text-anchor="middle" font-size="12.5" fill="#1c2b36" font-weight="700">x[n] @ 24 kHz</text>
  <text x="560" y="192" text-anchor="middle" font-size="10" fill="#5a6770">الموجة</text>
  <text x="340" y="250" font-size="10.5" fill="#5a6770" direction="rtl">التحدّي: إعادة بناء الطور (phase) المفقود في الطيف — إمّا تعلمه، وإما تقديره (Griffin–Lim).</text>
  <text x="340" y="272" font-size="10.5" fill="#5a6770" direction="rtl">الانتشار على الإشارات يولّد الطور مباشرةً ويبدع عيّنات عالية الدقّة.</text>
</svg>