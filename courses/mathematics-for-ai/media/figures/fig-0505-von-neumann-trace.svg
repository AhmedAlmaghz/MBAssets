<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" width="780" height="440">
  <rect x="0" y="0" width="780" height="440" fill="#ffffff"/>

  <text x="390" y="30" text-anchor="middle" font-size="19" fill="#111111" font-family="Times New Roman, serif">von Neumann trace inequality:  |tr(AᵀB)| &#8804; &#931;_i &#963;_i(A)&#183;&#963;_i(B)</text>
  <text x="390" y="54" text-anchor="middle" font-size="14" fill="#555555" font-family="Segoe UI, Tahoma, sans-serif">أفضل ترتيب للقيم المفردة هو التنازلي المتقابل — متراجحة إعادة الترتيب</text>

  <!-- ============ Left : singular value bars ============ -->
  <line x1="50" y1="290" x2="420" y2="290" stroke="#333333" stroke-width="1.5"/>

  <rect x="70" y="90" width="36" height="200" fill="#dbe6ff" stroke="#1b3a8a" stroke-width="2"/>
  <rect x="120" y="170" width="36" height="120" fill="#dbe6ff" stroke="#1b3a8a" stroke-width="2"/>
  <rect x="170" y="250" width="36" height="40" fill="#dbe6ff" stroke="#1b3a8a" stroke-width="2"/>
  <text x="88" y="82" text-anchor="middle" font-size="14" fill="#111111" font-family="Times New Roman, serif">5.0</text>
  <text x="138" y="162" text-anchor="middle" font-size="14" fill="#111111" font-family="Times New Roman, serif">3.0</text>
  <text x="188" y="242" text-anchor="middle" font-size="14" fill="#111111" font-family="Times New Roman, serif">1.0</text>

  <rect x="250" y="130" width="36" height="160" fill="#ffe3d1" stroke="#b05020" stroke-width="2"/>
  <rect x="300" y="190" width="36" height="100" fill="#ffe3d1" stroke="#b05020" stroke-width="2"/>
  <rect x="350" y="258" width="36" height="32" fill="#ffe3d1" stroke="#b05020" stroke-width="2"/>
  <text x="268" y="122" text-anchor="middle" font-size="14" fill="#111111" font-family="Times New Roman, serif">4.0</text>
  <text x="318" y="182" text-anchor="middle" font-size="14" fill="#111111" font-family="Times New Roman, serif">2.5</text>
  <text x="368" y="250" text-anchor="middle" font-size="14" fill="#111111" font-family="Times New Roman, serif">0.8</text>

  <text x="138" y="312" text-anchor="middle" font-size="15" fill="#1b3a8a" font-family="Times New Roman, serif">&#963;(A)</text>
  <text x="318" y="312" text-anchor="middle" font-size="15" fill="#b05020" font-family="Times New Roman, serif">&#963;(B)</text>
  <text x="228" y="336" text-anchor="middle" font-size="15" fill="#111111" font-family="Times New Roman, serif">both sorted decreasing</text>
  <text x="228" y="360" text-anchor="middle" font-size="15" fill="#111111" font-family="Times New Roman, serif">5&#183;4 + 3&#183;2.5 + 1&#183;0.8 = 28.30</text>

  <!-- ============ Right : rearrangement ============ -->
  <rect x="450" y="90" width="300" height="86" fill="#eef4ff" stroke="#1b3a8a" stroke-width="1.6"/>
  <text x="466" y="116" font-size="15" fill="#111111" font-family="Times New Roman, serif">aligned (maximum)</text>
  <text x="466" y="142" font-size="15" fill="#111111" font-family="Times New Roman, serif">5&#183;4 + 3&#183;2.5 + 1&#183;0.8</text>
  <text x="466" y="166" font-size="15" fill="#0f2a66" font-family="Times New Roman, serif">= 28.30</text>

  <rect x="450" y="196" width="300" height="86" fill="#f6f0ee" stroke="#b05020" stroke-width="1.6"/>
  <text x="466" y="222" font-size="15" fill="#111111" font-family="Times New Roman, serif">reversed (minimum)</text>
  <text x="466" y="248" font-size="15" fill="#111111" font-family="Times New Roman, serif">5&#183;0.8 + 3&#183;2.5 + 1&#183;4</text>
  <text x="466" y="272" font-size="15" fill="#7a3410" font-family="Times New Roman, serif">= 15.50</text>

  <text x="450" y="312" font-size="15" fill="#111111" font-family="Times New Roman, serif">any other pairing lies between</text>
  <text x="450" y="336" font-size="14" fill="#333333" font-family="Segoe UI, Tahoma, sans-serif">كل ترتيب آخر يقع بين الحدّين</text>

  <line x1="40" y1="380" x2="740" y2="380" stroke="#999999" stroke-width="1"/>
  <text x="390" y="404" text-anchor="middle" font-size="16" fill="#111111" font-family="Times New Roman, serif">|tr(AᵀB)| &#8804; &#10216;&#963;(A), &#963;(B)&#10217; &#8804; ||A||_p&#183;||B||_q  (Schatten H&#246;lder, 1/p + 1/q = 1)</text>
  <text x="390" y="428" text-anchor="middle" font-size="16" fill="#111111" font-family="Times New Roman, serif">&#8804; ||A||_op&#183;||B||_tr ;&#160;&#160;&#160; |tr(AᵀB)| &#8804; ||A||_F&#183;||B||_F</text>
</svg>
