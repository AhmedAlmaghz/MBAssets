<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" font-family="Latin Modern, serif">
  <rect width="680" height="340" fill="#fafafa"/>
  <text x="340" y="26" text-anchor="middle" font-size="16" fill="#222">Standard Continuous Densities (PDF)</text>

  <!-- axes -->
  <line x1="60" y1="300" x2="640" y2="300" stroke="#222"/>
  <line x1="60" y1="40" x2="60" y2="300" stroke="#222"/>
  <text x="350" y="325" text-anchor="middle" font-size="12" fill="#222">x</text>

  <!-- Normal(0,1) -->
  <path d="M60,300 C180,300 250,80 330,80 C410,80 480,300 600,300" fill="none" stroke="#2a6f97" stroke-width="2.5"/>
  <!-- Laplace(0,1) -->
  <path d="M60,300 L330,90 L600,300" fill="none" stroke="#e07a1f" stroke-width="2.5"/>
  <!-- Exponential(1) -->
  <path d="M120,300 C160,220 200,150 240,110 C300,60 360,55 420,52 L600,50" fill="none" stroke="#3a923a" stroke-width="2.5"/>
  <!-- Uniform(-2,2) -->
  <path d="M250,120 L430,120" fill="none" stroke="#b5333a" stroke-width="3"/>
  <path d="M250,300 L250,120" fill="none" stroke="#b5333a" stroke-width="2"/>
  <path d="M430,300 L430,120" fill="none" stroke="#b5333a" stroke-width="2"/>

  <!-- legend -->
  <g font-size="11" fill="#222">
    <rect x="470" y="60" width="14" height="14" fill="#2a6f97"/><text x="490" y="72">N(0,1)</text>
    <rect x="470" y="80" width="14" height="14" fill="#e07a1f"/><text x="490" y="92">Laplace(0,1)</text>
    <rect x="470" y="100" width="14" height="14" fill="#3a923a"/><text x="490" y="112">Exp(1)</text>
    <rect x="470" y="120" width="14" height="14" fill="#b5333a"/><text x="490" y="132">Unif(-2,2)</text>
  </g>
  <text x="340" y="325" text-anchor="middle" font-size="12" fill="#555">f(x): weight init, noise priors, survival times, regularizers</text>
</svg>
