<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="680" height="320" font-family="Segoe UI, Tahoma, Arial, sans-serif">
  <rect width="680" height="320" fill="#ffffff"/>
  <text x="340" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">نظرية الإسقاط المتعامد: أقرب نقطة في W إلى y</text>

  <defs>
    <marker id="c201" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#1d4ed8"/>
    </marker>
    <marker id="c202" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#b91c1c"/>
    </marker>
    <marker id="c203" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- الأصل -->
  <circle cx="120" cy="230" r="3" fill="#0f172a"/>
  <text x="112" y="250" font-size="12" fill="#475569">0</text>

  <!-- فضاء جزئي W: مستقيم مائل -->
  <line x1="60" y1="276" x2="620" y2="70" stroke="#1d4ed8" stroke-width="4"/>
  <text x="612" y="60" font-size="15" font-weight="bold" fill="#1d4ed8">W</text>

  <!-- y -->
  <line x1="120" y1="230" x2="330" y2="90" stroke="#b91c1c" stroke-width="3" marker-end="url(#c202)"/>
  <text x="340" y="82" font-size="15" font-weight="bold" fill="#b91c1c">y</text>

  <!-- الإسقاط -->
  <line x1="120" y1="230" x2="292" y2="164" stroke="#16a34a" stroke-width="3" marker-end="url(#c203)"/>
  <text x="228" y="150" font-size="15" font-weight="bold" fill="#16a34a">ŷ = P_W y</text>

  <!-- الباقي المتعامد -->
  <line x1="292" y1="164" x2="330" y2="90" stroke="#a16207" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#c203)"/>
  <text x="330" y="130" font-size="14" font-weight="bold" fill="#a16207">e = y − ŷ</text>

  <!-- علامة القائمة -->
  <rect x="284" y="128" width="18" height="18" fill="none" stroke="#a16207" stroke-width="2"/>
  <text x="306" y="146" font-size="12" fill="#a16207">⊥</text>

  <rect x="40" y="286" width="600" height="28" rx="4" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="340" y="305" text-anchor="middle" font-size="13" fill="#0f172a">y − P_W y ⟂ W  ⟹  ‖y − w‖ أصغري عندما w = P_W y</text>
</svg>
