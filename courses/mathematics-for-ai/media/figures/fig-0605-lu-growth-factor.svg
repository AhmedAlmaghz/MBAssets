<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 450" width="780" height="450">
  <rect x="0" y="0" width="780" height="450" fill="#ffffff"/>

  <text x="390" y="30" text-anchor="middle" font-size="19" fill="#111111" font-family="Times New Roman, serif">LU with partial pivoting:  ||&#916;A||&#8734; &#8804; c n u &#961; ||A||&#8734; ,  &#961; = max|u_ij| / max|a_ij|</text>
  <text x="390" y="54" text-anchor="middle" font-size="14" fill="#555555" font-family="Segoe UI, Tahoma, sans-serif">عامل النموّ &#961; هو «مكبّر الخطأ» في الإزاحة الغاوسية — والتدوير الجزئي يروّضه عملياً</text>

  <!-- ===== Left : pivoting sketch ===== -->
  <text x="120" y="88" text-anchor="middle" font-size="15" fill="#111111" font-family="Times New Roman, serif">A</text>
  <rect x="70" y="98" width="100" height="100" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
  <line x1="70" y1="131" x2="170" y2="131" stroke="#dddddd" stroke-width="1"/>
  <line x1="70" y1="164" x2="170" y2="164" stroke="#dddddd" stroke-width="1"/>
  <line x1="103" y1="98" x2="103" y2="198" stroke="#dddddd" stroke-width="1"/>
  <line x1="137" y1="98" x2="137" y2="198" stroke="#dddddd" stroke-width="1"/>
  <text x="86" y="124" font-size="13" fill="#111111" font-family="Times New Roman, serif">1</text>
  <text x="120" y="124" font-size="13" fill="#111111" font-family="Times New Roman, serif">1</text>
  <text x="153" y="124" font-size="13" fill="#b03030" font-family="Times New Roman, serif">1</text>
  <text x="86" y="157" font-size="13" fill="#111111" font-family="Times New Roman, serif">1</text>
  <text x="120" y="157" font-size="13" fill="#b03030" font-family="Times New Roman, serif">1</text>
  <text x="153" y="157" font-size="13" fill="#111111" font-family="Times New Roman, serif">1</text>
  <text x="86" y="190" font-size="13" fill="#111111" font-family="Times New Roman, serif">1</text>
  <text x="120" y="190" font-size="13" fill="#b03030" font-family="Times New Roman, serif">-1</text>
  <text x="153" y="190" font-size="13" fill="#111111" font-family="Times New Roman, serif">1</text>

  <text x="215" y="152" font-size="18" fill="#333333" font-family="Times New Roman, serif">&#8594;</text>

  <text x="290" y="88" text-anchor="middle" font-size="15" fill="#111111" font-family="Times New Roman, serif">U  (after elimination)</text>
  <rect x="240" y="98" width="100" height="100" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
  <line x1="240" y1="131" x2="340" y2="131" stroke="#dddddd" stroke-width="1"/>
  <line x1="240" y1="164" x2="340" y2="164" stroke="#dddddd" stroke-width="1"/>
  <line x1="273" y1="98" x2="273" y2="198" stroke="#dddddd" stroke-width="1"/>
  <line x1="307" y1="98" x2="307" y2="198" stroke="#dddddd" stroke-width="1"/>
  <text x="256" y="124" font-size="13" fill="#111111" font-family="Times New Roman, serif">1</text>
  <text x="290" y="124" font-size="13" fill="#111111" font-family="Times New Roman, serif">1</text>
  <text x="323" y="124" font-size="13" fill="#111111" font-family="Times New Roman, serif">1</text>
  <text x="256" y="157" font-size="13" fill="#b03030" font-family="Times New Roman, serif">0</text>
  <text x="290" y="157" font-size="13" fill="#b03030" font-family="Times New Roman, serif">2</text>
  <text x="323" y="157" font-size="13" fill="#111111" font-family="Times New Roman, serif">0</text>
  <text x="256" y="190" font-size="13" fill="#b03030" font-family="Times New Roman, serif">0</text>
  <text x="290" y="190" font-size="13" fill="#b03030" font-family="Times New Roman, serif">0</text>
  <text x="323" y="190" font-size="13" fill="#b03030" font-family="Times New Roman, serif">4</text>

  <text x="180" y="228" text-anchor="middle" font-size="14" fill="#b03030" font-family="Times New Roman, serif">&#961; = 4 / 1 = 4  &#1600; (&#1606;&#1605;&#1608;&#1617;&#1584; &#1608;&#1610;&#1604;&#1603;&#1606;&#1587;&#1608;&#1606;: 2^(n-1) = 4)</text>

  <text x="180" y="264" text-anchor="middle" font-size="14" fill="#111111" font-family="Times New Roman, serif">&#1575;&#1604;&#1581;&#1583; &#1575;&#1604;&#1571;&#1587;&#1608;&#1571; &#1604;&#1608;&#1610;&#1604;&#1603;&#1606;&#1587;&#1608;&#1606;</text>
  <text x="180" y="288" text-anchor="middle" font-size="16" fill="#111111" font-family="Times New Roman, serif">&#961; &#8804; 2^(n-1)  &#1600; &#1608;&#1607;&#1608; &#1581;&#1575;&#1583;&#1617;</text>
  <text x="180" y="314" text-anchor="middle" font-size="14" fill="#333333" font-family="Segoe UI, Tahoma, sans-serif">&#1604;&#1603;&#1606; &#1593;&#1605;&#1604;&#1610;&#1575;&#1611; &#1610;&#1606;&#1575;&#1583;&#1585; &#1571;&#1606; &#1610;&#1578;&#1580;&#1575;&#1608;&#1586; n</text>
  <text x="180" y="340" text-anchor="middle" font-size="14" fill="#333333" font-family="Segoe UI, Tahoma, sans-serif">&#1605;&#1606; &#1583;&#1608;&#1606; &#1578;&#1583;&#1608;&#1610;&#1585;: &#1575;&#1604;&#1593;&#1606;&#1589;&#1585; &#1575;&#1604;&#1605;&#1581;&#1608;&#1585;&#1610; &#1602;&#1583; &#1610;&#1603;&#1608;&#1606; &#1589;&#1601;&#1585;&#1575;&#1611;</text>
  <text x="180" y="366" text-anchor="middle" font-size="13" fill="#555555" font-family="Times New Roman, serif">&#1575;&#1604;&#1578;&#1583;&#1608;&#1610;&#1585; &#1575;&#1604;&#1580;&#1586;&#1574;&#1610; &#1610;&#1590;&#1605;&#1606; |l_ij| &#8804; 1</text>
  <text x="180" y="392" text-anchor="middle" font-size="13" fill="#555555" font-family="Times New Roman, serif">&#1608;&#1575;&#1604;&#1603;&#1575;&#1605;&#1604; &#1610;&#1590;&#1605;&#1606; &#961; &#8804; &#8730;(n &#183; 2 &#183; 3 &#183;&#183;&#183; n)</text>

  <!-- ===== Right : iterative refinement ===== -->
  <text x="620" y="88" text-anchor="middle" font-size="16" fill="#111111" font-family="Times New Roman, serif">iterative refinement</text>
  <line x1="450" y1="100" x2="760" y2="100" stroke="#999999" stroke-width="1"/>

  <text x="450" y="126" font-size="14" fill="#111111" font-family="Times New Roman, serif">r &#8592; b - A x  (&#1601;&#1610; &#1583;&#1602;&#1577; &#1571;&#1593;&#1604;&#1609;)</text>
  <text x="450" y="150" font-size="14" fill="#111111" font-family="Times New Roman, serif">d &#8592; A&#8315;&#185; r  ;  x &#8592; x + d</text>
  <line x1="450" y1="162" x2="760" y2="162" stroke="#999999" stroke-width="1"/>

  <text x="450" y="192" font-size="14" fill="#111111" font-family="Times New Roman, serif">||r_k|| / ||b||</text>
  <rect x="600" y="180" width="150" height="18" fill="#dbe6ff" stroke="#1b3a8a" stroke-width="1.4"/>
  <text x="606" y="195" font-size="12" fill="#111111" font-family="Times New Roman, serif">k=0 : 1.0e-2</text>

  <rect x="600" y="204" width="104" height="18" fill="#dbe6ff" stroke="#1b3a8a" stroke-width="1.4"/>
  <text x="606" y="219" font-size="12" fill="#111111" font-family="Times New Roman, serif">k=1 : 3.1e-7</text>

  <rect x="600" y="228" width="58" height="18" fill="#dbe6ff" stroke="#1b3a8a" stroke-width="1.4"/>
  <text x="606" y="243" font-size="12" fill="#111111" font-family="Times New Roman, serif">k=2 : 4.4e-15</text>

  <rect x="600" y="252" width="40" height="18" fill="#eaf5ec" stroke="#2f7a4a" stroke-width="1.4"/>
  <text x="606" y="267" font-size="12" fill="#2f7a4a" font-family="Times New Roman, serif">k=3 : &#1605;&#1587;&#1578;&#1602;&#1585;</text>

  <line x1="450" y1="288" x2="760" y2="288" stroke="#999999" stroke-width="1"/>
  <text x="450" y="312" font-size="14" fill="#111111" font-family="Times New Roman, serif">fixed precision &#1600; &#1610;&#1581;&#1587;&#1606; &#1575;&#1604;&#1582;&#1591;&#1571; &#1575;&#1604;&#1582;&#1604;&#1601;&#1610;</text>
  <text x="450" y="336" font-size="14" fill="#111111" font-family="Times New Roman, serif">extended r     &#1600; &#1610;&#1581;&#1587;&#1606; &#1575;&#1604;&#1582;&#1591;&#1571; &#1575;&#1604;&#1571;&#1605;&#1575;&#1605;&#1610;</text>
  <text x="450" y="362" font-size="13" fill="#555555" font-family="Segoe UI, Tahoma, sans-serif">&#1602;&#1575;&#1593;&#1583;&#1577; &#1587;&#1603;&#1610;&#1604; (Skeel): &#1575;&#1604;&#1582;&#1591;&#1571; &#1575;&#1604;&#1582;&#1604;&#1601;&#1610; &#1605;&#1606; &#1585;&#1578;&#1576;&#1577; u</text>
  <text x="450" y="386" font-size="13" fill="#555555" font-family="Segoe UI, Tahoma, sans-serif">&#1581;&#1578;&#1609; &#1604;&#1608; &#1603;&#1575;&#1606; &#954;(A) u &#8805; 1</text>
  <text x="450" y="412" font-size="13" fill="#555555" font-family="Times New Roman, serif">&#1588;&#1585;&#1591; &#1575;&#1604;&#1578;&#1602;&#1575;&#1585;&#1576;:  &#954;(A) &#183; u &#1600; &#1605;&#1602;&#1576;&#1608;&#1604; (&#1593;&#1575;&#1583;&#1577;&#1611; &#954;u &lt; 1)</text>

