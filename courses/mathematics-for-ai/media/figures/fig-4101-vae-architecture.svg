<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="380" fill="#fbfbfd"/>
  <text x="340" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2238">Variational Autoencoder (VAE)</text>

  <!-- input -->
  <rect x="40" y="155" width="70" height="50" rx="6" fill="#c9d6ff" stroke="#3b5bdb" stroke-width="2"/>
  <text x="75" y="185" text-anchor="middle" font-size="13" fill="#1a2238">x</text>

  <!-- encoder -->
  <rect x="150" y="145" width="90" height="70" rx="8" fill="#ffe0b2" stroke="#e8590c" stroke-width="2"/>
  <text x="195" y="175" text-anchor="middle" font-size="12" fill="#1a2238">Encoder</text>
  <text x="195" y="193" text-anchor="middle" font-size="11" fill="#1a2238">phi</text>
  <line x1="110" y1="180" x2="148" y2="180" stroke="#888" stroke-width="1.6" marker-end="url(#a1)"/>

  <!-- mu sigma -->
  <rect x="275" y="120" width="60" height="34" rx="5" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/>
  <rect x="275" y="196" width="60" height="34" rx="5" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/>
  <text x="305" y="142" text-anchor="middle" font-size="11" fill="#1a2238">mu</text>
  <text x="305" y="218" text-anchor="middle" font-size="11" fill="#1a2238">log sigma</text>
  <line x1="240" y1="170" x2="273" y2="138" stroke="#888" stroke-width="1.4" marker-end="url(#a1)"/>
  <line x1="240" y1="190" x2="273" y2="212" stroke="#888" stroke-width="1.4" marker-end="url(#a1)"/>

  <!-- sampling -->
  <circle cx="395" cy="172" r="26" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/>
  <text x="395" y="169" text-anchor="middle" font-size="11" fill="#1a2238">z =</text>
  <text x="395" y="183" text-anchor="middle" font-size="10" fill="#1a2238">mu+eps*sigma</text>
  <line x1="335" y1="137" x2="372" y2="160" stroke="#2f9e44" stroke-width="1.4" marker-end="url(#a2)"/>
  <line x1="335" y1="213" x2="372" y2="186" stroke="#2f9e44" stroke-width="1.4" marker-end="url(#a2)"/>

  <!-- decoder -->
  <rect x="470" y="145" width="90" height="70" rx="8" fill="#ffe0b2" stroke="#e8590c" stroke-width="2"/>
  <text x="515" y="175" text-anchor="middle" font-size="12" fill="#1a2238">Decoder</text>
  <text x="515" y="193" text-anchor="middle" font-size="11" fill="#1a2238">theta</text>
  <line x1="421" y1="172" x2="468" y2="172" stroke="#888" stroke-width="1.6" marker-end="url(#a1)"/>

  <!-- output -->
  <rect x="600" y="155" width="70" height="50" rx="6" fill="#c9d6ff" stroke="#3b5bdb" stroke-width="2"/>
  <text x="635" y="185" text-anchor="middle" font-size="13" fill="#1a2238">x_hat</text>
  <line x1="560" y1="180" x2="598" y2="180" stroke="#888" stroke-width="1.6" marker-end="url(#a1)"/>

  <!-- prior -->
  <text x="395" y="290" text-anchor="middle" font-size="12" fill="#2f9e44">prior p(z) = N(0, I)</text>
  <line x1="395" y1="252" x2="395" y2="262" stroke="#2f9e44" stroke-width="1.4" marker-end="url(#a2)"/>
  <text x="395" y="312" text-anchor="middle" font-size="12" fill="#2f9e44">KL(q(z|x) || p(z)) term</text>

  <text x="340" y="358" text-anchor="middle" font-size="12.5" fill="#555">ELBO: log p(x) ≥ E_q[log p(x|z)] − KL(q(z|x) || p(z)).</text>
  <defs>
    <marker id="a1" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#888"/></marker>
    <marker id="a2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#2f9e44"/></marker>
  </defs>
</svg>
