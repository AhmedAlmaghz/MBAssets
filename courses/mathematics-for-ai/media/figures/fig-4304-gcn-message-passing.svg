<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="380" fill="#fbfbfd"/>
  <text x="340" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2238">GCN message passing</text>

  <!-- center node receiving from neighbors -->
  <circle cx="340" cy="200" r="28" fill="#ffe0b2" stroke="#e8590c" stroke-width="2.5"/>
  <text x="340" y="205" text-anchor="middle" font-size="13" fill="#1a2238">h_i</text>

  <circle cx="180" cy="140" r="22" fill="#c9d6ff" stroke="#3b5bdb" stroke-width="2"/>
  <text x="180" y="144" text-anchor="middle" font-size="11" fill="#1a2238">h_j</text>
  <circle cx="500" cy="140" r="22" fill="#c9d6ff" stroke="#3b5bdb" stroke-width="2"/>
  <text x="500" y="144" text-anchor="middle" font-size="11" fill="#1a2238">h_k</text>
  <circle cx="150" cy="290" r="22" fill="#c9d6ff" stroke="#3b5bdb" stroke-width="2"/>
  <text x="150" y="294" text-anchor="middle" font-size="11" fill="#1a2238">h_l</text>
  <circle cx="530" cy="290" r="22" fill="#c9d6ff" stroke="#3b5bdb" stroke-width="2"/>
  <text x="530" y="294" text-anchor="middle" font-size="11" fill="#1a2238">h_m</text>

  <!-- aggregation arrows to center -->
  <g stroke="#2f9e44" stroke-width="2" fill="none" marker-end="url(#n2)">
    <path d="M200 152 Q260 170 315 190"/>
    <path d="M478 152 Q420 170 365 190"/>
    <path d="M172 278 Q240 250 315 214"/>
    <path d="M508 278 Q440 250 365 214"/>
  </g>
  <text x="340" y="120" text-anchor="middle" font-size="12" fill="#2f9e44">aggregate neighbours</text>

  <!-- self loop -->
  <path d="M340 172 A40 40 0 0 1 368 200" fill="none" stroke="#e8590c" stroke-width="1.8" marker-end="url(#n3)"/>

  <rect x="140" y="330" width="400" height="42" rx="8" fill="#fff3bf" stroke="#f08c00" stroke-width="1.5"/>
  <text x="340" y="355" text-anchor="middle" font-size="12.5" fill="#1a2238">h_i' = σ( Σ_j (1/√(d_i d_j)) h_j W )   (GCN layer)</text>
  <defs>
    <marker id="n2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#2f9e44"/></marker>
    <marker id="n3" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#e8590c"/></marker>
  </defs>
</svg>
