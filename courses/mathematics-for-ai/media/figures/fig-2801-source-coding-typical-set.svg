<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360">
  <rect width="680" height="360" fill="#fbfbfd"/>
  <rect x="60" y="60" width="480" height="240" fill="#f0f0f5" stroke="#999" stroke-width="1.5"/>
  <text x="300" y="50" font-family="sans-serif" font-size="13" fill="#555" text-anchor="middle">all 2^n sequences (improbable individually)</text>
  <ellipse cx="300" cy="180" rx="120" ry="80" fill="#cfe8ff" fill-opacity="0.85" stroke="#1f6feb" stroke-width="2.5"/>
  <text x="300" y="185" font-family="sans-serif" font-size="14" fill="#1f6feb" text-anchor="middle" font-weight="bold">typical set A</text>
  <text x="300" y="205" font-family="sans-serif" font-size="12" fill="#1f6feb" text-anchor="middle">|A| ≈ 2^{nH}</text>
  <circle cx="150" cy="110" r="4" fill="#c00"/>
  <circle cx="460" cy="130" r="4" fill="#c00"/>
  <circle cx="470" cy="250" r="4" fill="#c00"/>
  <circle cx="130" cy="260" r="4" fill="#c00"/>
  <text x="486" y="256" font-family="sans-serif" font-size="11" fill="#c00">atypical (tiny total prob.)</text>
  <text x="300" y="335" font-family="sans-serif" font-size="12" fill="#555" text-anchor="middle">each typical sequence has prob ≈ 2^{-nH} → needs nH bits</text>
</svg>
