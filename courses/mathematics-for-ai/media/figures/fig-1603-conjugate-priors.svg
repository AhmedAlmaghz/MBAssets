<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="Latin Modern, serif">
  <rect width="680" height="320" fill="#fafafa"/>
  <text x="340" y="26" text-anchor="middle" font-size="16" fill="#222">Conjugate Families</text>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#222"/>
    </marker>
  </defs>

  <!-- three boxes -->
  <rect x="40" y="110" width="150" height="80" rx="8" fill="#fff" stroke="#2a6f97" stroke-width="2"/>
  <text x="115" y="140" text-anchor="middle" font-size="13" fill="#2a6f97">PRIOR</text>
  <text x="115" y="162" text-anchor="middle" font-size="11" fill="#555">Beta / Gamma</text>
  <text x="115" y="178" text-anchor="middle" font-size="11" fill="#555">Dirichlet</text>

  <rect x="265" y="110" width="150" height="80" rx="8" fill="#fff" stroke="#e07a1f" stroke-width="2"/>
  <text x="340" y="140" text-anchor="middle" font-size="13" fill="#e07a1f">LIKELIHOOD</text>
  <text x="340" y="162" text-anchor="middle" font-size="11" fill="#555">Bern / Pois</text>
  <text x="340" y="178" text-anchor="middle" font-size="11" fill="#555">Multinom</text>

  <rect x="490" y="110" width="150" height="80" rx="8" fill="#fff" stroke="#3a923a" stroke-width="2"/>
  <text x="565" y="140" text-anchor="middle" font-size="13" fill="#3a923a">POSTERIOR</text>
  <text x="565" y="162" text-anchor="middle" font-size="11" fill="#555">same family</text>
  <text x="565" y="178" text-anchor="middle" font-size="11" fill="#555">updated params</text>

  <!-- arrows -->
  <line x1="190" y1="150" x2="260" y2="150" stroke="#222" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="415" y1="150" x2="485" y2="150" stroke="#222" stroke-width="2" marker-end="url(#arr)"/>
  <!-- loop back -->
  <path d="M565,190 C565,250 115,250 115,190" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="340" y="245" text-anchor="middle" font-size="11" fill="#999">closed-form update (no MCMC)</text>

  <text x="340" y="305" text-anchor="middle" font-size="12" fill="#555">Posterior stays in the same family as the prior.</text>
</svg>
