<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="680" height="340" font-family="Segoe UI, Tahoma, Arial, sans-serif">
  <rect width="680" height="340" fill="#ffffff"/>

  <text x="340" y="24" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">Spectral graph theory: the Fiedler vector splits the graph</text>
  <text x="340" y="44" text-anchor="middle" font-size="13" fill="#475569">المتجه الذاتي الثاني للابلاسيد (Fiedler vector) يعطي أرخص قطع وأفضل تقسيم للرسم البياني</text>

  <defs>
    <marker id="g1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
  </defs>

  <!-- edges inside left cluster -->
  <g stroke="#64748b" stroke-width="2.5">
    <line x1="95" y1="125" x2="175" y2="110"/>
    <line x1="175" y1="110" x2="175" y2="220"/>
    <line x1="175" y1="220" x2="95" y2="205"/>
    <line x1="95" y1="205" x2="95" y2="125"/>
    <line x1="95" y1="125" x2="175" y2="220"/>
  </g>
  <!-- edges inside right cluster -->
  <g stroke="#64748b" stroke-width="2.5">
    <line x1="505" y1="125" x2="585" y2="110"/>
    <line x1="585" y1="110" x2="585" y2="220"/>
    <line x1="585" y1="220" x2="505" y2="205"/>
    <line x1="505" y1="205" x2="505" y2="125"/>
    <line x1="505" y1="125" x2="585" y2="220"/>
  </g>
  <!-- bridge edges (thin, to be cut) -->
  <g stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4">
    <line x1="175" y1="110" x2="505" y2="125"/>
    <line x1="175" y1="220" x2="505" y2="205"/>
  </g>

  <!-- cut line -->
  <line x1="340" y1="72" x2="340" y2="260" stroke="#dc2626" stroke-width="3" stroke-dasharray="9 6"/>
  <text x="340" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc2626">min cut</text>

  <!-- nodes -->
  <g font-size="12" font-weight="bold" text-anchor="middle">
    <circle cx="95"  cy="125" r="18" fill="#1d4ed8"/><text x="95"  y="129" fill="#ffffff">+</text>
    <circle cx="175" cy="110" r="18" fill="#1d4ed8"/><text x="175" y="114" fill="#ffffff">+</text>
    <circle cx="175" cy="220" r="18" fill="#1d4ed8"/><text x="175" y="224" fill="#ffffff">+</text>
    <circle cx="95"  cy="205" r="18" fill="#1d4ed8"/><text x="95"  y="209" fill="#ffffff">+</text>

    <circle cx="505" cy="125" r="18" fill="#b91c1c"/><text x="505" y="129" fill="#ffffff">−</text>
    <circle cx="585" cy="110" r="18" fill="#b91c1c"/><text x="585" y="114" fill="#ffffff">−</text>
    <circle cx="585" cy="220" r="18" fill="#b91c1c"/><text x="585" y="224" fill="#ffffff">−</text>
    <circle cx="505" cy="205" r="18" fill="#b91c1c"/><text x="505" y="209" fill="#ffffff">−</text>
  </g>

  <!-- Fiedler values -->
  <g font-size="12" text-anchor="middle" fill="#334155">
    <text x="135" y="258">f ≈ +0.35</text>
    <text x="545" y="258">f ≈ −0.35</text>
  </g>
  <text x="135" y="276" text-anchor="middle" font-size="11.5" fill="#64748b">λ₂ = 0.18 (صغير ⟹ قطع رخيص)</text>
  <text x="545" y="276" text-anchor="middle" font-size="11.5" fill="#64748b">فجوة طيفية واضحة ⟹ عنقودان</text>

  <!-- spectrum strip -->
  <rect x="60" y="292" width="560" height="34" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="340" y="313" text-anchor="middle" font-size="13.5" fill="#0f172a">
    L = D − W ,  λ₁ = 0 ≤ λ₂ ≤ … ≤ λ_n ,  xᵀLx = Σ_{(i,j)∈E} w_ij (xᵢ − xⱼ)²
  </text>
</svg>
