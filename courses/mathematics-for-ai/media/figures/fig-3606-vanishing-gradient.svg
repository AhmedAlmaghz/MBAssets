<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380">
  <rect width="680" height="380" fill="#fbfbfd"/>
  <text x="20" y="28" font-family="sans-serif" font-size="13" fill="#1f6feb" font-weight="bold">Vanishing vs exploding gradient (product of Jacobians)</text>

  <!-- chain of W's -->
  <text x="90" y="80" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">W^(L)</text>
  <text x="200" y="80" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">...(W^(2))</text>
  <text x="330" y="80" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">delta^(1)</text>
  <line x1="90" y1="95" x2="330" y2="95" stroke="#999" stroke-width="1.5"/>

  <!-- vanishing bars shrinking -->
  <text x="150" y="130" font-family="sans-serif" font-size="11" fill="#2a7a2a" text-anchor="middle">rho &lt; 1 : VANISH</text>
  <rect x="90" y="180" width="40" height="120" fill="#2a7a2a"/>
  <rect x="150" y="210" width="40" height="90" fill="#2a7a2a"/>
  <rect x="210" y="240" width="40" height="60" fill="#2a7a2a"/>
  <rect x="270" y="270" width="40" height="30" fill="#2a7a2a"/>

  <!-- exploding bars growing -->
  <text x="510" y="130" font-family="sans-serif" font-size="11" fill="#c00" text-anchor="middle">rho &gt; 1 : EXPLODE</text>
  <rect x="430" y="280" width="40" height="20" fill="#c00"/>
  <rect x="490" y="240" width="40" height="60" fill="#c00"/>
  <rect x="550" y="190" width="40" height="110" fill="#c00"/>
  <rect x="610" y="120" width="40" height="180" fill="#c00"/>

  <text x="20" y="370" font-family="sans-serif" font-size="10" fill="#555">delta^(1) = (W^(L))^T ... (W^(2))^T delta^(L); spectral radius rho controls growth</text>
</svg>
