<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="Georgia, 'Times New Roman', serif">
  <rect width="680" height="300" fill="#fafaf7"/>

  <!-- domain X -->
  <g>
    <rect x="40" y="70" width="200" height="180" rx="10" fill="#e0f2f1" stroke="#0f766e" stroke-width="1.8"/>
    <text x="140" y="60" font-size="14" fill="#0f766e" text-anchor="middle" font-weight="bold">X مع σ-جبرا 𝓕</text>
    <!-- preimage shaded -->
    <ellipse cx="140" cy="160" rx="70" ry="55" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
    <text x="140" y="165" font-size="14" fill="#b45309" text-anchor="middle">f⁻¹((a,b])</text>
  </g>

  <!-- arrow f -->
  <line x1="245" y1="160" x2="335" y2="160" stroke="#334155" stroke-width="1.8" marker-end="url(#b)"/>
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <text x="290" y="148" font-size="15" fill="#334155" text-anchor="middle" font-style="italic">f</text>

  <!-- codomain Y -->
  <g>
    <rect x="440" y="70" width="200" height="180" rx="10" fill="#e0f2f1" stroke="#0f766e" stroke-width="1.8"/>
    <text x="540" y="60" font-size="14" fill="#0f766e" text-anchor="middle" font-weight="bold">Y مع σ-جبرا 𝓖</text>
    <!-- interval (a,b] -->
    <rect x="460" y="120" width="160" height="40" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.6"/>
    <text x="540" y="145" font-size="14" fill="#b45309" text-anchor="middle">(a, b]</text>
  </g>

  <rect x="120" y="262" width="440" height="28" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="340" y="281" font-size="12.5" fill="#334155" text-anchor="middle" font-style="italic">f قياسية ⟺ f⁻¹(B) ∈ 𝓕 لكل B ∈ 𝓖</text>
</svg>
