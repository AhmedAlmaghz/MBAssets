<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="380" fill="#fbfbfd"/>
  <text x="340" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2238">Positional encoding (sinusoidal)</text>

  <!-- sin/cos curves -->
  <g>
    <line x1="70" y1="60" x2="70" y2="200" stroke="#555" stroke-width="1.2"/>
    <line x1="70" y1="200" x2="360" y2="200" stroke="#555" stroke-width="1.2"/>
    <path d="M70 200 Q110 80 150 200 T230 200 T310 200 T390 200" fill="none" stroke="#3b5bdb" stroke-width="2.4"/>
    <path d="M70 200 Q110 320 150 200 T230 200 T310 200 T390 200" fill="none" stroke="#e8590c" stroke-width="2.4"/>
    <text x="200" y="50" font-size="12" fill="#3b5bdb">sin(pos / 10000^(2i/d))</text>
    <text x="200" y="225" font-size="12" fill="#e8590c">cos(...)</text>
  </g>

  <!-- small heatmap -->
  <text x="470" y="60" font-size="13" fill="#1a2238" font-weight="600">PE matrix (pos x dim)</text>
  <g>
    <rect x="430" y="70" width="200" height="160" fill="none" stroke="#5b6b8c" stroke-width="1"/>
    <!-- checker-ish rows -->
    <rect x="430" y="70" width="200" height="20" fill="#c9d6ff" fill-opacity="0.5"/>
    <rect x="430" y="110" width="200" height="20" fill="#ffe0b2" fill-opacity="0.5"/>
    <rect x="430" y="150" width="200" height="20" fill="#c8e6c9" fill-opacity="0.5"/>
    <rect x="430" y="190" width="200" height="20" fill="#d0bfff" fill-opacity="0.5"/>
    <line x1="530" y1="70" x2="530" y2="230" stroke="#5b6b8c" stroke-width="1"/>
  </g>
  <text x="530" y="260" text-anchor="middle" font-size="11" fill="#555">each position has a unique pattern</text>

  <text x="340" y="350" text-anchor="middle" font-size="12.5" fill="#555">PE_(pos,2i)=sin, PE_(pos,2i+1)=cos; added to token embedding to inject order.</text>
</svg>
