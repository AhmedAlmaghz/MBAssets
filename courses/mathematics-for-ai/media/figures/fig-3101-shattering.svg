<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380">
  <rect width="680" height="380" fill="#fbfbfd"/>
  <text x="340" y="26" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">Shattering: H realises all 2^m labelings of a set of m points</text>

  <!-- three points -->
  <circle cx="150" cy="210" r="8" fill="#1f6feb"/>
  <circle cx="330" cy="130" r="8" fill="#1f6feb"/>
  <circle cx="300" cy="290" r="8" fill="#1f6feb"/>
  <text x="132" y="234" font-family="sans-serif" font-size="11" fill="#333">x1</text>
  <text x="344" y="132" font-family="sans-serif" font-size="11" fill="#333">x2</text>
  <text x="314" y="294" font-family="sans-serif" font-size="11" fill="#333">x3</text>

  <!-- separating line for one labeling: + - +  -->
  <line x1="60" y1="300" x2="620" y2="60" stroke="#c00" stroke-width="2.4"/>
  <text x="500" y="90" font-family="sans-serif" font-size="11" fill="#c00">one half-plane</text>

  <!-- labelings list -->
  <text x="60" y="330" font-family="sans-serif" font-size="12" fill="#333">m = 3  =&gt;  2^3 = 8 labelings :  +++  ++-  +-+  +--  -++  -+-  --+  ---</text>
  <text x="60" y="352" font-family="sans-serif" font-size="12" fill="#1f6feb">if H realises all 8  =&gt;  the 3 points are shattered  =&gt;  VCdim(H) &gt;= 3</text>

  <!-- note -->
  <rect x="470" y="150" width="180" height="80" fill="#eef4ff" stroke="#1f6feb" stroke-width="1.2"/>
  <text x="560" y="174" font-family="sans-serif" font-size="11" fill="#1f6feb" text-anchor="middle">half-planes in R^2</text>
  <text x="560" y="192" font-family="sans-serif" font-size="11" fill="#1f6feb" text-anchor="middle">shatter 3 points</text>
  <text x="560" y="210" font-family="sans-serif" font-size="11" fill="#c00" text-anchor="middle">but never 4</text>
  <text x="560" y="222" font-family="sans-serif" font-size="10" fill="#555" text-anchor="middle">VCdim = 3 = d + 1</text>
</svg>
