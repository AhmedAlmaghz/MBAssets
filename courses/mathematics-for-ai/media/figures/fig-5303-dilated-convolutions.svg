  <text x="340" y="300" font-size="10.5" fill="#5a6770" direction="rtl">التوسيع d=1,2,4,8,… ⇒ حقل استقبالي ينمو أُسّيّاً بعمقٍ لوغاريتمي (WaveNet).</text>
