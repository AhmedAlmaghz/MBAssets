<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="Georgia, 'Times New Roman', serif">
  <rect width="680" height="320" fill="#fafaf7"/>

  <text x="340" y="26" font-size="14" fill="#334155" text-anchor="middle" font-weight="bold">تايلور متعدّد المتغيّرات: التقريب التربيعي (هِسّية)</text>

  <!-- contour bowl (ellipse) -->
  <g fill="none" stroke="#0f766e" stroke-width="1.5">
    <ellipse cx="300" cy="170" rx="40"  ry="26"/>
    <ellipse cx="300" cy="170" rx="80"  ry="52"/>
    <ellipse cx="300" cy="170" rx="120" ry="78"/>
    <ellipse cx="300" cy="170" rx="160" ry="104"/>
  </g>
  <!-- center x* -->
  <circle cx="300" cy="170" r="4.5" fill="#0f766e"/>
  <text x="300" y="200" font-size="12" fill="#0f766e" text-anchor="middle">x*</text>

  <!-- direction h arrow -->
  <line x1="300" y1="170" x2="430" y2="110" stroke="#b45309" stroke-width="1.8" marker-end="url(#h)"/>
  <defs>
    <marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>
  <text x="368" y="132" font-size="12" fill="#b45309" text-anchor="middle">h</text>

  <!-- parabolic slice along h -->
  <path d="M180,210 C300,170 360,150 430,110 C470,88 500,80 540,70" fill="none" stroke="#9d174d" stroke-width="2"/>
  <text x="540" y="64" font-size="13" fill="#9d174d" font-style="italic">f(x+th)</text>

  <!-- quadratic form formula -->
  <rect x="470" y="210" width="190" height="48" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="565" y="230" font-size="12.5" fill="#334155" text-anchor="middle" font-style="italic">f ≈ f + ∇ᵀh</text>
  <text x="565" y="248" font-size="12.5" fill="#334155" text-anchor="middle" font-style="italic">+ ½ hᵀ∇²f h</text>

  <text x="300" y="300" font-size="12.5" fill="#334155" text-anchor="middle" font-style="italic">الهِسّية ∇²f تتحكّم في انحناء التقريب حول x*</text>
</svg>
