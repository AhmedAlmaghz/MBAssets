<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360">
  <rect width="680" height="360" fill="#fbfbfd"/>
  <line x1="60" y1="320" x2="640" y2="320" stroke="#222" stroke-width="2"/>
  <line x1="80" y1="40" x2="80" y2="320" stroke="#222" stroke-width="2"/>
  <text x="80" y="55" font-family="sans-serif" font-size="12" fill="#222" text-anchor="middle">f(t)</text>
  <text x="600" y="345" font-family="sans-serif" font-size="12" fill="#555" text-anchor="middle">t = p/q</text>
  <circle cx="360" cy="295" r="5" fill="#222"/>
  <text x="360" y="285" font-family="sans-serif" font-size="11" fill="#222" text-anchor="middle">f(1)=0</text>
  <line x1="80" y1="295" x2="640" y2="295" stroke="#bbb" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="360" y1="295" x2="360" y2="40" stroke="#bbb" stroke-width="1" stroke-dasharray="4 3"/>
  <path d="M100,290 C220,270 300,80 360,50 C420,80 500,270 620,290" fill="none" stroke="#1f6feb" stroke-width="2.5"/>
  <text x="560" y="70" font-family="sans-serif" font-size="12" fill="#1f6feb" text-anchor="middle">t ln t : KL</text>
  <path d="M100,290 L360,50 L620,290" fill="none" stroke="#c00" stroke-width="2"/>
  <text x="560" y="150" font-family="sans-serif" font-size="12" fill="#c00" text-anchor="middle">|t-1|/2 : TV</text>
  <path d="M360,50 C260,120 280,260 360,290 C440,260 460,120 360,50" fill="none" stroke="#2da44e" stroke-width="2"/>
  <text x="470" y="210" font-family="sans-serif" font-size="12" fill="#2da44e" text-anchor="middle">(sqrt(t)-1)^2 : Hellinger</text>
  <text x="340" y="355" font-family="sans-serif" font-size="12" fill="#555" text-anchor="middle">convex f with f(1)=0 generates a divergence</text>
</svg>
