<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360">
  <rect width="680" height="360" fill="#fbfbfd"/>
  <rect x="60" y="70" width="60" height="200" fill="#e8f4ff" stroke="#1f6feb" stroke-width="2"/>
  <rect x="140" y="70" width="60" height="200" fill="#e8f4ff" stroke="#1f6feb" stroke-width="2"/>
  <rect x="220" y="70" width="60" height="200" fill="#e8f4ff" stroke="#1f6feb" stroke-width="2"/>
  <text x="160" y="300" font-family="sans-serif" font-size="13" fill="#1f6feb" text-anchor="middle">X: n x p orthonormal columns</text>
  <text x="160" y="325" font-family="sans-serif" font-size="12" fill="#555" text-anchor="middle">X^T X = I_p</text>
  <line x1="90" y1="170" x2="170" y2="170" stroke="#c00" stroke-width="2.5"/>
  <text x="130" y="155" font-family="sans-serif" font-size="12" fill="#c00" text-anchor="middle">90 deg</text>
  <text x="400" y="120" font-family="sans-serif" font-size="13" fill="#222" text-anchor="middle">St(p,n) = { X : X^T X = I }</text>
  <text x="400" y="160" font-family="sans-serif" font-size="12" fill="#2da44e" text-anchor="middle">T_X St: X^T xi + xi^T X = 0</text>
  <text x="400" y="195" font-family="sans-serif" font-size="12" fill="#2da44e" text-anchor="middle">proj: G - X sym(X^T G)</text>
  <text x="400" y="240" font-family="sans-serif" font-size="12" fill="#555" text-anchor="middle">retraction: qf(X + xi)  (QR / polar)</text>
  <text x="400" y="285" font-family="sans-serif" font-size="12" fill="#555" text-anchor="middle">use: orthogonal weights, spectral norm</text>
</svg>
