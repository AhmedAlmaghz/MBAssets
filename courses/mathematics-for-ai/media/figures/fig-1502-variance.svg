<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="Latin Modern, serif">
  <rect width="680" height="320" fill="#fafafa"/>
  <text x="340" y="26" text-anchor="middle" font-size="16" fill="#222">Variance = Spread Around the Mean</text>

  <!-- axes -->
  <line x1="50" y1="280" x2="630" y2="280" stroke="#222"/>
  <line x1="50" y1="40" x2="50" y2="280" stroke="#222"/>
  <line x1="340" y1="60" x2="340" y2="280" stroke="#999" stroke-dasharray="4 3"/>

  <!-- narrow density -->
  <path d="M50,280 C250,280 300,110 340,110 C380,110 430,280 630,280" fill="none" stroke="#2a6f97" stroke-width="2.5"/>
  <!-- wide density -->
  <path d="M50,280 C180,280 250,150 340,150 C430,150 500,280 630,280" fill="none" stroke="#e07a1f" stroke-width="2.5"/>

  <!-- deviation arrows -->
  <line x1="340" y1="110" x2="300" y2="110" stroke="#2a6f97" stroke-width="1.5"/>
  <line x1="340" y1="150" x2="250" y2="150" stroke="#e07a1f" stroke-width="1.5"/>

  <text x="300" y="100" font-size="11" fill="#2a6f97">sigma_1</text>
  <text x="250" y="140" font-size="11" fill="#e07a1f">sigma_2 &gt; sigma_1</text>
  <text x="350" y="75" font-size="11" fill="#222">same mu</text>

  <text x="340" y="320" text-anchor="middle" font-size="12" fill="#555">Var(X) = E[(X-mu)^2]; wider curve = larger variance.</text>
</svg>
