<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" font-family="Latin Modern, serif">
  <rect width="680" height="340" fill="#fafafa"/>
  <text x="340" y="26" text-anchor="middle" font-size="16" fill="#222">Change of Variables (Jacobian)</text>

  <!-- x axis -->
  <line x1="60" y1="250" x2="320" y2="250" stroke="#222"/>
  <text x="190" y="275" text-anchor="middle" font-size="12" fill="#222">X  (domain)</text>
  <!-- y axis -->
  <line x1="400" y1="250" x2="620" y2="250" stroke="#222"/>
  <text x="510" y="275" text-anchor="middle" font-size="12" fill="#222">Y = g(X)</text>

  <!-- mapping curve -->
  <path d="M320,250 C360,200 380,120 400,250" fill="none" stroke="#2a6f97" stroke-width="2"/>
  <text x="360" y="150" font-size="11" fill="#2a6f97">g</text>

  <!-- dx interval on x -->
  <rect x="120" y="244" width="60" height="12" fill="#e07a1f" opacity="0.4"/>
  <text x="150" y="240" text-anchor="middle" font-size="11" fill="#222">dx</text>
  <!-- dy interval on y (stretched) -->
  <rect x="470" y="244" width="100" height="12" fill="#e07a1f" opacity="0.4"/>
  <text x="520" y="240" text-anchor="middle" font-size="11" fill="#222">dy</text>

  <!-- Jacobian label -->
  <text x="510" y="120" font-size="13" fill="#222">|dy/dx| = |g'(x)|</text>
  <text x="510" y="145" font-size="13" fill="#222">stretches/shrinks mass</text>

  <text x="340" y="320" text-anchor="middle" font-size="12" fill="#555">f_Y(y) = f_X(x) |dx/dy|,  x = g^{-1}(y)</text>
</svg>
