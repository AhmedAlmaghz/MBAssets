<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="380" fill="#fbfbfd"/>
  <text x="340" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2238">Zero-sum game &amp; minimax</text>

  <!-- saddle surface as 2D plot -->
  <line x1="90" y1="300" x2="600" y2="300" stroke="#888" stroke-width="1.5"/>
  <line x1="90" y1="300" x2="90" y2="60" stroke="#888" stroke-width="1.5"/>
  <text x="70" y="60" font-size="11" fill="#555">value v</text>

  <!-- maxmin line (row) -->
  <path d="M120 90 Q220 60 320 120 Q420 180 520 250" fill="none" stroke="#c2255c" stroke-width="3"/>
  <text x="120" y="80" font-size="12" fill="#c2255c">maximin (Row secures)</text>

  <!-- minmax line (column) -->
  <path d="M120 240 Q220 200 320 140 Q420 80 520 60" fill="none" stroke="#3b5bdb" stroke-width="3"/>
  <text x="420" y="200" font-size="12" fill="#3b5bdb">minmax (Column caps)</text>

  <!-- saddle point -->
  <circle cx="330" cy="150" r="8" fill="#f08c00"/>
  <text x="345" y="155" font-size="12" fill="#f08c00" font-weight="600">saddle = game value</text>

  <text x="340" y="350" text-anchor="middle" font-size="12" fill="#1a2238">v* = max_p min_q pᵀMq = min_q max_p pᵀMq (von Neumann minimax theorem).</text>
</svg>
