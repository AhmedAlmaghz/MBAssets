<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380">
  <rect width="680" height="380" fill="#fbfbfd"/>

  <text x="340" y="26" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">The three sources of error: approximation, estimation, optimisation</text>

  <!-- Bayes risk baseline -->
  <line x1="70" y1="310" x2="640" y2="310" stroke="#888" stroke-width="2"/>
  <text x="80" y="302" font-family="sans-serif" font-size="11" fill="#666">R* (Bayes risk, irreducible)</text>

  <!-- best in class -->
  <line x1="70" y1="250" x2="640" y2="250" stroke="#2a7a2a" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="80" y="242" font-family="sans-serif" font-size="11" fill="#2a7a2a">inf over H : R(h_H)</text>

  <!-- ERM solution -->
  <line x1="70" y1="190" x2="640" y2="190" stroke="#1f6feb" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="80" y="182" font-family="sans-serif" font-size="11" fill="#1f6feb">R(h_S) : best possible on the data</text>

  <!-- obtained solution -->
  <line x1="70" y1="130" x2="640" y2="130" stroke="#c00" stroke-width="2.4"/>
  <text x="80" y="122" font-family="sans-serif" font-size="11" fill="#c00">R(h_hat) : what the optimiser returned</text>

  <!-- brackets -->
  <line x1="600" y1="130" x2="600" y2="190" stroke="#b8860b" stroke-width="2"/>
  <text x="612" y="164" font-family="sans-serif" font-size="11" fill="#b8860b">optimisation</text>

  <line x1="560" y1="190" x2="560" y2="250" stroke="#b8860b" stroke-width="2"/>
  <text x="572" y="224" font-family="sans-serif" font-size="11" fill="#b8860b">estimation</text>

  <line x1="520" y1="250" x2="520" y2="310" stroke="#b8860b" stroke-width="2"/>
  <text x="532" y="284" font-family="sans-serif" font-size="11" fill="#b8860b">approximation</text>

  <!-- axis label -->
  <text x="355" y="344" font-family="sans-serif" font-size="12" fill="#555" text-anchor="middle">excess risk  R(h_hat) - R*  =  approximation + estimation + optimisation</text>

  <!-- fixing actions -->
  <rect x="70" y="352" width="540" height="22" fill="#eef4ff" stroke="#1f6feb" stroke-width="1"/>
  <text x="340" y="367" font-family="sans-serif" font-size="11" fill="#1f6feb" text-anchor="middle">fix: bigger/richer H  |  more data or stronger regularisation  |  train longer, better optimiser</text>
</svg>
