<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="680" height="320" font-family="Segoe UI, Tahoma, Arial, sans-serif">
  <rect width="680" height="320" fill="#ffffff"/>
  <text x="340" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">المصفوفة بوصفها تحويلاً خطياً: A = [a₁  a₂] ⟹ e₁ ↦ a₁ و e₂ ↦ a₂</text>

  <defs>
    <marker id="f1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#1d4ed8"/>
    </marker>
    <marker id="f2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/>
    </marker>
    <marker id="f3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- اليسار: مربع الوحدة -->
  <text x="160" y="56" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">المجال: مربع الوحدة</text>
  <polygon points="60,250 140,250 140,170 60,170" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <line x1="60" y1="250" x2="140" y2="250" stroke="#1d4ed8" stroke-width="3" marker-end="url(#f1)"/>
  <line x1="60" y1="250" x2="60" y2="170" stroke="#16a34a" stroke-width="3" marker-end="url(#f2)"/>
  <text x="146" y="262" font-size="14" font-weight="bold" fill="#1d4ed8">e₁</text>
  <text x="60" y="160" font-size="14" font-weight="bold" fill="#16a34a">e₂</text>
  <text x="60" y="272" font-size="12" fill="#475569">0</text>

  <!-- السهم -->
  <line x1="230" y1="200" x2="290" y2="200" stroke="#b91c1c" stroke-width="3" marker-end="url(#f3)"/>
  <text x="260" y="188" text-anchor="middle" font-size="14" font-weight="bold" fill="#b91c1c">A</text>

  <!-- اليمين: متوازي الأضلاع -->
  <text x="490" y="56" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">المدى: متوازي أضلاع</text>
  <polygon points="360,250 520,210 600,110 440,150" fill="#fef3c7" stroke="#a16207" stroke-width="2"/>
  <line x1="360" y1="250" x2="520" y2="210" stroke="#1d4ed8" stroke-width="3" marker-end="url(#f1)"/>
  <line x1="360" y1="250" x2="440" y2="150" stroke="#16a34a" stroke-width="3" marker-end="url(#f2)"/>
  <text x="528" y="206" font-size="14" font-weight="bold" fill="#1d4ed8">a₁</text>
  <text x="442" y="142" font-size="14" font-weight="bold" fill="#16a34a">a₂</text>
  <text x="360" y="272" font-size="12" fill="#475569">0</text>

  <rect x="40" y="286" width="600" height="26" rx="4" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="340" y="304" text-anchor="middle" font-size="13" fill="#0f172a">A x = x₁a₁ + x₂a₂  ⟹  كل تحويل خطي = تركيبة خطية لأعمدة المصفوفة</text>
</svg>
