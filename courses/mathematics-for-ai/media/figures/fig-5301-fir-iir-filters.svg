<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="680" height="380" font-family="Tajawal, Noto Naskh Arabic, sans-serif">
  <rect width="680" height="380" fill="#ffffff"/>
  <text x="664" y="26" text-anchor="end" font-size="15" fill="#1f4e6b" font-weight="700">FIR مقابل IIR: الذاكرة والتلقيم الراجع</text>
  <text x="664" y="44" text-anchor="end" font-size="11" fill="#5a6770">FIR vs IIR filter structures</text>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6770"/></marker></defs>
  <rect x="40" y="120" width="240" height="60" rx="7" fill="#f2f7fa" stroke="#7a9e3c" stroke-width="1.5"/>
  <text x="160" y="148" text-anchor="middle" font-size="12.5" fill="#1c2b36" font-weight="700"><tspan direction="ltr" unicode-bidi="isolate">y[n]=Σ<tspan dy="3.75" font-size="70%">k=0</tspan><tspan dy="-3.75" font-size="1">&#8203;</tspan><tspan dy="-5.25" font-size="70%">L-1</tspan><tspan dy="5.25" font-size="1">&#8203;</tspan>h<tspan dy="3.75" font-size="70%">k</tspan><tspan dy="-3.75" font-size="1">&#8203;</tspan> x[n-k]</tspan></text>
  <text x="160" y="164" text-anchor="middle" font-size="10" fill="#5a6770">FIR: لا تلقيم راجع — مستقرّ دائماً</text>
  <rect x="40" y="210" width="240" height="60" rx="7" fill="#f2f7fa" stroke="#b5473a" stroke-width="1.5"/>
  <text x="160" y="238" text-anchor="middle" font-size="12.5" fill="#1c2b36" font-weight="700"><tspan direction="ltr" unicode-bidi="isolate">y[n]=Σ b<tspan dy="3.75" font-size="70%">k</tspan><tspan dy="-3.75" font-size="1">&#8203;</tspan>x[n-k]-Σ a<tspan dy="3.75" font-size="70%">k</tspan><tspan dy="-3.75" font-size="1">&#8203;</tspan>y[n-k]</tspan></text>
  <text x="160" y="254" text-anchor="middle" font-size="10" fill="#5a6770">IIR: تلقيم راجع — استقرار مشروط</text>
  <rect x="380" y="120" width="260" height="60" rx="7" fill="#f2f7fa" stroke="#7a9e3c" stroke-width="1.5"/>
  <text x="510" y="148" text-anchor="middle" font-size="12.5" fill="#1c2b36" font-weight="700"><tspan direction="ltr" unicode-bidi="isolate">H(z)=Σ h<tspan dy="3.75" font-size="70%">k</tspan><tspan dy="-3.75" font-size="1">&#8203;</tspan> z<tspan dy="-5.25" font-size="70%">-k</tspan><tspan dy="5.25" font-size="1">&#8203;</tspan></tspan></text>
  <text x="510" y="164" text-anchor="middle" font-size="10" fill="#5a6770">أقطاب عند الصفر فقط</text>
  <rect x="380" y="210" width="260" height="60" rx="7" fill="#f2f7fa" stroke="#b5473a" stroke-width="1.5"/>
  <text x="510" y="238" text-anchor="middle" font-size="12.5" fill="#1c2b36" font-weight="700"><tspan direction="ltr" unicode-bidi="isolate">H(z)=B(z)/(A(z))</tspan></text>
  <text x="510" y="254" text-anchor="middle" font-size="10" fill="#5a6770">الأقطاب تحدّد الاستقرار</text>
  <text x="340" y="310" font-size="10.5" fill="#5a6770" direction="rtl">FIR: طورٌ خطّي ممكن واستقرار مضمون. IIR: كفاءة أعلى وخطر انفجار (أقطاب خارج الوحدة).</text>
  <text x="340" y="332" font-size="10.5" fill="#5a6770" direction="rtl">في الشبكات: الالتفاف FIR؛ والمتكرّرات IIR؛ وSSM تجمع الاثنين.</text>
</svg>