<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="380" fill="#fbfbfd"/>
  <text x="340" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2238">Simplicial complex dimensions</text>

  <!-- 0-simplex -->
  <circle cx="90" cy="180" r="7" fill="#3b5bdb"/>
  <text x="90" y="225" text-anchor="middle" font-size="11" fill="#1a2238">0-simplex</text>
  <text x="90" y="241" text-anchor="middle" font-size="10" fill="#555">(vertex)</text>

  <!-- 1-simplex -->
  <line x1="200" y1="170" x2="290" y2="170" stroke="#2f9e44" stroke-width="3"/>
  <circle cx="200" cy="170" r="6" fill="#3b5bdb"/>
  <circle cx="290" cy="170" r="6" fill="#3b5bdb"/>
  <text x="245" y="215" text-anchor="middle" font-size="11" fill="#1a2238">1-simplex</text>
  <text x="245" y="231" text-anchor="middle" font-size="10" fill="#555">(edge)</text>

  <!-- 2-simplex -->
  <polygon points="380,120 460,120 420,200" fill="#ffd6e7" stroke="#c2255c" stroke-width="2.5"/>
  <circle cx="380" cy="120" r="6" fill="#3b5bdb"/>
  <circle cx="460" cy="120" r="6" fill="#3b5bdb"/>
  <circle cx="420" cy="200" r="6" fill="#3b5bdb"/>
  <text x="420" y="240" text-anchor="middle" font-size="11" fill="#1a2238">2-simplex</text>
  <text x="420" y="256" text-anchor="middle" font-size="10" fill="#555">(triangle)</text>

  <!-- 3-simplex tetra -->
  <polygon points="590,130 640,160 620,215 560,210" fill="#ffe0b2" stroke="#e8590c" stroke-width="2.5"/>
  <line x1="560" y1="210" x2="590" y2="130" stroke="#e8590c" stroke-width="1.5"/>
  <line x1="590" y1="130" x2="640" y2="160" stroke="#e8590c" stroke-width="1.5"/>
  <line x1="640" y1="160" x2="560" y2="210" stroke="#e8590c" stroke-width="1.5"/>
  <text x="600" y="255" text-anchor="middle" font-size="11" fill="#1a2238">3-simplex</text>
  <text x="600" y="271" text-anchor="middle" font-size="10" fill="#555">(tetrahedron)</text>

  <text x="340" y="340" text-anchor="middle" font-size="12" fill="#555">A k-simplex = convex hull of k+1 affinely independent points.</text>
</svg>
