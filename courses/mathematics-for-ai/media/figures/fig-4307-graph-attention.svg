<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="380" fill="#fbfbfd"/>
  <text x="340" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2238">Graph Attention Network (GAT)</text>

  <!-- center node -->
  <circle cx="340" cy="200" r="28" fill="#ffe0b2" stroke="#e8590c" stroke-width="2.5"/>
  <text x="340" y="205" text-anchor="middle" font-size="12" fill="#1a2238">h_i</text>

  <!-- neighbors with edge weights -->
  <line x1="200" y1="140" x2="315" y2="188" stroke="#3b5bdb" stroke-width="4"/>
  <line x1="480" y1="140" x2="365" y2="188" stroke="#888" stroke-width="1.6"/>
  <line x1="200" y1="280" x2="315" y2="216" stroke="#888" stroke-width="1.6"/>
  <line x1="480" y1="280" x2="365" y2="216" stroke="#c2255c" stroke-width="2"/>

  <circle cx="200" cy="140" r="22" fill="#c9d6ff" stroke="#3b5bdb" stroke-width="2"/>
  <text x="200" y="144" text-anchor="middle" font-size="11" fill="#1a2238">h_j</text>
  <circle cx="480" cy="140" r="22" fill="#c9d6ff" stroke="#3b5bdb" stroke-width="2"/>
  <text x="480" y="144" text-anchor="middle" font-size="11" fill="#1a2238">h_k</text>
  <circle cx="200" cy="280" r="22" fill="#c9d6ff" stroke="#3b5bdb" stroke-width="2"/>
  <text x="200" y="284" text-anchor="middle" font-size="11" fill="#1a2238">h_l</text>
  <circle cx="480" cy="280" r="22" fill="#c9d6ff" stroke="#3b5bdb" stroke-width="2"/>
  <text x="480" y="284" text-anchor="middle" font-size="11" fill="#1a2238">h_m</text>

  <text x="240" y="150" font-size="11" fill="#3b5bdb">α=0.6</text>
  <text x="410" y="255" font-size="11" fill="#c2255c">α=0.3</text>

  <rect x="140" y="330" width="400" height="42" rx="8" fill="#fff3bf" stroke="#f08c00" stroke-width="1.5"/>
  <text x="340" y="348" text-anchor="middle" font-size="12.5" fill="#1a2238">α_ij = softmax( LeakyReLU(aᵀ[Wh_i ‖ Wh_j]) )</text>
  <text x="340" y="366" text-anchor="middle" font-size="11" fill="#555">Neighbour-weighted sum: informative edges get higher attention.</text>
</svg>
