<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380">
  <rect width="680" height="380" fill="#fbfbfd"/>
  <text x="340" y="26" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">PAC learning: probably (1 - delta) approximately (eps) correct</text>

  <!-- error axis -->
  <line x1="70" y1="300" x2="640" y2="300" stroke="#222" stroke-width="2"/>
  <line x1="70" y1="60" x2="70" y2="300" stroke="#222" stroke-width="2"/>
  <text x="355" y="332" font-family="sans-serif" font-size="12" fill="#555" text-anchor="middle">sample size n</text>
  <text x="26" y="180" font-family="sans-serif" font-size="12" fill="#555">error R(h)</text>

  <!-- target eps line -->
  <line x1="70" y1="120" x2="640" y2="120" stroke="#2a7a2a" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="580" y="112" font-family="sans-serif" font-size="12" fill="#2a7a2a">eps</text>

  <!-- risk curve decaying -->
  <path d="M90,280 C180,240 280,170 380,140 C480,120 560,110 620,105"
        fill="none" stroke="#1f6feb" stroke-width="3"/>
  <text x="430" y="96" font-family="sans-serif" font-size="12" fill="#1f6feb">R(A(S))</text>

  <!-- confidence band -->
  <path d="M90,290 C180,252 280,186 380,156 C480,136 560,126 620,121"
        fill="none" stroke="#9dc4f5" stroke-width="1.6"/>
  <path d="M90,270 C180,228 280,154 380,124 C480,104 560,94 620,89"
        fill="none" stroke="#9dc4f5" stroke-width="1.6"/>
  <text x="230" y="200" font-family="sans-serif" font-size="11" fill="#9dc4f5">confidence band 1 - delta</text>

  <!-- crossing point -->
  <circle cx="380" cy="140" r="5" fill="#c00"/>
  <line x1="380" y1="140" x2="380" y2="300" stroke="#c00" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="356" y="318" font-family="sans-serif" font-size="11" fill="#c00">n(eps, delta)</text>

  <!-- definition box -->
  <rect x="70" y="346" width="560" height="26" fill="#fff6d8" stroke="#b8860b" stroke-width="1"/>
  <text x="350" y="364" font-family="sans-serif" font-size="11" fill="#8a5a00" text-anchor="middle">P over S ~ D^n [ R(A(S)) &lt;= eps ] &gt;= 1 - delta</text>
</svg>
