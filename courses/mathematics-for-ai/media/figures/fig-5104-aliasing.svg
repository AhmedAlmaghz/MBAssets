  <text x="340" y="320" font-size="10.5" fill="#b5473a" direction="rtl">العيّنات (النقاط الحمراء) توافق إشارةً منخفضة التردّد تماماً ⇒ لا تمييز بعد العيّنة.</text>
  <text x="340" y="342" font-size="10.5" fill="#5a6770" direction="rtl">العلاج: مرشّح تمرير منخفض قبل العيّنة (anti-alias)، أو رفع f_s.</text>
