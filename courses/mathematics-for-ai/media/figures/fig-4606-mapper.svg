<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="380" fill="#fbfbfd"/>
  <text x="340" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2238">Mapper algorithm</text>

  <!-- data blob with overlap -->
  <ellipse cx="170" cy="190" rx="90" ry="70" fill="#c9d6ff" opacity="0.5" stroke="#3b5bdb"/>
  <ellipse cx="330" cy="200" rx="80" ry="75" fill="#ffd6e7" opacity="0.5" stroke="#c2255c"/>
  <ellipse cx="480" cy="180" rx="85" ry="70" fill="#d3f9d8" opacity="0.5" stroke="#2f9e44"/>

  <!-- nodes -->
  <circle cx="170" cy="190" r="22" fill="#3b5bdb"/>
  <text x="170" y="194" text-anchor="middle" font-size="11" fill="#fff">A</text>
  <circle cx="330" cy="200" r="22" fill="#c2255c"/>
  <text x="330" y="204" text-anchor="middle" font-size="11" fill="#fff">B</text>
  <circle cx="480" cy="180" r="22" fill="#2f9e44"/>
  <text x="480" y="184" text-anchor="middle" font-size="11" fill="#fff">C</text>

  <!-- edges (overlaps) -->
  <line x1="192" y1="190" x2="308" y2="198" stroke="#555" stroke-width="2.5"/>
  <line x1="352" y1="196" x2="458" y2="184" stroke="#555" stroke-width="2.5"/>

  <text x="170" y="120" text-anchor="middle" font-size="11" fill="#555">filter f</text>
  <text x="340" y="300" text-anchor="middle" font-size="12" fill="#1a2238">Mapper: cover data by overlapping filter bins → cluster each → graph of clusters.</text>
  <text x="340" y="340" text-anchor="middle" font-size="12" fill="#555">Nodes = preimages of bins (clusters); edges = shared points (overlap).</text>
</svg>
