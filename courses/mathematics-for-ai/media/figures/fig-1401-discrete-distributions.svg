<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" font-family="Latin Modern, serif">
  <rect width="680" height="340" fill="#fafafa"/>
  <text x="340" y="26" text-anchor="middle" font-size="16" fill="#222">Standard Discrete Distributions (PMF)</text>

  <!-- Bernoulli p=0.3 -->
  <g transform="translate(30,60)">
    <text x="95" y="0" text-anchor="middle" font-size="13" fill="#222">Bernoulli(p=0.3)</text>
    <line x1="20" y1="70" x2="170" y2="70" stroke="#222"/>
    <line x1="20" y1="10" x2="20" y2="70" stroke="#222"/>
    <rect x="42" y="49" width="26" height="21" fill="#2a6f97"/>
    <rect x="122" y="11" width="26" height="59" fill="#2a6f97"/>
    <text x="55" y="85" text-anchor="middle" font-size="11" fill="#222">0</text>
    <text x="135" y="85" text-anchor="middle" font-size="11" fill="#222">1</text>
  </g>

  <!-- Binomial n=10 p=0.4 -->
  <g transform="translate(235,60)">
    <text x="105" y="0" text-anchor="middle" font-size="13" fill="#222">Binomial(n=10,p=0.4)</text>
    <line x1="20" y1="70" x2="190" y2="70" stroke="#222"/>
    <line x1="20" y1="10" x2="20" y2="70" stroke="#222"/>
    <rect x="20" y="62" width="15" height="8" fill="#2a6f97"/>
    <rect x="38" y="48" width="15" height="22" fill="#2a6f97"/>
    <rect x="56" y="33" width="15" height="37" fill="#2a6f97"/>
    <rect x="74" y="20" width="15" height="50" fill="#2a6f97"/>
    <rect x="92" y="14" width="15" height="56" fill="#2a6f97"/>
    <rect x="110" y="22" width="15" height="48" fill="#2a6f97"/>
    <rect x="128" y="36" width="15" height="34" fill="#2a6f97"/>
    <rect x="146" y="52" width="15" height="18" fill="#2a6f97"/>
    <rect x="164" y="64" width="15" height="6" fill="#2a6f97"/>
    <text x="100" y="85" text-anchor="middle" font-size="11" fill="#222">k</text>
  </g>

  <!-- Poisson lambda=3 -->
  <g transform="translate(470,60)">
    <text x="95" y="0" text-anchor="middle" font-size="13" fill="#222">Poisson(lambda=3)</text>
    <line x1="20" y1="70" x2="170" y2="70" stroke="#222"/>
    <line x1="20" y1="10" x2="20" y2="70" stroke="#222"/>
    <rect x="22" y="20" width="18" height="50" fill="#2a6f97"/>
    <rect x="44" y="14" width="18" height="56" fill="#2a6f97"/>
    <rect x="66" y="22" width="18" height="48" fill="#2a6f97"/>
    <rect x="88" y="38" width="18" height="32" fill="#2a6f97"/>
    <rect x="110" y="52" width="18" height="18" fill="#2a6f97"/>
    <rect x="132" y="60" width="18" height="10" fill="#2a6f97"/>
    <rect x="154" y="66" width="18" height="4" fill="#2a6f97"/>
    <text x="90" y="85" text-anchor="middle" font-size="11" fill="#222">k</text>
  </g>

  <text x="340" y="320" text-anchor="middle" font-size="12" fill="#555">P(X=k): count-based models (classification, event rates, arrivals)</text>
</svg>
