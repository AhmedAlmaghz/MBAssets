<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="680" height="380" font-family="Tajawal, Noto Naskh Arabic, sans-serif">
  <rect width="680" height="380" fill="#ffffff"/>
  <text x="664" y="26" text-anchor="end" font-size="15" fill="#1f4e6b" font-weight="700">مبرهنة الالتفاف: الترشيح ضربٌ في مجال التردّد</text>
  <text x="664" y="44" text-anchor="end" font-size="11" fill="#5a6770">Convolution theorem: filtering = multiplication</text>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6770"/></marker></defs>
  <rect x="40" y="140" width="150" height="56" rx="7" fill="#f2f7fa" stroke="#1f4e6b" stroke-width="1.5"/>
  <text x="115" y="166" text-anchor="middle" font-size="12.5" fill="#1c2b36" font-weight="700">x(t)</text>
  <text x="115" y="182" text-anchor="middle" font-size="10" fill="#5a6770">الإشارة</text>
  <line x1="190" y1="168" x2="240" y2="168" stroke="#5a6770" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="240" y="140" width="170" height="56" rx="7" fill="#f2f7fa" stroke="#1f4e6b" stroke-width="1.5"/>
  <text x="325" y="166" text-anchor="middle" font-size="12.5" fill="#1c2b36" font-weight="700"><tspan direction="ltr" unicode-bidi="isolate">X(ω)=ℱ{x}</tspan></text>
  <text x="325" y="182" text-anchor="middle" font-size="10" fill="#5a6770">التحويل</text>
  <rect x="470" y="140" width="170" height="56" rx="7" fill="#f2f7fa" stroke="#7a9e3c" stroke-width="1.5"/>
  <text x="555" y="166" text-anchor="middle" font-size="12.5" fill="#1c2b36" font-weight="700"><tspan direction="ltr" unicode-bidi="isolate">Y=H·X</tspan></text>
  <text x="555" y="182" text-anchor="middle" font-size="10" fill="#5a6770">الترشيح ضرباً</text>
  <line x1="240" y1="196" x2="190" y2="250" stroke="#5a6770" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah)"/>
  <rect x="40" y="236" width="150" height="56" rx="7" fill="#f2f7fa" stroke="#7a9e3c" stroke-width="1.5"/>
  <text x="115" y="262" text-anchor="middle" font-size="12.5" fill="#1c2b36" font-weight="700">y=h*x</text>
  <text x="115" y="278" text-anchor="middle" font-size="10" fill="#5a6770">الالتفاف في الزمن</text>
  <line x1="555" y1="196" x2="555" y2="236" stroke="#5a6770" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="470" y="236" width="170" height="56" rx="7" fill="#f2f7fa" stroke="#7a9e3c" stroke-width="1.5"/>
  <text x="555" y="262" text-anchor="middle" font-size="12.5" fill="#1c2b36" font-weight="700"><tspan direction="ltr" unicode-bidi="isolate">y=ℱ<tspan dy="-5.25" font-size="70%">-1</tspan><tspan dy="5.25" font-size="1">&#8203;</tspan>{Y}</tspan></text>
  <text x="555" y="278" text-anchor="middle" font-size="10" fill="#5a6770">التحويل العكسي</text>
  <text x="340" y="330" font-size="10.5" fill="#5a6770" direction="rtl">تكلفة الالتفاف المباشر<tspan direction="ltr" unicode-bidi="isolate"> O(N·L) </tspan>مقابل<tspan direction="ltr" unicode-bidi="isolate"> O(N log N) </tspan>عبر<tspan direction="ltr" unicode-bidi="isolate"> FFT.</tspan></text>
</svg>