<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="680" height="380" font-family="Tajawal, Noto Naskh Arabic, sans-serif">
  <rect width="680" height="380" fill="#ffffff"/>
  <text x="664" y="26" text-anchor="end" font-size="15" fill="#1f4e6b" font-weight="700">طيف القدرة والارتباط الذاتي (فينر–خينتشين)</text>
  <text x="664" y="44" text-anchor="end" font-size="11" fill="#5a6770">Wiener–Khinchin: PSD ↔ autocorrelation</text>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6770"/></marker></defs>
  <line x1="60" y1="280" x2="310" y2="280" stroke="#5a6770" stroke-width="1"/>
  <line x1="60" y1="90" x2="60" y2="280" stroke="#5a6770" stroke-width="1"/>
  <text x="310" y="294" font-size="11" fill="#5a6770"><tspan direction="ltr" unicode-bidi="isolate">τ</tspan></text>
  <text x="54" y="100" text-anchor="end" font-size="11" fill="#5a6770"><tspan direction="ltr" unicode-bidi="isolate">R<tspan dy="3.30" font-size="70%">x</tspan><tspan dy="-3.30" font-size="1">&#8203;</tspan>(τ)</tspan></text>
  <path d="M 70 270 L 150 270 L 180 130 L 210 270 L 300 270" fill="none" stroke="#1f4e6b" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="370" y1="280" x2="620" y2="280" stroke="#5a6770" stroke-width="1"/>
  <line x1="370" y1="90" x2="370" y2="280" stroke="#5a6770" stroke-width="1"/>
  <text x="620" y="294" font-size="11" fill="#5a6770"><tspan direction="ltr" unicode-bidi="isolate">ω</tspan></text>
  <text x="364" y="100" text-anchor="end" font-size="11" fill="#5a6770"><tspan direction="ltr" unicode-bidi="isolate">S<tspan dy="3.30" font-size="70%">x</tspan><tspan dy="-3.30" font-size="1">&#8203;</tspan>(ω)</tspan></text>
  <path d="M 380 270 L 460 270 L 480 140 L 510 140 L 530 270 L 610 270" fill="none" stroke="#7a9e3c" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="320" y1="190" x2="360" y2="190" stroke="#5a6770" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="360" y1="210" x2="320" y2="210" stroke="#5a6770" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="340" y="330" font-size="10.5" fill="#5a6770" direction="rtl"><tspan direction="ltr" unicode-bidi="isolate">S<tspan dy="3.15" font-size="70%">x</tspan><tspan dy="-3.15" font-size="1">&#8203;</tspan>(ω)=ℱ{R<tspan dy="3.15" font-size="70%">x</tspan><tspan dy="-3.15" font-size="1">&#8203;</tspan>} — </tspan>والضجيج الأبيض<tspan direction="ltr" unicode-bidi="isolate">: R<tspan dy="3.15" font-size="70%">x</tspan><tspan dy="-3.15" font-size="1">&#8203;</tspan>=σ<tspan dy="-4.41" font-size="70%">2</tspan><tspan dy="4.41" font-size="1">&#8203;</tspan>δ ⇒ S<tspan dy="3.15" font-size="70%">x</tspan><tspan dy="-3.15" font-size="1">&#8203;</tspan> </tspan>ثابت<tspan direction="ltr" unicode-bidi="isolate">.</tspan></text>
  <text x="340" y="352" font-size="10.5" fill="#5a6770" direction="rtl">أثره في التعلّم: تبييض (whitening) الميزات يجعل طيفها ثابتاً.</text>
