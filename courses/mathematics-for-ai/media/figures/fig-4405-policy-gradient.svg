<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="380" fill="#fbfbfd"/>
  <text x="340" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2238">Policy gradient (REINFORCE)</text>

  <!-- trajectory -->
  <g>
    <circle cx="90" cy="200" r="20" fill="#c9d6ff" stroke="#3b5bdb" stroke-width="2"/>
    <text x="90" y="204" text-anchor="middle" font-size="11" fill="#1a2238">s1</text>
    <circle cx="230" cy="160" r="20" fill="#c9d6ff" stroke="#3b5bdb" stroke-width="2"/>
    <text x="230" y="164" text-anchor="middle" font-size="11" fill="#1a2238">s2</text>
    <circle cx="370" cy="210" r="20" fill="#c9d6ff" stroke="#3b5bdb" stroke-width="2"/>
    <text x="370" y="214" text-anchor="middle" font-size="11" fill="#1a2238">s3</text>
    <circle cx="510" cy="160" r="20" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/>
    <text x="510" y="164" text-anchor="middle" font-size="11" fill="#1a2238">end</text>
    <line x1="110" y1="192" x2="210" y2="168" stroke="#888" stroke-width="2" marker-end="url(#d2)"/>
    <line x1="250" y1="170" x2="350" y2="200" stroke="#888" stroke-width="2" marker-end="url(#d2)"/>
    <line x1="390" y1="200" x2="490" y2="170" stroke="#888" stroke-width="2" marker-end="url(#d2)"/>
  </g>

  <!-- likelihoods -->
  <text x="160" y="130" text-anchor="middle" font-size="11" fill="#1a2238">πθ(a1|s1)</text>
  <text x="300" y="130" text-anchor="middle" font-size="11" fill="#1a2238">πθ(a2|s2)</text>
  <text x="440" y="130" text-anchor="middle" font-size="11" fill="#1a2238">πθ(a3|s3)</text>

  <!-- return -->
  <text x="510" y="230" text-anchor="middle" font-size="13" fill="#f08c00">G (return)</text>

  <rect x="120" y="290" width="440" height="60" rx="8" fill="#fff3bf" stroke="#f08c00" stroke-width="1.5"/>
  <text x="340" y="312" text-anchor="middle" font-size="12.5" fill="#1a2238">∇J(θ) = E_τ[ (Σ_t ∇ log πθ(a_t|s_t)) G(τ) ]</text>
  <text x="340" y="336" text-anchor="middle" font-size="11.5" fill="#555">Push up log-probability of actions weighted by their return.</text>
  <defs><marker id="d2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#888"/></marker></defs>
</svg>
