<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="680" height="320" font-family="Segoe UI, Tahoma, Arial, sans-serif">
  <rect width="680" height="320" fill="#ffffff"/>
  <text x="340" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">متطابقة وودبري: تحديث رتبة‑k أرخص من عكس كامل</text>

  <!-- المسار المباشر -->
  <rect x="40" y="70" width="270" height="150" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="175" y="96" text-anchor="middle" font-size="14" font-weight="bold" fill="#7f1d1d">الطريق المباشر</text>
  <text x="175" y="126" text-anchor="middle" font-size="13" fill="#0f172a">(A + U C V)⁻¹</text>
  <rect x="70" y="142" width="210" height="26" rx="3" fill="#ffffff" stroke="#94a3b8"/>
  <text x="175" y="160" text-anchor="middle" font-size="12" fill="#0f172a">عكس مصفوفة n × n من الصفر</text>
  <text x="175" y="192" text-anchor="middle" font-size="16" font-weight="bold" fill="#b91c1c">O(n³)</text>
  <rect x="70" y="198" width="210" height="12" rx="3" fill="#b91c1c"/>
  <text x="175" y="260" text-anchor="middle" font-size="11" fill="#475569">n = 10⁵ ⟹ 10¹⁵ عملية (غير ممكن)</text>

  <!-- المسار الذكي -->
  <rect x="370" y="70" width="270" height="150" rx="6" fill="#bbf7d0" stroke="#166534" stroke-width="2"/>
  <text x="505" y="96" text-anchor="middle" font-size="14" font-weight="bold" fill="#14532d">طريق وودبري</text>
  <text x="505" y="126" text-anchor="middle" font-size="13" fill="#0f172a">A⁻¹ − A⁻¹U(…)⁻¹VA⁻¹</text>
  <rect x="400" y="142" width="210" height="26" rx="3" fill="#ffffff" stroke="#94a3b8"/>
  <text x="505" y="160" text-anchor="middle" font-size="12" fill="#0f172a">نعكس فقط مصفوفة k × k</text>
  <text x="505" y="192" text-anchor="middle" font-size="16" font-weight="bold" fill="#166534">O(n k² + k³)</text>
  <rect x="400" y="198" width="60" height="12" rx="3" fill="#16a34a"/>
  <text x="505" y="260" text-anchor="middle" font-size="11" fill="#475569">n = 10⁵ , k = 10 ⟹ 10⁷ (ممكن فوراً)</text>

  <!-- الصيغة -->
  <rect x="40" y="240" width="600" height="56" rx="4" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="340" y="264" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">(A + U C V)⁻¹ = A⁻¹ − A⁻¹ U (C⁻¹ + V A⁻¹ U)⁻¹ V A⁻¹</text>
  <text x="340" y="286" text-anchor="middle" font-size="11" fill="#475569">الشرط: A قابلة للعكس، C قابلة للعكس، و k ≪ n هي مكسب الكفاءة</text>
</svg>
