<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="380" fill="#fbfbfd"/>
  <text x="340" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2238">Backprop as optics (Para)</text>

  <!-- three layers as optics -->
  <rect x="80" y="140" width="110" height="80" rx="8" fill="#c9d6ff" stroke="#3b5bdb" stroke-width="2.5"/>
  <text x="135" y="180" text-anchor="middle" font-size="14" fill="#1a2238">layer 1</text>
  <rect x="250" y="140" width="110" height="80" rx="8" fill="#c9d6ff" stroke="#3b5bdb" stroke-width="2.5"/>
  <text x="305" y="180" text-anchor="middle" font-size="14" fill="#1a2238">layer 2</text>
  <rect x="420" y="140" width="110" height="80" rx="8" fill="#c9d6ff" stroke="#3b5bdb" stroke-width="2.5"/>
  <text x="475" y="180" text-anchor="middle" font-size="14" fill="#1a2238">layer 3</text>

  <!-- parameters as wires into layers -->
  <text x="135" y="125" text-anchor="middle" font-size="11" fill="#3b5bdb">θ₁</text>
  <text x="305" y="125" text-anchor="middle" font-size="11" fill="#3b5bdb">θ₂</text>
  <text x="475" y="125" text-anchor="middle" font-size="11" fill="#3b5bdb">θ₃</text>

  <!-- forward arrows -->
  <g stroke="#2f9e44" stroke-width="2.5" fill="none" marker-end="url(#bp1)">
    <path d="M190 170 L248 170"/>
    <path d="M360 170 L418 170"/>
    <path d="M530 170 L590 170"/>
  </g>
  <text x="340" y="105" text-anchor="middle" font-size="12" fill="#2f9e44">forward pass (data)</text>
  <circle cx="620" cy="170" r="24" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2.5"/>
  <text x="620" y="174" text-anchor="middle" font-size="12" fill="#1a2238">out</text>

  <!-- backward arrows -->
  <g stroke="#c2255c" stroke-width="2.5" fill="none" stroke-dasharray="6 4" marker-end="url(#bp2)">
    <path d="M590 200 L530 200"/>
    <path d="M418 200 L360 200"/>
    <path d="M248 200 L190 200"/>
  </g>
  <text x="340" y="255" text-anchor="middle" font-size="12" fill="#c2255c">backward pass (updates θ)</text>

  <text x="340" y="330" text-anchor="middle" font-size="11.5" fill="#555">each layer = optic; the network = their monoidal composition (Para).</text>
  <text x="340" y="356" text-anchor="middle" font-size="11.5" fill="#555">Category theory gives compositionality &amp; correctness of gradient flows.</text>
  <defs>
    <marker id="bp1" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#2f9e44"/></marker>
    <marker id="bp2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#c2255c"/></marker>
  </defs>
</svg>
