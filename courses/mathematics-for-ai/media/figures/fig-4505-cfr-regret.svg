<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="380" fill="#fbfbfd"/>
  <text x="340" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2238">No-regret learning &amp; CFR</text>

  <!-- axes -->
  <line x1="80" y1="300" x2="600" y2="300" stroke="#888" stroke-width="1.5"/>
  <line x1="80" y1="300" x2="80" y2="60" stroke="#888" stroke-width="1.5"/>
  <text x="80" y="55" font-size="11" fill="#555">regret</text>
  <text x="590" y="322" font-size="11" fill="#555">iterations t</text>

  <!-- no-regret (sublinear) curve -->
  <path d="M90 100 Q160 250 260 275 Q420 295 590 292" fill="none" stroke="#2f9e44" stroke-width="3"/>
  <text x="360" y="260" font-size="12" fill="#2f9e44">no-regret (≈ √t) → average strategy is ε-NE</text>

  <!-- rising (bad) linear regret -->
  <path d="M90 290 L590 90" fill="none" stroke="#c2255c" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="470" y="95" font-size="12" fill="#c2255c">linear regret (bad)</text>

  <rect x="120" y="330" width="440" height="40" rx="8" fill="#fff3bf" stroke="#f08c00" stroke-width="1.5"/>
  <text x="340" y="354" text-anchor="middle" font-size="12" fill="#1a2238">CFR: regret(I) = Σ_t [ u(a*,I) − u(σ^t,I) ]; time-avg ⇒ Nash.</text>
  <defs><marker id="j2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#2f9e44"/></marker></defs>
</svg>
