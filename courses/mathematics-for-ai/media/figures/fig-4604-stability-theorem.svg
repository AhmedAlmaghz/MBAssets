<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="380" fill="#fbfbfd"/>
  <text x="340" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2238">Stability &amp; bottleneck distance</text>

  <!-- two persistence diagrams scattered -->
  <text x="170" y="90" text-anchor="middle" font-size="12" fill="#3b5bdb">Diagram of g</text>
  <line x1="80" y1="120" x2="260" y2="120" stroke="#888" stroke-width="1"/>
  <line x1="80" y1="120" x2="80" y2="290" stroke="#888" stroke-width="1"/>
  <g fill="#2f9e44">
    <circle cx="150" cy="200" r="6"/><circle cx="180" cy="150" r="6"/>
    <circle cx="140" cy="260" r="6"/><circle cx="200" cy="230" r="6"/>
  </g>

  <text x="510" y="90" text-anchor="middle" font-size="12" fill="#c2255c">Diagram of g'</text>
  <line x1="420" y1="120" x2="600" y2="120" stroke="#888" stroke-width="1"/>
  <line x1="420" y1="120" x2="420" y2="290" stroke="#888" stroke-width="1"/>
  <g fill="#2f9e44">
    <circle cx="470" cy="210" r="6"/><circle cx="490" cy="160" r="6"/>
    <circle cx="500" cy="270" r="6"/><circle cx="455" cy="185" r="6"/>
  </g>

  <!-- matching arrows -->
  <g stroke="#f08c00" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#t2)">
    <line x1="186" y1="152" x2="466" y2="205"/>
    <line x1="183" y1="198" x2="488" y2="162"/>
    <line x1="204" y1="231" x2="497" y2="268"/>
  </g>
  <text x="340" y="200" text-anchor="middle" font-size="12" fill="#f08c00">nearby point clouds</text>
  <text x="340" y="220" text-anchor="middle" font-size="12" fill="#f08c00">→ small W∞ distance</text>

  <rect x="120" y="320" width="440" height="45" rx="8" fill="#fff3bf" stroke="#f08c00" stroke-width="1.5"/>
  <text x="340" y="340" text-anchor="middle" font-size="12.5" fill="#1a2238">W∞(PD(g), PD(g')) ≤ ‖g − g'‖∞</text>
  <text x="340" y="358" text-anchor="middle" font-size="11.5" fill="#555">Persistence is stable: small input perturbation ⇒ small diagram change.</text>
  <defs><marker id="t2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#f08c00"/></marker></defs>
</svg>
