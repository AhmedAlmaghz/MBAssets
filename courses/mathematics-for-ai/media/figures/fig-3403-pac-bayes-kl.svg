<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380">
  <rect width="680" height="380" fill="#fbfbfd"/>

  <text x="340" y="28" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">PAC-Bayes: bound = sqrt( ( KL(Q||P) + ln(2n/delta) ) / 2n )</text>

  <!-- left panel: prior and posterior gaussians -->
  <text x="96" y="56" font-family="sans-serif" font-size="11" fill="#555" text-anchor="middle">prior P and posterior Q</text>
  <line x1="40" y1="300" x2="230" y2="300" stroke="#222" stroke-width="1.6"/>

  <path d="M40,300 C58,268 76,238 96,238 C116,238 134,268 152,300" fill="none" stroke="#1f6feb" stroke-width="2.4"/>
  <text x="96" y="230" font-family="sans-serif" font-size="11" fill="#1f6feb" text-anchor="middle">P = N(0, s^2 I)</text>

  <path d="M120,300 C138,268 156,238 176,238 C196,238 214,268 232,300" fill="none" stroke="#c00" stroke-width="2.4"/>
  <text x="176" y="216" font-family="sans-serif" font-size="11" fill="#c00" text-anchor="middle">Q = N(w, s^2 I)</text>

  <line x1="96" y1="238" x2="176" y2="238" stroke="#b8860b" stroke-width="1.6" stroke-dasharray="4,3"/>
  <text x="136" y="330" font-family="sans-serif" font-size="11" fill="#b8860b" text-anchor="middle">KL = ||w||^2 / (2 s^2)</text>
  <text x="136" y="346" font-family="sans-serif" font-size="10" fill="#b8860b" text-anchor="middle">nats, not bits</text>

  <!-- right panel: bound vs KL -->
  <line x1="290" y1="320" x2="650" y2="320" stroke="#222" stroke-width="2"/>
  <line x1="290" y1="60" x2="290" y2="320" stroke="#222" stroke-width="2"/>
  <text x="470" y="352" font-family="sans-serif" font-size="12" fill="#555" text-anchor="middle">KL(Q||P) in nats</text>
  <text x="252" y="180" font-family="sans-serif" font-size="12" fill="#555">bound</text>

  <path d="M300,296 C400,240 520,150 640,86" fill="none" stroke="#2a7a2a" stroke-width="2.8"/>
  <text x="470" y="120" font-family="sans-serif" font-size="11" fill="#2a7a2a">n = 5*10^4</text>

  <path d="M300,308 C400,278 520,240 640,208" fill="none" stroke="#1f6feb" stroke-width="2.8"/>
  <text x="520" y="242" font-family="sans-serif" font-size="11" fill="#1f6feb">n = 10^6</text>

  <path d="M300,286 C400,196 520,110 640,58" fill="none" stroke="#c00" stroke-width="2.6"/>
  <text x="440" y="76" font-family="sans-serif" font-size="11" fill="#c00">n = 10^4</text>

  <!-- non vacuous point -->
  <circle cx="392" cy="243" r="6" fill="#2a7a2a"/>
  <line x1="392" y1="243" x2="392" y2="320" stroke="#2a7a2a" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="330" y="338" font-family="sans-serif" font-size="10" fill="#2a7a2a">KL = 500</text>
  <text x="322" y="350" font-family="sans-serif" font-size="10" fill="#2a7a2a">bound = 0.072</text>

  <!-- vacuous threshold line -->
  <line x1="300" y1="196" x2="650" y2="196" stroke="#b8860b" stroke-width="1.6" stroke-dasharray="7,4"/>
  <text x="646" y="190" font-family="sans-serif" font-size="10" fill="#b8860b" text-anchor="end">bound = 1 (vacuous above)</text>
</svg>
