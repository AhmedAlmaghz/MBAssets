<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="Georgia, 'Times New Roman', serif">
  <rect width="680" height="320" fill="#fafaf7"/>

  <text x="340" y="26" font-size="14" fill="#334155" text-anchor="middle" font-weight="bold">مخطّط الطور (phase portrait) والنقاط الثابتة</text>

  <!-- axes -->
  <line x1="60" y1="160" x2="640" y2="160" stroke="#334155" stroke-width="1.4"/>
  <line x1="340" y1="290" x2="340" y2="40" stroke="#334155" stroke-width="1.4"/>
  <text x="350" y="180" font-size="12" fill="#334155">0</text>

  <!-- saddle at origin: arrows diverge along x, converge along y -->
  <g stroke="#9d174d" stroke-width="1.4">
    <line x1="340" y1="160" x2="380" y2="160" marker-end="url(#a)"/>
    <line x1="340" y1="160" x2="300" y2="160" marker-end="url(#a)"/>
    <line x1="340" y1="160" x2="340" y2="130" marker-end="url(#a)"/>
    <line x1="340" y1="160" x2="340" y2="190" marker-end="url(#a)"/>
  </g>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9d174d"/>
    </marker>
  </defs>
  <circle cx="340" cy="160" r="5" fill="#9d174d"/>
  <text x="352" y="150" font-size="12" fill="#9d174d">سرج (saddle)</text>

  <!-- spiral sink at (520,110) -->
  <g stroke="#0f766e" stroke-width="1.3" fill="none">
    <path d="M560,110 C540,90 500,110 520,130 C545,150 575,135 560,115"/>
    <path d="M540,100 C520,80 480,100 500,125"/>
  </g>
  <circle cx="520" cy="110" r="5" fill="#0f766e"/>
  <text x="535" y="95" font-size="12" fill="#0f766e">بالوعة حلزونية</text>

  <!-- node sink at (160,230) -->
  <g stroke="#1d4ed8" stroke-width="1.3">
    <line x1="160" y1="230" x2="140" y2="210" marker-end="url(#b)"/>
    <line x1="160" y1="230" x2="180" y2="210" marker-end="url(#b)"/>
    <line x1="160" y1="230" x2="145" y2="240" marker-end="url(#b)"/>
    <line x1="160" y1="230" x2="175" y2="245" marker-end="url(#b)"/>
  </g>
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <circle cx="160" cy="230" r="5" fill="#1d4ed8"/>
  <text x="120" y="262" font-size="12" fill="#1d4ed8">بالوعة عقدية</text>

  <!-- sample trajectories -->
  <path d="M120,80 C250,110 330,150 338,158" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4 3"/>
  <path d="M600,260 C560,210 540,150 522,120" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4 3"/>

  <text x="340" y="305" font-size="12.5" fill="#334155" text-anchor="middle" font-style="italic">نوع النقطة الثابتة يُحدّد بقيم ذاتية ليعقوبية الخريطة</text>
</svg>
