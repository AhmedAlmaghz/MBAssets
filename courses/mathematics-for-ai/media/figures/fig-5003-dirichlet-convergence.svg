<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="680" height="380" font-family="Tajawal, Noto Naskh Arabic, sans-serif">
  <rect width="680" height="380" fill="#ffffff"/>
  <text x="664" y="26" text-anchor="end" font-size="15" fill="#1f4e6b" font-weight="700">تقارب ديريكلِه: عند القفزة نصفُ المجموع</text>
  <text x="664" y="44" text-anchor="end" font-size="11" fill="#5a6770">Dirichlet point-wise convergence</text>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6770"/></marker></defs>
  <line x1="60" y1="300" x2="620" y2="300" stroke="#5a6770" stroke-width="1"/>
  <line x1="60" y1="90" x2="60" y2="300" stroke="#5a6770" stroke-width="1"/>
  <text x="620" y="314" font-size="11" fill="#5a6770">x</text>
  <text x="54" y="100" text-anchor="end" font-size="11" fill="#5a6770">S_N(x)</text>
  <path d="M 60 300 L 130 300 L 130 140 L 200 140 L 200 300 L 270 300 L 270 140 L 340 140 L 340 300 L 410 300 L 410 140 L 480 140 L 480 300 L 550 300 L 550 140 L 620 140" fill="none" stroke="#5a6770" stroke-width="1.6" stroke-dasharray="6 4" stroke-linecap="round"/>
  <path d="M 60 300 L 220 300 L 222 140 L 320 140 L 318 300 L 620 300" fill="none" stroke="#1f4e6b" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="270" cy="220" r="4" fill="#b5473a"/>
  <text x="286" y="224" font-size="11" fill="#b5473a">القفزة: النهاية = (f(x^-)+f(x^+))/2</text>
  <text x="340" y="336" font-size="10.5" fill="#5a6770" direction="rtl">عند نقطة استمرار<tspan direction="ltr" unicode-bidi="isolate">: S<tspan dy="3.15" font-size="70%">N</tspan><tspan dy="-3.15" font-size="1">&#8203;</tspan>(x) → f(x). </tspan>وعند قفزة<tspan direction="ltr" unicode-bidi="isolate">: </tspan>إلى منتصف القفزة<tspan direction="ltr" unicode-bidi="isolate"> — </tspan>لا إلى قيمة الدالّة<tspan direction="ltr" unicode-bidi="isolate">.</tspan></text>
</svg>