<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="380" fill="#fbfbfd"/>
  <text x="340" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2238">Neural Tangent Kernel: idea</text>

  <!-- two inputs -->
  <g>
    <rect x="60" y="90" width="70" height="40" rx="6" fill="#c9d6ff" stroke="#3b5bdb" stroke-width="2"/>
    <rect x="60" y="170" width="70" height="40" rx="6" fill="#c9d6ff" stroke="#3b5bdb" stroke-width="2"/>
    <text x="95" y="115" text-anchor="middle" font-size="12" fill="#1a2238">x</text>
    <text x="95" y="195" text-anchor="middle" font-size="12" fill="#1a2238">x'</text>
  </g>

  <!-- network f(theta) -->
  <ellipse cx="250" cy="135" rx="46" ry="60" fill="#ffe0b2" stroke="#e8590c" stroke-width="2"/>
  <text x="250" y="131" text-anchor="middle" font-size="12" fill="#1a2238">f(.;theta)</text>
  <text x="250" y="147" text-anchor="middle" font-size="11" fill="#1a2238">NN</text>
  <line x1="130" y1="110" x2="204" y2="125" stroke="#888" stroke-width="1.6" marker-end="url(#n1)"/>
  <line x1="130" y1="190" x2="204" y2="150" stroke="#888" stroke-width="1.6" marker-end="url(#n1)"/>
  <defs><marker id="n1" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#888"/></marker></defs>

  <!-- jacobians -->
  <g>
    <rect x="335" y="95" width="60" height="34" rx="5" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/>
    <rect x="335" y="175" width="60" height="34" rx="5" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/>
    <text x="365" y="117" text-anchor="middle" font-size="11" fill="#1a2238">J(x)</text>
    <text x="365" y="197" text-anchor="middle" font-size="11" fill="#1a2238">J(x')</text>
  </g>
  <line x1="296" y1="125" x2="333" y2="110" stroke="#888" stroke-width="1.4" marker-end="url(#n1)"/>
  <line x1="296" y1="150" x2="333" y2="190" stroke="#888" stroke-width="1.4" marker-end="url(#n1)"/>

  <!-- kernel matrix -->
  <text x="540" y="70" text-anchor="middle" font-size="13" fill="#2f9e44" font-weight="600">Theta = J J^T</text>
  <g stroke="#5b6b8c" stroke-width="1" fill="none">
    <rect x="470" y="90" width="140" height="140"/>
    <line x1="540" y1="90" x2="540" y2="230"/><line x1="470" y1="160" x2="610" y2="160"/>
  </g>
  <g fill="#2f9e44" fill-opacity="0.5">
    <rect x="470" y="90" width="70" height="70"/>
    <rect x="540" y="160" width="70" height="70"/>
    <rect x="540" y="90" width="70" height="70"/>
    <rect x="470" y="160" width="70" height="70"/>
  </g>
  <text x="540" y="270" text-anchor="middle" font-size="11" fill="#555">NTK matrix over the data</text>

  <text x="340" y="355" text-anchor="middle" font-size="12.5" fill="#555">Theta_(i,j) = &lt;nabla f(x_i), nabla f(x_j)&gt;  --  governs training dynamics.</text>
</svg>
