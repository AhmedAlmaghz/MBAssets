<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360">
  <rect width="680" height="360" fill="#fbfbfd"/>
  <rect x="290" y="40" width="100" height="45" fill="#e8f4ff" stroke="#1f6feb" stroke-width="2"/>
  <text x="340" y="68" font-family="sans-serif" font-size="12" fill="#1f6feb" text-anchor="middle">root H(Y)</text>
  <line x1="340" y1="85" x2="180" y2="140" stroke="#222" stroke-width="2"/>
  <line x1="340" y1="85" x2="500" y2="140" stroke="#222" stroke-width="2"/>
  <rect x="110" y="140" width="140" height="50" fill="#ffe8e8" stroke="#c00" stroke-width="2"/>
  <text x="180" y="163" font-family="sans-serif" font-size="11" fill="#c00" text-anchor="middle">A &lt;= t : H(Y|A) low</text>
  <text x="180" y="180" font-family="sans-serif" font-size="11" fill="#c00" text-anchor="middle">purer child</text>
  <rect x="430" y="140" width="140" height="50" fill="#ffe8e8" stroke="#c00" stroke-width="2"/>
  <text x="500" y="163" font-family="sans-serif" font-size="11" fill="#c00" text-anchor="middle">A &gt; t : H(Y|A)</text>
  <text x="500" y="180" font-family="sans-serif" font-size="11" fill="#c00" text-anchor="middle">weighted</text>
  <text x="340" y="240" font-family="sans-serif" font-size="13" fill="#2da44e" text-anchor="middle">IG = H(Y) - H(Y|A)</text>
  <text x="340" y="270" font-family="sans-serif" font-size="12" fill="#555" text-anchor="middle">choose the split with the largest information gain</text>
  <text x="340" y="330" font-family="sans-serif" font-size="12" fill="#555" text-anchor="middle">leaf entropy 0 = pure node; stop or prune</text>
</svg>
