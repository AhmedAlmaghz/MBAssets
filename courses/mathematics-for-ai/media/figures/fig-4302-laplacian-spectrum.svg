<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="380" fill="#fbfbfd"/>
  <text x="340" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2238">Laplacian spectrum &amp; Dirichlet energy</text>

  <!-- smooth eigenvector -->
  <text x="150" y="70" text-anchor="middle" font-size="12" fill="#3b5bdb">u1 (small λ, smooth)</text>
  <path d="M60 260 Q110 110 240 240" fill="none" stroke="#3b5bdb" stroke-width="2.5"/>
  <circle cx="90" cy="230" r="4" fill="#3b5bdb"/><circle cx="150" cy="205" r="4" fill="#3b5bdb"/><circle cx="205" cy="230" r="4" fill="#3b5bdb"/>

  <!-- oscillating eigenvector -->
  <text x="470" y="70" text-anchor="middle" font-size="12" fill="#c2255c">u2 (large λ, oscillating)</text>
  <path d="M390 240 Q420 100 450 240 Q480 320 520 240 Q550 100 580 240" fill="none" stroke="#c2255c" stroke-width="2.5"/>
  <circle cx="390" cy="240" r="4" fill="#c2255c"/><circle cx="450" cy="240" r="4" fill="#c2255c"/><circle cx="520" cy="240" r="4" fill="#c2255c"/><circle cx="580" cy="240" r="4" fill="#c2255c"/>

  <!-- energy formula -->
  <rect x="150" y="310" width="380" height="50" rx="8" fill="#fff3bf" stroke="#f08c00" stroke-width="1.5"/>
  <text x="340" y="332" text-anchor="middle" font-size="13" fill="#1a2238">x^T L x = Σ_{(i,j)∈E} (x_i − x_j)²  (Dirichlet energy)</text>
  <text x="340" y="352" text-anchor="middle" font-size="11.5" fill="#555">L u = λ u;  λ1=0 ⇔ all-ones ⇒ connectivity</text>
</svg>
