<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="Georgia, 'Times New Roman', serif">
  <rect width="680" height="320" fill="#fafaf7"/>

  <text x="340" y="26" font-size="14" fill="#334155" text-anchor="middle" font-weight="bold">انتشار الخطأ: من x إلى f(x)</text>

  <!-- input interval -->
  <g>
    <line x1="80" y1="160" x2="240" y2="160" stroke="#0f766e" stroke-width="3"/>
    <text x="160" y="148" font-size="13" fill="#0f766e" text-anchor="middle">x ± δx</text>
    <text x="160" y="184" font-size="12" fill="#64748b" text-anchor="middle">المدخل غير دقيق</text>
  </g>

  <!-- arrow f -->
  <line x1="250" y1="160" x2="360" y2="160" stroke="#334155" stroke-width="1.8" marker-end="url(#f)"/>
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <text x="305" y="148" font-size="15" fill="#334155" text-anchor="middle" font-style="italic">f</text>
  <!-- slope label -->
  <text x="305" y="184" font-size="11.5" fill="#b45309" text-anchor="middle">ميل = |f′(x)|</text>

  <!-- output interval (wider if |f'|>1) -->
  <g>
    <line x1="380" y1="160" x2="600" y2="160" stroke="#9d174d" stroke-width="3"/>
    <text x="490" y="148" font-size="13" fill="#9d174d" text-anchor="middle">f(x) ± |f′|·δx</text>
    <text x="490" y="184" font-size="12" fill="#64748b" text-anchor="middle">الخطأ مضخّم بالميل</text>
  </g>

  <rect x="200" y="230" width="280" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="340" y="252" font-size="13" fill="#334155" text-anchor="middle" font-style="italic">δf ≈ |f′(x)| δx</text>
  <text x="340" y="268" font-size="11.5" fill="#64748b" text-anchor="middle">|f′|&gt;1 ⟹ خطأ متضخّم (مُكيَّف سيّئاً)</text>

  <text x="340" y="300" font-size="12.5" fill="#334155" text-anchor="middle" font-style="italic">العدد الترتيبي κ = |x f′/f| يقيس حساسية الخطأ النسبي</text>
</svg>
