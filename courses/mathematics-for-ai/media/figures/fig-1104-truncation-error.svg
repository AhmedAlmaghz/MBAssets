<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="Georgia, 'Times New Roman', serif">
  <rect width="680" height="320" fill="#fafaf7"/>

  <text x="340" y="26" font-size="14" fill="#334155" text-anchor="middle" font-weight="bold">خطأ القطع ينخفضّ مع الدرجة n</text>

  <!-- log-log axes -->
  <line x1="70" y1="270" x2="630" y2="270" stroke="#334155" stroke-width="1.4"/>
  <line x1="70" y1="270" x2="70" y2="50" stroke="#334155" stroke-width="1.4"/>
  <text x="350" y="295" font-size="12" fill="#334155" text-anchor="middle">الدرجة n (محور لوغاريتمي)</text>
  <text x="40" y="150" font-size="12" fill="#334155" text-anchor="middle" transform="rotate(-90 40 150)">الخطأ |Rₙ|</text>

  <!-- error points roughly ~ 1/(n+1)! decreasing steeply -->
  <g fill="#b45309" stroke="#b45309">
    <circle cx="110" cy="255" r="5"/>
    <circle cx="170" cy="220" r="5"/>
    <circle cx="230" cy="165" r="5"/>
    <circle cx="290" cy="105" r="5"/>
    <circle cx="350" cy="72"  r="5"/>
    <circle cx="410" cy="55"  r="5"/>
    <circle cx="470" cy="48"  r="5"/>
  </g>
  <path d="M110,255 L170,220 L230,165 L290,105 L350,72 L410,55 L470,48" fill="none" stroke="#9d174d" stroke-width="1.6" stroke-dasharray="5 3"/>

  <!-- slope label -->
  <text x="250" y="200" font-size="12.5" fill="#9d174d" text-anchor="middle" font-style="italic">هبوط شديد ~ O(1/(n+1)!)</text>

  <rect x="500" y="120" width="150" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="575" y="145" font-size="13" fill="#334155" text-anchor="middle" font-style="italic">|Rₙ|≈ C·|x−a|^{n+1}</text>

  <text x="340" y="305" font-size="12.5" fill="#334155" text-anchor="middle" font-style="italic">قطع السلسلة بعد n حدّ يُنتج خطأً من رتبة (n+1)</text>
</svg>
