<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380">
  <rect width="680" height="380" fill="#fbfbfd"/>

  <!-- unknown distribution D -->
  <ellipse cx="90" cy="180" rx="62" ry="46" fill="#eef4ff" stroke="#1f6feb" stroke-width="2"/>
  <text x="90" y="172" font-family="sans-serif" font-size="13" fill="#1f6feb" text-anchor="middle">D (unknown)</text>
  <text x="90" y="190" font-family="sans-serif" font-size="11" fill="#1f6feb" text-anchor="middle">P(X, Y)</text>
  <text x="90" y="245" font-family="sans-serif" font-size="11" fill="#555" text-anchor="middle">Nature</text>

  <!-- sample S -->
  <line x1="152" y1="180" x2="200" y2="180" stroke="#333" stroke-width="2"/>
  <polygon points="200,180 192,175 192,185" fill="#333"/>
  <text x="166" y="168" font-family="sans-serif" font-size="11" fill="#333">i.i.d.</text>
  <rect x="205" y="140" width="90" height="80" fill="#fff6d8" stroke="#b8860b" stroke-width="1.8"/>
  <text x="250" y="166" font-family="sans-serif" font-size="12" fill="#8a5a00" text-anchor="middle">S = {(x_i,y_i)}</text>
  <text x="250" y="184" font-family="sans-serif" font-size="11" fill="#8a5a00" text-anchor="middle">n samples</text>
  <text x="250" y="202" font-family="sans-serif" font-size="11" fill="#8a5a00" text-anchor="middle">training set</text>

  <!-- learner -->
  <line x1="295" y1="180" x2="345" y2="180" stroke="#333" stroke-width="2"/>
  <polygon points="345,180 337,175 337,185" fill="#333"/>
  <rect x="350" y="130" width="110" height="100" fill="#eef4ff" stroke="#1f6feb" stroke-width="2"/>
  <text x="405" y="158" font-family="sans-serif" font-size="12" fill="#1f6feb" text-anchor="middle">Learner A</text>
  <text x="405" y="176" font-family="sans-serif" font-size="11" fill="#1f6feb" text-anchor="middle">ERM / SRM</text>
  <text x="405" y="194" font-family="sans-serif" font-size="11" fill="#1f6feb" text-anchor="middle">over H</text>
  <text x="405" y="212" font-family="sans-serif" font-size="11" fill="#1f6feb" text-anchor="middle">min R_hat(h)</text>

  <!-- hypothesis -->
  <line x1="460" y1="180" x2="510" y2="180" stroke="#333" stroke-width="2"/>
  <polygon points="510,180 502,175 502,185" fill="#333"/>
  <ellipse cx="570" cy="180" rx="62" ry="46" fill="#e8f5e8" stroke="#2a7a2a" stroke-width="2"/>
  <text x="570" y="172" font-family="sans-serif" font-size="13" fill="#2a7a2a" text-anchor="middle">h_S</text>
  <text x="570" y="190" font-family="sans-serif" font-size="11" fill="#2a7a2a" text-anchor="middle">hypothesis</text>
  <text x="570" y="245" font-family="sans-serif" font-size="11" fill="#555" text-anchor="middle">h_S : X -&gt; Y</text>

  <!-- risk arrow (dashed, evaluated) -->
  <path d="M570,226 C400,300 200,300 90,226" fill="none" stroke="#c00" stroke-width="2" stroke-dasharray="6,4"/>
  <polygon points="90,226 99,220 98,231" fill="#c00"/>
  <text x="330" y="318" font-family="sans-serif" font-size="12" fill="#c00" text-anchor="middle">R(h) = E[ l( h(x), y ) ]  -- the quantity we really care about</text>

  <rect x="180" y="40" width="320" height="52" fill="#fff" stroke="#bbb" stroke-width="1.2"/>
  <text x="340" y="60" font-family="sans-serif" font-size="12" fill="#333" text-anchor="middle">R_hat_S(h) = (1/n) sum_i l(h(x_i), y_i)</text>
  <text x="340" y="80" font-family="sans-serif" font-size="12" fill="#333" text-anchor="middle">R(h) = E_D[ l(h(x), y) ]   ;   h* = argmin R</text>
</svg>
