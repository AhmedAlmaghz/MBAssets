<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="380" fill="#fbfbfd"/>
  <text x="340" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2238">Transformer block</text>

  <!-- input x -->
  <rect x="300" y="40" width="90" height="34" rx="6" fill="#c9d6ff" stroke="#3b5bdb" stroke-width="2"/>
  <text x="345" y="62" text-anchor="middle" font-size="12" fill="#1a2238">x</text>

  <!-- add&amp;norm 1 -->
  <rect x="300" y="95" width="90" height="34" rx="6" fill="#ffe0b2" stroke="#e8590c" stroke-width="2"/>
  <text x="345" y="117" text-anchor="middle" font-size="11" fill="#1a2238">Add &amp; Norm</text>

  <!-- self attn -->
  <rect x="295" y="150" width="100" height="40" rx="6" fill="#c8e6c9" stroke="#2f9e44" stroke-width="2"/>
  <text x="345" y="175" text-anchor="middle" font-size="12" fill="#1a2238">MultiHead Attn</text>

  <!-- residual arrow x -> add&amp;norm1 -->
  <path d="M345 74 L285 110 L295 112" fill="none" stroke="#3b5bdb" stroke-width="1.8" marker-end="url(#t1)"/>
  <defs><marker id="t1" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#3b5bdb"/></marker></defs>

  <!-- add&amp;norm 2 -->
  <rect x="300" y="215" width="90" height="34" rx="6" fill="#ffe0b2" stroke="#e8590c" stroke-width="2"/>
  <text x="345" y="237" text-anchor="middle" font-size="11" fill="#1a2238">Add &amp; Norm</text>

  <!-- ffn -->
  <rect x="295" y="265" width="100" height="40" rx="6" fill="#c8e6c9" stroke="#2f9e44" stroke-width="2"/>
  <text x="345" y="290" text-anchor="middle" font-size="12" fill="#1a2238">FFN</text>

  <!-- residual attn -> add&amp;norm2 -->
  <path d="M345 190 L285 230 L295 232" fill="none" stroke="#3b5bdb" stroke-width="1.8" marker-end="url(#t1)"/>

  <text x="345" y="335" text-anchor="middle" font-size="12" fill="#1a2238">FFN(x)=max(0,xW_1+b_1)W_2+b_2</text>
  <text x="345" y="358" text-anchor="middle" font-size="12.5" fill="#555">Residuals let gradients flow; LayerNorm stabilizes training.</text>
</svg>
