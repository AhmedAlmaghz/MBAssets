<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="680" height="320" font-family="Segoe UI, Tahoma, Arial, sans-serif">
  <rect width="680" height="320" fill="#ffffff"/>
  <text x="340" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">التفكك القطبي A = U P : تدوير (أو انعكاس) ثم تمدد</text>

  <defs>
    <marker id="k1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#1d4ed8"/>
    </marker>
    <marker id="k2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- 1: دائرة الوحدة -->
  <text x="110" y="56" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">① دائرة الوحدة</text>
  <circle cx="110" cy="170" r="70" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <line x1="110" y1="170" x2="180" y2="170" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#k1)"/>
  <line x1="110" y1="170" x2="110" y2="100" stroke="#16a34a" stroke-width="2.5" marker-end="url(#k1)"/>
  <text x="110" y="258" text-anchor="middle" font-size="12" fill="#475569">‖x‖ = 1</text>

  <!-- سهم U -->
  <line x1="196" y1="170" x2="256" y2="170" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#k2)"/>
  <text x="226" y="158" text-anchor="middle" font-size="14" font-weight="bold" fill="#b91c1c">U</text>
  <text x="226" y="190" text-anchor="middle" font-size="11" fill="#475569">تدوير</text>

  <!-- 2: دائرة مُدارة -->
  <text x="330" y="56" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">② بعد U (نفس الشكل)</text>
  <circle cx="330" cy="170" r="70" fill="#e0e7ff" stroke="#1e40af" stroke-width="2"/>
  <line x1="330" y1="170" x2="379" y2="120" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#k1)"/>
  <line x1="330" y1="170" x2="281" y2="120" stroke="#16a34a" stroke-width="2.5" marker-end="url(#k1)"/>
  <text x="330" y="258" text-anchor="middle" font-size="12" fill="#475569">U⊤U = I ⟹ يحفظ الأطوال</text>

  <!-- سهم P -->
  <line x1="416" y1="170" x2="476" y2="170" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#k2)"/>
  <text x="446" y="158" text-anchor="middle" font-size="14" font-weight="bold" fill="#b91c1c">P</text>
  <text x="446" y="190" text-anchor="middle" font-size="11" fill="#475569">تمدد</text>

  <!-- 3: القطع الناقص -->
  <text x="560" y="56" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">③ بعد P (قطع ناقص)</text>
  <ellipse cx="560" cy="170" rx="82" ry="42" fill="#bbf7d0" stroke="#166534" stroke-width="2" transform="rotate(-20 560 170)"/>
  <line x1="560" y1="170" x2="640" y2="140" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#k1)"/>
  <line x1="560" y1="170" x2="600" y2="100" stroke="#16a34a" stroke-width="2.5" marker-end="url(#k1)"/>
  <text x="560" y="258" text-anchor="middle" font-size="12" fill="#475569">المحاور = القيم المفردة σ₁, σ₂</text>

  <rect x="40" y="278" width="600" height="26" rx="4" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="340" y="296" text-anchor="middle" font-size="13" fill="#0f172a">A = U P : U متعامدة (شكل) و P متماثلة موجبة نصف‑محددة (حجم)</text>
</svg>
