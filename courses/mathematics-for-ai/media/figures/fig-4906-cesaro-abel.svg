<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="680" height="380" font-family="Tajawal, Noto Naskh Arabic, sans-serif">
  <rect width="680" height="380" fill="#ffffff"/>
  <text x="664" y="26" text-anchor="end" font-size="15" fill="#1f4e6b" font-weight="700">تجميع سيزارو وأبيل: ترويض المتسلسلات المتذبذبة</text>
  <text x="664" y="44" text-anchor="end" font-size="11" fill="#5a6770">Cesàro &amp; Abel summation</text>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6770"/></marker></defs>
  <line x1="60" y1="200" x2="620" y2="200" stroke="#5a6770" stroke-width="1"/>
  <line x1="60" y1="60" x2="60" y2="330" stroke="#5a6770" stroke-width="1"/>
  <text x="66" y="72" font-size="11" fill="#5a6770">S_n</text>
  <line x1="60" y1="150" x2="620" y2="150" stroke="#1f4e6b" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="66" y="146" font-size="11" fill="#1f4e6b">1/2</text>
  <g fill="none" stroke="#b5473a" stroke-width="1.6">
    <path d="M 80 240 L 110 120 L 140 235 L 170 122 L 200 238 L 230 118 L 260 236 L 290 120 L 320 237 L 350 119 L 380 235 L 410 121 L 440 238 L 470 118 L 500 236 L 530 120 L 560 237 L 590 119 L 615 236"/>
  </g>
  <text x="600" y="258" text-anchor="end" font-size="11" fill="#b5473a">المجاميع الجزئيّة لـ 1-1+1-1+... (لا تتقارب)</text>
  <g fill="none" stroke="#7a9e3c" stroke-width="2.2">
    <path d="M 80 205 C 200 172 330 156 615 151"/>
  </g>
  <text x="600" y="282" text-anchor="end" font-size="11" fill="#7a9e3c">متوسطات سيزارو<tspan direction="ltr" unicode-bidi="isolate"> σ<tspan dy="3.30" font-size="70%">n</tspan><tspan dy="-3.30" font-size="1">&#8203;</tspan> → 1/2</tspan></text>
  <text x="340" y="320" font-size="10.5" fill="#5a6770" direction="rtl">أبيل<tspan direction="ltr" unicode-bidi="isolate">: lim<tspan dy="3.15" font-size="70%">r→1<tspan dy="-3.09" font-size="70%">-</tspan><tspan dy="3.09" font-size="1">&#8203;</tspan></tspan><tspan dy="-3.15" font-size="1">&#8203;</tspan>Σ a<tspan dy="3.15" font-size="70%">n</tspan><tspan dy="-3.15" font-size="1">&#8203;</tspan> r<tspan dy="-4.41" font-size="70%">n</tspan><tspan dy="4.41" font-size="1">&#8203;</tspan> </tspan>يعطي القيمة ذاتها حين توجد<tspan direction="ltr" unicode-bidi="isolate"> — </tspan>ويُعمّم على المتسلسلات المتباعدة<tspan direction="ltr" unicode-bidi="isolate">.</tspan></text>
  <text x="340" y="342" font-size="10.5" fill="#5a6770" direction="rtl">نظير في التعلّم: متوسط التدرّجات (EMA/momentum) يروّض التذبذب في المسارات المتعرّجة.</text>
</svg>