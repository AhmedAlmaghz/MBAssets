<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="Georgia, 'Times New Roman', serif">
  <rect width="680" height="320" fill="#fafaf7"/>

  <text x="340" y="26" font-size="14" fill="#334155" text-anchor="middle" font-weight="bold">مسار الانتشار العكسي: من الضجيج إلى البيانات</text>

  <!-- axes -->
  <line x1="60" y1="270" x2="640" y2="270" stroke="#334155" stroke-width="1.4"/>
  <line x1="340" y1="290" x2="340" y2="40" stroke="#334155" stroke-width="1.4"/>

  <!-- noise cloud on left (t=T) -->
  <g fill="#cbd5e1">
    <circle cx="110" cy="150" r="3"/><circle cx="130" cy="120" r="3"/><circle cx="125" cy="180" r="3"/>
    <circle cx="100" cy="200" r="3"/><circle cx="140" cy="160" r="3"/><circle cx="115" cy="100" r="3"/>
    <circle cx="150" cy="210" r="3"/><circle cx="95" cy="130" r="3"/><circle cx="135" cy="230" r="3"/>
  </g>
  <text x="120" y="250" font-size="12" fill="#64748b" text-anchor="middle">t=T (ضجيج)</text>

  <!-- trajectory arrow -->
  <line x1="150" y1="160" x2="300" y2="160" stroke="#9d174d" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#d)"/>
  <defs>
    <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9d174d"/>
    </marker>
  </defs>
  <text x="225" y="148" font-size="12" fill="#9d174d" text-anchor="middle">عكس SDE</text>

  <!-- intermediate -->
  <g fill="#fcd34d">
    <circle cx="320" cy="140" r="3"/><circle cx="350" cy="170" r="3"/><circle cx="335" cy="190" r="3"/>
    <circle cx="360" cy="150" r="3"/><circle cx="330" cy="120" r="3"/>
  </g>
  <text x="335" y="250" font-size="12" fill="#b45309" text-anchor="middle">t mid</text>

  <!-- trajectory arrow 2 -->
  <line x1="370" y1="160" x2="500" y2="160" stroke="#9d174d" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#d)"/>

  <!-- data cluster on right (t=0) -->
  <g fill="#0f766e">
    <circle cx="520" cy="150" r="3.5"/><circle cx="540" cy="160" r="3.5"/><circle cx="530" cy="175" r="3.5"/>
    <circle cx="550" cy="145" r="3.5"/><circle cx="535" cy="135" r="3.5"/><circle cx="545" cy="170" r="3.5"/>
    <circle cx="525" cy="165" r="3.5"/>
  </g>
  <text x="535" y="250" font-size="12" fill="#0f766e" text-anchor="middle">t=0 (بيانات)</text>

  <!-- SDE box -->
  <rect x="430" y="50" width="210" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="535" y="68" font-size="12" fill="#334155" text-anchor="middle" font-style="italic">dx = [−½βx − β∇log p]dt</text>
  <text x="535" y="84" font-size="11" fill="#64748b" text-anchor="middle">+ √β dW</text>

  <text x="340" y="290" font-size="12.5" fill="#334155" text-anchor="middle" font-style="italic">إزالة الضجيج تدريجياً = حلّ SDE عكسي (diffusion models)</text>
</svg>
