<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-labelledby="title">
<title id="title">Venn diagram for sets</title>
<defs>
  <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f2f7ff"/><stop offset="1" stop-color="#f7fbfa"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17324d" flood-opacity=".12"/>
  </filter>
</defs>
<rect width="1000" height="340" rx="28" fill="url(#wash)"/>
<path d="M34 40h8v260h-8z" rx="4" fill="#16a6a1"/>
<rect x="140" y="62" width="720" height="230" rx="24" fill="#fff" stroke="#c7d4e5" stroke-width="3"/>
<circle cx="425" cy="177" r="100" fill="#4c7cf3" fill-opacity=".26" stroke="#4c7cf3" stroke-width="5"/>
<circle cx="575" cy="177" r="100" fill="#16a6a1" fill-opacity=".25" stroke="#16a6a1" stroke-width="5"/>
<g font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#17324d" text-anchor="middle"><text x="380" y="185">A</text><text x="620" y="185">B</text><text x="500" y="188" font-size="20">A ∩ B</text></g>
<text x="500" y="320" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#718096">UNION · INTERSECTION · COMPLEMENT</text>
</svg>