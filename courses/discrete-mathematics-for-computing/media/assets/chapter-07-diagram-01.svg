<svg xmlns="http://www.w3.org/2000/svg" width="881" height="1028" viewBox="0 0 881 1028" role="img" aria-labelledby="diagram-title">
<title id="diagram-title">مخطط توضيحي من الفصل 7</title>
<defs><linearGradient id="diagram-wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f2f7ff"/><stop offset="1" stop-color="#f7fbfa"/></linearGradient></defs>
<rect x="4" y="4" width="873" height="1020" rx="24" fill="url(#diagram-wash)" stroke="#d5deea" stroke-width="2"/>
<rect x="24" y="24" width="8" height="980" rx="4" fill="#16a6a1"/>
<text x="58" y="58" fill="#087f82" font-family="Tahoma,Arial,sans-serif" font-size="17" font-weight="700">رسم توضيحي · الفصل 7</text>
<g fill="#17324d" font-family="Consolas,'Courier New',Tahoma,monospace" font-size="23"><text x="58" y="96.0" xml:space="preserve">هل أختار من بدائل منفصلة؟</text>
<text x="58" y="137.4" xml:space="preserve">    نعم → مبدأ الجمع.</text>
<text x="58" y="178.8" xml:space="preserve"></text>
<text x="58" y="220.2" xml:space="preserve">هل الاختيار النهائي يمر بمراحل متتابعة؟</text>
<text x="58" y="261.6" xml:space="preserve">    نعم → مبدأ الضرب.</text>
<text x="58" y="303.0" xml:space="preserve"></text>
<text x="58" y="344.4" xml:space="preserve">هل يهم ترتيب العناصر؟</text>
<text x="58" y="385.8" xml:space="preserve">    نعم → ترتيب.</text>
<text x="58" y="427.2" xml:space="preserve">    لا  → توافق.</text>
<text x="58" y="468.6" xml:space="preserve"></text>
<text x="58" y="510.0" xml:space="preserve">هل أسمح بإعادة العنصر؟</text>
<text x="58" y="551.4" xml:space="preserve">    نعم → استخدم صيغة التكرار المناسبة.</text>
<text x="58" y="592.8" xml:space="preserve">    لا  → قلّل عدد الخيارات بعد كل اختيار.</text>
<text x="58" y="634.2" xml:space="preserve"></text>
<text x="58" y="675.6" xml:space="preserve">هل أبحث عن «واحد على الأقل»؟</text>
<text x="58" y="717.0" xml:space="preserve">    جرّب عدّ الحالات المقابلة واطرحها من الكل.</text>
<text x="58" y="758.4" xml:space="preserve"></text>
<text x="58" y="799.8" xml:space="preserve">هل تتداخل المجموعات؟</text>
<text x="58" y="841.2" xml:space="preserve">    نعم → الشمول والاستبعاد.</text>
<text x="58" y="882.6" xml:space="preserve"></text>
<text x="58" y="924.0" xml:space="preserve">هل أريد ضمان وجود عنصرين متشابهين؟</text>
<text x="58" y="965.4" xml:space="preserve">    فكّر في مبدأ الحمام.</text></g>
</svg>